name: landgate
description: |
  May this ready change land without an operator being asked? It reads the change's
  state on the host and the project's land policy, and decides: land now, or ask. It
  lands nothing and writes nothing itself. The pack setting `land_gate` says whether the
  decision is acted on. `shadow`, the default: the gate asks an operator every time, and
  the ask and the result say what the policy would have done. `policy`: a change the
  policy lets land starts the land stage with no ask.

model: ['@judge', medium]

inputs:
  item:
    description: The work item as text.
  change:
    description: Where the change is proposed.
  delivered:
    description: What delivery ended with, as its result.
  land_on:
    default: ""
    description: The branch this item's change lands on. Empty means the project's base branch.
  answers:
    default: "None."
    description: Decisions an operator already made on this item.

# The options every ask of this stage offers. The id an operator chooses decides what starts
# next: the pack's asks-settled bindings name them.
returns:
  node: end
  outcome: outcome
  asks: asks
  summary: summary
  options:
    - id: land
      does: The land stage merges the change into its landing branch, when it still merges and its checks are green.
      cost: The change is on the branch everyone builds on.
    - id: send-back
      does: The same builder continues on the change with what you say in your answer, and the checks look at it again.
      cost: One build run and one check round before it can land.
    - id: drop
      does: The change is closed without merging and the item ends here. Your answer is written on the change as the reason.
      cost: The work on this change is given up; its branch stays.
    - id: reshape
      does: The change is closed without merging, its branch kept, and nothing more is built until the item is shaped again. Your answer is written on the change.
      cost: The item waits for shaping, and the next build starts a new change from what is decided then.

display:
  label: Merge gate
  short: "May it merge?"
  blurb: "Decides whether an approved change merges without asking you, or asks you first."
  story: The merge gate read the change
  outcomes:
    ask: { label: asked you, story: The merge gate asked you }
    land: { label: merge it, story: The merge gate said land }
  answers:
    land: { label: merge it }
    send-back: { label: sent back }
    other: { label: something else }
    drop: { label: dropped by you }
    reshape: { label: needs shaping }
  phases:
    - label: Gate
      cards:
        - { title: Merge gate, text: "Decides, by the land policy, whether the change may merge without asking you", icon: shield-check, kind: agent, covers: [gate] }
        - { title: Gate's answer, text: "Lands it when the policy allows, otherwise asks you", icon: send, kind: script, covers: [end] }
  results: { change: /change }

nodes:
  - id: gate
    display: { label: Decides whether it may merge }
    command: landgate
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      properties:
        land: { type: string, enum: [auto, ask] }
        criterion: { type: string, description: 'The line of the policy that decided it, or: all hold. When there is no policy: no policy.' }
        why: { type: string, description: 'One or two sentences.' }
        facts:
          type: object
          additionalProperties: false
          description: 'What you read on the host, not what you were told.'
          properties:
            checks: { type: string, description: 'The state of the project checks at the head commit.' }
            head: { type: string, description: 'The head commit you read them at.' }
            merges: { type: string, description: 'Whether it merges with the branch it targets.' }
            size: { type: string, description: 'Lines added and removed, and how many files.' }
            protected: { type: string, description: 'Protected paths the change touches, or none.' }
          required: [checks, head, merges, size, protected]
        asks:
          type: array
          description: 'The one question you put to the operator. Always one, also when the policy lets the change land.'
          items:
            type: object
            additionalProperties: false
            properties:
              question: { type: string }
              context: { type: string }
              recommendation:
                type: object
                additionalProperties: false
                properties:
                  option:
                    type: string
                    enum: [land, send-back, drop, reshape, none]
                    description: 'What you would do, by the id of one of the options this stage declares, which the ask offers. none when you have no basis to choose: the ask then carries no recommendation, and your why says what stops you.'
                  why: { type: string, description: 'Why that one. If you are not sure, say what would change your mind. With none: why you cannot choose, and what you would need to know to choose. The operator reads it in place of a recommendation.' }
                required: [option, why]
            required: [question, context, recommendation]
        sure: { type: string, enum: [high, medium, low] }
      required: [land, criterion, why, facts, asks, sure]

  # The outcome the bindings route on, and what the land policy would have done.
  # The engine defines the `asks` property of the result, so the output format leaves it out.
  - id: end
    display: { label: Hands on the gate's answer }
    depends_on: [gate]
    runtime: bun
    script: landing
    with:
      stage: landgate
      last: $gate.output
      change: $INPUTS.change
      delivered: $INPUTS.delivered
      land_gate: $INPUTS.land_gate
      noticed: ""   # land stage only
    output_format:
      type: object
      properties:
        outcome: { type: string, enum: [land, ask] }
        change: { type: string }
        summary: { type: string }
        returned: { type: string, description: 'What the builder gets when an operator sends the change back.' }
        noticed: { type: array, description: 'What the checks noticed that this change did not cause, carried on to the land stage.' }
        would: { type: string, enum: [land, ask], description: 'What the land policy decided: land the change without asking, or ask.' }
        shadow: { type: boolean, description: 'True when nothing acted on `would`: the gate asked whatever the policy decided.' }
      required: [outcome, change, summary, returned, noticed, would, shadow]
