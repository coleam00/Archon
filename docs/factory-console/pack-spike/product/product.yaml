name: product
description: |
  Review the change for the product's users: the commands, output, errors,
  documentation and screens they meet, held to the project's own product
  and design documents. Changes nothing in the change.

model: ['@product-reviewer', large]

inputs:
  item:
    description: The work item as text.
  answers:
    default: "None."
    description: Decisions an operator already made on this item.
  base:
    description: The commit the change was built on.
  product_policy:
    default: ""
    description: The pack setting of the same name, declared here so a workflow that includes this stage can pass it through.

returns: { node: product, outcome: outcome }

nodes:
  - id: product
    display: { label: Product check }
    command: product
    output_format:
      type: object
      additionalProperties: false
      properties:
        outcome: { type: string, enum: [approve, return, ask] }
        summary: { type: string, description: 'For a maintainer deciding whether to land it.' }
        used:
          type: array
          description: 'Each thing you used the way a user would, and what you met.'
          items:
            type: object
            additionalProperties: false
            properties:
              what: { type: string, description: 'The command, message, page or passage.' }
              how: { type: string, enum: [used, read] }
              met: { type: string, description: 'What a user sees or has to do.' }
            required: [what, how, met]
        findings:
          type: array
          description: 'With return: each thing a user should not have to meet. Empty otherwise.'
          items:
            type: object
            additionalProperties: false
            properties:
              who: { type: string, description: 'Who meets it: an operator at the CLI, an agent reading output, a workflow author, a reader of the docs.' }
              where: { type: string }
              sees: { type: string, description: 'What they see, quoted where it is text.' }
              needs: { type: string, description: 'What they would need instead.' }
              says_so: { type: string, description: 'The project document and passage this rests on.' }
              evidence_kind: { type: string, enum: [used, read] }
            required: [who, where, sees, needs, says_so, evidence_kind]
        noticed:
          type: array
          description: 'Things wrong or odd for users that this change did not cause.'
          items:
            type: object
            additionalProperties: false
            properties:
              what: { type: string }
              where: { type: string }
              kind: { type: string, enum: [defect, odd] }
            required: [what, where, kind]
        asks:
          type: array
          description: 'Each decision that belongs to a maintainer. Empty when there is none.'
          items:
            type: object
            additionalProperties: false
            properties:
              question: { type: string }
              context: { type: string }
              options:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    id: { type: string, description: 'kebab-case, one token, such as keep-the-flag. The answer names it.' }
                    does: { type: string }
                    cost: { type: string }
                  required: [id, does, cost]
              recommendation:
                type: object
                additionalProperties: false
                properties:
                  option: { type: string, description: 'The id of the option you would take. It is one of the options above.' }
                  why: { type: string, description: 'Why that one. If you are not sure, say what would change your mind.' }
                required: [option, why]
            required: [question, context, options, recommendation]
        notes: { type: string, description: 'Anything worth saying that has no field here.' }
        for_next: { type: string, description: 'Anything the engineer who fixes what you returned, or the maintainer who lands it needs from you that has no field here. Write it to them.' }
      required: [outcome, summary, used, findings, noticed, asks, notes, for_next]
