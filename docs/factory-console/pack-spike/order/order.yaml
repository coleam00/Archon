name: order
description: |
  Take a work order from an operator and make it one work item the factory can read.
  A work order names its work by a link to an item on the project's forge, by text, or
  both, and may say where the change lands, which larger item it is part of and what it
  depends on. An order that lists several items makes each a member, part of the order's
  own item, and each member is then ordered like any other item; a split orders its
  members the same way. This stage reads and judges nothing: it gathers the text, records
  what is part of what, and hands the order on. Whether an item waits is the link stage's.

inputs:
  key:
    default: ""
    description: The key of the item this order is about, such as issue-123. The binding that starts this stage puts the run on that item.
  source:
    default: ""
    description: A link to the work item on the project's forge (an issue, for example). Empty when the work lives in no tracker.
  issue:
    default: ""
    description: The number of the issue this order is about, on the repository `repo_host` and `repo_path` name. Set by the binding that orders an issue when a label is put on it; an order by hand gives `source`.
  repo_host:
    default: ""
    description: The host of the project's repository, such as github.com. Read with `issue`.
  repo_path:
    default: ""
    description: The path of the project's repository on its host, such as acme/widgets. Read with `issue`.
  text:
    default: ""
    description: The work as text. With a source, it is added below what the source says, as the operator's own words.
  land_on:
    default: ""
    description: The branch this item's change lands on. Empty means the project's base branch.
  part_of:
    default: ""
    description: The key of the larger item this one is a member of, when it is one. Empty when it stands alone.
  depends_on:
    default: ""
    description: Keys of the items the operator knows must land before this one, separated by commas. Empty when none. Handed to the link stage as a fact; this stage does not act on it.
  items:
    default: ""
    description: >-
      For an order of several items: the members as a JSON list, each with its own `key`,
      a `source` or `text`, and optionally `depends_on`. Empty for an order of one item.
  members:
    default: ""
    description: >-
      The members a work order or a split started, as JSON: each with its `key`, `title`,
      `source` or `text`, and `depends_on`. Set by the binding that starts this stage on
      each of them. The order is the member with this run's item key, and it is taken once.
  earlier:
    result_of: order
    description: What the last order on this item returned. An order that names no work is the item's last order again.

# A refused order starts nothing and shows the item as stopped in attention, with `why`.
# `work_order` ends the order's own item: the work goes on as its members, and the item
# read derives the work order's open or done from them. `refused` stops it with the reason.
returns: { node: order, outcome: outcome, ends: [work_order], summary: why }

display:
  label: Order
  short: "Orders, labelled issues"
  blurb: "Takes a work order, or an issue someone added the factory label to, and makes it one item the factory can read."
  outcomes:
    ready: { label: ready, story: Order took the work order and made it an item }
    refused: { label: Refused at intake, story: Order refused the work order }
    work_order: { label: Ordered as a work order, story: Order took the work order and ordered its pieces }
  phases:
    - label: Take the order
      cards:
        - { title: Take the order, text: "Turns a work order, or an issue given the factory label, into one item the factory can read", icon: inbox, kind: script, covers: [order] }

nodes:
  - id: order
    display: { label: Take the order }
    runtime: bun
    mutates_checkout: false
    with:
      source: $INPUTS.source
      issue: $INPUTS.issue
      repo_host: $INPUTS.repo_host
      repo_path: $INPUTS.repo_path
      text: $INPUTS.text
      land_on: $INPUTS.land_on
      part_of: $INPUTS.part_of
      depends_on: $INPUTS.depends_on
      items: $INPUTS.items
      members: $INPUTS.members
      earlier: $INPUTS.earlier
    script: |
      import { emit, forge, input, item, linkItem, recordLanding } from 'archon:script';
      const parse = (name: string) => { try { return JSON.parse(input(name) || 'null'); } catch { return null; } };
      const keys = (value: unknown) => (Array.isArray(value) ? value : String(value ?? '').split(',')).map(key => String(key).trim()).filter(Boolean);
      const read = item();
      const own = read?.item.key ?? '';
      const earlier = parse('earlier');
      // Started by a work order or a split, on each member it names: the order is the
      // member with this item's key.
      const started = parse('members');
      const mine = Array.isArray(started) ? started.find((m: any) => m.key === own) : null;
      // A label binding names the issue by its number on the project's repository.
      const issue = Number(input('issue').trim());
      const given = {
        source: String(mine ? mine.source ?? '' : input('source')).trim(),
        text: String(mine ? mine.text ?? '' : input('text')).trim(),
        issue: Number.isInteger(issue) && issue > 0 ? { repo: { host: input('repo_host').trim(), path: input('repo_path').trim() }, number: issue } : null,
        land_on: input('land_on').trim(),
        part_of: input('part_of').trim(),
        depends_on: keys(mine ? mine.depends_on : input('depends_on')),
      };
      // An order that names no work is the item's last order again.
      const order = given.source || given.text || given.issue ? given : earlier?.order ?? null;
      const title = (m: any) => String(m.title || String(m.text ?? '').split('\n')[0].replace(/^#+\s*/, '') || m.source || '');
      const members = Array.isArray(started)
        ? started.filter((m: any) => m.key !== own).map((m: any) => ({ key: String(m.key), title: title(m) }))
        : earlier?.members ?? [];
      const end = (outcome: string, more: Record<string, unknown>) => emit({
        outcome, item: '', land_on: order?.land_on ?? '', part_of: order?.part_of ?? '', depends_on: order?.depends_on ?? [],
        why: '', order, members, start: [], ...more,
      });
      const listed = parse('items');
      if (Array.isArray(listed)) {
        // An order of several items. This run's item is the work order, and each member is
        // recorded as part of it: a fact the order states, which needs no judgment.
        // Recording the link writes the member's item. The `order-after-work-order` binding
        // starts this stage on each member, and a member that records no landing branch
        // takes the work order's.
        const start = listed.map((m: any) => ({
          key: String(m?.key ?? '').trim(), title: title(m ?? {}),
          source: String(m?.source ?? '').trim(), text: String(m?.text ?? '').trim(), depends_on: keys(m?.depends_on),
        }));
        if (!own || start.length === 0 || start.some(m => !m.key || m.key === own || (!m.source && !m.text)) || new Set(start.map(m => m.key)).size !== start.length) {
          end('refused', { why: 'A work order needs a key, and every member a key of its own, different from the order\'s, and a source or text.' });
        } else {
          if (given.land_on) recordLanding(given.land_on);
          if (given.part_of) linkItem({ kind: 'part_of', to: given.part_of });
          for (const m of start) linkItem({ kind: 'part_of', from: m.key });
          end('work_order', { item: given.text, order: given, land_on: given.land_on, part_of: given.part_of, depends_on: [], start });
        }
      } else if (!order) {
        end('refused', { why: 'The order names no work: give a source, text, or both.' });
      } else if (mine && (read?.runs ?? []).some(run => run.workflow.slice(run.workflow.lastIndexOf(':') + 1) === 'order' && run.outcome === 'ready')) {
        // The item keeps the order it was given: the link stage reads the last order's result.
        emit({ ...earlier, outcome: 'refused', why: 'This member was ordered before.' });
      } else {
        // What the order says the item is part of is a fact too. A work order or a split
        // already recorded it for its members.
        if (order === given && !mine && order.part_of) linkItem({ kind: 'part_of', to: order.part_of });
        let text = order.text;
        let why = '';
        if (order.source || order.issue) {
          text = '';
          try {
            const where = order.issue
              ? { kind: 'resolved', repo: order.issue.repo, subject: { kind: 'issue', number: order.issue.number } }
              : forge('resolve', { remote: order.source, web: true });
            if (where.kind !== 'resolved' || !where.subject) {
              why = `The source is not an item on a forge this install can read: ${order.source}`;
            } else {
              const ref = { repo: where.repo, number: where.subject.number };
              const work = forge('workitem.view', { ref });
              const seen = forge('workitem.comments', { subject: { kind: where.subject.kind, ref } });
              const talk = (seen.comments ?? [])
                .map((c: any) => `**${c.author?.login ?? 'someone'}**:\n\n${String(c.body ?? '').trim()}`)
                .join('\n\n');
              text =
                `---\nid: ${where.subject.number}\nsource: ${work.url ?? order.source}\n---\n\n` +
                `# ${work.title}\n\n${String(work.body ?? '').trim()}\n\n## Discussion\n\n${talk || 'No comments.'}` +
                (order.text ? `\n\n## From the operator who ordered this\n\n${order.text}` : '');
            }
          } catch (error) {
            why = `The source could not be read: ${error instanceof Error ? error.message : String(error)}`;
          }
        }
        if (text) end('ready', { item: text });
        else end('refused', { why });
      }
    output_format:
      type: object
      properties:
        outcome: { type: string, enum: [ready, work_order, refused] }
        item: { type: string, description: 'The work item as text.' }
        land_on: { type: string, description: 'The branch the change lands on. Empty means the base branch.' }
        part_of: { type: string, description: 'The larger item this one is a member of. Empty when none.' }
        depends_on: { type: array, items: { type: string }, description: 'Keys of the items the order says must land before this one. The link stage reads them.' }
        why: { type: string, description: 'Why the order was refused. Empty when it was not.' }
        order: { description: 'The order as it was given: source, text, issue, land_on, part_of and depends_on. An order that names no work starts from it. Null when no order named work.' }
        members: { type: array, description: 'The other members of the work order or split this item is part of: key and title. Empty when it is part of none.' }
        start: { type: array, description: 'For a work order: its members, each with key, title, source, text and depends_on.' }
      required: [outcome, item, land_on, part_of, depends_on, why, order, members, start]
