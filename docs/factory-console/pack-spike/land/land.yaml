name: land
description: |
  Land one ready change on its landing branch. On a host, that is merging the proposed
  change into the branch it targets, when that is the landing branch, it still merges
  and the host's checks at its head are green. With no host, the landing branch is a
  local branch, moved after checking the tree that would land, and nothing is pushed.

model: ['@lander', medium]

inputs:
  item:
    description: The work item as text.
  change:
    default: ""
    description: Where the change is proposed. Empty when the project has no host.
  land_on:
    default: ""
    description: The branch this item's change lands on. Empty means the project's base branch.
  answers:
    default: "None."
    description: Decisions an operator already made on this item.
  noticed:
    default: "[]"
    description: What the checks noticed that this change did not cause. Carried to the discoveries drain, which starts when the change has landed.
  build:
    default: ""
    description: What build concluded, as its result, for a start by hand with no host. It holds the commit to land.
  landing_branch:
    default: ""
    description: The older name of `land_on`, for a start by hand.

# The options every ask of this stage offers. The id an operator chooses decides what starts
# next: the pack's asks-settled bindings name them.
returns:
  node: end
  outcome: outcome
  asks: asks
  summary: summary
  options:
    - id: land
      does: The land stage tries the landing again and merges the change into its landing branch, when it still merges and its checks are green.
      cost: The change is on the branch everyone builds on.
    - id: send-back
      does: The same builder continues on the change with what you say in your answer, and the checks look at it again.
      cost: One build run and one check round before it can land.
    - id: drop
      does: The change is closed without merging and the item ends here. Your answer is written on the change as the reason.
      cost: The work on this change is given up; its branch stays.
    - id: reshape
      does: The change is closed without merging, its branch kept, and nothing more is built until the item is shaped again. Your answer is written on the change.
      cost: The item waits for shaping, and the next build starts a new change from what is decided then.

display:
  label: Land
  short: Merges the change
  blurb: "Merges the change once the gate says land, or sends it back to the builder."
  outcomes:
    ask: { label: asked you, story: Merging asked you }
    behind: { label: behind its branch, story: Merging found it behind its landing branch and sent it back to the builder }
    landed: { label: merged, story: The factory merged it }
    returned: { label: returned, story: Merging sent it back to the builder }
    stop: { label: Stopped before merging, story: Merging stopped it }
  answers:
    land: { label: merge it }
    send-back: { label: sent back }
    other: { label: something else }
    drop: { label: dropped by you }
    reshape: { label: needs shaping }
  phases:
    - label: Merge
      cards:
        - { title: Merge, text: "Told \"land\" by the gate or by you, the factory merges the change", icon: git-merge, kind: agent, covers: [land] }
        - { title: Merge's answer, text: "Says merged, sent back, or asks you", icon: send, kind: script, covers: [end] }
  results: { change: /change }

nodes:
  - id: land
    display: { label: Merges the change }
    command: land
    output_format:
      type: object
      additionalProperties: false
      properties:
        outcome: { type: string, enum: [landed, behind, returned, stop, ask] }
        summary: { type: string, description: 'For a maintainer who has not followed the item.' }
        landing_branch: { type: string, description: 'The branch it landed on, or would have.' }
        from: { type: string, description: 'The commit the landing branch pointed at when you started.' }
        to: { type: string, description: 'The commit it points at now: on a host, the commit the change landed as. Empty unless landed.' }
        checked: { type: string, description: 'On a host: the state of its checks at the head commit you merged. With no host: the command run on the combined tree, and what it showed.' }
        returned: { type: string, description: 'With returned: what a builder needs to fix. With behind: what it conflicts with on the landing branch. Empty otherwise.' }
        stop: { type: string, description: 'With stop: what prevents landing, and what you recommend. Empty otherwise.' }
        asks:
          type: array
          description: 'Each decision that belongs to a maintainer. Empty when there is none.'
          items:
            type: object
            additionalProperties: false
            properties:
              question: { type: string }
              context: { type: string }
              recommendation:
                type: object
                additionalProperties: false
                properties:
                  option:
                    type: string
                    enum: [land, send-back, drop, reshape, none]
                    description: 'What you would do, by the id of one of the options this stage declares, which the ask offers. none when you have no basis to choose: the ask then carries no recommendation, and your why says what stops you.'
                  why: { type: string, description: 'Why that one. If you are not sure, say what would change your mind. With none: why you cannot choose, and what you would need to know to choose. The operator reads it in place of a recommendation.' }
                required: [option, why]
            required: [question, context, recommendation]
        notes: { type: string, description: 'Anything worth saying that has no field here: caveats, doubts, things noticed.' }
        for_next: { type: string, description: 'Anything whoever works on this project next needs from you that has no field here. Write it to them.' }
      required: [outcome, summary, landing_branch, from, to, checked, returned, stop, asks, notes, for_next]

  # The outcome the bindings route on. The engine records the merge and the landing branch
  # on the item when the node above merges through `archon forge pr.merge`.
  # The engine defines the `asks` property of the result, so the output format leaves it out.
  - id: end
    display: { label: Hands on the merge's answer }
    depends_on: [land]
    runtime: bun
    script: landing
    with:
      stage: land
      last: $land.output
      change: $INPUTS.change
      noticed: $INPUTS.noticed
      delivered: ""   # gate only
      land_gate: ""   # gate only
    output_format:
      type: object
      properties:
        outcome: { type: string, enum: [landed, behind, returned, stop, ask] }
        change: { type: string }
        summary: { type: string }
        returned: { type: string, description: 'What goes back to the builder: why the change did not land.' }
        noticed: { type: array, description: 'What the checks noticed that this change did not cause. The discoveries stage starts from it when the change has landed.' }
      required: [outcome, change, summary, returned, noticed]
