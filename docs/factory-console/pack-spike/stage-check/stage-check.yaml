name: stage-check
description: |
  Delivery as three stages, stage two: one round of our own checks on the proposed change,
  ending in one verdict. Approve goes on to the host round, return goes back to the
  builder, both through the pack's bindings. A return goes to the builder twice on an item
  without an operator; the third ends in an ask instead.

inputs:
  item:
    description: The work item as text.
  land_on:
    default: ""
    description: The branch this item's change lands on. Empty means the project's base branch.
  answers:
    default: "None."
    description: Decisions an operator already made on this item.
  plan:
    result_of: plan
    description: What plan concluded, as its result. The verdict reads who the outcome is for and what the change leaves alone.
  change:
    default: ""
    description: Where the change is proposed, as the builder reported it.
  returned_before:
    default: ""
    description: What the checks returned the last time this change was checked. Empty in the first round.
  builder_reply:
    default: ""
    description: What the builder says it did about what was returned. Empty in the first round.

# The options every ask of this stage offers. The id an operator chooses decides what starts
# next: the pack's asks-settled bindings name them.
returns:
  node: end
  outcome: outcome
  asks: asks
  summary: summary
  options:
    - id: send-back
      does: The same builder continues on the change with what you say in your answer, and the checks look at it again.
      cost: One build run and one check round.
    - id: one-more-round
      does: The same builder fixes what the checks returned, and the checks look at it once more. If they return it again, you are asked again.
      cost: One build run and one check round.
    - id: replan
      does: The item goes back to planning with what you say in your answer.
      cost: The work so far may be discarded.
    - id: take-as-is
      does: The change goes on to the host round as it is.
      cost: What the checks returned stays unfixed.
    - id: drop
      does: The change is closed without merging and the item ends here. Your answer is written on the change as the reason.
      cost: The work on this change is given up; its branch stays.
    - id: reshape
      does: The change is closed without merging, its branch kept, and nothing more is built until the item is shaped again. Your answer is written on the change.
      cost: The item waits for shaping, and the next build starts a new change from what is decided then.

display:
  label: Checks
  short: "Review, tests, product"
  blurb: "A review, a test check and a product check read the change and approve it or send it back."
  outcomes:
    approve: { label: approved, story: The checks approved it }
    ask: { label: asked you, story: The checks asked you }
    replan: { label: plan again, story: The checks sent it back to planning }
    return: { label: returned, story: The checks sent it back }
  answers:
    send-back: { label: sent back }
    one-more-round: { label: one more round }
    other: { label: something else }
    take-as-is: { label: taken as it is }
    replan: { label: plan again }
    drop: { label: dropped by you }
    reshape: { label: needs shaping }
  phases:
    - label: Prepare
      cards:
        - { title: Read the base, text: Reads the commit the change is checked against, icon: git-branch, kind: script, covers: [base] }
        - { title: Sizes, text: Reads the change's size at each delivery run since it was last planned, icon: ruler, kind: script, covers: [sizes] }
    - label: Check
      cards:
        - { title: Code review, text: Reviews the change, icon: search-code, kind: check, covers: [review__review] }
        - { title: Test check, text: Checks the tests prove the change, icon: flask-conical, kind: check, covers: [tests__tests] }
        - { title: Product check, text: Looks at the change in a browser, icon: monitor-check, kind: check, covers: [product__product] }
    - label: Verdict
      cards:
        - { title: Verdict, text: Approves the change or sends it back, icon: gavel, kind: check, covers: [verdict__verdict] }
    - label: Round ends
      cards:
        - { title: Count the round, text: Records the round and the rounds allowed, icon: ruler, kind: script, covers: [limit] }
        - { title: Rounds ran out, text: Asks you when the allowed rounds are used up, icon: circle-alert, kind: agent, covers: [exhausted] }
        - { title: Hand on, text: "Hands the change on to CI, back to the builder or to Plan, or to you", icon: send, kind: script, covers: [end] }
        - { title: Report, text: Writes the factory's report on the pull request, icon: message-square, kind: agent, covers: [report__report] }
  marks:
    - { node: verdict__verdict, outcome: return, means: returns }
    - { node: verdict__verdict, outcome: approve, means: approves }
  results: { round: /round, allowance: /allowance, change: /change }

nodes:
  # The commit this change sits on, read after the builder's last commit: a builder
  # may move its branch onto newer work, and the checks must compare against that.
  - id: base
    display: { label: Reads the base commit }
    bash: |
      onto="${INPUTS_LAND_ON:-}"
      [ -n "$onto" ] || onto=$BASE_BRANCH
      git merge-base HEAD "origin/$onto" 2>/dev/null || git merge-base HEAD "$onto"

  # The change's size at the end of each delivery run since the item was last planned, as
  # the engine recorded it, for the verdict and the exhausted ask.
  - id: sizes
    display: { label: Reads the change's sizes }
    runtime: bun
    mutates_checkout: false
    script: sizes

  # Each check starts with a fresh context and is told what was returned last round and
  # what the builder says it did about it. Both arrive as this run's inputs, from the
  # result of the build run that ended before it.
  - id: review
    include: review
    depends_on: [base]
    with:
      item: $INPUTS.item
      answers: $INPUTS.answers
      base: $base.output
      review_policy: $INPUTS.review_policy
      returned_before: $INPUTS.returned_before
      builder_reply: $INPUTS.builder_reply

  - id: tests
    include: tests
    depends_on: [base]
    with:
      item: $INPUTS.item
      answers: $INPUTS.answers
      base: $base.output
      test_policy: $INPUTS.test_policy
      returned_before: $INPUTS.returned_before
      builder_reply: $INPUTS.builder_reply

  - id: product
    include: product
    depends_on: [base]
    with:
      item: $INPUTS.item
      answers: $INPUTS.answers
      base: $base.output
      product_policy: $INPUTS.product_policy

  - id: verdict
    include: verdict
    depends_on: [review, tests, product, sizes]
    with:
      item: $INPUTS.item
      answers: $INPUTS.answers
      plan: $INPUTS.plan
      sizes: $sizes.output
      review_policy: $INPUTS.review_policy
      reports: |
        ## From the review (is the change right against the item)
        $review.output

        ## From the test check (do the tests the change adds or edits earn their place)
        $tests.output

        ## From the product review (is the change right for the product's users)
        $product.output

        ## From the builder (what it did about what was returned last round; empty in the first round)
        $INPUTS.builder_reply

  # Which round this is, and whether the start this round's outcome needs is used up: a
  # return goes to the builder twice on an item by itself, a replan to planning once.
  - id: limit
    display: { label: Counts the round }
    depends_on: [verdict]
    runtime: bun
    script: limit
    with:
      stage: stage-check
      last: $verdict.output
      ends_as: '{}'
    output_format:
      type: object
      properties:
        round: { type: integer }
        state: { type: string, enum: [open, used_up] }
      required: [round, state]

  # The rounds this item is allowed are used up and the change is still returned. One more
  # round is not automatic: an agent reads what is left and recommends what to do, with
  # the prompt in commands/exhausted.md. The options are the stage's: the recommendation names one.
  - id: exhausted
    display: { label: Rounds ran out }
    depends_on: [limit, sizes]
    when: "$limit.output.state == 'used_up'"
    command: exhausted
    model: ['@judge', medium]
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      properties:
        asks:
          type: array
          description: 'The one decision: what should happen to this change now.'
          items:
            type: object
            additionalProperties: false
            properties:
              question: { type: string }
              context: { type: string }
              recommendation:
                type: object
                additionalProperties: false
                properties:
                  option:
                    type: string
                    enum: [one-more-round, take-as-is, replan, drop, reshape, none]
                    description: 'What you would do, by the id of one of the options this stage declares, which the ask offers. none when you have no basis to choose: the ask then carries no recommendation, and your why says what stops you. When you would split the change, recommend replan and say so.'
                  why: { type: string, description: 'Why that one. If you are not sure, say what would change your mind. With none: why you cannot choose, and what you would need to know to choose. The operator reads it in place of a recommendation.' }
                required: [option, why]
            required: [question, context, recommendation]
        same_kind: { type: string, description: 'Whether what is left is the same kind of finding the earlier round returned, and how you know. Say so plainly when you cannot tell.' }
      required: [asks, same_kind]

  - id: end
    display: { label: Hands the change on }
    depends_on: [limit, exhausted]
    trigger_rule: all_done
    runtime: bun
    script: ending
    with:
      stage: stage-check
      last: $verdict.output
      change: $INPUTS.change
      limit: $limit.output
      exhausted: { from: $exhausted.output, if_skipped: "" }
      next: ""      # build stage only
      checked: ""   # host stage only
      # What the builder gets when this round returns the change: where it is proposed and
      # the verdict's findings, each once. The verdict is the one place that has the item,
      # the plan and all three reports, and it has already sorted them: its notes and what
      # the checks noticed beside the item are for the maintainers, on the change's report,
      # and reach the builder nowhere. The three reports are not handed on.
      returned: |
        The change is proposed at $INPUTS.change

        ## What must change before this lands

        $verdict.output.findings

        ## How the change grew across its rounds

        $verdict.output.growth

        These findings are everything that returned the change. The checks also left notes and things they noticed beside the item; those are on the change's report for the maintainers and are not yours to act on.
    output_format:
      type: object
      properties:
        outcome: { type: string, enum: [approve, return, replan, ask] }
        change: { type: string }
        summary: { type: string }
        for_next: { type: string }
        noticed: { type: array, description: 'What the checks noticed that this change did not cause.' }
        round: { type: integer, description: 'Which run of this stage on the item this is, counted since the item was last planned.' }
        returned: { type: string, description: 'What goes back to the builder: the verdict and the three reports.' }
      required: [outcome, change, summary, for_next, noticed, round, returned]

  # The report on the proposed change, written after the stage has ended so it can say how:
  # one comment replaced each round, and this round's findings on their lines.
  - id: report
    include: report
    depends_on: [end]
    with:
      change: $INPUTS.change
      verdict: $verdict.output
      item_lines: $review.output.item_lines
      builder_reply: $INPUTS.builder_reply
      ending: $end.output
