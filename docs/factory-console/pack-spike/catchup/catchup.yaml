name: catchup
description: |
  The short way back to landing. A change that was approved and then fell behind its
  landing branch is brought up to date by its builder. This stage compares the change
  itself before and after, and waits for the host's checks at the new head. When the lines
  the change adds and removes are the same as what was approved, and the checks are green,
  it goes straight back to the land stage: the approval was for this change and still
  holds. Anything else goes to the host round and the land gate, as a host fix does.

model: ['@host', medium]

inputs:
  item:
    description: The work item as text.
  change:
    description: Where the change is proposed.
  land_on:
    default: ""
    description: The branch this item's change lands on. Empty means the project's base branch.
  answers:
    default: "None."
    description: Decisions an operator already made on this item.
  landing:
    result_of: land
    description: What the land run that found the change behind ended with. Read from the item, for what the checks noticed.

# Neither outcome ends the item: `ready` starts the land stage, `changed` the host round.
returns: { node: end, outcome: outcome, summary: summary }

display:
  label: Catch up
  short: "Still what was approved?"
  blurb: "The short way back to merging. A change brought up to date with its landing branch goes straight back to land when the change itself is unchanged and CI is green; otherwise CI and the reviews read it again."
  outcomes:
    changed: { label: changed, story: "Catch up found the change differs from what was approved, or its CI is not green, and sent it to CI and the reviews" }
    ready: { label: unchanged and green, story: "Catch up found the change unchanged and CI green, and sent it back to land" }
  phases:
    - label: Compare
      cards:
        - { title: Landing branch, text: Finds the branch the change lands on, icon: git-branch, kind: script, covers: [onto] }
        - { title: Compare, text: Compares the lines the change adds and removes with what was approved, icon: search-code, kind: script, covers: [same] }
    - label: CI
      cards:
        - { title: Read CI, text: "Reads the checks at the new head, when the change is unchanged", icon: monitor-check, kind: agent, covers: [checks] }
    - label: Hand on
      cards:
        - { title: Hand on, text: "Back to land, or to CI and the reviews", icon: send, kind: script, covers: [end] }

nodes:
  # The branch the change lands on, as the builder's checkout knows it after its merge.
  - id: onto
    display: { label: Finds the landing branch }
    bash: |
      onto="${INPUTS_LAND_ON:-}"
      [ -n "$onto" ] || onto=$BASE_BRANCH
      git rev-parse --verify -q "origin/$onto" >/dev/null && echo "origin/$onto" || echo "$onto"

  # Code compares; nobody judges whether two diffs mean the same.
  - id: same
    display: { label: Compares the change before and after }
    depends_on: [onto]
    runtime: bun
    mutates_checkout: false
    script: catchup
    with:
      onto: $onto.output

  # The host's checks at the new head. Asked only when the change itself is unchanged:
  # a changed one goes to the host round, which reads the checks and the reviews.
  - id: checks
    display: { label: Reads CI at the new head }
    depends_on: [same]
    when: "$same.output.same == true"
    command: catchup-checks
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      properties:
        checks: { type: string, enum: [green, red, waiting], description: 'green: every check the host requires at the head finished and passed. red: one failed. waiting: you gave up waiting.' }
        head: { type: string, description: 'The commit you read the checks at.' }
        merges: { type: boolean, description: 'Whether the host says the change merges with the branch it targets now.' }
        summary: { type: string, description: 'One or two sentences: what you read.' }
      required: [checks, head, merges, summary]

  - id: end
    display: { label: Hands the change on }
    depends_on: [same, checks]
    trigger_rule: none_failed_min_one_success
    runtime: bun
    mutates_checkout: false
    with:
      same: $same.output
      checks: $checks.output
      change: $INPUTS.change
      landing: $INPUTS.landing
    script: |
      import { emit, input } from 'archon:script';
      const parse = (name: string) => { try { return JSON.parse(input(name) || 'null'); } catch { return null; } };
      const same = parse('same') ?? {};
      const checks = parse('checks');
      const ready = same.same === true && checks?.checks === 'green' && checks?.merges === true;
      const why = same.same !== true ? `The change itself differs from what was approved: ${same.why ?? 'not compared'}`
        : checks?.checks !== 'green' ? `The change is unchanged, but its checks are ${checks?.checks ?? 'unread'}. ${checks?.summary ?? ''}`
        : checks?.merges !== true ? 'The change is unchanged and green, but the host says it still does not merge.'
        : 'The lines the change adds and removes are the ones that were approved, and the checks are green at the new head.';
      emit({
        outcome: ready ? 'ready' : 'changed',
        change: input('change').trim(),
        summary: why,
        // For the host round, when it is not ready: what this stage was looking at.
        returned: 'The land stage found the change behind its landing branch, and the builder brought it up to date.',
        reply: why,
        noticed: parse('landing')?.noticed ?? [],
        compared: same,
        metrics: [{ name: 'sf.catchup_ready', unit: 'changes', subject: input('change').trim() || null, kind: 'count', value: ready ? 1 : 0 }],
      });
    output_format:
      type: object
      properties:
        outcome: { type: string, enum: [ready, changed] }
        change: { type: string }
        summary: { type: string }
        returned: { type: string }
        reply: { type: string }
        noticed: { type: array }
      required: [outcome, change, summary, returned, reply, noticed]
