name: tests
description: |
  Check the tests one change adds or edits: does each earn its place in the
  suite. Asks for a test only where the item itself names a behaviour that nothing guards. Changes nothing in the change.

model: ['@test-checker', large]

inputs:
  item:
    description: The work item as text.
  answers:
    default: "None."
    description: Decisions an operator already made on this item.
  base:
    description: The commit the change was built on.
  test_policy:
    default: ""
    description: The pack setting of the same name, declared here so a workflow that includes this stage can pass it through.
  returned_before:
    default: "Nothing. This is the first time this change is checked."
    description: What the checks returned the last time this change was checked.
  builder_reply:
    default: "Nothing."
    description: What the builder says it did about what was returned.

returns: { node: tests, outcome: outcome }

nodes:
  - id: tests
    display: { label: Test check }
    command: tests
    # A small model sometimes fails to produce a report that meets the schema on a large
    # change. A second attempt starts with a fresh context, which is what gets past it.
    # `schema_unmet` retries that and the transient failures, and not an unknown failure.
    retry: { max_attempts: 2, on_error: schema_unmet }
    output_format:
      type: object
      additionalProperties: false
      properties:
        outcome: { type: string, enum: [sound, return, ask] }
        summary: { type: string, description: 'For a maintainer deciding whether to land it.' }
        findings:
          type: array
          description: 'With return: each test that does not earn its place. Empty with sound.'
          items:
            type: object
            additionalProperties: false
            properties:
              test: { type: string, description: 'The test, by file and name. For something the item asks for that nothing guards: the line of the item.' }
              fault: { type: string, enum: [cannot_fail, fails_for_other_reasons, guards_nothing_that_matters, already_guarded, item_asks_unguarded] }
              evidence: { type: string, description: 'What you ran and what it showed.' }
              do: { type: string, enum: [remove, simplify, repair, add] }
              how: { type: string }
            required: [test, fault, evidence, do, how]
        noted:
          type: array
          items: { type: string }
          description: 'Each thing about a test that you would mention and not return the change for: more than the change needs, could be simpler, a name that misleads. A note returns nothing. Empty when there is none.'
        checked:
          type: array
          items: { type: string }
          description: 'Each thing you ran or read to decide, and what it showed.'
        asks:
          type: array
          description: 'Each decision that belongs to a maintainer. Empty when there is none.'
          items:
            type: object
            additionalProperties: false
            properties:
              question: { type: string }
              context: { type: string }
              options:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    id: { type: string, description: 'kebab-case, one token, such as keep-the-flag. The answer names it.' }
                    does: { type: string }
                    cost: { type: string }
                  required: [id, does, cost]
              recommendation:
                type: object
                additionalProperties: false
                properties:
                  option: { type: string, description: 'The id of the option you would take. It is one of the options above.' }
                  why: { type: string, description: 'Why that one. If you are not sure, say what would change your mind.' }
                required: [option, why]
            required: [question, context, options, recommendation]
        notes: { type: string, description: 'Anything worth saying that has no field here: caveats, doubts, things noticed.' }
        for_next: { type: string, description: 'Anything the engineer who fixes the tests you returned needs from you that has no field here. Write it to them.' }
      required: [outcome, summary, findings, noted, checked, asks, notes, for_next]
