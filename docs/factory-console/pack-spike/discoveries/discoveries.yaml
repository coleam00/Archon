name: discoveries
description: |
  Drain what agents noticed outside their scope: read the whole list, verify
  what is worth filing against the code, and decide what becomes a work item.
  It creates up to three of those items in the project's tracker, when there is one,
  and changes nothing else.

model: ['@manager', large]

inputs:
  discoveries:
    description: What agents noticed, each entry with where it came from.
  open_items:
    default: "None listed."
    description: The project's open items, as a short index.

# When nothing was noticed the drain is skipped and the run completes with no result.
returns: drain

display:
  label: Discoveries
  short: Files what was noticed
  blurb: "After a merge, files what agents noticed outside their own task as new work, or holds or drops it."
  story: The factory looked for other work it noticed

nodes:
  # An empty list is the common case: most deliveries notice nothing. Count the entries so
  # the manager is not started to say so.
  - id: intake
    display: { label: Collect what agents noticed }
    runtime: bun
    with:
      discoveries: $INPUTS.discoveries
    script: |
      import { input } from 'archon:script';
      const text = input('discoveries').trim();
      let entries = text ? 1 : 0;
      try {
        const parsed = JSON.parse(text);
        if (Array.isArray(parsed)) entries = parsed.length;
        else if (parsed === null) entries = 0;
      } catch {}
      console.log(JSON.stringify({ entries }));

  - id: drain
    display: { label: "File it as new work, or hold or drop it" }
    depends_on: [intake]
    when: "$intake.output.entries > 0"
    command: discoveries
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      properties:
        summary: { type: string, description: 'For the operator: what was on the list and what you decided.' }
        filed:
          type: array
          description: 'Most valuable first.'
          items:
            type: object
            additionalProperties: false
            properties:
              title: { type: string }
              kind: { type: string, enum: [defect, cleanup, question, other] }
              item: { type: string, description: 'The work item as text.' }
              seen_by: { type: array, items: { type: string }, description: 'The entries this came from.' }
              verified: { type: string, description: 'What you ran or read to confirm it, and what it showed.' }
              key: { type: string, description: 'The short kebab-case name in its marker.' }
              filed_at: { type: string, description: 'Where it was filed in the tracker. Empty when nothing was written.' }
            required: [title, kind, item, seen_by, verified, key, filed_at]
        folded:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              into: { type: string }
              what: { type: string }
              adds: { type: string }
            required: [into, what, adds]
        held:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              what: { type: string }
              until: { type: string, description: 'What would change that. For one held only because three were filed this run: say so.' }
            required: [what, until]
        dropped:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              what: { type: string }
              why: { type: string }
            required: [what, why]
        left_out: { type: string, description: 'How many entries were caveats about the reporting agent own work, in a sentence.' }
        notes: { type: string, description: 'Anything worth saying that has no field here.' }
        for_next: { type: string, description: 'Anything the operator who owns the backlog needs from you that has no field here. Write it to them.' }
      required: [summary, filed, folded, held, dropped, left_out, notes, for_next]
