name: complexity
description: |
  Shadow, since 2026-11-25. Judges at triage how complex an item is to get right, from the
  item alone, with what a shorter path could skip. It starts nothing and changes nothing.
  Its result is only recorded, to find out whether a triage-time judgment could route an
  item onto a shorter path: compare it with what the item's later check rounds found.

model: ['@judge', medium]

inputs:
  item:
    description: The work item as text.
  judgment:
    result_of: triage
    description: What triage concluded about the item.

# `observes: true`: its runs act on an item without being steps of it, so they never
# stop, end or move the item, and never hide a stop on it.
observes: true
returns: { node: end, outcome: outcome, summary: why }

display:
  label: Complexity
  short: "How hard to get right?"
  blurb: "Judges, at triage, how complex the item is to get right and what a shorter path could skip. A measurement only: it starts nothing."
  outcomes:
    none: { label: nothing recorded, story: Complexity recorded no judgment }
    recorded: { label: complexity recorded, story: Complexity recorded how hard it is to get right }
  phases:
    - label: Judge
      cards:
        - { title: Judge, text: "Judges whether the item is plain, ordinary or involved, and what a shorter path could skip", icon: ruler, kind: agent, covers: [at_triage] }
    - label: Record
      cards:
        - { title: Record, text: "Records the judgment; nothing acts on it", icon: database, kind: script, covers: [end] }

nodes:
  - id: at_triage
    display: { label: Judges how complex it is }
    command: at-triage
    mutates_checkout: false
    output_format:
      type: object
      additionalProperties: false
      properties:
        complexity: { type: string, enum: [plain, ordinary, involved] }
        why: { type: string, description: 'One sentence.' }
        would_skip:
          type: array
          items: { type: string, enum: [plan, test-check, later-rounds] }
      required: [complexity, why, would_skip]

  # The judgment as a record for `archon metrics`, one per item, latest wins.
  - id: end
    display: { label: Records the judgment }
    depends_on: [at_triage]
    runtime: bun
    mutates_checkout: false
    with:
      triage: $at_triage.output
    script: |
      import { emit, input, item } from 'archon:script';
      let said: any = null;
      try { said = JSON.parse(input('triage') || 'null'); } catch {}
      const step = String(said?.complexity ?? '');
      const metrics = step ? [{ name: 'sf.complexity_at_triage', unit: 'items', subject: item()?.item.key ?? null, kind: 'count', value: 1 }] : [];
      emit({
        outcome: step ? 'recorded' : 'none',
        step,
        why: String(said?.why ?? ''),
        would_skip: said?.would_skip ?? [],
        metrics,
        metric_dimensions: metrics.map(() => ({ step })),
      });
    output_format:
      type: object
      properties:
        outcome: { type: string, enum: [recorded, none] }
        step: { type: string }
        why: { type: string }
      required: [outcome, step, why]
