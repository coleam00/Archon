name: survey
description: |
  Judge one open issue the way triage does, and stop there. A survey of the backlog:
  the same judgment, the same project policies and the same admit shadow as triage, on
  an item of its own (`survey-<n>`), and nothing after it. No binding starts from it,
  and it writes nothing to the issue. Its results are read together to decide closes,
  folds and what to order.

inputs:
  item:
    default: ""
    description: >-
      The work item as text: its title, its body, and the discussion on it. A run by hand
      gives this; the binding on a newly opened issue gives `issue` instead.
  issue:
    default: ""
    description: The number of the issue to judge, on the repository `repo_host` and `repo_path` name. Set by the binding that starts a survey when an issue is opened.
  repo_host:
    default: ""
    description: The host of the project's repository, such as github.com. Read with `issue`.
  repo_path:
    default: ""
    description: The path of the project's repository on its host, such as acme/widgets. Read with `issue`.
  members:
    default: "[]"
    description: Not used by a survey; triage's judgment reads it. Leave it empty.
  depends_on:
    default: "[]"
    description: Not used by a survey; triage's judgment reads it. Leave it empty.

# A survey records a judgment to read; it is never a step of the item.
observes: true
returns:
  node: judge
  outcome: recommend
  summary: why

display:
  label: Survey
  short: Would triage build it?
  blurb: "Judges a newly opened issue the way triage would, on an item of its own, and stops there. It starts nothing and writes nothing on the issue: its judgments are read together."
  outcomes:
    build: { label: would build, story: The survey judged it worth building }
    narrow: { label: would narrow, story: "The survey judged it worth building, in a narrower form" }
    split: { label: would split, story: The survey judged it is more than one change }
    shape: { label: would need shaping, story: "The survey judged it worth doing, once a maintainer settles its open questions" }
    recipe: { label: handled another way, story: The survey judged it is handled another way }
    native: { label: handled another way, story: The survey judged it is handled another way }
    fold: { label: would fold, story: The survey judged it belongs in another item }
    park: { label: would park, story: The survey judged it should be parked for later }
    deprecate: { label: would close, story: The survey judged it should be deprecated }
    decline: { label: would close, story: The survey judged it should be declined }
    close: { label: would close, story: The survey judged it should be closed }
  phases:
    - label: Read
      cards:
        - { title: Read the issue, text: "Reads the issue and its discussion, or the item given by hand", icon: inbox, kind: script, covers: [read] }
    - label: Decide
      cards:
        - { title: Decide, text: "Decides whether the item is worth building, and how, as triage would", icon: scale, kind: agent, covers: [judge__judge] }
        - { title: Would it start on its own, text: Decides whether it would start without you, icon: ruler, kind: agent, covers: [judge__admit] }
        - { title: Record, text: Records the measurement, icon: database, kind: script, covers: [judge__admitted] }

nodes:
  # The item as text: what a run by hand gave, or the issue the binding names, read
  # through the forge. An issue that cannot be read fails the run with the reason.
  - id: read
    display: { label: Reads the issue }
    runtime: bun
    mutates_checkout: false
    with:
      item: $INPUTS.item
      issue: $INPUTS.issue
      repo_host: $INPUTS.repo_host
      repo_path: $INPUTS.repo_path
    script: |
      import { emit, forge, input } from 'archon:script';
      const given = input('item').trim();
      const issue = Number(input('issue').trim());
      if (given || !(Number.isInteger(issue) && issue > 0)) {
        if (!given) throw new Error('A survey needs the item as text, or the number of an issue to read.');
        emit({ item: given });
      } else {
        const ref = { repo: { host: input('repo_host').trim(), path: input('repo_path').trim() }, number: issue };
        const work = forge('workitem.view', { ref });
        const seen = forge('workitem.comments', { subject: { kind: 'issue', ref } });
        const talk = (seen.comments ?? [])
          .map((c: any) => `**${c.author?.login ?? 'someone'}**:\n\n${String(c.body ?? '').trim()}`)
          .join('\n\n');
        emit({
          item: `---\nid: ${issue}\nsource: ${work.url ?? ''}\nopened_by: ${work.author?.login ?? 'unknown'}\n---\n\n` +
            `# ${work.title}\n\n${String(work.body ?? '').trim()}\n\n## Discussion\n\n${talk || 'No comments.'}`,
        });
      }
    output_format:
      type: object
      properties:
        item: { type: string, description: 'The work item as text.' }
      required: [item]

  - id: judge
    depends_on: [read]
    include: judge
    with:
      item: $read.output.item
      triage_policy: $INPUTS.triage_policy
      members: $INPUTS.members
      depends_on: $INPUTS.depends_on
      admit_policy: $INPUTS.admit_policy
