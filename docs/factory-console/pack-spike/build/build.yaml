name: build
description: |
  Make one planned change in its own checkout, commit it, and open it for review as a draft.

model: ['@builder', large]

inputs:
  item:
    description: The work item as text.
  plan:
    result_of: plan
    description: What plan concluded, as its result. It holds the option plan recommends and the plan for it. Read from the item when the start does not pass it.
  answers:
    default: "None."
    description: Decisions an operator already made on this item.
  before:
    default: "Nothing. This item has not been delivered before."
    description: What the last delivery run on this item ended with.
  land_on:
    default: ""
    description: The branch this item's change lands on. Empty means the project's base branch.
  build_policy:
    default: ""
    description: The pack setting of the same name, declared here so a workflow that includes this stage can pass it through.

returns: { node: build, outcome: outcome }

nodes:
  # The builder continues the session it last had on this item. When the stage runs again
  # on an item it already built, the builder still knows its change and reads what was
  # returned as decisions and findings already given; on a first run there is none to continue.
  - id: build
    display: { label: Writes or fixes the change }
    command: build
    context: same
    output_format:
      type: object
      additionalProperties: false
      properties:
        outcome: { type: string, enum: [built, ask, stop] }
        summary: { type: string, description: 'For a maintainer who has not read the plan.' }
        changed:
          type: array
          items: { type: string }
          description: 'What changed, one line per part of the change.'
        checked:
          type: array
          items: { type: string }
          description: 'Each thing you ran to check your work, and what it showed.'
        commit: { type: string, description: 'The commit that holds the change. Empty when there is none.' }
        proposed: { type: string, description: 'The address of the proposed change, whether you opened it now or continued one opened earlier. Empty only when the project has nowhere to propose a change.' }
        title: { type: string, description: 'The title you proposed it with.' }
        description: { type: string, description: 'The description you proposed it with, as text.' }
        asks:
          type: array
          description: 'Each decision that belongs to a maintainer. Empty when there is none.'
          items:
            type: object
            additionalProperties: false
            properties:
              question: { type: string }
              context: { type: string }
              options:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  properties:
                    id: { type: string, description: 'kebab-case, one token, such as keep-the-flag. The answer names it.' }
                    does: { type: string }
                    cost: { type: string }
                  required: [id, does, cost]
              recommendation:
                type: object
                additionalProperties: false
                properties:
                  option: { type: string, description: 'The id of the option you would take. It is one of the options above.' }
                  why: { type: string, description: 'Why that one. If you are not sure, say what would change your mind.' }
                required: [option, why]
            required: [question, context, options, recommendation]
        stop: { type: string, description: 'Why it could not be built, and what you recommend. Empty otherwise.' }
        notes: { type: string, description: 'Anything worth saying that has no field here: caveats, doubts, things noticed.' }
        for_next: { type: string, description: 'Anything the maintainer who reads this change, and the engineer who continues it if it comes back needs from you that has no field here. Write it to them.' }
      required: [outcome, summary, changed, checked, commit, proposed, title, description, asks, stop, notes, for_next]
