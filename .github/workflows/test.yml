name: Windows budget phases diagnostic
on:
  workflow_dispatch:
env:
  BUN_VERSION: '1.4.2'
jobs:
  trace:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Trace full package tests
        shell: pwsh
        run: |
          $payloadDir = Join-Path $env:RUNNER_TEMP 'archon-diag-payload'
          New-Item -ItemType Directory -Force -Path $payloadDir | Out-Null
          [IO.File]::WriteAllBytes((Join-Path $payloadDir 'preload.cjs'), [Convert]::FromBase64String(''))
          [IO.File]::WriteAllBytes((Join-Path $payloadDir 'run.ps1'), [Convert]::FromBase64String(''))
          & (Join-Path $payloadDir 'run.ps1') -Repository $env:GITHUB_WORKSPACE -OutputDirectory (Join-Path $env:RUNNER_TEMP 'archon-diag-output') -Mode full
          exit $LASTEXITCODE
      - name: Retain diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-budget-phases
          path: ${{ runner.temp }}/archon-diag-output
