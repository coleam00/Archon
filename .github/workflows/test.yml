name: Test Suite

on:
  workflow_dispatch:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  BUN_VERSION: '1.4.2'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - name: Setup uv
        uses: astral-sh/setup-uv@v4
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Warm uv
        run: uv run python -c "print('uv warm')"
      - name: Forge probe (idle)
        run: bun scripts/diag-forge-probe.ts
      - name: Validate (Windows)
        run: bun run validate --only tests
      - name: Forge probe (after suite)
        if: always()
        run: bun scripts/diag-forge-probe.ts

