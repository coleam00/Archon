# TEMPORARY (#5127): remove before the pull request is marked ready.
# Probes the detached-timeout test's socket ready signal on Windows and loops the test.
name: tmp-5127 probe

on:
  pull_request:
  workflow_dispatch:

env:
  BUN_VERSION: '1.4.2'

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile
        env:
          BUN_INSTALL_CACHE_DIR: ${{ runner.temp }}/bun-install-cache

      - name: Socket probe (old end signal vs new line signal)
        if: runner.os == 'Windows'
        run: bun .github/tmp-5127/socket-probe.ts 300

      # The spec as it was on dev before this change: report-only, this is the red side.
      - name: Old spec, 50 runs (report only)
        if: runner.os == 'Windows'
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          export PATH="/c/Program Files/Git/mingw64/bin:$PATH"
          spec=packages/cli/src/commands/workflow-file-store.integration.spec.ts
          cp "$spec" "$RUNNER_TEMP/new-spec.ts"
          git show a83a37b0f:"$spec" > "$spec"
          .github/tmp-5127/loop.sh 50 old --report-only
          cp "$RUNNER_TEMP/new-spec.ts" "$spec"

      - name: New spec, 50 runs
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: |
          if [ "$RUNNER_OS" = Windows ]; then export PATH="/c/Program Files/Git/mingw64/bin:$PATH"; fi
          .github/tmp-5127/loop.sh 50 new
