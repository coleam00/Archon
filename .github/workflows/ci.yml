# CI for the factory-console proof of concept. Upstream Archon's full CI (release, docs, e2e,
# Windows and macOS legs) is not run here; this covers what the console work can break: the
# static checks and the console reopen-asks and factory-view check tests in `check`, the suites of the packages the console
# touches in `package-tests`, and every store test that runs on Postgres in `postgres`.
name: ci
on:
  pull_request:
  push:
    branches: [main, combined]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
env:
  BUN_VERSION: "1.4.5"
jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Generated API types, lint, format
        run: bun run validate --only generated-files,lint,format
      # One TypeScript 7 `tsc -b` build over every package and root project (dev's scripts/type-check.ts),
      # one project at a time: measured 1.7 GB peak, so a private repository's 7 GB runner no longer
      # needs the packages checked one after another.
      - name: Type-check
        run: bun run type-check
      # Guards `dev:console --reopen-asks`, which rewrites the scratch copy's asks.
      - name: Console reopen-asks
        run: bun test ./scripts/console-reopen-asks.test.ts
      - name: Web build
        run: bun run build:web
      # The factory view check's script; its validator and read run in the workflows, core and
      # server suites below.
      - name: Factory view check tests
        run: bun test ./scripts/check-factory-view.test.ts

  # Each package's suite on its own runner, through the package's `test` script
  # (scripts/package-tests.ts), as upstream's CI did. A private repository's runner has 7 GB and
  # 2 vCPUs. There, test groups running side by side starve each other's timing-bound upstream
  # tests, so every leg runs one group at a time (ARCHON_TEST_CONCURRENCY=1). cli is too slow
  # for one 45-minute leg that way, so it runs in parts split by measured group time
  # (ARCHON_TEST_PART). The junit options put the runner in request mode, which runs every group
  # even after one fails, and its combined report gives the leg's totals and its failing files.
  package-tests:
    name: tests (${{ matrix.package }}${{ matrix.part && format(' {0}', matrix.part) || '' }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # Every leg must report: with fail-fast, one failing leg cancels the others and hides
      # their results until the next round.
      fail-fast: false
      matrix:
        include:
          - { package: core, part: '' }
          - { package: workflows, part: '' }
          - { package: cli, part: 1/3 }
          - { package: cli, part: 2/3 }
          - { package: cli, part: 3/3 }
          - { package: adapters, part: '' }
          - { package: server, part: '' }
          - { package: web, part: '' }
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      # Script-node tests run Python through uv (upstream's test job installed it too).
      - uses: astral-sh/setup-uv@v4
      - run: bun install --frozen-lockfile
      # A failing file is rerun once by itself (scripts/retry-failed-test-files.ts), which prints
      # `RETRIED <file>` to the log and the summary; a file that fails again fails the leg.
      - name: Tests
        env:
          ARCHON_TEST_CONCURRENCY: '1'
          ARCHON_TEST_PART: ${{ matrix.part }}
        run: |
          report="$RUNNER_TEMP/junit.xml"
          bun run --cwd packages/${{ matrix.package }} test --reporter=junit --reporter-outfile="$report" && exit 0
          bun scripts/retry-failed-test-files.ts packages/${{ matrix.package }} "$report"
      - name: Test counts
        if: always()
        run: |
          totals=$(grep -o '<testsuites[^>]*>' "$RUNNER_TEMP/junit.xml" || echo 'no report written')
          printf '### %s %s\n\n`%s`\n' '${{ matrix.package }}' '${{ matrix.part }}' "$totals" | tee -a "$GITHUB_STEP_SUMMARY"

  # The stores must work on Postgres as well as SQLite. This runs every test file that reads
  # ARCHON_TEST_PG_URL, found by content rather than by name (not every such file is named
  # `*.postgres.*`). Among them is the workflow-store conformance, which also carries the
  # item/link and item-ask conformance harnesses. Each test creates and drops its own scratch
  # database; each file replaces the connection module, so each runs in its own process through
  # its package's runner (which applies the package's preload). These files skip without the
  # URL, so a file that reports no executed test fails the job rather than passing green.
  postgres:
    name: postgres
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # These tests assert behaviour across stores, never durability, so their writes stay off
    # the runner's root disk (dev #6115): temp (the file store's root) goes to tmpfs through
    # TMPDIR, and the server's data directory is a tmpfs mount (PGDATA in the postgres 17
    # image; from 18 the image keeps data elsewhere). Durable fsyncs stalled single cheap
    # tests for 1-5 s on a shared runner.
    env:
      TMPDIR: /dev/shm
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}
      - run: bun install --frozen-lockfile
      - name: Stores on Postgres
        env:
          ARCHON_TEST_PG_URL: postgres://postgres:postgres@localhost:5432/postgres
        run: |
          failed=0
          i=0
          files=$(git grep -l ARCHON_TEST_PG_URL -- 'packages/*.test.ts' 'packages/*.spec.ts')
          [ -n "$files" ] || { echo '::error::no test file reads ARCHON_TEST_PG_URL'; exit 1; }
          for f in $files; do
            pkg=${f#packages/}; pkg=${pkg%%/*}; rel=${f#packages/$pkg/}; i=$((i+1))
            out="$RUNNER_TEMP/pg-$i.xml"
            printf '== %s\n' "$f"
            # A failing file is rerun once, as in package-tests; a second failure fails the job.
            if ! bun run --cwd "packages/$pkg" test "$rel" --reporter=junit --reporter-outfile="$out"; then
              printf -- '- `RETRIED %s`\n' "$f" | tee -a "$GITHUB_STEP_SUMMARY"
              bun run --cwd "packages/$pkg" test "$rel" --reporter=junit --reporter-outfile="$out" || failed=1
            fi
            totals=$(grep -o '<testsuites[^>]*>' "$out" || echo 'no report written')
            printf -- '- `%s`: `%s`\n' "$f" "$totals" | tee -a "$GITHUB_STEP_SUMMARY"
            tests=$(sed -nE 's/.* tests="([0-9]+)".*/\1/p' <<<"$totals")
            skipped=$(sed -nE 's/.* skipped="([0-9]+)".*/\1/p' <<<"$totals")
            if [ "${tests:-0}" -le "${skipped:-0}" ]; then
              echo "::error file=$f::no test ran on Postgres"
              failed=1
            fi
          done
          exit $failed
