name: Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'main') }}
          flavor: |
            latest=auto

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          # Build arguments are published in the attestation; secrets must use secrets:, whose values are excluded.
          provenance: mode=max
          sbom: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify published attestations
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          image="${REGISTRY}/$(printf '%s' "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')@${DIGEST}"
          provenance=$(docker buildx imagetools inspect "$image" --format '{{ json .Provenance }}')
          sbom=$(docker buildx imagetools inspect "$image" --format '{{ json .SBOM }}')
          if ! jq -e 'type == "object" and length > 0 and all(.[]; .SLSA | type == "object" and length > 0)' <<< "$provenance"; then
            echo "::error::Missing or empty provenance attestation on $image"
            exit 1
          fi
          if ! jq -e 'type == "object" and length > 0 and all(.[]; .SPDX | type == "object" and length > 0)' <<< "$sbom"; then
            echo "::error::Missing or empty SBOM attestation on $image"
            exit 1
          fi
