worktree:
  baseBranch: dev

docs:
  path: packages/docs-web/src/content/docs

aliases:
  # Cheap model for the t1–t4 engine-primitive test workflows. Every test workflow
  # references `@mini` rather than a literal model id, so retargeting them all is a
  # one-line edit here — and so per-run tier/alias rebinding (#2481) can reach them.
  '@mini':
    provider: pi
    model: minimax/MiniMax-M3

# Tier presets — the orchestrator resolves `small` / `medium` / `large`
# references in workflow YAMLs into the catalog entry below. Models are
# AIDERDESK AGENT-PROFILE NAMES (case-sensitive), NOT provider/model
# literals. The AiderDesk provider looks each name up against
# `/api/agent-profiles` at request time; an unknown profile throws
# `UnknownAiderDeskAgentProfileError`. Use `modelOverride` on the
# workflow node if a specific inference endpoint is needed.
tiers:
  small:
    provider: aiderdesk
    model: Power Tools
  medium:
    provider: aiderdesk
    model: Aider
  large:
    provider: aiderdesk
    model: Poe
