# Dry-run fixture: eval mode on a listed maintainer's issue. Triage is handed the
# issue's title and body at creation, not its URL. The facts and outcome scripts
# are stubbed; .archon/scripts/__tests__/intake.test.ts proves that in eval they
# make no write call.
facts:
  path: triage
  item: { repo: { host: "github.com", path: "example/repo" }, number: 7 }
  target: "# Stub title at creation\n\nStub body at creation."
  decision:
    path: triage
    trust: maintainer
    promoted: null
    stage: new
    body_digest: "sha256:stub"
    labels: []
    waiting: []
    notes: []
  seen: { title: "Stub title at creation", body_digest: "sha256:stub", body_from: creation }
triage__triage:
  decision: { contract: READY, route: deliver }
  type: { value: feature, reason: "stub: asks for new behavior" }
  size: { value: s, reason: "stub: size" }
  complexity: { value: low, reason: "stub: complexity" }
  importance: { value: medium, reason: "stub: importance" }
  urgency: { value: none, reason: "stub: urgency" }
  item: { repo: { host: "", path: "" }, number: 0 }
  area_labels: []
  report: { type: archon_artifact, run_id: "fixture-run", path: "triage.md" }
  summary: "stub: ready to deliver"
outcome:
  path: triage
  item: 7
  stage: deliver
  trust: maintainer
  promoted: false
  labels: [archon-ready, archon-size-s, archon-type-feature]
  summary: "stub: Issue 7: deliver"
  evaluation:
    trust_input: auto
    seen: { title: "Stub title at creation", body_digest: "sha256:stub", body_from: creation }
    labels: { add: [archon-ready, archon-size-s, archon-type-feature], remove: [] }
    reasons: []
    triage:
      contract: READY
      route: deliver
      pull_request: null
      type: { value: feature, reason: "stub: asks for new behavior" }
      size: { value: s, reason: "stub: size" }
      complexity: { value: low, reason: "stub: complexity" }
      importance: { value: medium, reason: "stub: importance" }
      urgency: { value: none, reason: "stub: urgency" }
      proposed_edits: { title: "", body: "" }
      blocked_reason: ""
      blocked_by: []
      labels: [archon-ready, archon-size-s, archon-type-feature]
      summary: "stub: ready to deliver"
      report: { type: archon_artifact, run_id: "fixture-run", path: "triage.md" }
fixture:
  inputs: { repo_host: github.com, repo_path: example/repo, number: "7", mode: eval }
  expect: completed
  reached: [facts, triage__verdict, outcome]
  resolved-text-contains:
    triage__triage: "Stub title at creation"
exec-code: true
