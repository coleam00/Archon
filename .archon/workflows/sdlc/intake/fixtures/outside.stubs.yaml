# Dry-run fixture: an outside author's issue. No triage node is stubbed, and a
# dry run fails on a reached agent node without a stub, so completing proves no
# agent node ran.
facts:
  path: outside
  item: { repo: { host: "github.com", path: "example/repo" }, number: 8 }
  target: "https://github.com/example/repo/issues/8"
  decision:
    path: outside
    trust: outside
    promoted: null
    stage: needs_maintainer
    body_digest: "sha256:stub"
    labels: []
    notes: []
outcome:
  path: outside
  item: 8
  stage: needs_maintainer
  trust: outside
  promoted: false
  labels: [archon-needs-maintainer]
  summary: "stub: Issue 8: needs_maintainer"
fixture:
  inputs: { repo_host: github.com, repo_path: example/repo, number: "8" }
  expect: completed
  reached: [facts, outcome]
exec-code: true
