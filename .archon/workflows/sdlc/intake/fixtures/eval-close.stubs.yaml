# Dry-run fixture: eval mode on a maintainer's issue that triage finds a duplicate.
# The outcome script runs for real on the verdict's bound closure: it refuses a
# NO_ACTION verdict that arrives without one, so completing proves the closure
# reaches intake's outcome. Eval writes nothing; intake.test.ts proves the close.
facts:
  path: triage
  item: { repo: { host: "github.com", path: "example/repo" }, number: 7 }
  target: "# Stub title at creation\n\nStub body at creation."
  decision:
    path: triage
    trust: maintainer
    promoted: null
    stage: new
    body_digest: "sha256:stub"
    labels: []
    waiting: []
    notes: []
  seen: { title: "Stub title at creation", body_digest: "sha256:stub", body_from: creation }
triage__triage:
  decision:
    contract: NO_ACTION
    closure:
      kind: duplicate
      url: "https://github.com/example/repo/issues/3"
      original: { repo: { host: "github.com", path: "example/repo" }, number: 3 }
  type: { value: feature, reason: "stub: asks for new behavior" }
  size: { value: s, reason: "stub: size" }
  complexity: { value: low, reason: "stub: complexity" }
  importance: { value: medium, reason: "stub: importance" }
  urgency: { value: none, reason: "stub: urgency" }
  item: { repo: { host: "", path: "" }, number: 0 }
  area_labels: []
  report: { type: archon_artifact, run_id: "fixture-run", path: "triage.md" }
  summary: "stub: duplicates the open issue 3"
fixture:
  inputs: { repo_host: github.com, repo_path: example/repo, number: "7", mode: eval }
  expect: completed
  reached: [facts, triage__verdict, outcome]
exec-code: true
