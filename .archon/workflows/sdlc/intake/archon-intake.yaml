name: archon-intake
description: |
  The standing front of the label-driven pack. Every issue event records a
  request on the issue's work item; the run then claims the best waiting item
  and decides, with a script and before any model reads the text, whether its
  author is a listed maintainer. A maintainer's issue is triaged, and the
  verdict becomes the item's stage and a route label. An outside issue gets
  archon-needs-maintainer and starts no agent until a listed maintainer
  promotes it by adding archon-triage or a route label. With mode eval the run
  writes nothing: it decides the named issue as it was opened and returns the
  whole decision as its output.

  Use when: trigger bindings start it on issue lifecycle and label events (see
  the SDLC pack README, "Intake").
  NOT for: triaging one item by hand (archon-triage), or delivering work.

inputs:
  repo_host:
    description: The forge host of the issue's repository (binding field repository.host).
  repo_path:
    description: The owner/name path of the issue's repository (binding field repository.path).
  number:
    description: The issue number (binding field subject.number).
  kind:
    default: "issue"
    description: >-
      The event's subject kind (binding field subject.kind). Only an issue
      records a request; a pull request's event only runs a pickup.
  action:
    default: "opened"
    description: >-
      The event's action (binding field event.action): opened, edited,
      reopened, or added for a label.
  label:
    default: ""
    description: The label a label event added (binding field label.name).
  label_actor:
    default: ""
    description: >-
      Who added the label, as the forge reported it (binding field
      label.actor.login). A label promotes only when this login is on the
      maintainer list.
  order:
    default: '["urgency desc","importance desc","size asc","created asc"]'
    description: >-
      Pickup order, a JSON array of "<key> <asc|desc>" with keys urgency,
      importance, size, complexity and created. An item with no value for a
      key sorts after every item that has one.
  mode:
    default: "live"
    description: >-
      live or eval. Eval writes no request, claim, work item, label or comment:
      it decides the issue named by number as it was opened, as if no run had
      seen it, shows triage only its title and body at creation, and returns
      every field of the decision as the outcome's evaluation. Any other value
      refuses the run at facts, before anything is read or written.
  trust:
    default: "auto"
    description: >-
      auto or outside. Outside decides the item as an outside author's whatever
      the maintainer list says, and refuses an item whose trust is already
      recorded as maintainer, because recorded trust never changes. There is no
      maintainer value: any other value refuses the run at facts, before
      anything is read or written, so no input can raise trust.

returns: outcome

nodes:
  # Trust is decided here, by a script, from the maintainer list at the default
  # branch's head. Writes only the request and the claim in live, and nothing in
  # eval.
  - id: facts
    script: facts
    runtime: bun
    output_format:
      type: object
      properties:
        path: { type: string, enum: [idle, quiet, closed, outside, triage] }
        # The claimed issue; null when nothing waits.
        item:
          type: [object, 'null']
          properties:
            repo:
              type: object
              properties:
                host: { type: string }
                path: { type: string }
              required: [host, path]
            number: { type: integer }
          required: [repo, number]
        # Triage's target: the claimed issue's URL, empty when nothing waits. In
        # eval, the issue's title and body at creation, without its number.
        target: { type: string }
        decision:
          type: [object, 'null']
          properties:
            path: { type: string, enum: [quiet, closed, outside, triage] }
            trust: { type: [string, 'null'], enum: [maintainer, outside, null] }
            promoted: { type: [object, 'null'] }
            stage: { type: string }
            body_digest: { type: string }
            labels: { type: array, items: { type: string } }
            waiting: { type: array, items: { type: string } }
            notes: { type: array, items: { type: object } }
          required: [path, trust, promoted, stage, body_digest, labels, waiting, notes]
        # What triage was shown in eval; null in live. body_from is current when
        # the creation body could not be recovered and the current one stood in.
        seen: &seen
          type: [object, 'null']
          properties:
            title: { type: string }
            body_digest: { type: string }
            body_from: { type: string, enum: [creation, current] }
          required: [title, body_digest, body_from]
      required: [path, item, target, decision, seen]

  # Only a maintainer's item, or an outside item a maintainer promoted at its
  # current body, reaches this agent. Unpublished: the outcome writes the labels
  # after the work item.
  - id: triage
    include: archon-triage
    depends_on: [facts]
    when: "$facts.output.path == 'triage'"
    with:
      target: "$facts.output.target"
      publish: "false"

  - id: outcome
    script: outcome
    runtime: bun
    depends_on: [facts, triage]
    trigger_rule: none_failed_min_one_success
    with:
      path: "$facts.output.path"
      item: { from: "$facts.output.item" }
      decision: { from: "$facts.output.decision" }
      seen: { from: "$facts.output.seen" }
      contract: { from: "$triage.output.contract", if_skipped: null }
      route: { from: "$triage.output.route", if_skipped: null }
      pull_request: { from: "$triage.output.pull_request", if_skipped: null }
      type: { from: "$triage.output.type", if_skipped: null }
      size: { from: "$triage.output.size", if_skipped: null }
      complexity: { from: "$triage.output.complexity", if_skipped: null }
      importance: { from: "$triage.output.importance", if_skipped: null }
      urgency: { from: "$triage.output.urgency", if_skipped: null }
      labels: { from: "$triage.output.labels", if_skipped: null }
      summary: { from: "$triage.output.summary", if_skipped: null }
      report: { from: "$triage.output.report", if_skipped: null }
      proposed_edits: { from: "$triage.output.proposed_edits", if_skipped: null }
      blocked_reason: { from: "$triage.output.blocked_reason", if_skipped: null }
      blocked_by: { from: "$triage.output.blocked_by", if_skipped: null }
    output_format:
      type: object
      properties:
        path: { type: string, enum: [idle, quiet, closed, outside, triage] }
        item: { type: [integer, 'null'] }
        stage: { type: [string, 'null'] }
        trust: { type: [string, 'null'] }
        promoted: { type: boolean }
        labels: { type: array, items: { type: string } }
        summary: { type: string }
        # Null in live. In eval, the run's whole decision: the input trust, what
        # triage was shown, the label delta live would write, this run's history
        # entries, and triage's verdict (null when triage did not run).
        evaluation:
          type: [object, 'null']
          properties:
            trust_input: { type: string, enum: [auto, outside] }
            seen: *seen
            labels:
              type: object
              properties:
                add: { type: array, items: { type: string } }
                remove: { type: array, items: { type: string } }
              required: [add, remove]
            reasons: { type: array, items: { type: object } }
            # Triage's verdict as outcome.ts assembles it from fields triage's own
            # output schema already validated; null when triage did not run.
            triage: { type: [object, 'null'] }
          required: [trust_input, seen, labels, reasons, triage]
      required: [path, item, stage, trust, promoted, labels, summary, evaluation]
