name: archon-lifecycle
description: >-
  Take one issue through shared ship, runtime and optional independent holdout verification,
  optional discovery publication and a shared merge queue. All agents are visible
  Archon command nodes. Scheduling belongs to the caller.
model: medium
# Unattended-class, so a schedule or trigger can start it. The two blocks that can
# pause for a human (merge approval, discovery publication) run as child workflows
# below: a child keeps its own interactive posture and gate, approved by the
# child's run id, while this run waits on it. In auto modes nothing pauses.
inputs:
  target:
    default: ''
    description: >-
      One issue or work order. Empty selects the oldest open issue in the
      origin repository that has no configured state label, no open PR
      claiming it (Closes/Fixes/Resolves/Relates to #N), and no open
      `Depends on: #n`. Automatic intake requires all state_labels; an
      explicit target works without them.
  publish:
    default: 'false'
    description: >-
      Forwarded to triage. "true" writes the proposed state label to the issue,
      which is what marks it as touched for backlog intake.
  state_labels:
    default: '{}'
    description: >-
      Caller-owned JSON mapping of workflow states to GitHub labels, forwarded
      through ship. Automatic intake requires every state to be mapped and
      treats only mapped labels as previously touched.
  redrive_limit:
    default: '2'
    description: >-
      How many times automatic intake re-drives one unfinished pull request (an
      earlier run delivered it, it never merged) before leaving it for a human.
      Intake finishes such a pull request before starting a new issue. "0" turns
      re-driving off.
  redrive_after_minutes:
    default: '30'
    description: >-
      How long an unfinished pull request must sit untouched before intake
      re-drives it, so work another run or a person is still doing is left alone.
  stall_fail:
    default: 'true'
    description: >-
      When automatic intake finds open issues but nothing it can start (all
      claimed, waiting on open dependencies, or labeled for a human), "true" fails
      the run after commenting on each root blocker; "false" completes it with the
      same comments.
  scenario:
    required: true
    description: Absolute path to a project runtime scenario JSON.
  holdout:
    default: ''
    description: >-
      Optional absolute path to an independent runtime scenario JSON, verified
      after the scenario passes. Empty skips the holdout pass; qualification then
      rests on the scenario alone.
  merge_mode:
    default: approve
    description: preview, approve, or auto for the shared merge workflow.
  merge_method:
    default: ''
    description: 'Required merge strategy: merge, squash, or rebase.'
  required_checks:
    default: ''
    description: >-
      Forwarded to the merge queue: "none" or comma-separated check names when
      GitHub cannot report the base branch's required checks. Empty reads them
      from GitHub.
  publish_holds:
    default: 'false'
    description: >-
      Forwarded to the merge queue. In approve or auto mode, "true" publishes
      hold comments; preview remains read-only and merging remains separately gated.
  protected_paths:
    default: ''
    description: >-
      Forwarded to the merge queue: comma-separated root-anchored path patterns a
      pull request may not change (a match holds it for a human). Empty protects
      nothing.
  discovery_publication:
    default: preview
    description: preview, approve, or auto for discovered adjacent work.
  validation_scope:
    default: ''
    description: >-
      Optional package, directory, or named-check scope forwarded through ship
      and any repair delivery. Empty keeps the project's full applicable gate.
  validation_context:
    default: ''
    description: >-
      Optional nonsecret external-state identity forwarded through ship and
      any repair delivery. Changing it requires fresh validation.
  final_validation:
    default: always
    description: >-
      Forwarded through ship and any repair delivery. The merge queue requires
      validation evidence, so this composition defaults to always; auto limits
      final local validation to fork pull requests.
  close_target:
    default: 'true'
    description: >-
      "true" closes the target issue after every pull request delivered for it is
      confirmed merged, when the issue is still open (a `Relates to #N` merge
      leaves it open, and issues that depend on it would wait forever). "false"
      leaves the issue for a human.
  deploy:
    default: ''
    description: >-
      Optional trusted project deployment command, forwarded to archon-deploy
      after a successful merge. Empty skips deployment.
  health:
    default: ''
    description: Trusted project health command for archon-deploy; required with deploy.
  identity:
    default: ''
    description: Optional command printing the deployed revision, for archon-deploy.
returns: merge
nodes:
  # Backlog intake is deterministic gh reads; judgment about the issue belongs
  # to triage. An explicit target passes through unchanged.
  - id: intake
    script: select-target
    runtime: uv
    mutates_checkout: false
    with:
      target: "$INPUTS.target"
      state_labels: "$INPUTS.state_labels"
      redrive_limit: "$INPUTS.redrive_limit"
      redrive_after_minutes: "$INPUTS.redrive_after_minutes"
    output_format:
      type: object
      properties:
        target: { type: string }
        found: { type: boolean }
        selected: { type: boolean }
        reason: { type: string }
        waiting_on: { type: array, items: { type: integer } }
        open_issues: { type: integer }
        kind: { type: string, enum: [issue, pr] }
        pr: { type: string }
      required: [target, found, selected, reason, waiting_on, open_issues, kind, pr]

  # Nothing to start is a fact; open issues that cannot move are a stall someone
  # must hear about, so the run says so on the blockers and, by default, fails.
  - id: stall
    script: report-stall
    runtime: uv
    mutates_checkout: false
    depends_on: [intake]
    when: "$intake.output.found == false"
    with:
      intake: "$intake.output"
      stall_fail: "$INPUTS.stall_fail"
    output_format:
      type: object
      properties:
        stalled: { type: boolean }
        notified: { type: array, items: { type: integer } }
        summary: { type: string }
      required: [stalled, notified, summary]

  - id: ship
    include: archon-ship
    depends_on: [intake]
    when: "$intake.output.found == true && $intake.output.kind == 'issue'"
    with:
      target: "$intake.output.target"
      publish: "$INPUTS.publish"
      state_labels: "$INPUTS.state_labels"
      validation_scope: "$INPUTS.validation_scope"
      validation_context: "$INPUTS.validation_context"
      final_validation: "$INPUTS.final_validation"

  # Unfinished work: intake chose a pull request an earlier run delivered but
  # nobody merged. A script records the attempt, checks out its branch and merges
  # the base in when that is clean; anything needing judgment (a draft, a
  # conflict) goes to a repair delivery on the same branch. It always runs (with
  # no pull request it adopts nothing and touches nothing) so every route below
  # can read its output.
  - id: adopt
    script: adopt-pr
    runtime: uv
    depends_on: [intake]
    with:
      pr: "$intake.output.pr"
      redrive_limit: "$INPUTS.redrive_limit"
    output_format:
      type: object
      properties:
        adopted: { type: boolean }
        route: { type: string, enum: [deliver, verify, ''] }
        pr: { type: string }
        number: { type: integer }
        branch: { type: string }
        base: { type: string }
        head: { type: string }
        attempt: { type: integer }
        reason: { type: string }
      required: [adopted, route, pr, number, branch, base, head, attempt, reason]

  # Ordered after ship only because both deliveries can suspend on CI and one
  # suspension must own the run cursor; intake's kind makes them exclusive.
  - id: update
    include: archon-deliver
    depends_on: [adopt, ship]
    trigger_rule: none_failed_min_one_success
    when: "$adopt.output.route == 'deliver'"
    with:
      validation_scope: "$INPUTS.validation_scope"
      validation_context: "$INPUTS.validation_context"
      final_validation: "$INPUTS.final_validation"
      work: >-
        Finish the existing pull request $adopt.output.pr for $intake.output.target.
        An earlier run delivered it and it never merged ($adopt.output.reason).
        This checkout is on its branch, $adopt.output.branch. First bring it up to
        date: merge origin/$adopt.output.base into this branch with `git merge`
        (never rebase, never force-push), resolving every conflict so both the
        pull request's intent and the base's changes survive. Then read the issue,
        the pull request's latest `<!-- archon-review-report -->` comment and any
        `<!-- archon-merge-hold -->` comment, and complete what they show is still
        missing. Commit on this branch. Do not switch branches or open another
        pull request. Independently review every correction.

  - id: revalidate
    include: archon-validate
    depends_on: [adopt]
    when: "$adopt.output.route == 'verify'"
    with:
      scope: "$INPUTS.validation_scope"
      context: "$INPUTS.validation_context"

  # Binding the delivered pull request is facts (the delivery's certified URL, gh,
  # git HEAD, this run's review and validation reports), so a script owns it.
  - id: candidate
    script: bind-delivered-pr
    runtime: uv
    mutates_checkout: false
    depends_on: [intake, ship, adopt, update, revalidate]
    trigger_rule: none_failed_min_one_success
    when: "$intake.output.found == true"
    with:
      delivery: { from: "$ship.output", if_skipped: null }
      update: { from: "$update.output", if_skipped: null }
      adopted: { from: "$adopt.output", if_skipped: null }
      revalidated: { from: "$revalidate.output", if_skipped: null }
    output_format:
      type: object
      properties:
        delivered: { type: boolean }
        prs: { type: array, items: { type: string } }
        head: { type: string }
        reason: { type: string }
      required: [delivered, prs, head]

  - id: runtime
    include: archon-verify-runtime
    depends_on: [candidate]
    when: "$candidate.output.delivered == true"
    with:
      scenario: "$INPUTS.scenario"

  - id: holdout
    include: archon-verify-runtime
    depends_on: [runtime]
    when: "$runtime.output.verified == true && $INPUTS.holdout != ''"
    with:
      scenario: "$INPUTS.holdout"

  - id: qualify
    command: qualify-runtime
    context: fresh
    mutates_checkout: false
    depends_on: [candidate, runtime, holdout]
    trigger_rule: none_failed_min_one_success
    with:
      candidate: "$candidate.output"
      runtime: { from: "$runtime.output", if_skipped: null }
      holdout: { from: "$holdout.output", if_skipped: null }
      holdout_scenario: "$INPUTS.holdout"
    output_format:
      type: object
      properties:
        ready: { type: boolean }
        repair: { type: boolean }
        evidence: { type: string }
      required: [ready, repair, evidence]

  - id: repair
    include: archon-deliver
    depends_on: [qualify]
    when: "$qualify.output.repair == true"
    with:
      validation_scope: "$INPUTS.validation_scope"
      validation_context: "$INPUTS.validation_context"
      final_validation: "$INPUTS.final_validation"
      work: >-
        Repair the existing PR on this same branch using the concrete runtime
        findings in $qualify.output.evidence. Preserve the original work order in
        $ARTIFACTS_DIR/triage.md and the runtime scenarios. Do not switch branches
        or create another PR. Independently review every correction.

  - id: repaired-candidate
    script: bind-delivered-pr
    runtime: uv
    mutates_checkout: false
    depends_on: [repair]
    when: "$qualify.output.repair == true"
    with:
      delivery: "$repair.output"
    output_format:
      type: object
      properties:
        delivered: { type: boolean }
        prs: { type: array, items: { type: string } }
        head: { type: string }
        reason: { type: string }
      required: [delivered, prs, head]

  - id: runtime-retry
    include: archon-verify-runtime
    depends_on: [repaired-candidate]
    when: "$repaired-candidate.output.delivered == true"
    with:
      scenario: "$INPUTS.scenario"

  - id: holdout-retry
    include: archon-verify-runtime
    depends_on: [runtime-retry]
    when: "$runtime-retry.output.verified == true && $INPUTS.holdout != ''"
    with:
      scenario: "$INPUTS.holdout"

  - id: qualify-retry
    command: qualify-runtime
    context: fresh
    mutates_checkout: false
    depends_on: [repaired-candidate, runtime-retry, holdout-retry]
    trigger_rule: none_failed_min_one_success
    when: "$qualify.output.repair == true"
    with:
      candidate: "$repaired-candidate.output"
      runtime: { from: "$runtime-retry.output", if_skipped: null }
      holdout: { from: "$holdout-retry.output", if_skipped: null }
      holdout_scenario: "$INPUTS.holdout"
    output_format:
      type: object
      properties:
        ready: { type: boolean }
        repair: { type: boolean }
        evidence: { type: string }
      required: [ready, repair, evidence]

  - id: selected
    script: select-qualified
    runtime: uv
    depends_on: [candidate, qualify, qualify-retry]
    trigger_rule: none_failed_min_one_success
    with:
      candidate: "$candidate.output"
      initial: "$qualify.output"
      repaired: { from: "$repaired-candidate.output", if_skipped: null }
      retried: { from: "$qualify-retry.output", if_skipped: null }
    output_format:
      type: object
      properties:
        ready: { type: boolean }
        prs: { type: array, items: { type: string } }
        evidence: { type: string }
      required: [ready, prs, evidence]

  # A re-driven pull request whose base was merged in has a new head, so CI
  # restarted. Wait for it to conclude before the merge queue reads the checks,
  # instead of letting the queue hold a batch that is only still running.
  - id: settle
    depends_on: [selected, adopt]
    when: "$selected.output.ready == true && $adopt.output.route == 'verify'"
    loop_group:
      max_iterations: 13
      until_bash: |
        value=$settle-probe.output.state
        test "$value" != "pending"
      nodes:
        - id: settle-probe
          script: pr-checks
          runtime: uv
          with:
            pr: "$adopt.output.pr"
          output_format:
            type: object
            properties:
              state: { type: string, enum: [pending, concluded, red] }
              detail: { type: string }
            required: [state, detail]
        - id: settle-pause
          wait:
            event: checks.complete
            deadline_ms: 300000
          when: $settle-probe.output.state == 'pending'
          depends_on: [settle-probe]

  # After settle: only one suspending node may own the run cursor at a time.
  - id: discoveries
    workflow: archon-discoveries
    depends_on: [selected, settle]
    trigger_rule: none_failed_min_one_success
    when: "$selected.output.ready == true"
    with:
      discovery_artifact: "$ARTIFACTS_DIR/discoveries.json"
      publication: "$INPUTS.discovery_publication"

  # A skipped discovery run (no qualified candidate) must not skip the merge entry
  # under the default all-success join; none_failed lets it through, while a FAILED
  # discovery run still blocks the merge.
  - id: merge
    workflow: archon-merge-queue
    depends_on: [selected, discoveries, settle]
    trigger_rule: none_failed_min_one_success
    when: "$selected.output.ready == true"
    with:
      prs: "$selected.output.prs"
      mode: "$INPUTS.merge_mode"
      merge_method: "$INPUTS.merge_method"
      required_checks: "$INPUTS.required_checks"
      publish_holds: "$INPUTS.publish_holds"
      protected_paths: "$INPUTS.protected_paths"
      evidence: "$selected.output.evidence"

  # A merged `Relates to #N` pull request leaves its issue open, and every issue
  # that depends on it then waits. This run worked the issue, so once GitHub
  # confirms its own pull requests merged, the script closes the issue if open.
  - id: close-target
    script: close-target
    runtime: uv
    mutates_checkout: false
    depends_on: [intake, selected, merge]
    when: "$merge.output.merged == true && $INPUTS.close_target == 'true'"
    with:
      target: "$intake.output.target"
      prs: "$selected.output.prs"
    output_format:
      type: object
      properties:
        closed: { type: boolean }
        reason: { type: string }
      required: [closed, reason]

  # Merging is not shipping. With deployment inputs set, a confirmed merge rolls
  # the default branch onto the running service and reads the revision back.
  - id: deploy
    include: archon-deploy
    depends_on: [merge]
    when: "$merge.output.merged == true && $INPUTS.deploy != ''"
    with:
      deploy: "$INPUTS.deploy"
      health: "$INPUTS.health"
      identity: "$INPUTS.identity"
