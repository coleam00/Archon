# Dry-run fixture: intake finds an unfinished pull request that conflicts with its
# base (or is still a draft), so adopt routes it to a repair delivery on its own
# branch (route deliver). Ship never runs; the update delivery merges the base in,
# finishes the work and is reviewed, then the normal runtime and merge tail runs.
intake:
  target: "https://github.com/example/app/issues/1"
  found: true
  selected: true
  reason: "unfinished pull request #7 for #1"
  waiting_on: []
  open_issues: 3
  kind: pr
  pr: "https://github.com/example/app/pull/7"
adopt:
  adopted: true
  route: deliver
  pr: "https://github.com/example/app/pull/7"
  number: 7
  branch: "fixture-branch"
  base: "main"
  head: "0123456789abcdef0123456789abcdef01234567"
  attempt: 1
  reason: "#7 conflicts with main"
update__impl__implement:
  done: true
  green: true
  red_cause: ""
  summary: "stub: direct work implemented and green"
update__review__synthesize:
  ready: true
  action: none
  findings_summary: "stub: no open findings"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
update__review__publish:
  ready: true
  action: none
  findings_summary: "stub: no open findings"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
update__review-policy: { risks: "fixture-owned-policy" }
update__classify:
  tier: full
  errors: false
  docs: false
  reasons:
    tier: "stub: touches persisted state"
    errors: "stub: no failure paths"
    docs: "stub: no doc-facing changes"
update__resolve-scope: '{"errors":"false"}'
update__gate-ready: '{"gate":"ready"}'
update__impl__assert-changed: "2 files changed"
update__gate-green: '{"gate":"green","red_cause":"","stage":"The implementation","summary":""}'
update__ci-verdict: '{"state":"concluded","detail":"all checks green"}'
update__flip-ready: { pr_url: "https://github.com/example/app/pull/7" }
update__outcome: { pr_url: "https://github.com/example/app/pull/7", summary: "https://github.com/example/app/pull/7" }
update__pr__pr: { intent: "/fixture/pr-intent.json" }
update__pr__publish: { schemaVersion: 1, repo: { host: "github.com", path: "example/app" }, number: 7, url: "https://github.com/example/app/pull/7", head: "fixture-branch", base: "dev", is_draft: true, state: "open", head_repo: { host: "github.com", path: "example/app" }, head_revision: "fixturehead", base_revision: "fixturebase", maintainer_can_modify: null }
update__review__mode: '{"continuation":false,"head":"fixturehead","cursor":"","risks":"fixture-owned-policy","execution":{"path":"deliver__review__mode","invocation":{"loopPath":[]}}}'
update__review__coverage: { full: true }
update__review__scope:
  # PR diff in scope; head sha stubbed
  docs: false
  pr: { repo: { host: "github.com", path: "example/app" }, number: 7 }
update__review__code: "0 findings"
update__review__simplify__simplify: { findings: false }
update__review__seams: "0 findings"
update__shape__simplify: { findings: false }
update__review__tests: "0 findings"
update__review__review-complete: "settled"
update__ci-attention-route: { attention: false, red_cause: "" }
update__validate__applicability: { fingerprint: fixture, scope: "", context: "", validator: fixture, generation: 1, reason: "first validation for this run", nonce: fixture, reuse: false }
update__validate__mode: { comparison: false }
update__validate__result: { green: true, checks_performed: true, red_cause: "", summary: "stub: project gate green", evidence: null }
update__validate__discover: { checks: [{ name: "project gate", argv: ["stub-gate"] }], notes: "stub: the project's aggregate gate" }
update__validate__run: { status: green, summary: "stub: project gate green" }
update__gate-validated: '{"gate":"green","red_cause":"","stage":"The project gate","summary":""}'
update__file-discoveries: '{"issues":[]}'
update__final-gate: '{"validate":true}'
update__fork: '{"fork":true}'
ci-probe: '{"state":"concluded","detail":"all checks green"}'
candidate:
  delivered: true
  prs: ["https://github.com/example/app/pull/7"]
  head: "0123456789abcdef0123456789abcdef01234567"
# The runtime scenario verifies; with no holdout input the holdout pass must skip on
# its own `when`, and qualify must still be reached. `qualify` and `selected` stand
# in for the independently tested evidence path.
runtime__read-scenario:
  setup: "true"
  start: "true"
  teardown: "true"
  candidate_command: "echo 0123456789abcdef0123456789abcdef01234567"
  assertion_ids: ["a1"]
  assertions_json: []
# The runtime loop body runs once and verifies (inner node ids are unprefixed).
prepare-attempt:
  attempt: 1
  directory: "/artifacts/runtime"
  report_path: "/artifacts/runtime/report.json"
  checkout: "/checkout"
  report_feedback: ""
setup-run: { ok: true }
start-run: { ok: true }
capture-helper: { path: "/helper" }
verify: "stub: assertions exercised"
identity-run: { ok: true }
check-evidence:
  status: "verified"
  reason: "stub: all assertions passed"
  candidate: "0123456789abcdef0123456789abcdef01234567"
teardown-run: { ok: true }
finish-attempt:
  status: "verified"
  reason: "stub: all assertions passed"
  candidate: "0123456789abcdef0123456789abcdef01234567"
  done: true
  checkout: "/checkout"
  directory: "/artifacts/runtime"
  report_path: "/artifacts/runtime/report.json"
runtime__gate-verified:
  verified: true
  verdict: "verified"
  candidate: "0123456789abcdef0123456789abcdef01234567"
  checkout: "/checkout"
  summary: "stub: verified"
  directory: "/artifacts/runtime"
  report_path: "/artifacts/runtime/report.json"
qualify:
  ready: true
  repair: false
  evidence: "/artifacts/runtime-qualification.md"
selected:
  ready: true
  prs: ["https://github.com/example/app/pull/7"]
  evidence: "/artifacts/runtime-qualification.md"
discoveries:
  count: 0
  stale_count: 0
  duplicate_count: 0
  update_existing_count: 0
  new_count: 0
merge:
  done: true
  merged: true
  urls: ["https://github.com/example/app/pull/7"]
  queued: []
  prior_base_sha: "fixture-base"
  summary: "stub: merged"
close-target: { closed: true, reason: "stub: closed after merge" }
fixture:
  expect: completed
  reached: [adopt, update__flip-ready, candidate, runtime__gate-verified, qualify, merge, close-target]
  resolved-text-contains:
    update__impl__implement: "merge origin/main into this branch"
  inputs:
    scenario: "/private/scenario.json"
    merge_mode: "auto"
    merge_method: "squash"
    state_labels: '{"READY":"r","DESIGN_FIRST":"d","NEEDS_CONTRACT_WORK":"c","BLOCKED":"b","NO_ACTION":"n"}'
