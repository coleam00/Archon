# Dry-run fixture: discoveries in preview mode skip their publication sink, and
# the merge stage must still run on the qualified candidate. Seen live on
# 2026-09-09: a verified PR was left open while the run reported success because
# the merge entry joined on the skipped sink with the default all-success rule.
intake:
  target: "https://github.com/example/app/issues/1"
  found: true
  selected: false
  reason: "explicit target"
ship__triage__triage: &judgment
  route: "deliver"
  summary: "stub: ready to deliver"
  contract: "READY"
  design_first: false
  complexity: "small_bounded"
