runtime__read-scenario: '{"setup":"","start":"","teardown":"","candidate_command":"true","assertion_ids":["a"],"assertions_json":[{"id":"a"}]}'
# The runtime verifier's loop body is keyed by bare node id; the same stubs serve
# the runtime and holdout instances (both verify on the first attempt).
prepare-attempt: '{"attempt":1,"directory":"/artifacts/attempt-1","report_path":"/artifacts/attempt-1/report.json","checkout":"0123456789abcdef0123456789abcdef01234567","report_feedback":""}'
setup-run: '{"ok":true}'
start-run: '{"ok":true}'
verify: "stub: report written"
identity-run: '{"ok":true}'
check-evidence: '{"status":"verified","reason":"stub","candidate":"c"}'
teardown-run: '{"ok":true}'
finish-attempt: '{"status":"verified","reason":"stub","candidate":"c","done":true,"checkout":"0123456789abcdef0123456789abcdef01234567"}'
# The runtime gate is stubbed as not verified so the holdout instance (whose loop
# body shares these bare stub ids and cannot be stubbed a second time in a dry
# run) is skipped by its when:. qualify joins on none_failed and is itself a stub;
# this fixture proves the merge wiring, not verification.
runtime__gate-verified:
