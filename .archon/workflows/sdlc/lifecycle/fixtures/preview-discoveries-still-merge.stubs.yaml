ship__deliver__review-action: '{"ready":"true","action":"none"}'
ship__deliver__gate-ready: "ready"
ship__deliver__validate__applicability: { fingerprint: fixture, scope: "", context: "", validator: fixture, generation: 1, reason: fixture, nonce: fixture, reuse: false }
