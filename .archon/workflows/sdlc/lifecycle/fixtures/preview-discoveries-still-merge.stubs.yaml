# Dry-run fixture: discoveries in preview mode skip their publication sink, and
# the merge stage must still run on the qualified candidate. Seen live on
# 2026-09-09: a verified PR was left open while the run reported success because
# the merge entry joined on the skipped sink with the default all-success rule.
intake:
  target: "https://github.com/example/app/issues/1"
  found: true
  selected: false
  reason: "explicit target"
  waiting_on: []
ship__triage__triage:
  contract: READY
  route: deliver
  design_first: false
  complexity: small
  item: { repo: { host: "github.com", path: "example/app" }, number: 1 }
  area_labels: []
  proposed_edits: { title: "", body: "" }
  blocked_reason: ""
  blocked_by: []
  summary: "stub: ready to deliver"
  report: { type: archon_artifact, run_id: "fixture-run", path: "triage.md" }
ship__gate-direct: '{"gate":"direct"}'
ship__deliver__impl__implement:
  done: true
  green: true
  red_cause: ""
  summary: "stub: direct work implemented and green"
ship__deliver__review__synthesize:
  ready: true
  action: none
  findings_summary: "stub: no open findings"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
ship__deliver__review__publish:
  ready: true
  action: none
  findings_summary: "stub: no open findings"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
ci-probe: '{"state":"concluded","detail":"all checks green"}'
ship__deliver__review-policy: { risks: "fixture-owned-policy" }
ship__deliver__classify:
  tier: full
  errors: false
  docs: false
  reasons:
    tier: "stub: touches persisted state"
    errors: "stub: no failure paths"
    docs: "stub: no doc-facing changes"
ship__deliver__resolve-scope: '{"errors":"false"}'
ship__deliver__gate-ready: '{"gate":"ready"}'
ship__deliver__impl__assert-changed: "2 files changed"
ship__deliver__gate-green: '{"gate":"green","red_cause":"","stage":"The implementation","summary":""}'
ship__deliver__ci-verdict: '{"state":"concluded","detail":"all checks green"}'
ship__deliver__flip-ready: { pr_url: "https://github.com/example/app/pull/7" }
ship__deliver__outcome: { pr_url: "https://github.com/example/app/pull/7", summary: "https://github.com/example/app/pull/7" }
ship__deliver__pr__pr: { intent: "/fixture/pr-intent.json" }
ship__deliver__pr__publish: { schemaVersion: 1, repo: { host: "github.com", path: "example/app" }, number: 7, url: "https://github.com/example/app/pull/7", head: "fixture-branch", base: "dev", is_draft: true, state: "open", head_repo: { host: "github.com", path: "example/app" }, head_revision: "fixturehead", base_revision: "fixturebase", maintainer_can_modify: null }
ship__deliver__review__mode: '{"continuation":false,"head":"fixturehead","cursor":"","risks":"fixture-owned-policy","execution":{"path":"deliver__review__mode","invocation":{"loopPath":[]}}}'
ship__deliver__review__coverage: { full: true }
ship__deliver__review__scope:
  # PR diff in scope; head sha stubbed
  docs: false
  pr: { repo: { host: "github.com", path: "example/app" }, number: 7 }
ship__deliver__review__code: "0 findings"
ship__deliver__review__simplify__simplify: { findings: false }
ship__deliver__review__seams: "0 findings"
ship__deliver__shape__simplify: { findings: false }
ship__deliver__review__tests: "0 findings"
ship__deliver__review__review-complete: "settled"
ship__deliver__ci-attention-route: { attention: false, red_cause: "" }
ship__deliver__validate__mode: { comparison: false }
ship__deliver__validate__result: { green: true, red_cause: "", summary: "stub: project gate green", evidence: null }
ship__deliver__validate__discover: { checks: [{ name: "project gate", argv: ["stub-gate"] }], notes: "stub: the project's aggregate gate" }
ship__deliver__validate__run: { status: green, summary: "stub: project gate green" }
ship__deliver__gate-validated: '{"gate":"green","red_cause":"","stage":"The project gate","summary":""}'
ship__deliver__file-discoveries: '{"issues":[]}'
ship__deliver__fork: '{"fork":true}'
ship__triage__verdict:
  contract: READY
  route: deliver
  ready: true
  design_first: false
  complexity: small
  labels: ["team-ready"]
  published: false
  skipped_labels: []
  proposed_edits: { title: "", body: "" }
  blocked_reason: ""
  blocked_by: []
  summary: "stub: ready to deliver"
  report: { type: archon_artifact, run_id: "fixture-run", path: "triage.md" }
ship__outcome: { delivered: true, summary: "https://github.com/example/app/pull/7" }
candidate:
  delivered: false
  prs: ["https://github.com/example/app/pull/7"]
  head: "0123456789abcdef0123456789abcdef01234567"
# Runtime is skipped here so this fixture isolates the discovery-to-merge join.
# `qualify` and `selected` stand in for the independently tested evidence path.
qualify:
  ready: true
  repair: false
  evidence: "/artifacts/runtime-qualification.md"
selected:
  ready: true
  prs: ["https://github.com/example/app/pull/7"]
  evidence: "/artifacts/runtime-qualification.md"
# Discoveries and the merge queue run as child workflows; each stub is the child's
# terminal (returns) output.
discoveries:
  count: 0
  stale_count: 0
  duplicate_count: 0
  update_existing_count: 0
  new_count: 0
merge:
  done: true
  merged: true
  urls: ["https://github.com/example/app/pull/7"]
  queued: []
  prior_base_sha: "fixture-base"
  summary: "stub: merged"
fixture:
  expect: completed
  reached: [discoveries, merge]
  resolved-text-contains:
    qualify: 'Configured holdout scenario: "/private/holdout.json"'
  inputs:
    target: "https://github.com/example/app/issues/1"
    scenario: "/private/scenario.json"
    holdout: "/private/holdout.json"
    merge_mode: "auto"
    merge_method: "squash"
    state_labels: '{"READY":"team-ready"}'
    publish_holds: "true"
