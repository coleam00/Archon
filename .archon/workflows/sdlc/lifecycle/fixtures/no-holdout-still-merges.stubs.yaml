  merged: true
  urls: ["https://github.com/example/app/pull/7"]
  queued: []
  prior_base_sha: "fixture-base"
  summary: "stub: merged"
ship__deliver__validate__record-evidence: '{"recorded":true}'
fixture:
  expect: completed
  reached: [runtime__gate-verified, qualify, discoveries, merge]
  resolved-text-contains:
    qualify: 'Configured holdout scenario: ""'
  inputs:
