# attention item instead of ending with nothing to take it forward. The rounds are
# the block's own round-cap stubs; the real outcome, report and settle scripts run.
stage__forge: { source: forge }
implement__implement:
  done: true
  green: true
  red_cause: ""
  summary: "stub: implemented; focused checks pass"
implement__assert-changed: "3 files changed"
pr__forge: { source: forge }
pr__prepare: { repo: { host: "github.com", path: "example/repo" }, head_repo: { host: "github.com", path: "example/repo" }, head: "fixture-branch", base: "dev", existing: null, title: "stub: title", body: { type: archon_artifact, run_id: "fixture-run", path: "pr-body.md" }, summary: "stub: target recorded" }
