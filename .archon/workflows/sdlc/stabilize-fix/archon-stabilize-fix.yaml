name: archon-stabilize-fix
description: |
  One flaky-test work order, fixed properly and shipped as a PR with CI proof.
  Child of archon-stabilize-batch: receives a single self-contained work order,
  fixes it in this run's own worktree, verifies with repeated targeted-test
  runs plus the project's own checks, pushes a branch, opens a PR, watches that
  PR's CI, and returns {branch, pr_url, ci_verdict}.

model: medium

inputs:
  order:
    required: true
    description: Complete self-contained brief from the batch's work-orders node.
  test_repetitions:
    default: "5"
    description: Consecutive greens required of the targeted test before shipping.

returns: ship

nodes:
  # Fix + discover: implement the work order, discover the project's own
  # check/test commands (never assume toolchain), commit, push the branch named
  # in the order.
  - id: fix
    command: fix-loop
    output_format:
      type: object
      properties:
        branch:
          type: string
        summary:
          type: string
        validate_cmd:
          type: string
          description: Project's own full-check command, discovered not assumed.
        test_cmd:
          type: string
          description: Command that runs ONLY the targeted test(s) for this order.
      required: [branch, summary, validate_cmd, test_cmd]

  # Deterministic proof: targeted test green N consecutive times, full checks
  # green once. No judgment here — a script owns the exit code (#2088 shape).
  - id: verify
    script: verify
    runtime: uv
    depends_on: [fix]
    with:
      fix: "$fix.output"

  # Ship: open the PR against the base branch, watch its CI to a verdict.
  - id: ship
    script: ship
    runtime: uv
    depends_on: [verify]
    with:
      fix: "$fix.output"
