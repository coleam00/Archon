name: archon-stabilize-batch
description: |
  Hunt down a whole CLASS of flaky/failing tests and fix every instance in one
  run. Point it at a smell ("5000ms timeouts failing in windows CI"), a GitHub
  issue, or prior evidence — find sweeps the codebase for candidates, per-target
  assessors prove or reject each one, confirmed instances become work orders,
  and parallel children fix each in its own worktree, verify with repeated
  targeted-test runs, open one PR per instance, and watch that PR's CI. The
  right fix is never "make CI pass": delete useless tests, make weak tests
  actually test the behavior, fix real product bugs, split for composability.

  Use when: the same flake family keeps biting CI and you want all instances
  gone, not just the loudest one.

model: medium

inputs:
  smell:
    default: ""
    description: >-
      The issue class or evidence to hunt — e.g. "tests timing out at Bun's
      5000ms default in windows CI". Empty means the run's trigger message.
  test_repetitions:
    default: "5"
    description: Consecutive greens required of the targeted test before shipping.

returns: collect

nodes:
  # Stage 1 (wide, cheap): sweep for candidates matching the smell class.
  # Recall-oriented — suspects are wanted here; proof happens downstream.
  - id: sniff
    command: sniff
    mutates_checkout: false
    output_format:
      type: object
      properties:
        grounded:
          type: string
          description: What CI/evidence was actually consulted, one line.
        findings:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              file:
                type: string
              test_id:
                type: string
                description: Selector that runs exactly this test.
              why_suspect:
                type: string
              evidence:
                type: string
      required: [grounded, findings]

  # Stage 2 (deep, parallel): one assessor per candidate proves the mechanism
  # and classifies the fix kind — or rejects the candidate outright.
  - id: assess-each
    workflow: archon-stabilize-assess
    depends_on: [sniff]
    with:
      smell: "$INPUTS.smell"
    fan_out:
      items: "$sniff.output.findings"
      as: target
      max_parallel: 3
      join: all_done

  # Stage 3: merge confirmed verdicts into self-contained orders. Runs even if
  # some assessors rejected their candidates — all_done delivers every verdict.
  - id: work-orders
    command: work-orders
    depends_on: [assess-each]
    with:
      assessments: "$assess-each.output"
      grounded: "$sniff.output.grounded"
    mutates_checkout: false
    output_format:
      type: object
      properties:
        orders:
          type: array
          items:
            type: object
            properties:
              title:
                type: string
              branch:
                type: string
                description: Branch slug, e.g. fix/flaky-migrate-state-dir-timeout
              kind:
                type: string
                enum:
                  - delete-useless-test
                  - make-test-meaningful
                  - fix-product-bug
                  - split-or-recompose-test
              work_order:
                type: string
                description: >
                  Complete brief: file paths, test id, proven mechanism,
                  chosen fix kind AND WHY, the forbidden shortcuts (no timeout
                  raises, no retries, no skips, no tolerance widening), and how
                  to verify. A competent engineer with no other context acts on
                  exactly this text.
            required: [title, branch, kind, work_order]
      required: [orders]

  # Stage 4: one child per order, in parallel, each in its own worktree.
  # Children push branches, open PRs, and watch their own CI; they never touch
  # this checkout's state.
  - id: fix-each
    workflow: archon-stabilize-fix
    depends_on: [work-orders]
    with:
      test_repetitions: "$INPUTS.test_repetitions"
    fan_out:
      items: "$work-orders.output.orders"
      as: order
      max_parallel: 3
      join: all_done
    isolation: worktree

  # One canonical batch surface: which order became which PR, what CI said.
  # Runs regardless of child outcomes — reporting three failed children IS its
  # job. It exits 1 itself only when every child failed.
  - id: collect
    script: collect
    runtime: uv
    depends_on: [fix-each]
    with:
      fix-each: "$fix-each.output"
    trigger_rule: all_done
    mutates_checkout: false
