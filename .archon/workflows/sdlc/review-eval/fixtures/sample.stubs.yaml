# One sample: the route agent picks every lens, the review finds a blocking defect
# and declares a working diff, so nothing is published, and simplify still runs.
review__mode: '{"continuation":false,"light":false,"head":"fixturehead","cursor":"","risks":"fixture-owned-policy","execution":{"path":"review__mode","invocation":{"loopPath":[]}},"seams":false,"code":false,"tests":false,"errors":false,"docs":false,"part":null}'
review__route: { seams: true, code: true, tests: true, errors: true, docs: true, reason: "stub: every lens" }
review__head-check: "target matches"
review__scope:
  selector: ""
  base: null
  pr: null
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/scope.md" }
review__seams: "0 findings"
review__code: "1 finding"
review__tests: "0 findings"
review__errors: "0 findings"
review__docs: "0 findings"
review__review-complete: "settled"
review__synthesize:
  ready: false
  action: correct
  findings_summary: "stub: one blocking finding"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
  discoveries: []
  contract_left: []
review__publish:
  ready: false
  action: correct
  findings_summary: "stub: one blocking finding"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
  discoveries: []
  contract_left: []
review__prune-scratch: "prune-scratch: removed 0 scratch worktree(s)"
simplify__simplify: { findings: true }
simplify__prune-scratch: "prune-scratch: removed 0 scratch worktree(s)"
fixture:
  expect: completed
  reached: [review__seams, review__code, review__tests, review__errors, review__docs, review__publish, simplify__simplify]
