# Outcome: ready. The route node's risk call picks seams and code for a contract
# change and leaves tests, errors and docs out; those carry no stub, so the fixture
# fails if any of them runs.
mode: '{"continuation":false,"head":"fixturehead","cursor":"","risks":"fixture-owned-policy","execution":{"path":"mode","invocation":{"loopPath":[]}}}'
scope:
  # A standalone review of the working diff: no pull request to publish to.
  pr: null
route: { seams: true, code: true, tests: false, errors: false, docs: false, risk: "stub: changes a typed contract between two packages" }
seams: "0 findings"
code: "0 findings"
review-complete: "settled"
synthesize:
  ready: true
  action: none
  findings_summary: "stub: clean"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
publish:
  ready: true
  action: none
  findings_summary: "stub: clean"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
fixture:
  expect: completed
  reached: [seams, code, synthesize, publish]
