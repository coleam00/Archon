# The golden path against fixtures/scenarios/sample.json, which declares no
# environment commands at all (a plain "the target is already reachable"
# scenario — the generic non-factory case). exec-code: true runs
# read-scenario.py, both status bash nodes, check-evidence.py and
# gate-verified.py for real; only the agent node (verify) is stubbed, since a
# dry run cannot invoke a provider. check-evidence really re-runs the
# scenario's candidate_command as a subprocess and really opens the two
# evidence files below off disk — nothing about the malformed-detection logic
# is faked here.
verify:
  candidate: "fixture-candidate-001"
  assertions:
    - id: help-text
      ok: true
      observed: "python3 --version printed 'Python 3.11.6'"
      evidence_path: .archon/workflows/sdlc/verify-runtime/fixtures/evidence/help-text.txt
    - id: always-true
      ok: true
      observed: "the check exited 0, as observed in the captured evidence"
      evidence_path: .archon/workflows/sdlc/verify-runtime/fixtures/evidence/always-true.txt
exec-code: true
fixture:
  expect: completed
  reached: [gate-verified]
  inputs:
    scenario: .archon/workflows/sdlc/verify-runtime/fixtures/scenarios/sample.json
