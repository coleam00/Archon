# Proves the environment commands really sequence setup -> start -> verify ->
# teardown, not just the "no commands declared" trivial path the other
# fixtures use. fixtures/scenarios/full-lifecycle.json's setup writes a
# marker file and its start command asserts the marker exists — a real
# exec-code bash chain, not a stub — so this fails for real if the workflow
# ever ran start before setup. teardown removes the marker; it is not
# re-asserted here since check-evidence.py judges the report, not the
# filesystem's state after cleanup.
verify:
  candidate: "fixture-candidate-001"
  assertions:
    - id: marker-present
      ok: true
      observed: "the marker file existed when start's own check ran"
      evidence_path: .archon/workflows/sdlc/verify-runtime/fixtures/evidence/marker-present.txt
exec-code: true
fixture:
  expect: completed
  reached: [gate-verified]
  inputs:
    scenario: .archon/workflows/sdlc/verify-runtime/fixtures/scenarios/full-lifecycle.json
