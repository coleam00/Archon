# fixtures/scenarios/unavailable.json declares a start command that always
# fails (`exit 1`) — a real exec-code bash node runs it for real. `verify` is
# never reached at all (its `when` gate refuses), so it needs no stub; the
# absence of one here IS part of the proof: an unavailable target never pays
# for an agent turn. Distinct from `malformed`: nothing was ever judged, so
# nothing here is retried by until_bash either — one attempt, inconclusive.
exec-code: true
fixture:
  expect: completed
  reached: [gate-verified]
  inputs:
    scenario: .archon/workflows/sdlc/verify-runtime/fixtures/scenarios/unavailable.json
