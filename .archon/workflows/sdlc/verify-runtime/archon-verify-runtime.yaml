name: archon-verify-runtime
description: |
  Run an agent against a live, testable target (a running app, a CLI, any
  executable project surface) and verify a project-declared set of runtime
  assertions with real observed evidence, never a self-reported pass count.
  A deterministic script owns every check with a known exact rule: assertion
  coverage, non-empty on-disk evidence per assertion, and the candidate
  identity the agent actually observed. A malformed report (not an ordinary
  failed assertion) gets one bounded retry in a fresh project-declared
  environment before the run gives up and reports inconclusive.

  Use when: a candidate needs its declared runtime behavior checked against a
  live target — "run the runtime scenario for this PR", "verify this build
  actually works", "holdout-check this candidate".
  NOT for: unit/build/type/lint checks (validate) or static code review
  (review). The scenario's own commands must never invoke this pack's own
  workflows — that would make validate depend on this workflow depending on
  validate.

model: medium

inputs:
  scenario:
    default: ""
    description: >-
      Path, relative to the checkout, to a project-owned JSON file declaring
      the runtime scenario: a required `assertions` array (each
      `{id, description}`) and an optional `environment` object (`setup`,
      `start`, `teardown` shell commands, and `candidate_command` — how to
      read the identity of whatever is actually running; defaults to
      `git rev-parse HEAD`). Required — empty fails the run before any agent
      cost. See fixtures/scenarios/sample.json for a worked example.
  candidate:
    default: ""
    description: >-
      Optional externally-known candidate identity to require (for example a
      PR head SHA a caller already pinned). Empty means only self-consistency
      is enforced: the agent's independently observed candidate must match
      this run's own independently captured identity, with no outside
      expectation.

returns: gate-verified
outcome_field: verified

nodes:
  # Parse once. A malformed scenario file is a bad invocation, not a bad
  # verification result, so it fails the run directly rather than feeding the
  # retry loop below (that loop retries a malformed AGENT REPORT, never a
  # malformed project config).
  - id: read-scenario
    script: read-scenario
    runtime: uv
    always_run: true
    with:
      scenario: "$INPUTS.scenario"
    output_format:
      type: object
      properties:
        setup: { type: string }
        start: { type: string }
        teardown: { type: string }
        candidate_command: { type: string }
        assertion_ids:
          type: array
          items: { type: string }
        assertion_descriptions: { type: object }
        assertions_json: { type: array }
      required:
        [
          setup,
          start,
          teardown,
          candidate_command,
          assertion_ids,
          assertion_descriptions,
          assertions_json,
        ]

  # Bounded malformed-report retry via the engine's own loop_group primitive
  # (see the workflow-language constitution's case law on until_bash on
  # loop_group): the body re-runs setup/start/verify/teardown/check-evidence
  # in a fresh iteration whenever check-evidence classifies the report as
  # structurally malformed, and stops the moment it does not. Two iterations
  # total, matching the one-retry precedent this replaces (the prior harness's
  # agentcheck.py retried exactly once on a malformed result and never on an
  # ordinary failed assertion). An ordinary failed assertion, an unavailable
  # target, or a well-formed pass all end the loop on iteration one.
  - id: verify-loop
    depends_on: [read-scenario]
    loop_group:
      until_bash: test $check-evidence.output.status != "malformed"
      max_iterations: 2
      fresh_context: true
      nodes:
        # Both project commands are captured as DATA, never as a node failure:
        # a loop_group fails its whole group the instant any body node fails
        # (mirrors the top-level DAG), which would make every unavailable
        # target look identical to a malformed report. Capturing ok/failure
        # as JSON keeps that distinction available to check-evidence. The
        # project command's own stdout/stderr is never smuggled into this
        # node's JSON stdout — captured via command substitution and
        # re-emitted to stderr only on failure, where it is the diagnostic.
        - id: setup-run
          bash: |
            CMD=$read-scenario.output.setup
            if [ -z "$CMD" ]; then
              echo '{"ok":true}'
              exit 0
            fi
            if OUT=$(eval "$CMD" 2>&1); then
              echo '{"ok":true}'
            else
              printf '%s\n' "$OUT" >&2
              echo '{"ok":false}'
            fi
          output_format:
            type: object
            properties: { ok: { type: boolean } }
            required: [ok]

        - id: start-run
          depends_on: [setup-run]
          bash: |
            if [ "$setup-run.output.ok" != "true" ]; then
              echo '{"ok":false}'
              exit 0
            fi
            CMD=$read-scenario.output.start
            if [ -z "$CMD" ]; then
              echo '{"ok":true}'
              exit 0
            fi
            if OUT=$(eval "$CMD" 2>&1); then
              echo '{"ok":true}'
            else
              printf '%s\n' "$OUT" >&2
              echo '{"ok":false}'
            fi
          output_format:
            type: object
            properties: { ok: { type: boolean } }
            required: [ok]

        # The one agent node in this whole workflow. Never edits app source or
        # the scenario to pass: mutates_checkout: false is engine-enforced (a
        # git-tree snapshot taken before and after the node), not a prompt
        # request. retry: covers the node's OWN structured-output validation
        # failure (the agent's reply did not even parse against the schema) —
        # a loop_group fails its whole group on any body-node failure, so
        # without this in-place retry a single bad turn would burn the
        # fresh-environment retry below for free. It is bounded and narrow:
        # it never runs the agent's judgment twice over a report that DID
        # parse — check-evidence's semantic checks own that case.
        - id: verify
          command: verify-runtime
          depends_on: [start-run]
          when: "$start-run.output.ok == 'true'"
          mutates_checkout: false
          retry:
            max_attempts: 2
            delay_ms: 1000
            on_error: all
          output_type: runtime-verification
          with:
            assertions_json: "$read-scenario.output.assertions_json"
            candidate_command: "$read-scenario.output.candidate_command"
          output_format:
            type: object
            properties:
              candidate: { type: string }
              assertions:
                type: array
                items:
                  type: object
                  properties:
                    id: { type: string }
                    ok: { type: boolean }
                    observed: { type: string }
                    evidence_path: { type: string }
                  required: [id, ok, observed, evidence_path]
            required: [candidate, assertions]

        # Best-effort cleanup, always attempted regardless of what verify did —
        # never gates on check-evidence, so cleanup never waits on the verdict.
        - id: teardown-run
          depends_on: [start-run]
          trigger_rule: all_done
          always_run: true
          bash: |
            CMD=$read-scenario.output.teardown
            if [ -z "$CMD" ]; then
              echo '{"ok":true}'
              exit 0
            fi
            if OUT=$(eval "$CMD" 2>&1); then
              echo '{"ok":true}'
            else
              printf '%s\n' "$OUT" >&2
              echo '{"ok":false}'
            fi
          output_format:
            type: object
            properties: { ok: { type: boolean } }
            required: [ok]

        # The only place any of this is judged. Never trusts a self-reported
        # pass count or prose marker: it recomputes the verdict from the
        # per-assertion `ok` fields alone, after every structural check below
        # passes. verify may be genuinely SKIPPED (target never came up) or
        # genuinely FAILED (exhausted its own retry above without ever
        # parsing) — trigger_rule: all_done reaches this node either way;
        # if_skipped covers the first, and the second surfaces as this node's
        # own unresolved-reference failure, which (correctly) fails the whole
        # group rather than inventing a soft verdict for a report that never
        # existed.
        - id: check-evidence
          script: check-evidence
          runtime: uv
          depends_on: [verify, teardown-run]
          trigger_rule: all_done
          always_run: true
          with:
            start_ok: "$start-run.output.ok"
            candidate: { from: "$verify.output.candidate", if_skipped: "" }
            assertions_raw: { from: "$verify.output.assertions", if_skipped: [] }
            required_ids: "$read-scenario.output.assertion_ids"
            required_descriptions: "$read-scenario.output.assertion_descriptions"
            candidate_command: "$read-scenario.output.candidate_command"
            expected_candidate: "$INPUTS.candidate"
          output_format:
            type: object
            properties:
              status:
                type: string
                enum: [verified, failed, unavailable, malformed]
              reason: { type: string }
              candidate: { type: string }
            required: [status, reason, candidate]

  - id: gate-verified
    script: gate-verified
    runtime: uv
    depends_on: [verify-loop]
    always_run: true
    with:
      status: "$verify-loop.output.status"
      reason: "$verify-loop.output.reason"
      candidate: "$verify-loop.output.candidate"
    output_format:
      type: object
      properties:
        verified: { type: boolean }
        verdict:
          type: string
          enum: [verified, failed, inconclusive]
        candidate: { type: string }
        summary: { type: string }
      required: [verified, verdict, candidate, summary]
