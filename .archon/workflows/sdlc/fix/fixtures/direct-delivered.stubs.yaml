# Sparse dry-run fixture: the current-truth check proves the work item is already
# implementation-ready, so planning and investigation stay skipped. Run with
# --default-stubs.
triage__triage:
  route: deliver
  summary: "stub: current code confirms a complete work order"
deliver__impl__implement:
  done: true
  green: true
  summary: "stub: direct work implemented and green"
deliver__rev1__synthesize:
  ready: true
  findings_summary: "stub: no open findings"
deliver__validate__validate:
  green: true
  summary: "stub: project gate green"
outcome: "https://github.com/example/repo/pull/4"
