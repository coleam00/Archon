# The review is ready but CI concludes red on a test the PR changed. The owner judges
# it introduced, fixes it in the same session, a verify review checks the fix, CI is
# awaited on the new head, and the run reports delivery.
plan:
  ready: true
  summary: "stub: plan written"
implement:
  green: true
  pr: { repo: { host: "github.com", path: "example/repo" }, number: 1, url: "https://github.com/example/repo/pull/1" }
  summary: "stub: implemented, validated, PR opened"
review:
  ready: true
  verdict: "READY TO MERGE"
  summary: "stub: no findings"
ci-probe: '{"state":"concluded","detail":"red: test (failure)","unstarted":0}'
finish:
  changed: true
  verify: true
  ci_cause: introduced
  summary: "stub: the changed test failed on Windows; fixed and pushed"
reverify:
  ready: true
  verdict: "READY TO MERGE"
  summary: "stub: CI fix verified"
recheck-probe: '{"state":"concluded","detail":"green: test (success)","unstarted":0}'
outcome: { ready: true, reason: delivered, pr_url: "https://github.com/example/repo/pull/1", summary: "stub: delivered" }
fixture:
  expect: completed
  reached: [finish, reverify, recheck, outcome]
