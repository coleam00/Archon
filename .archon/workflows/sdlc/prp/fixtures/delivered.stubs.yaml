# Outcome: delivered. Triage routes straight to delivery (archon-ready); one round is
# reviewed ready, simplify changes nothing, and the CI agent sees green and marks the
# PR ready. The route node picked seams and code; the other lenses carry no stub, so
# the fixture fails if one runs. verdict, round and outcome run for real.
triage:
  contract: READY
  route: deliver
  design_first: false
  complexity: small
  item: { repo: { host: "", path: "" }, number: 0 }
  area_labels: []
  proposed_edits: { title: "", body: "" }
  blocked_reason: ""
  blocked_by: []
  summary: "stub: current code confirms a complete work order"
  report: { type: archon_artifact, run_id: "fixture-run", path: "triage.md" }
implement__implement:
  done: true
  green: true
  red_cause: ""
  summary: "stub: implemented; project validation passed at handoff"
implement__assert-changed: "3 files changed"
pr__pr: { intent: "/fixture/pr-intent.json" }
pr__publish: { schemaVersion: 1, repo: { host: "github.com", path: "example/repo" }, number: 1, url: "https://github.com/example/repo/pull/1", head: "fixture-branch", base: "dev", is_draft: true, state: "open", head_repo: { host: "github.com", path: "example/repo" }, head_revision: "fixturehead", base_revision: "fixturebase", maintainer_can_modify: null }
review__mode: '{"continuation":false,"head":"fixturehead","cursor":"","risks":"fixture-owned-policy","execution":{"path":"review__mode","invocation":{"loopPath":[]}}}'
review__scope:
  pr: { repo: { host: "github.com", path: "example/repo" }, number: 1 }
review__route: { seams: true, code: true, tests: false, errors: false, docs: false, risk: "stub: changes a typed contract" }
review__seams: "0 findings"
review__code: "0 findings"
review__review-complete: "settled"
review__synthesize:
  ready: true
  action: none
  findings_summary: "stub: clean"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
review__publish:
  ready: true
  action: none
  findings_summary: "stub: clean"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
simplify: { findings: false }
ci:
  state: green
  summary: "stub: all checks green; marked ready"
fixture:
  expect: completed
  reached: [verdict, review__route, review__publish, simplify, ci, round, outcome]
exec-code: true
