name: archon-prp
description: |
  Experimental, beside the SDLC pack: take one issue or request to a ready PR in
  the agent-first shape. Triage labels the route: archon-ready delivers;
  archon-plan plans, then delivers when every design call is settled, or stops
  with the questions only a person can answer; archon-issue investigates, then
  delivers on a proven cause. Delivery runs capped rounds of implement (which
  checks only what it changed; CI is the validation), draft PR, and review; after
  the review passes, simplify runs once, then one CI agent marks the PR ready on
  green. A conflict with the base sends the work back to implement, which merges
  the base into the branch. Every other ending is not ready, with its reason.
  Never merges the PR.

  Use when: comparing this shape with archon-ship on real work — "deliver this
  issue with archon-prp".
  NOT for: reviewing someone else's PR, or merging.

requires: [github]
model: medium

inputs:
  target:
    default: ""
    description: >-
      What to take through the pipeline — an issue, document, plan, report, or
      free-form request. When empty, the run's trigger message is the target.
  publish:
    default: "false"
    description: Let triage write its route label to the tracker item — true or false.
  review_scopes:
    default: ""
    description: >-
      Review lenses to add to the ones the route node picks (seams, code, tests,
      errors, docs, or all), or an explicit restriction such as "only tests".

returns: outcome
outcome_field: ready

nodes:
  # Triage: a copy of archon-triage's nodes. Its verdict labels a READY item with the
  # route this workflow takes on it.
  - id: triage
    command: triage
    # Triage is advisory on both counts, and the engine holds both. It fails this
    # node with the touched paths named if the checkout is modified, and it
    # refuses the artifact pointer below if the report it names does not exist —
    # so a route with no evidence behind it never leaves here.
    mutates_checkout: false
    output_type: work-triage
    output_format:
      type: object
      properties:
        contract:
          type: string
          enum: [READY, NEEDS_CONTRACT_WORK, BLOCKED, NO_ACTION]
        route:
          type: string
          enum: [investigate, plan, deliver, no_action]
        complexity:
          type: string
          enum: [small, risky, large]
        # The tracker item the labels address. An empty repository means the
        # target was not a tracker issue.
        item:
          type: object
          properties:
            repo:
              type: object
              properties:
                host: { type: string }
                path: { type: string }
              required: [host, path]
              additionalProperties: false
            number:
              type: integer
          required: [repo, number]
        area_labels:
          type: array
          items:
            type: string
        # Only NEEDS_CONTRACT_WORK fills these; a later gated step applies them.
        proposed_edits:
          type: object
          properties:
            title:
              type: string
            body:
              type: string
          required: [title, body]
        # Only BLOCKED fills these. URLs are verified references, never guesses.
        blocked_reason:
          type: string
        blocked_by:
          type: array
          items:
            type: string
        summary:
          type: string
        report:
          # The evidence contract, enforced by the engine at this node: a pointer at a
          # file this run's artifacts do not hold, or an empty one, is refused before
          # the node completes, so a verdict cannot arrive without its report.
          type: object
          properties:
            type: { type: string, enum: [archon_artifact] }
            run_id: { type: string }
            path: { type: string, enum: [triage.md] }
          required: [type, run_id, path]
      required:
        - contract
        - route
        - complexity
        - item
        - area_labels
        - proposed_edits
        - blocked_reason
        - blocked_by
        - summary
        - report

  # The prompt judges; this boundary verifies what a schema cannot: the relations
  # between fields. Only a READY contract carries an engineering route, only
  # NEEDS_CONTRACT_WORK proposes edits, only BLOCKED names blockers, and the pack's labels are derived here rather than
  # chosen by the model: one state label, plus a size label while the item can
  # still be worked. Each field's own type and vocabulary were certified on the
  # node above. Labels are written only under publish, after the item's identity
  # is verified on the tracker, and read back before the node reports them.
  - id: verdict
    script: verdict
    runtime: bun
    depends_on: [triage]
    with:
      contract: "$triage.output.contract"
      route: "$triage.output.route"
      complexity: "$triage.output.complexity"
      item: { from: "$triage.output.item" }
      area_labels: { from: "$triage.output.area_labels" }
      proposed_edits: { from: "$triage.output.proposed_edits" }
      blocked_reason: "$triage.output.blocked_reason"
      blocked_by: { from: "$triage.output.blocked_by" }
      summary: "$triage.output.summary"
      report: { from: "$triage.output.report" }
      publish: "$INPUTS.publish"
    output_format:
      type: object
      properties:
        contract:
          type: string
          enum: [READY, NEEDS_CONTRACT_WORK, BLOCKED, NO_ACTION]
        route:
          type: string
          enum: [investigate, plan, deliver, no_action]
        ready:
          type: boolean
        complexity:
          type: string
          enum: [small, risky, large]
        labels:
          type: array
          items:
            type: string
        published:
          type: boolean
        proposed_edits:
          type: object
          properties:
            title:
              type: string
            body:
              type: string
          required: [title, body]
        blocked_reason:
          type: string
        blocked_by:
          type: array
          items:
            type: string
        summary:
          type: string
        # The same pointer, so a composing caller resolves to a verdict that still
        # carries its evidence; the engine checks it again here.
        report:
          type: object
          properties:
            type: { type: string, enum: [archon_artifact] }
            run_id: { type: string }
            path: { type: string, enum: [triage.md] }
          required: [type, run_id, path]
      required:
        - contract
        - route
        - ready
        - complexity
        - labels
        - published
        - proposed_edits
        - blocked_reason
        - blocked_by
        - summary
        - report

  - id: inv
    include: archon-investigate
    with:
      target: >-
        Investigate the unresolved causal question recorded in
        $ARTIFACTS_DIR/triage.md. Read that assessment first; its confirmed facts
        are context, while its unknowns are the investigation target.
    depends_on: [verdict]
    when: "$verdict.output.route == 'investigate'"

  # Usage data for the planner, when the item could turn on it.
  - id: intel
    command: intel
    depends_on: [verdict]
    when: "$verdict.output.route == 'plan'"
    mutates_checkout: false

  # The planner makes the design calls. Open questions stop the run (needs_human).
  - id: planned
    include: archon-plan
    with:
      work: >-
        Plan the current work item from $ARTIFACTS_DIR/triage.md. Read that
        assessment first, preserve its verified outcome and constraints, and
        decide the implementation questions it identified. Read
        $ARTIFACTS_DIR/intel.md too: what usage data says about this work, or
        why there is none.
    depends_on: [verdict, intel]
    when: "$verdict.output.route == 'plan'"

  # One round: implement → draft PR → review → (simplify → CI). A review that needs
  # fixes, or a red CI the PR caused, starts another round. Each round's implementer
  # is a fresh agent that reads the previous round's review report and ci.md; once a
  # loop body can continue a named session, `implement` resumes the previous round's
  # session instead.
  - id: rounds
    # One join into delivery: the direct route, a rooted investigation, or a ready
    # plan. `&&` short-circuits, so a skipped producer's output is never read.
    depends_on: [verdict, inv, planned]
    trigger_rule: none_failed_min_one_success
    when: "$verdict.output.route == 'deliver' || $verdict.output.route == 'investigate' && $inv.output.rooted == true || $verdict.output.route == 'plan' && $planned.output.ready == true"
    loop_group:
      until_bash: |
        done=$round.output.done
        test "$done" = "true"
      # round caps itself one below this, so the cap ends typed instead of failing.
      max_iterations: 4
      fresh_context: true
      nodes:
        - id: implement
          include: archon-prp-build
          with:
            work: >-
              Deliver the work prepared by this run. Read $ARTIFACTS_DIR/triage.md
              first. When present, plan.md or investigation.md is the detailed work
              order and must be read in full; on the direct route, triage.md itself
              is the verified work order.

              Result of this run's previous delivery round (empty on the first
              round): $LOOP_PREV.round.output.summary

              On a later round, correct what that round left: read
              $ARTIFACTS_DIR/review/report.md and judge every open finding (fix
              every blocking finding, or decline it only with the evidence that it
              is not a finding; fix a note or decline it with a one-line reason),
              and read $ARTIFACTS_DIR/ci.md when the round ended on a CI failure
              this pull request caused or on a conflict with its base. Record
              every disposition in implementation.md. Do not cross an explicit
              boundary to make a finding disappear.

        - id: pr
          include: archon-pr
          depends_on: [implement]
          when: "$implement.output.green == true || $implement.output.red_cause == 'inherited' || $implement.output.red_cause == 'environment'"
          with:
            draft: "true"

        - id: review
          include: archon-prp-reviewers
          depends_on: [pr]
          with:
            scope: "$pr.output"
            prior_report: "$LOOP_PREV.round.output.prior_report"
            work_order: >-
              $ARTIFACTS_DIR/triage.md, with plan.md or investigation.md beside it
              when present.
            scopes: "$INPUTS.review_scopes"

        # After the last fix round's review passes, before CI. Once per run: a later
        # round finds the earlier shape.md and stops (see simplify.md).
        - id: simplify
          command: simplify
          depends_on: [review]
          when: "$review.output.ready == true"
          context: fresh
          mutates_checkout: false
          output_type: structure-review
          output_format:
            type: object
            properties:
              findings: { type: boolean }
            required: [findings]

        - id: reshape
          include: archon-prp-build
          depends_on: [simplify]
          when: "$simplify.output.findings == true"
          with:
            work: >-
              Judge the smaller shapes recorded in $ARTIFACTS_DIR/shape.md against
              the work order in $ARTIFACTS_DIR/triage.md (and plan.md or
              investigation.md when present). Adopt every finding whose smaller shape
              preserves behavior and that the project's values back; decline one
              only with that evidence. Record each disposition in implementation.md.
              Keep the requested outcome and its tests intact. When the work is
              green, push its commits to the branch this run is on by name (`git
              push origin HEAD:refs/heads/<branch>`), never letting git select an
              upstream, and never force-push.

        - id: ci
          command: ci
          depends_on: [review, simplify, reshape]
          trigger_rule: none_failed_min_one_success
          when: "$review.output.ready == true"
          output_format:
            type: object
            properties:
              state: { type: string, enum: [green, pr_caused, other] }
              summary: { type: string }
            required: [state, summary]

        - id: round
          script: round
          runtime: bun
          depends_on: [implement, pr, review, ci]
          trigger_rule: all_done
          with:
            previous: "$LOOP_PREV.round.output.round"
            prior_report: "$LOOP_PREV.round.output.prior_report"
            previous_pr_url: "$LOOP_PREV.round.output.pr_url"
            green: "$implement.output.green"
            red_cause: "$implement.output.red_cause"
            implement_summary: "$implement.output.summary"
            pr_url: { from: "$pr.output.url", if_skipped: null }
            review_ready: { from: "$review.output.ready", if_skipped: null }
            review_action: { from: "$review.output.action", if_skipped: null }
            review_summary: { from: "$review.output.findings_summary", if_skipped: null }
            ci: { from: "$ci.output.state", if_skipped: null }
            ci_summary: { from: "$ci.output.summary", if_skipped: null }
          output_format:
            type: object
            properties:
              round: { type: integer }
              done: { type: boolean }
              ready: { type: boolean }
              reason:
                type: string
                enum: [delivered, implement_blocked, review_open, replan, ci_pr_caused, ci_other, round_cap]
              pr_url: { type: string }
              prior_report: { type: string }
              summary: { type: string }
            required: [round, done, ready, reason, pr_url, prior_report, summary]

  # One return for every ending: the rounds' typed ending, or the advisory stop that
  # kept delivery from starting. A failed node cascades an `upstream_failed` skip that
  # blocks this join, so the run's terminal record names the node that failed.
  - id: outcome
    script: outcome
    runtime: bun
    depends_on: [verdict, rounds]
    trigger_rule: none_failed_min_one_success
    with:
      route: "$verdict.output.route"
      summary: "$verdict.output.summary"
      open_questions: { from: "$planned.output.open_questions", if_skipped: null }
      rounds: { from: "$rounds.output", if_skipped: null }
    output_format:
      type: object
      properties:
        ready: { type: boolean }
        reason:
          type: string
          enum:
            [delivered, implement_blocked, replan, ci_other, round_cap, no_action, needs_human, not_rooted]
        pr_url: { type: string }
        summary: { type: string }
      required: [ready, reason, pr_url, summary]
