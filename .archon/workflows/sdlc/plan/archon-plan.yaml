name: archon-plan
description: |
  Turn decided intent — a feature request, an investigation report, an idea —
  into an implementable plan: the approach chosen with alternatives rejected for
  stated reasons, the work broken into verifiable steps, and the validation that
  proves it. Advisory: it reads and reports — the repository is left exactly as
  it was found.

  Use when: what to build is known but how is not yet decided — "plan this
  feature", "turn this investigation into a plan", "how should we build this".
  NOT for: root-causing a bug (investigate), or building the plan (implement).

model: large

inputs:
  work:
    default: ""
    description: >-
      What to plan — a feature description, an issue reference, or a goal. When
      empty, the run's trigger message is the work.
  report:
    default: ""
    description: >-
      Optional path to a prior investigation report to build on — its claims are
      verified, not trusted. Empty means no prior report.

# ready:false is a valid completion (see the plan node): the run succeeds with
# an authored outcome of false — lifecycle status and work outcome are separate facts.
returns: plan
outcome_field: ready

nodes:

  # Blocked is a valid outcome, not a failure: ready:false naming exactly what
  # is missing beats a plan built on guesses. Consumers gate on
  # $plan.output.ready before building.
  - id: plan
    command: plan
    # Advisory on both counts, and the engine holds both: it fails this node with
    # the touched paths named if the checkout is modified, and it refuses the
    # artifact pointer below if the report it names does not exist.
    mutates_checkout: false
    output_type: implementation-plan
    output_format:
      type: object
      properties:
        ready:
          type: boolean
        summary:
          type: string
        report:
          # The evidence contract, enforced by the engine at this node: a pointer at a
          # file this run's artifacts do not hold is refused before the node completes,
          # so a verdict cannot arrive without its report. The bar is existence, not
          # content — a zero-byte report satisfies it, where the node this replaced
          # also required the file to be non-empty.
          type: object
          properties:
            type: { type: string, enum: [archon_artifact] }
            run_id: { type: string }
            path: { type: string, enum: [plan.md] }
          required: [type, run_id, path]
      required: [ready, summary, report]
