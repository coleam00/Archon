name: archon-plan
description: |
  Turn one issue whose outcome is decided into an implementable plan: the approach chosen
  with alternatives rejected for stated reasons, the work broken into verifiable steps,
  and the validation that proves it. Changes nothing in the checkout.

  Starts when triage or the split stage routes an issue `plan`, when delivery sends it
  back to planning, or by hand:
  `archon workflow run archon-plan --item issue-<n> --input issue=<n>`.
  `planned` starts the build stage; a call that belongs to an operator is an ask, and the
  answers start the plan again.

model: ['@planner', large]
mutates_checkout: false

inputs:
  issue:
    description: The number of the issue to plan.
  repo_host:
    default: ""
    description: The host of the issue's repository. Empty means the checkout's `origin` remote.
  repo_path:
    default: ""
    description: The issue's repository on its host. Empty means the checkout's `origin` remote.
  answers:
    default: "None."
    description: Every answer an operator gave on this item, oldest first.
  triage:
    result_of: archon-triage
    description: What triage concluded about the issue. Read from the item.
  split:
    result_of: archon-split
    description: What the split stage concluded, when the item came through one. Read from the item.
  build:
    result_of: archon-build
    description: What the last build of the item ended with, when delivery sent it back to planning.
  review:
    result_of: archon-review
    description: What the last review of the item ended with, when delivery sent it back to planning.

returns: { node: plan, outcome: outcome, asks: asks, summary: summary }

nodes:
  - id: plan
    command: plan
    output_format:
      type: object
      additionalProperties: false
      properties:
        outcome: { type: string, enum: [planned, ask] }
        open_questions: { type: array, items: { type: string } }
        summary: { type: string }
        report: { type: string, description: 'The absolute path of plan.md.' }
      required: [outcome, open_questions, summary, report]
