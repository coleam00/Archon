# Dry-run fixture: the ready path. The planner declares ready with an empty
# open_questions list. Structured stubs are YAML mappings (they hydrate
# structuredOutput); plain-string stubs stay strings.
plan:
  ready: true
  open_questions: []
  summary: "stub: approach chosen — full plan at plan.md"
  report: { type: archon_artifact, run_id: "fixture-run", path: "plan.md" }
fixture:
  expect: completed
  # The planner is told where the pack's default rulings are: $PACK_DIR's policy folder.
  resolved-text-contains:
    plan: "/sdlc/.shared/policy/`"
