name: archon-ship
description: "Ground an item, investigate or plan as needed, and deliver through archon-ship-block. Unowned questions and Ready PRs pause for a disposition. Retry authorizes one pipeline attempt with the answer; finish leaves the work as it stands. Terminal no-action outcomes complete. Never merges."
inputs:
  branch:
    default: ""
    description: >-
      The branch a new pull request opens from, as the caller resolved it,
      forwarded unchanged to delivery. When an open pull request already has that
      head, the push updates it instead of opening another. Empty opens it from the
      checkout's branch.

  pull_request:
    default: ""
    description: >-
      The number of an open pull request this run continues, as the caller
      resolved it; empty or `null` when it names none. Delivery finishes it
      whichever route triage takes; triage naming a different one refuses the run.
  target:
    default: ""
    description: "What to take through the pipeline — an issue, document, plan, report, or free-form request. When empty, the run's trigger message is the target."
  errors:
    default: auto
    description: "Silent-failure lens — auto, true, or false."
  part:
    default: ""
    description: "The part of an approved multi-part plan this run delivers, forwarded unchanged to delivery's reviews. archon-review's `part` input owns its shape. Empty delivers the whole contract."
  publish:
    default: "false"
    description: Let triage write its derived labels to the tracker item — true or false. Off by default. Forwarded unchanged to triage; a scheduled ship run is the only place an unattended intake can turn it on.
returns: report
outcome_field: delivered
nodes:
  - id: cycle
    loop_group:
      max_iterations: 1
      fresh_context: true
      until_bash: |
        done=$settle.output.done
        test "$done" = "true"
      nodes:
        - id: prepare
          script: prepare
          runtime: bun
          with:
            previous: $LOOP_PREV.settle.output
            answer: $LOOP_PREV.ask.output
            work: $INPUTS.target
          output_format:
            type: object
            properties:
              effect:
                type: string
                enum:
                  - retry
                  - replan
                  - ci
                  - finish
              work:
                &text
                type: string
              previous:
                type:
                  - object
                  - "null"
              replan:
                type: boolean
              pr:
                anyOf:
                  - type: "null"
                  - &qualified_pr
                    type: object
                    additionalProperties: false
                    properties:
                      repo:
                        type: object
                        properties:
                          host:
                            &nonempty_text
                            type: string
                            pattern: \S
                          path:
                            *nonempty_text
                        required:
                          - host
                          - path
                        additionalProperties: false
                      number:
                        type: integer
                        minimum: 1
                    required:
                      - repo
                      - number
              policy_defaults:
                *text
            required:
              - effect
              - work
              - previous
              - replan
              - pr
              - policy_defaults
        - id: attempt
          include: archon-ship-block
          depends_on:
            - prepare
          when: "$prepare.output.effect == 'retry'"
          with:
            pull_request: $INPUTS.pull_request
            branch: $INPUTS.branch
            target: $prepare.output.work
            errors: $INPUTS.errors
            part: $INPUTS.part
            publish: $INPUTS.publish
        - id: decide
          command: decide
          model: medium
          context: fresh
          mutates_checkout: false
          depends_on:
            - attempt
            - prepare
          trigger_rule: none_failed_min_one_success
          when: "$prepare.output.effect != 'finish'"
          with:
            result:
              from: $attempt.output
              if_skipped: null
            previous:
              from: $prepare.output.previous
            effect: $prepare.output.effect
            policy_defaults: $prepare.output.policy_defaults
          output_format:
            type: object
            additionalProperties: false
            properties:
              done:
                type: boolean
              attention:
                anyOf:
                  - type: "null"
                  - &attention
                    type: object
                    additionalProperties: false
                    properties:
                      what:
                        *nonempty_text
                      why:
                        *nonempty_text
                      recommendation:
                        type: object
                        additionalProperties: false
                        properties:
                          choice:
                            *nonempty_text
                          why:
                            *nonempty_text
                          evidence:
                            *nonempty_text
                          confidence:
                            type: string
                            enum:
                              - low
                              - medium
                              - high
                          would_change:
                            *nonempty_text
                        required:
                          - choice
                          - why
                          - evidence
                          - confidence
                          - would_change
                      choices:
                        type: array
                        minItems: 1
                        items:
                          type: object
                          additionalProperties: false
                          properties:
                            id:
                              type: string
                              pattern: "^[a-z][a-z0-9-]*$"
                            label:
                              *nonempty_text
                            does:
                              *nonempty_text
                            effect:
                              type: string
                              enum:
                                - retry
                                - finish
                            ruling:
                              *text
                          required:
                            - id
                            - label
                            - does
                            - effect
                            - ruling
                      if_unanswered:
                        *nonempty_text
                      links:
                        type: array
                        items:
                          *nonempty_text
                        minItems: 1
                    required:
                      - what
                      - why
                      - recommendation
                      - choices
                      - if_unanswered
                      - links
              pr:
                anyOf:
                  - type: "null"
                  - *qualified_pr
            required:
              - done
              - attention
              - pr
        - id: settle
          script: settle
          runtime: bun
          depends_on:
            - prepare
            - attempt
            - decide
          trigger_rule: none_failed_min_one_success
          with:
            previous:
              from: $prepare.output.previous
            effect: $prepare.output.effect
            result:
              from: $attempt.output
              if_skipped: null
            decision:
              from: $decide.output
              if_skipped: null
          output_format:
            type: object
            properties:
              result:
                &result
                type: object
                properties:
                  delivered:
                    type: boolean
                  reason:
                    type: string
                    enum:
                      - delivered
                      - implement_blocked
                      - review_open
                      - replan
                      - ci_pr_caused
                      - ci_other
                      - round_cap
                      - failed
                      - no_action
                      - blocked
                      - needs_contract
                      - refuted
                      - not_rooted
                      - needs_human
                  pr_url:
                    type: string
                  summary:
                    type: string
                required:
                  - delivered
                  - reason
                  - pr_url
                  - summary
              done:
                type: boolean
              message:
                *text
              attention:
                anyOf:
                  - type: "null"
                  - *attention
              class: { type: string }
              options:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      *text
                    label:
                      *text
                  required:
                    - id
                    - label
              replan:
                type: boolean
              pr:
                anyOf:
                  - type: "null"
                  - *qualified_pr
            required:
              - result
              - done
              - message
              - class
              - attention
              - options
              - replan
              - pr
        - id: ask
          depends_on:
            - settle
          when: "$settle.output.message != ''"
          wait:
            attention: $settle.output.message
            form: select
            options: $settle.output.options
            labels:
              sdlc: ship
              decision: $settle.output.class
  - id: result
    depends_on:
      - cycle
    runtime: bun
    script: console.log(JSON.stringify(JSON.parse(process.env.INPUTS_ENVELOPE).result))
    with:
      envelope:
        from: $cycle.output
    output_format:
      *result
  - id: report
    depends_on:
      - result
    trigger_rule: all_done
    always_run: true
    script: report
    runtime: bun
    with:
      outcome:
        from: $result.output
        if_skipped: null
    output_format:
      *result
