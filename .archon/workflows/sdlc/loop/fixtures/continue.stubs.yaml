# Dry-run fixture: the continue route. pick names an open pull request with
# findings; the builder is told which one, the black-box check is told only the pull
# request and its head (never the builder's report), and the reviewer sees both.
# The reviewer sends it back, so the merge gate never runs.
pick:
  route: continue
  target: "https://github.com/example/app/issues/3"
  pr: "https://github.com/example/app/pull/7"
  confidence: high
  area: app/
  reason: "stub: review findings outstanding on a loop-owned pull request"
build: "Fixed the review findings on the open pull request.\nPR: https://github.com/example/app/pull/7"
subject:
  pr: "https://github.com/example/app/pull/7"
  head: "def5678"
  base: main
  files: "app/notes.py"
  started: "1700000000000"
check-app:
  pr: "https://github.com/example/app/pull/7"
  head: "def5678"
  merged_with: "def5678"
  lines:
  - id: C1
    kind: criterion
    verdict: PASS
    text: "the skipped test runs and passes"
    evidence: ["/artifacts/c1.txt"]
    pre_existing: ""
    defect: ""
    carried_from: ""
  overall: "PASS"
  summary: "stub: no defects seen"
evidence:
  ok: "true"
  problems: ""
  overall: PASS
  checked_at: "1700000100000"
review:
  outcome: sent-back
  pr: "https://github.com/example/app/pull/7"
  sha: def5678
  delivers: none
  dispositions: []
  judge_changes: []
  reason: "stub: a test was skipped to get green"
claim:
  held: "true"
  holder: fixture-run
  reason: "stub: this run holds the work item"
release: "released 1 claim(s)"
fixture:
  expect: completed
  reached: [pick, claim, build, subject, check-app, evidence, review, release]
  resolved-text-contains:
    build: "https://github.com/example/app/pull/7"
    check-app: "Pull request: https://github.com/example/app/pull/7"
    review: "Fixed the review findings"
  inputs:
    runtime: "/private/run-the-app.md"
