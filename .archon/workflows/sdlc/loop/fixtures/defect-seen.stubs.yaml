# Dry-run fixture (with --exec-code: the evidence check really runs). The app check
# saw a new defect, reported it as a defect line, and still claimed Overall: PASS, the
# way observed defects used to be graded PASS. Its evidence files were never written
# either. The evidence check refuses the report, and the reviewer is told why before it
# decides; the merge gate would refuse the same report.
pick:
  route: simple
  target: "https://github.com/example/app/issues/5"
  pr: ""
  confidence: high
  area: app/
  reason: "stub: next unblocked issue, one module, clear criteria"
build: "Built the gate.\nPR: https://github.com/example/app/pull/9"
subject:
  pr: "https://github.com/example/app/pull/9"
  head: "abc1234"
  base: main
  files: "app/gate.py"
  started: "1700000000000"
check-app:
  pr: "https://github.com/example/app/pull/9"
  head: "abc1234"
  merged_with: "abc1234"
  lines:
  - id: C1
    kind: criterion
    verdict: PASS
    text: "the gate reports why it is shut: the reason is shown"
    evidence: ["/artifacts/c1.txt"]
    pre_existing: ""
    defect: ""
    carried_from: ""
  - id: P1
    kind: probe
    verdict: SURPRISE
    text: "shut gate / walk into it: walked straight through"
    evidence: ["/artifacts/p1.png"]
    pre_existing: ""
    defect: "D1"
    carried_from: ""
  - id: D1
    kind: defect
    verdict: DEFECT
    text: "walking into the shut gate carries the user through it"
    evidence: ["/artifacts/p1.png"]
    pre_existing: ""
    defect: ""
    carried_from: ""
  overall: "PASS"
  summary: "stub: one defect seen, graded PASS anyway"
review:
  outcome: sent-back
  pr: "https://github.com/example/app/pull/9"
  sha: abc1234
  delivers: none
  dispositions:
  - line: D1
    action: blocks
    file: ""
    issue: ""
    reason: ""
  judge_changes: []
  reason: "stub: D1 is this change's to fix"
claim:
  held: "true"
  holder: fixture-run
  reason: "stub: this run holds the work item"
release: "released 1 claim(s)"
fixture:
  expect: completed
  reached: [pick, claim, build, subject, check-app, evidence, review, release]
  resolved-text-contains:
    review: "Overall says PASS over D1"
  inputs:
    runtime: "/private/run-the-app.md"
exec-code: true
