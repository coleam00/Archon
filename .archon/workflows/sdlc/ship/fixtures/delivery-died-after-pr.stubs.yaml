# Dry-run fixture: delivery dies AFTER the pull request exists. The project
# gate goes red on an introduced failure, the flip is skipped, and the run
# fails with the terminal report reachable — this pins the post-creation death
# REACHING the died-mid-flight path at all, not the report's content.
#
# `outcome` is stubbed for the same reason delivery-died stubs it: the real
# script returns 1 on this branch, and a declared failure fixture asserts
# exactly one failed node. Because of that stub, this fixture cannot tell a
# stale record from a null delivered value — the proof that a creation-time
# record never masquerades as a delivery lives in delivered-unusable (which
# runs the real script) and in the five delivered fixtures that go red when
# the returns choice is reverted.
triage__triage:
  route: deliver
  summary: "stub: current code confirms a complete work order"
triage__assert-intact: '{"intact":"true"}'
gate-direct: '{"gate":"direct"}'
deliver__impl__record-start: '{"start":"recorded"}'
deliver__impl__implement:
  done: true
  green: true
  summary: "stub: direct work implemented and green"
deliver__impl__assert-changed: "2 files changed"
deliver__gate-green: '{"gate":"green"}'
deliver__pr__pr: { repo: { host: "github.com", path: "example/repo" }, number: 6, url: "https://github.com/example/repo/pull/6", head: "fixture-branch", base: "dev", is_draft: true }
deliver__classify:
  errors: false
  docs: false
  reasons:
    errors: "stub: no failure paths"
    docs: "stub: no doc-facing changes"
deliver__resolve-scope: '{"errors":"false"}'
deliver__review__mode: '{"continuation":false}'
deliver__review__scope: "PR diff in scope; head sha stubbed"
deliver__review__code: "0 findings"
deliver__review__seams: "0 findings"
deliver__review__simplify: "0 findings"
deliver__review__tests: "0 findings"
deliver__review__review-complete: "settled"
deliver__review__synthesize:
  ready: true
  action: none
  findings_summary: "stub: no open findings"
deliver__review-action: '{"ready":true,"action":"none"}'
deliver__gate-ready: '{"gate":"ready"}'
deliver__validate__validate:
  green: false
  red_cause: introduced
  summary: "stub: the change broke one spec in the project gate"
# deliver__gate-validated is deliberately unstubbed: the real gate must refuse
# introduced red.
outcome: "outcome: delivery started but did not complete"
fixture:
  expect: failed
  fail-node: deliver__gate-validated
  reached: [outcome]
exec-code: true
