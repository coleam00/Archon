# Dry-run fixture: delivery dies when the implementer declares a blocker and changed
# nothing. The real assert-changed guard refuses and the loop group fails. Deliver's
# report still completes not ready with reason failed, ship's outcome relays it, and
# the run fails.
triage__triage:
  decision: { contract: READY, route: deliver }
  type: { value: feature, reason: "stub: asks for new behavior" }
  size: { value: s, reason: "stub: size" }
  complexity: { value: low, reason: "stub: complexity" }
  importance: { value: medium, reason: "stub: importance" }
  urgency: { value: none, reason: "stub: urgency" }
  item: { repo: { host: "", path: "" }, number: 0 }
  area_labels: []
  summary: "stub: current code confirms a complete work order"
  report: { type: archon_artifact, run_id: "fixture-run", path: "triage.md" }
implement__implement:
  done: true
  green: false
  red_cause: ""
  summary: "stub: blocked: the work order names a module that does not exist"
# implement__assert-changed is deliberately unstubbed: the real guard must refuse.
fixture:
  expect: failed
  fail-node: [implement__assert-changed, deliver__rounds]
  reached: [deliver__report, outcome, report]
exec-code: true
