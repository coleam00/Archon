triage__triage: &judgment
  route: "plan"
  summary: "stub: desired outcome is current; implementation shape needs a decision"
  contract: "READY"
  design_first: true
  complexity: "small_bounded"
  proposed_edits: {"title":"","body":""}
  labels: ["archon-design-first"]
  blocked_by: []
  blocked_reason: ""
  issue_repo: ""
  issue_number: 0
  issue_url: ""
triage__validate-contract:
  <<: *judgment
  publication: { published: false, applied_labels: [], skipped_labels: [] }
# Sparse dry-run fixture: a bound target reaches triage, planning, and the shared
# delivery tail. The plan is ready and delivery completes. Run with
# --default-stubs --exec-code.
#
# `outcome` is deliberately unstubbed: the real script runs and must report pull
# request 3 from the delivered flip value alone. The exec workspace is a DETACHED
# worktree, so there is no current branch for an ambient pull request lookup to
# resolve - a pass here is proof the report is built from the delivered value and nothing
# the checkout happens to be sitting on.

planned__plan:
  ready: true
  summary: "stub: approach chosen and plan ready"
deliver__impl__implement:
  done: true
  green: true
  summary: "stub: planned work implemented and green"
deliver__review__synthesize:
  ready: true
  action: none
  findings_summary: "stub: no open findings"
deliver__review-action: '{"ready":true,"action":"none"}'
deliver__validate__validate:
  checks_performed: true
  green: true
  summary: "stub: project gate green"
ci-probe: '{"state":"concluded","detail":"all checks green"}'
deliver__classify:
  errors: false
  docs: false
  reasons:
    errors: "stub: no failure paths"
    docs: "stub: no doc-facing changes"
deliver__resolve-scope: '{"errors":"false"}'
fixture:
  expect: completed
  inputs:
    target: "issue #3031"
  resolved-text-contains:
    triage__triage: "issue #3031"
exec-code: true

planned__assert-intact: '{"intact":"true"}'
deliver__gate-ready: '{"gate":"ready"}'
deliver__impl__record-start: '{"start":"recorded"}'
deliver__gate-validated: '{"gate":"green"}'
deliver__impl__assert-changed: "2 files changed"
deliver__gate-green: '{"gate":"green"}'
deliver__ci-verdict: '{"state":"concluded","detail":"all checks green"}'
deliver__flip-ready: "https://github.com/example/repo/pull/3"
deliver__outcome: "https://github.com/example/repo/pull/3"
gate-planned: '{"gate":"planned"}'
deliver__pr__pr: {"ref": {"repo": {"host": "github.com", "path": "example/repo"}, "number": 3}, "url": "https://github.com/example/repo/pull/3", "head_repo": {"host": "github.com", "path": "example/repo"}, "head": "fixture-branch", "base": "dev", "head_sha": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", "is_draft": true, "state": "open", "title": "Fixture", "body": "Fixture"}
deliver__review__mode: '{"continuation":false}'
deliver__review__scope: "PR diff in scope; head sha stubbed"
deliver__review__code: "0 findings"
deliver__review__seams: "0 findings"
deliver__review__simplify: "0 findings"
deliver__review__tests: "0 findings"
deliver__review__review-complete: "settled"

deliver__pr__prepare:
  title: Fixture
  body: Fixture
  base: dev
deliver__review__publish:
  ready: true
  action: none
  findings_summary: "stub: no open findings"
