# Sparse dry-run fixture: the default launch leaves `fixture.inputs` absent, so
# `target` takes its empty default. The current-truth check proves the work item
# is already implementation-ready, so planning and investigation stay skipped.
# Run with --default-stubs --exec-code.
#
# `outcome` is deliberately unstubbed: the real script runs and must report pull
# request 4 from deliver's outcome alone. The exec workspace is a DETACHED
# worktree, so there is no current branch for an ambient pull request lookup to
# resolve — a pass here is proof the report is built from the delivered value and nothing
# the checkout happens to be sitting on.
triage__triage:
  decision: { contract: READY, route: deliver, design_first: false }
  complexity: small
  item: { repo: { host: "", path: "" }, number: 0 }
  area_labels: []
  summary: "stub: current code confirms a complete work order"
  report: { type: archon_artifact, run_id: "fixture-run", path: "triage.md" }
gate-direct: '{"gate":"direct"}'
deliver__impl__implement:
  done: true
  green: true
  red_cause: ""
  summary: "stub: direct work implemented and green"
deliver__review__lens-status: { required: [seams, code, tests, simplify], completed: [seams, code, tests, simplify], missing: [] }
deliver__review__prune-scratch: "prune-scratch: removed 0 scratch worktree(s)"
deliver__review__synthesize:
  ready: true
  action: none
  findings_summary: "stub: no open findings"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
  discoveries: []
deliver__review__publish:
  ready: true
  action: none
  findings_summary: "stub: no open findings"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
  discoveries: []
deliver__review-policy: { risks: "fixture-owned-policy" }
deliver__classify:
  tier: full
  errors: false
  docs: false
  reasons:
    tier: "stub: touches persisted state"
    errors: "stub: no failure paths"
    docs: "stub: no doc-facing changes"
deliver__resolve-scope: '{"errors":"false"}'
deliver__match-discoveries: { matches: [] }
deliver__file-discoveries: '{"records":[]}'
fixture:
  expect: completed
  resolved-text-contains:
    triage__triage: "target):\n\n\n\nThe operator's request"
exec-code: true
deliver__gate-ready: '{"gate":"ready"}'
deliver__impl__assert-changed: "2 files changed"
deliver__gate-green: '{"gate":"green","red_cause":"","stage":"The implementation","summary":"","head":null}'
deliver__publish-pr-body: {}
deliver__ci: { state: green, summary: "stub: every check that gates a merge passed", evidence: "stub: gh pr checks on the head commit" }
deliver__flip-ready: { pr_url: "https://github.com/example/repo/pull/4" }
deliver__outcome: { ready: true, pr_url: "https://github.com/example/repo/pull/4", summary: "https://github.com/example/repo/pull/4" }
deliver__pr__prepare: { repo: { host: "github.com", path: "example/repo" }, head_repo: { host: "github.com", path: "example/repo" }, head: "fixture-branch", base: "dev", existing: null, title: "stub: title", body: { type: archon_artifact, run_id: "fixture-run", path: "pr-body.md" }, conflicts: [], summary: "stub: the base had not moved" }
deliver__pr__synced: { recorded: true }
deliver__pr__publish: { schemaVersion: 1, repo: { host: "github.com", path: "example/repo" }, number: 4, url: "https://github.com/example/repo/pull/4", head: "fixture-branch", base: "dev", is_draft: true, state: "open", head_repo: { host: "github.com", path: "example/repo" }, head_revision: "fixturehead", base_revision: "fixturebase", maintainer_can_modify: null }
deliver__review__mode: '{"continuation":false,"head":"fixturehead","cursor":"","risks":"fixture-owned-policy"}'
deliver__review__coverage: { full: true, errors: false, docs: false, lenses: [seams, code, tests, simplify] }
deliver__review__scope:
  # PR diff in scope; head sha stubbed
  docs: false
  pr: { repo: { host: "github.com", path: "example/repo" }, number: 4 }
deliver__review__code: "0 findings"
deliver__review__simplify__simplify: { findings: false }
deliver__review__simplify__prune-scratch: "prune-scratch: removed 0 scratch worktree(s)"
deliver__review__seams: "0 findings"
deliver__shape__simplify: { findings: false }
deliver__shape__prune-scratch: "prune-scratch: removed 0 scratch worktree(s)"
deliver__review__tests: "0 findings"
deliver__review__review-complete: "settled"
