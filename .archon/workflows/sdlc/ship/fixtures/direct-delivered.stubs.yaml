# Sparse dry-run fixture: `target` takes its empty default. The current-truth check
# proves the work item is already implementation-ready, so planning and investigation
# stay skipped. The run delivers part 1 of a plan, and the review's mode script is
# unstubbed, so the part assignment must reach the review's scope through deliver.
# Run with --default-stubs --exec-code.
#
# Both outcomes are deliberately unstubbed: the real scripts run and must report the
# pull request from the rounds' typed result alone. The exec workspace is a DETACHED
# worktree, so there is no current branch for an ambient pull request lookup to
# resolve — a pass here is proof the report is built from the delivered value and nothing
# the checkout happens to be sitting on.
