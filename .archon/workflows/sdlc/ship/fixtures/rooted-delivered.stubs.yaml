# Dry-run fixture: a bound target takes the full investigation chain — rooted
# investigation flows through the spend gate into the delivery tail, initial
# review ready, PR flips. SPARSE:
# the dry-run engine auto-defaults every node it can and names the ones it
# cannot; this file stubs exactly those plus the verdict fields that steer
# branches. Structured stubs are YAML mappings (they hydrate structuredOutput).
# Run with --default-stubs --exec-code.
#
# `outcome` is deliberately unstubbed: the real script runs and must report pull
# request 2 from the delivered flip value alone. The exec workspace is a DETACHED
# worktree, so there is no current branch for an ambient pull request lookup to
# resolve — a pass here is proof the report is built from the delivered value and nothing
# the checkout happens to be sitting on.
triage__triage:
  contract: READY
  route: investigate
  design_first: false
  complexity: risky
  item: { repository: "", number: 0 }
  area_labels: []
  proposed_edits: { title: "", body: "" }
  blocked_reason: ""
  blocked_by: []
  summary: "stub: current evidence leaves the causal chain unresolved"
  report: { type: archon_artifact, run_id: "fixture-run", path: "triage.md" }
inv__investigate:
  rooted: true
  summary: "stub: cause established — report at investigation.md"
  report: { type: archon_artifact, run_id: "fixture-run", path: "investigation.md" }
gate-rooted: '{"gate":"rooted"}'
deliver__gate-validated: '{"gate":"green","red_cause":"","stage":"The project gate","summary":""}'
deliver__impl__assert-changed: "3 files changed"
deliver__gate-green: '{"gate":"green","red_cause":"","stage":"The implementation","summary":""}'
deliver__pr__pr: { intent: "/fixture/pr-intent.json" }
deliver__pr__publish: { schemaVersion: 1, repo: { host: "github.com", path: "example/repo" }, number: 2, url: "https://github.com/example/repo/pull/2", head: "fixture-branch", base: "dev", is_draft: true, state: "open", head_repo: { host: "github.com", path: "example/repo" }, head_revision: "fixturehead", base_revision: "fixturebase", maintainer_can_modify: null }
ci-probe: '{"state":"concluded","detail":"all checks passed"}'
deliver__ci-verdict: '{"state":"concluded","detail":"all checks green"}'
deliver__flip-ready: { pr_url: "https://github.com/example/repo/pull/2" }
deliver__outcome: { pr_url: "https://github.com/example/repo/pull/2", summary: "https://github.com/example/repo/pull/2" }
deliver__validate__discover: { checks: [{ name: "project gate", argv: ["stub-gate"] }], quarantine: [], notes: "stub: the project's aggregate gate" }
deliver__validate__run: { status: green, summary: "stub: project gate green" }
deliver__impl__implement:
  done: true
  green: true
  red_cause: ""
  summary: "stub: fix built per the investigation, checks green"
deliver__review__mode: '{"continuation":false}'
deliver__review__scope:
  # PR diff in scope; head sha stubbed
  docs: false
  pr: { repo: { host: "github.com", path: "example/repo" }, number: 2 }
deliver__review__code: "0 findings"
deliver__review__seams: "0 findings"
deliver__shape__simplify: { findings: false }
deliver__review__tests: "0 findings"
deliver__review__review-complete: "settled"
deliver__review__synthesize:
  ready: true
  action: none
  findings_summary: "stub: no open findings"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
deliver__review__publish:
  ready: true
  action: none
  findings_summary: "stub: no open findings"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
deliver__gate-ready: '{"ready":"true"}'
deliver__classify:
  tier: full
  errors: false
  docs: false
  reasons:
    tier: "stub: touches persisted state"
    errors: "stub: no failure paths"
    docs: "stub: no doc-facing changes"
deliver__resolve-scope: '{"errors":"false","simplify":"false"}'
deliver__polish-scope: '{"polish":false}'
deliver__file-discoveries: '{"issues":[]}'
deliver__fork: '{"fork":true}'
fixture:
  expect: completed
  inputs:
    target: "issue #3031"
  resolved-text-contains:
    triage__triage: "target):\n\nissue #3031\n\nThe operator's request"
exec-code: true
