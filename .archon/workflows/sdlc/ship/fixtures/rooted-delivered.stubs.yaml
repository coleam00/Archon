# Dry-run fixture: a bound target takes the full investigation chain — rooted
# investigation flows through the spend gate into the delivery tail, initial
# review ready, PR flips. SPARSE:
# the dry-run engine auto-defaults every node it can and names the ones it
# cannot; this file stubs exactly those plus the verdict fields that steer
# branches. Structured stubs are YAML mappings (they hydrate structuredOutput).
# Run with --default-stubs --exec-code.
#
# `outcome` is deliberately unstubbed: the real script runs and must report pull
# request 2 from the confirmed ready value alone. The exec workspace is a DETACHED
# worktree, so there is no current branch for an ambient pull request lookup to
# resolve — a pass here is proof the report is built from the delivered value and nothing
# the checkout happens to be sitting on.
triage__triage:
  decision: { contract: READY, route: investigate, design_first: false }
  complexity: risky
  item: { repository: "", number: 0 }
  area_labels: []
  summary: "stub: current evidence leaves the causal chain unresolved"
  report: { type: archon_artifact, run_id: "fixture-run", path: "triage.md" }
inv__investigate:
  verdict: rooted
  summary: "stub: cause established — report at investigation.md"
  report: { type: archon_artifact, run_id: "fixture-run", path: "investigation.md" }
gate-rooted: '{"gate":"rooted"}'
deliver__gate-validated: '{"gate":"green","red_cause":"","stage":"The project gate","summary":"","head":null}'
deliver__impl__assert-changed: "3 files changed"
deliver__gate-green: '{"gate":"green","red_cause":"","stage":"The implementation","summary":"","head":null}'
