# Dry-run fixture: the guard seen RED (run with --default-stubs --exec-code).
#
# Delivery hands back a flip value that does not satisfy the flip's declared result
# contract, and the run fails at the flip — nothing downstream is given the chance to
# build a report from it. flip-ready declares `output_format: { pr_url }`, so its
# stdout is a contract the engine certifies rather than a convention a reader hopes
# for, and a stub standing in for that stdout is held to the same contract. Two
# hand-written copies of a URL sniffer used to do this job at the two composing tails,
# one whole node later.
#
# The pr node's record below stays deliberately COMPLETE, url included, as the record
# a tail must not fall back on. It no longer catches a fallback on its own: with the
# flip failed, every consumer is skipped and never reads anything. What keeps that
# honest is the flip's own contract being the only source of the delivered value —
# `deliver/scripts/outcome.ts` and both composing tails bind `pr_url` and nothing else.
triage__triage:
  contract: READY
  route: deliver
  design_first: false
  complexity: small
  item: { repository: "", number: 0 }
  area_labels: []
  proposed_edits: { title: "", body: "" }
  blocked_reason: ""
  blocked_by: []
  summary: "stub: current code confirms a complete work order"
  report: { type: archon_artifact, run_id: "fixture-run", path: "triage.md" }
gate-direct: '{"gate":"direct"}'
deliver__impl__record-start: '{"start":"recorded"}'
deliver__impl__implement:
  done: true
  green: true
  red_cause: ""
  summary: "stub: direct work implemented and green"
deliver__impl__assert-changed: "2 files changed"
