# Dry-run fixture: the guard seen RED (run with --default-stubs --exec-code).
#
# Delivery hands back a flip value that does not satisfy the flip's declared
# result contract, and no terminal report is built from it — the run fails instead
# of printing garbage under a completed one. The pr node's record below is
# deliberately COMPLETE, url included: the report must be built from the flip's
# read-back value and nothing else, so a perfect record must not rescue an
# unusable flip. If a future change quietly reads the record again, this fixture
# goes green-to-red the other way and catches it.
#
# The refusal lands at the flip itself now, where a real run enforces it too.
# flip-ready declares `output_format: { pr_url }`, so its stdout is a contract the
# engine certifies rather than a convention a reader hopes for — and a stub that
# stands in for that stdout is held to the same contract. Two hand-written copies of
# a URL sniffer used to do this job at the two composing tails, one whole node later.
triage__triage:
  route: deliver
  summary: "stub: current code confirms a complete work order"
  report: { type: archon_artifact, run_id: "fixture-run", path: "triage.md" }
gate-direct: '{"gate":"direct"}'
deliver__impl__record-start: '{"start":"recorded"}'
deliver__impl__implement:
  done: true
  green: true
  red_cause: ""
  summary: "stub: direct work implemented and green"
deliver__impl__assert-changed: "2 files changed"
deliver__gate-green: '{"gate":"green"}'
deliver__pr__pr: { repo: { host: "github.com", path: "example/repo" }, number: 5, url: "https://github.com/example/repo/pull/5", head: "fixture-branch", base: "dev", is_draft: true }
deliver__classify:
  errors: false
  docs: false
  reasons:
    errors: "stub: no failure paths"
    docs: "stub: no doc-facing changes"
deliver__resolve-scope: '{"errors":"false"}'
deliver__review__mode: '{"continuation":false}'
deliver__review__scope:
  # PR diff in scope; head sha stubbed
  docs: false
deliver__review__code: "0 findings"
deliver__review__seams: "0 findings"
deliver__review__simplify: "0 findings"
deliver__review__tests: "0 findings"
deliver__review__review-complete: "settled"
deliver__review__synthesize:
  ready: true
  action: none
  findings_summary: "stub: no open findings"
deliver__review-action: '{"ready":true,"action":"none"}'
deliver__gate-ready: '{"gate":"ready"}'
deliver__validate__validate:
  green: true
  red_cause: ""
  summary: "stub: project gate green"
deliver__gate-validated: '{"gate":"green"}'
ci-probe: '{"state":"concluded","detail":"all checks green"}'
# The mutation: the flip printed something that is not a URL.
deliver__ci-verdict: '{"state":"concluded","detail":"all checks green"}'
deliver__flip-ready: "flip printed something that is not a pull request URL"
fixture:
  expect: failed
  fail-node: deliver__flip-ready
exec-code: true
