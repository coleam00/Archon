# Dry-run fixture: the guard seen RED (run with --default-stubs --exec-code).
#
# Delivery hands back a ready URL that does not satisfy confirm-ready's declared
# result contract, and the run fails there — nothing downstream is given the chance
# to build a report from it. confirm-ready, deliver's returns node, declares
# `output_format: { pr_url }`, so its stdout is a contract the engine certifies
# rather than a convention a reader hopes for, and a stub standing in for that
# stdout is held to the same contract. Two
# hand-written copies of a URL sniffer used to do this job at the two composing tails,
# one whole node later.
#
# The pr node's record below stays deliberately COMPLETE, url included, as the record
# a tail must not fall back on. It no longer catches a fallback on its own: with the
# confirmation failed, every consumer is skipped and never reads anything. What keeps
# that honest is confirm-ready's contract being the only source of the delivered value —
# `deliver/scripts/outcome.ts` and both composing tails bind `pr_url` and nothing else.
