name: archon-validate
description: |
  Discover and run the project's own checks — types, lint, tests, build,
  whatever the repository itself defines — and report a structured verdict.
  Judges nothing and fixes nothing: it runs what the project declares and
  tells the truth about the result.

  Use when: the current state of the checkout needs a validation verdict —
  "run the checks", "is this green", "validate this".
  NOT for: fixing failures (implement) or reviewing code (review).

model: medium

inputs:
  scope:
    default: ""
    description: >-
      Optional narrowing — a package, directory, or named check to focus on.
      Empty means the project's full applicable gate.

  context:
    default: ""
    description: >-
      Optional nonsecret identity for external validation state that the tracked
      tree cannot measure (a database snapshot, a service version). Changing it
      requires fresh validation. Never a secret.

  comparison:
    default: ""
    description: >-
      Optional path to a composition request JSON: pinned original_base/base/head,
      change/base_changes, merge method and the project check argv/environment identity.
      Runs that exact gate on separate and composed trees without an agent.

returns: result
outcome_field: green

nodes:
  - id: mode
    script: mode
    runtime: bun
    with:
      comparison: "$INPUTS.comparison"
    output_format:
      type: object
      properties:
        comparison: { type: boolean }
      required: [comparison]

  - id: compare
    script: compare
    runtime: bun
    always_run: true
    depends_on: [mode]
    when: "$mode.output.comparison == true"
    with:
      comparison: "$INPUTS.comparison"
    output_format:
      type: object
      properties:
        green: { type: boolean }
        red_cause:
          type: string
          enum: [introduced, inherited, environment, interaction, incomplete, ""]
        summary: { type: string }
        evidence:
          anyOf:
            - type: "null"
            - type: object
              properties:
                type: { type: string, enum: [archon_artifact] }
                run_id: { type: string }
                path: { type: string }
              required: [type, run_id, path]
      required: [green, red_cause, summary, evidence]

  # A run that reaches validation again after a pause (an approval, a CI wait, an
  # operator's resume) reuses the verdict it already reached when nothing that
  # verdict measured has changed: the tracked tree, scope, context, this validator's
  # own sources and the recorded report. Decided on every pass, never cached, and
  # only a green verdict with performed checks is ever reused. The rules are in
  # .shared/validation-evidence.ts.
  - id: applicability
    script: applicability
    runtime: bun
    depends_on: [mode]
    when: "$mode.output.comparison == false"
    always_run: true
    mutates_checkout: false
    with:
      scope: "$INPUTS.scope"
      context: "$INPUTS.context"
    output_format:
      type: object
      properties:
        fingerprint: { type: string }
        scope: { type: string }
        context: { type: string }
        validator: { type: string }
        generation: { type: integer }
        reason: { type: string }
        nonce: { type: string }
        reuse: { type: boolean }
      required: [fingerprint, scope, context, validator, generation, reason, nonce, reuse]

  # Ordinary validation is three nodes. Finding the gate is judgement, so an agent
  # does it. Running the gate is computation, so a script does it: an agent's
  # shell tool has a per-call time limit that a project's gate can outlast, and a
  # script node runs for as long as its own `timeout:` allows. Judging why a
  # check failed is judgement again, so only a red run reaches an agent.
  - id: discover
    command: discover-checks
    depends_on: [applicability]
    when: "$applicability.output.reuse == false"
    always_run: true
    output_format:
      type: object
      properties:
        # The commands to run, in order. Each is an argv, never a shell string;
        # a check that needs a shell names one as its first element.
        checks:
          type: array
          items:
            type: object
            properties:
              name: { type: string }
              argv:
                type: array
                items: { type: string }
                minItems: 1
            required: [name, argv]
        notes: { type: string }
      required: [checks, notes]

  # Runs the declared checks and records every exit status in
  # `$ARTIFACTS_DIR/validation.md`. Green and "didn't finish" are read from those
  # exit statuses, never from a clock. The timeout is sized for a slow gate on a
  # loaded machine. When it stops the gate anyway, the node is skipped and
  # `result` reports `incomplete`.
  - id: run
    script: run-checks
    runtime: bun
    depends_on: [discover]
    always_run: true
    timeout: 7200000
    on_timeout: skip
    with:
      discovery: "$discover.output"
    output_format:
      type: object
      properties:
        status: { type: string, enum: [green, red, incomplete] }
        summary: { type: string }
      required: [status, summary]

  - id: classify
    command: classify-red
    depends_on: [run]
    when: "$run.output.status == 'red'"
    output_format:
      type: object
      properties:
        red_cause:
          type: string
          enum: [introduced, inherited, environment]
        summary: { type: string }
      required: [red_cause, summary]

  # The one verdict. A fresh ordinary verdict is recorded here as evidence, with
  # the report it came with; a reuse decision selects the recorded one instead.
  - id: result
    script: result
    runtime: bun
    # `discover` keeps this join eligible when the timeout skipped `run`, and
    # `applicability` when a reuse skipped every producer.
    depends_on: [compare, applicability, discover, run, classify]
    trigger_rule: none_failed_min_one_success
    mutates_checkout: false
    with:
      scope: "$INPUTS.scope"
      context: "$INPUTS.context"
      comparison: { from: "$compare.output", if_skipped: null }
      applicability: { from: "$applicability.output", if_skipped: null }
      discovery: { from: "$discover.output", if_skipped: null }
      run: { from: "$run.output", if_skipped: null }
      classification: { from: "$classify.output", if_skipped: null }
    output_type: validation
    output_format:
      type: object
      properties:
        green: { type: boolean }
        # True only when at least one project check ran to an exit status the
        # verdict rests on. A project with no checks is green without any; a gate
        # that did not finish performed none.
        checks_performed: { type: boolean }
        red_cause:
          type: string
          enum: [introduced, inherited, environment, interaction, incomplete, ""]
        summary: { type: string }
        evidence:
          anyOf:
            - type: "null"
            - type: object
              properties:
                type: { type: string, enum: [archon_artifact] }
                run_id: { type: string }
                path: { type: string }
              required: [type, run_id, path]
      required: [green, checks_performed, red_cause, summary, evidence]
