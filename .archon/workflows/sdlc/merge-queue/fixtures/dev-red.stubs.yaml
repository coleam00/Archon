# Dry-run fixture, a red default branch: the sweep finds the default branch's CI red in
# code a recent merge touched, so it merges nothing and the run's one attention item
# is the red branch. Its one choice holds merges until the branch is green, which every
# later sweep reads from the forge. The queue's scripts are stubbed here and proved by
# .archon/scripts/__tests__/merge-queue.test.ts.
facts:
  path: sweep
  base: { branch: dev, head: "2222222", checks: { state: red, failing: [unit], pending: [] } }
  items:
    - item: { repo: { host: "github.com", path: "example/repo" }, number: 7 }
      pr: { repo: { host: "github.com", path: "example/repo" }, number: 42 }
      url: "https://github.com/example/repo/pull/42"
      facts: { state: open, head_revision: "1111111", mergeable: clean, checks: { state: green }, threads: { unresolved: 0 }, verdict: { state: ready, reviewed: "1111111" } }
      record: null
  settled: []
  gate: "'bun' '/stub/gate.ts' '--method' 'squash'"
  policy_defaults: "/stub/policy"
sweep:
  decisions:
    - { number: 42, action: wait, class: clear, head: "1111111", reran: false, reason: "stub: dev is red, so nothing merges", brief: "", attention: null }
  dev:
    summary: "stub: the unit job fails in a file PR 41 changed"
    attention:
      what: "stub: dev CI is red since PR 41 merged"
      why: "stub: every merge waits while it is red"
      recommendation: { choice: hold, why: "stub: revert PR 41", evidence: "stub: the failing job's log", confidence: high, would_change: "stub: a green rerun" }
      choices:
        - { id: hold, label: "stub: hold merges", does: "stub: merges nothing until dev is green", effect: hold, ruling: "" }
      if_unanswered: "stub: the queue merges nothing while dev is red"
      links: ["https://github.com/example/repo/actions/runs/1"]
  summary: "stub: dev is red; merged nothing"
record:
  merged: []
  summary: "stub: dev is red; merged nothing"
  attention: "stub: the attention message"
  options: [{ id: hold, label: "stub: hold merges" }]
  class: dev
  asked: { by: dev, attention: {} }
ask: { decision: hold, text: "" }
ruling:
  decision: hold
  section: ""
  summary: "stub: the queue holds merges while dev is red"
fixture:
  inputs: { repo_host: github.com, repo_path: example/repo }
  expect: completed
  reached: [facts, sweep, record, ask, ruling]
exec-code: true
