# Dry-run fixture, red default branch after a batch: the sweep merged a pull request,
# the default branch's CI went red in code the batch touched, so the run's one
# attention item is the red branch. Its one choice holds merges until the branch is
# green, which every later sweep reads from the forge. The queue's scripts are stubbed
# here and proved by .archon/scripts/__tests__/merge-queue.test.ts.
facts:
  path: sweep
  base: { branch: dev, head: "2222222", checks: { state: green, failing: [], pending: [] } }
  items:
    - item: { repo: { host: "github.com", path: "example/repo" }, number: 7 }
      pr: { repo: { host: "github.com", path: "example/repo" }, number: 42 }
      url: "https://github.com/example/repo/pull/42"
      facts: { state: open, head_revision: "1111111", mergeable: clean, checks: { state: green }, threads: { unresolved: 0 }, verdict: { state: ready, reviewed: "1111111" } }
      record: null
      prior_report: "/stub/merge/42/review/report.md"
      recorded: null
  settled: []
  gate: "'bun' '/stub/gate.ts' '--method' 'squash'"
  policy_defaults: "/stub/policy"
sweep:
  decisions:
    - { number: 42, action: merged, class: clear, head: "1111111", synced: false, reran: false, reason: "stub: a small feature; the gate passed", brief: "", attention: null }
  review_url: ""
  review_prior: ""
  dev:
    state: red
    rerun: none
    summary: "stub: the unit job fails in a file PR 42 changed"
    attention:
      what: "stub: dev CI is red after merging PR 42"
      why: "stub: every merge waits while it is red"
      recommendation: { choice: hold, why: "stub: revert PR 42", evidence: "stub: the failing job's log", confidence: high, would_change: "stub: a green rerun" }
      choices:
        - { id: hold, label: "stub: hold merges", does: "stub: merges nothing until dev is green", effect: hold, ruling: "" }
      if_unanswered: "stub: the queue merges nothing while dev is red"
      links: ["https://github.com/example/repo/actions/runs/1"]
  summary: "stub: merged PR 42; dev went red"
record:
  merged: [42]
  summary: "stub: merged PR 42; dev went red"
  attention: "stub: the attention message"
  options: [{ id: hold, label: "stub: hold merges" }]
  class: dev
  asked: { by: dev, attention: {} }
  evaluation: null
ask: { decision: hold, text: "" }
ruling:
  decision: hold
  section: ""
  summary: "stub: the queue holds merges while dev is red"
fixture:
  inputs: { repo_host: github.com, repo_path: example/repo }
  expect: completed
  reached: [facts, sweep, record, ask, ruling]
exec-code: true
