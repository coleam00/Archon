# Dry-run fixture, a clear auto-merge: a small bug fix whose gate passes. The sweep
# merges it through the gate, the default branch is green, and nothing is asked.
# The queue's scripts reach the state store and the forge, so they are stubbed here
# and proved by .archon/scripts/__tests__/merge-queue.test.ts.
facts:
  path: sweep
  base: { branch: dev, head: "2222222", checks: { state: green, failing: [], pending: [] } }
  base_error: ""
  items:
    - item: { repo: { host: "github.com", path: "example/repo" }, number: 7 }
      pr: { repo: { host: "github.com", path: "example/repo" }, number: 42 }
      url: "https://github.com/example/repo/pull/42"
      facts: { state: open, head_revision: "1111111", mergeable: clean, checks: { state: green }, threads: { unresolved: 0 }, verdict: { state: ready, reviewed: "1111111" } }
      record: null
  settled: []
  gate: "'bun' '/stub/gate.ts' '--method' 'squash'"
  policy_defaults: "/stub/policy"
sweep:
  decisions:
    - { number: 42, action: merged, class: clear, head: "1111111", reran: false, reason: "stub: a bug fix with its test; the gate passed", brief: "", attention: null }
  base: { summary: "stub: dev is green", reran: false, attention: null }
  summary: "stub: merged PR 42"
record:
  merged: [42]
  summary: "stub: merged PR 42"
  attention: ""
  options: []
  class: ""
  asked: null
retriage:
  retriaged: [7]
  summary: "stub: Sent 1 of 1 merged issue(s) back to intake."
fixture:
  inputs: { repo_host: github.com, repo_path: example/repo }
  expect: completed
  reached: [facts, sweep, record, retriage]
exec-code: true
