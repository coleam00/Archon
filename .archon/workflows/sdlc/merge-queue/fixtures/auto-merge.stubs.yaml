      pr: { repo: { host: "github.com", path: "example/repo" }, number: 42 }
      url: "https://github.com/example/repo/pull/42"
      facts:
        pr: { repo: { host: "github.com", path: "example/repo" }, number: 42 }
        url: "https://github.com/example/repo/pull/42"
        title: "stub: fix the thing"
        state: open
        is_draft: false
        base: dev
        default_branch: dev
        default_head: "2222222"
        behind: 0
        head: feature
        head_revision: "1111111"
        merge_commit: null
        mergeable: clean
        checks: { state: green, failing: [], pending: [] }
        threads: { unresolved: 0, urls: [] }
