  summary: "stub: merged PR 42"
  attention: ""
  options: []
  recommendation: null
  class: ""
  asked: null
retriage:
  retriaged: [7]
  summary: "stub: Sent 1 of 1 merged issue(s) back to intake."
fixture:
  inputs: { repo_host: github.com, repo_path: example/repo }
  expect: completed
