# Dry-run fixture, a clear auto-merge: a small bug fix whose gate passes. The sweep
# merges it through the gate, the default branch is green, and nothing is asked.
# The queue's scripts reach the state store and the forge, so they are stubbed here
# and proved by .archon/scripts/__tests__/merge-queue.test.ts.
facts:
  path: sweep
  base: { branch: dev, head: "2222222", checks: { state: green, failing: [], pending: [] } }
  base_error: ""
  items:
