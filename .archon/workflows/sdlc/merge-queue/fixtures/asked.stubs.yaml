# Dry-run fixture, an unclear pull request: the run ends `asked` with the judge's question
# and the stage's three fixed options left on the item, and no wait. The answer starts the
# stage again.
facts:
  path: judge
  item: { repo: { host: "github.com", path: "example/repo" }, number: 7 }
  pr: { repo: { host: "github.com", path: "example/repo" }, number: 1 }
  url: "https://github.com/example/repo/pull/1"
  facts: null
  base: null
  record: null
  validation: null
  protected: []
  lane: auto
  ci: forge
  answer: null
  settled: null
judge:
  decision:
    action: ask
    class: unclear
    head: "1111111111111111111111111111111111111111"
    reran: false
    reason: "stub: it changes a stored format"
    brief: "stub-brief: split the migration out of pull request 1"
    ask:
      question: &question "Pull request 1 changes the stored run format: merge it as it is?"
      context: &context "stub: Older binaries read the same rows. I would send it back to split the migration out. https://github.com/example/repo/pull/1"
      recommendation: &recommendation { option: return, why: "The format change has no ruling." }
  base: "stub: dev is green"
settle:
  outcome: asked
  summary: "stub: PR 1: ask (unclear); it changes a stored format"
  number: 7
  head: "1111111111111111111111111111111111111111"
  brief: "stub-brief: split the migration out of pull request 1"
  asks:
    - question: *question
      context: *context
      options:
        - { id: merge, does: "stub: approves it at this head; the stage runs again and merges it.", cost: "stub: it lands as it is." }
        - { id: return, does: "stub: the build queue's next round starts with the answer's words.", cost: "stub: one more round." }
        - { id: park, does: "stub: nothing starts.", cost: "stub: it does not land." }
      recommendation: *recommendation
      artifacts: []
  waits: []
fixture:
  inputs: { repo_host: github.com, repo_path: example/repo }
  expect: completed
  authored: asked
  reached: [facts, judge, settle]
