# Dry-run fixture, a conflict: the pull request conflicts with the default branch. The
# queue never pushes, so it goes back to the build queue with a brief to merge the
# default branch in and resolve the conflict, and its next round brings it back Ready.
# The queue's scripts are stubbed here and proved by
# .archon/scripts/__tests__/merge-queue.test.ts.
facts:
  path: sweep
  base: { branch: dev, head: "2222222", checks: { state: green, failing: [], pending: [] } }
  items:
    - item: { repo: { host: "github.com", path: "example/repo" }, number: 7 }
      pr: { repo: { host: "github.com", path: "example/repo" }, number: 42 }
      url: "https://github.com/example/repo/pull/42"
      facts: { state: open, head_revision: "1111111", mergeable: conflict, checks: { state: green }, threads: { unresolved: 0 }, verdict: { state: ready, reviewed: "1111111" } }
      record: null
  settled: []
  gate: "'bun' '/stub/gate.ts' '--method' 'squash'"
  policy_defaults: "/stub/policy"
sweep:
  decisions:
    - { number: 42, action: return, class: clear, head: "1111111", reran: false, reason: "stub: it conflicts with dev in one file", brief: "stub: merge dev into PR 42 and resolve the conflict in src/a.ts", attention: null }
  base: { summary: "stub: dev is green", reran: false, attention: null }
  summary: "stub: sent PR 42 back for its conflict"
record:
  merged: []
  summary: "stub: PR 42 went back to the build queue"
  attention: ""
  options: []
  class: ""
  asked: null
fixture:
  inputs: { repo_host: github.com, repo_path: example/repo }
  expect: completed
  reached: [facts, sweep, record]
exec-code: true
