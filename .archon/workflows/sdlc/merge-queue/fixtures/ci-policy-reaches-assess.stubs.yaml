# Dry-run fixture: the scripted required-check policy runs first, its output is what
# the assess agent is told (it must not re-derive CI policy), and the gate receives
# the same output. A declared policy with a passing check reaches the merge.
ci-policy:
  requirement: "required"
  source: "declared"
  checks: ["tests"]
  checks_state: "passing"
  results:
    - pr: "https://github.com/example/app/pull/7"
      head_sha: "0123456789abcdef0123456789abcdef01234567"
      check: "tests"
      state: "passing"
  reason: ""
path-policy:
  state: "not_applicable"
  patterns: []
  heads: []
  matches: []
  reason: ""
assess:
  summary: "stub: batch eligible"
  eligible: true
  method: "squash"
  validation_verified: true
  review_verified: true
  plan_digest: "fixture"
  holds: []
publish-holds:
  published: false
  updated: []
  summary: "stub: nothing to publish"
gate:
  ready: true
  summary: "stub: gate ready"
  method: "squash"
  plan_digest: "fixture"
refresh:
  authorized: true
  repository: "example/app"
  number: 7
  head_sha: "0123456789abcdef0123456789abcdef01234567"
  method: "squash"
  summary: "stub: fresh facts pass"
execute:
  done: true
  merged: true
  urls: ["https://github.com/example/app/pull/7"]
  queued: []
  prior_base_sha: "fixture-base"
  summary: "stub: merged"
fixture:
  expect: completed
  reached: [ci-policy, assess, gate, execute]
  resolved-text-contains:
    assess: '"checks":["tests"]'
  inputs:
    prs: '["https://github.com/example/app/pull/7"]'
    mode: "auto"
    merge_method: "squash"
    required_checks: "tests"
