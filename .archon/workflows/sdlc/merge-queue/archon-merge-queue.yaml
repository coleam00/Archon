name: archon-merge-queue
description: |
  The merge queue: merges the pull requests the build queue finished, and stops only
  for decisions that belong to a person. Each run claims every waiting item with
  intake's claim, up to limit. One sweep agent decides each pull request and merges
  what policy allows, one at a time, through a gate script that refuses unless the
  trusted review verdict says Ready at the head, CI is green there, the head contains
  the default branch or merges into it cleanly, and the default branch's CI is not
  red, and merges pinned to that head. The queue never pushes and never waits for CI:
  a conflict, a stale verdict or red the change caused goes back to the build queue,
  and the default branch's CI after a merge is the next sweep's first fact. A clear
  case acts on its own by default; each question waits in an independent child run.

  Use when: a trigger binding the operator installed starts it (see the SDLC pack
  README, "Merge queue").
  NOT for: delivering or fixing a pull request (archon-build-queue, archon-ship), or
  reviewing one by hand (archon-review).

requires: [github]

inputs:
  auto_merge_queue:
    default: 'true'
    description: Whether the queue acts without a maintainer answer. Accepts true or false.
  repo_host:
    description: The forge host of the repository whose pull requests the queue merges.
  repo_path:
    description: The owner/name path of that repository.
  limit:
    default: "10"
    description: The most items one run claims.
  merge_method:
    default: "squash"
    description: How the gate merges, squash or merge.
  retriage_as:
    default: ""
    description: >-
      The maintainer login a merged item's re-triage is requested as. Set, an issue
      still open after its pull request merged gets archon-triage and an intake run
      with that label event. Empty re-triages nothing.

returns: record

# Read-only: runs in the launch checkout beside any other run, and creates no worktree.
worktree:
  enabled: false
mutates_checkout: false

nodes:
  - id: facts
    script: facts
    runtime: bun
    output_format:
      type: object
      properties:
        path: { type: string, enum: [idle, record, sweep] }
        # The default branch snapshot, or null with its diagnostic in base_error.
        base: { type: [object, 'null'] }
        base_error: { type: string }
        # The claimed pull requests the sweep decides, each with its facts snapshot.
        items: { type: array, items: { type: object } }
        # Claimed items settled without the sweep: merged or closed already, or no pull request.
        settled: { type: array, items: { type: object } }
        # The gate command the sweep runs to merge.
        gate: { type: string }
        policy_defaults: { type: string }
      required: [path, base, base_error, items, settled, gate, policy_defaults]

  - id: sweep
    command: sweep
    depends_on: [facts]
    when: "$facts.output.path == 'sweep'"
    model: large
    with:
      policy_defaults: "$facts.output.policy_defaults"
      base: { from: "$facts.output.base" }
      items: { from: "$facts.output.items" }
      gate: "$facts.output.gate"
      auto_merge_queue: "$INPUTS.auto_merge_queue"
    output_format:
      type: object
      properties:
        decisions:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              number: { type: integer, minimum: 1 }
              action: { type: string, enum: [merged, return, ask, wait] }
              class: { type: string, enum: [clear, unclear] }
              # The head the decision is about.
              head: { type: string, pattern: '^[0-9a-f]{7,64}$' }
              reran: { type: boolean }
              reason: { type: string, pattern: '\S' }
              # On return, what the build queue's next round starts from; on ask, what a
              # return choice launches. Empty otherwise.
              brief: { type: string }
              attention:
                type: [object, 'null']
                additionalProperties: false
                properties:
                  what: { type: string, pattern: '\S' }
                  why: { type: string, pattern: '\S' }
                  recommendation: &recommendation
                    type: object
                    additionalProperties: false
                    properties:
                      choice: { type: string }
                      why: { type: string, pattern: '\S' }
                      evidence: { type: string, pattern: '\S' }
                      confidence: { type: string, enum: [low, medium, high] }
                      would_change: { type: string, pattern: '\S' }
                    required: [choice, why, evidence, confidence, would_change]
                  choices:
                    type: array
                    minItems: 1
                    items:
                      type: object
                      additionalProperties: false
                      properties:
                        id: &choice_id { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
                        label: &choice_label { type: string, pattern: '\S' }
                        does: &choice_does { type: string, pattern: '\S' }
                        effect: { type: string, enum: [merge, return, park] }
                        ruling: { type: string }
                      required: [id, label, does, effect, ruling]
                  if_unanswered: &if_unanswered { type: string, pattern: '\S' }
                  links: &links { type: array, items: { type: string } }
                required: [what, why, recommendation, choices, if_unanswered, links]
            required: [number, action, class, head, reran, reason, brief, attention]
        # The default branch as the sweep found it; an attention item only when its red holds merges.
        base:
          type: object
          additionalProperties: false
          properties:
            summary: { type: string }
            # True when the sweep re-ran the default branch's failed jobs this run.
            reran: { type: boolean }
            attention:
              type: [object, 'null']
              additionalProperties: false
              properties:
                what: { type: string, pattern: '\S' }
                why: { type: string, pattern: '\S' }
                recommendation: *recommendation
                choices:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      id: *choice_id
                      label: *choice_label
                      does: *choice_does
                      effect: { type: string, enum: [hold] }
                      ruling: { type: string }
                    required: [id, label, does, effect, ruling]
                if_unanswered: *if_unanswered
                links: *links
              required: [what, why, recommendation, choices, if_unanswered, links]
          required: [summary, reran, attention]
        summary: { type: string }
      required: [decisions, base, summary]

  # Checks the decisions, reads back every pull request and records one decision per
  # item; returns every eligible question. It also runs when no sweep was due.
  - id: record
    script: record
    runtime: bun
    depends_on: [facts, sweep]
    trigger_rule: none_failed_min_one_success
    with:
      path: "$facts.output.path"
      base_error: "$facts.output.base_error"
      items: { from: "$facts.output.items" }
      settled: { from: "$facts.output.settled" }
      base: { from: "$facts.output.base" }
      sweep: { from: "$sweep.output", if_skipped: null }
    output_format:
      type: object
      properties:
        merged: { type: array, items: { type: integer } }
        summary: { type: string }
        asks: { type: array, items: { type: object } }
      required: [merged, summary, asks]

  # An issue its merged pull request left open (`Refs #N`) goes back to intake, the
  # judge of whether the work is delivered. Writes nothing on the work item.
  - id: retriage
    script: retriage
    runtime: bun
    depends_on: [facts, record]
    with:
      items: { from: "$facts.output.items" }
      settled: { from: "$facts.output.settled" }
      merged: { from: "$record.output.merged" }
    output_format:
      type: object
      properties:
        retriaged: { type: array, items: { type: integer } }
        summary: { type: string }
      required: [retriaged, summary]

  - id: questions
    depends_on: [record]
    workflow: archon-merge-question
    with:
      limit: "$INPUTS.limit"
      merge_method: "$INPUTS.merge_method"
      retriage_as: "$INPUTS.retriage_as"
      auto_merge_queue: "$INPUTS.auto_merge_queue"
    fan_out:
      items: "$record.output.asks"
      as: question
      max_parallel: all
