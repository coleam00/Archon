name: archon-merge-queue
description: >-
  Assess an explicit bounded list of GitHub PRs, then merge eligible changes
  sequentially using gh and GitHub branch protection. Agents inspect current
  review and CI evidence; no forge engine extension is required.
model: medium
interactive: true
mutates_checkout: false
inputs:
  prs:
    required: true
    description: JSON array of 1-5 explicit PR URLs in this repository.
  mode:
    default: approve
    description: preview only assesses; approve waits for a human; auto authorizes this batch.
  evidence:
    default: ''
    description: Optional runtime/review report paths or structured evidence for this batch.
  merge_method:
    default: ''
    description: >-
      Required merge strategy: merge, squash, or rebase. Empty is accepted only
      when project guidance or the repository's sole enabled method resolves it.
returns: merge
nodes:
  - id: facts
    script: merge-queue
    runtime: bun
    with:
      action: facts
      prs: "$INPUTS.prs"

  - id: assess
    command: assess-merge-queue
    context: fresh
    depends_on: [facts]
    with:
      facts: "$facts.output"
      evidence: "$INPUTS.evidence"
      merge_method: "$INPUTS.merge_method"
    output_format:
      type: object
      properties:
        ready: { type: boolean }
        summary: { type: string }
        holds:
          type: array
          items:
            type: object
            properties:
              kind: { type: string, enum: [code, policy, checks, evidence, stale, authorization] }
              reason: { type: string }
            required: [kind, reason]
        method: { type: string, enum: [merge, squash, rebase, ''] }
        method_source: { type: string, enum: [caller, project, ''] }
        method_conflict: { type: string }
        evidence:
          type: object
          properties:
            state: { type: string, enum: [qualified, rejected, missing, stale] }
            fingerprint: { type: string }
            references: { type: array, items: { type: string } }
          required: [state, fingerprint, references]
      required: [ready, summary, holds, method, method_source, method_conflict, evidence]

  - id: plan
    script: merge-queue
    runtime: bun
    depends_on: [facts, assess]
    with:
      action: plan
      facts: "$facts.output"
      assessment: "$assess.output"
      method: "$INPUTS.merge_method"
    output_format:
      type: object
      properties:
        ready: { type: boolean }
        summary: { type: string }
        method: { type: string, enum: [merge, squash, rebase, ''] }
        holds:
          type: array
          items:
            type: object
            properties:
              kind: { type: string }
              reason: { type: string }
            required: [kind, reason]
        plan_reference: { type: string }
        plan_digest: { type: string }
      required: [ready, summary, method, holds, plan_reference, plan_digest]

  - id: approval
    depends_on: [plan]
    when: "$plan.output.ready == true && $INPUTS.mode == 'approve'"
    approval:
      message: >-
        Approve the PRs, pinned heads, evidence and $plan.output.method method in
        $ARTIFACTS_DIR/$plan.output.plan_reference (digest
        $plan.output.plan_digest)? $plan.output.summary
      decisions:
        - id: approve
          label: Merge eligible PRs
        - id: hold
          label: Hold batch

  - id: merge
    script: merge-queue
    runtime: bun
    depends_on: [plan, approval]
    trigger_rule: none_failed_min_one_success
    with:
      action: execute
      ready: "$plan.output.ready"
      plan_summary: "$plan.output.summary"
      plan_holds: "$plan.output.holds"
      plan_reference: "$plan.output.plan_reference"
      plan_digest: "$plan.output.plan_digest"
      mode: "$INPUTS.mode"
      approval: { from: "$approval.output", if_skipped: null }
    output_format:
      type: object
      properties:
        merged: { type: boolean }
        urls: { type: array, items: { type: string } }
        queued: { type: array, items: { type: string } }
        summary: { type: string }
        holds:
          type: array
          items:
            type: object
            properties:
              kind: { type: string }
              reason: { type: string }
            required: [kind, reason]
      required: [merged, urls, queued, summary, holds]
