name: archon-merge-queue
description: |
  The merge stage: one run decides one issue's pull request, the one the build queue
  finished, and stops only for a decision that belongs to a person. The run is on the
  issue's item, where the engine admits one merge run at a time. One agent judges the
  pull request, and a script merges what it declared through a gate that refuses unless
  the trusted review verdict says Ready at the head, what the pack's ci setting trusts
  passes there (green checks, or a recorded validation), the pull request targets the
  base branch (the item's landing branch, else the default branch), the head contains
  that branch or merges into it cleanly, and that branch's CI is not red, and merges
  pinned to that head. The stage never pushes and never holds a run open: a conflict, a
  stale verdict or red the change caused goes back to the build queue; a pull request
  whose checks still run ends waiting for a check at its head; one a red base branch
  holds back ends waiting for the backstop (archon-merge-pick); and anything unclear ends as one ask on the item with three
  fixed options (merge, return, park), whose answer starts the stage again.

  Use when: a trigger binding the operator installed starts it (see
  https://archon.diy/guides/sdlc-operations/#merge-queue), or a person starts one issue:
  `--item issue-<n>`.
  NOT for: delivering or fixing a pull request (archon-build-queue, archon-ship), or
  reviewing one by hand (archon-review).

requires: [github]

inputs:
  repo_host:
    default: ""
    description: >-
      The forge host of the repository whose pull request the run merges. Empty, with repo_path empty too, resolves the repository from the checkout's git remotes.
  repo_path:
    default: ""
    description: The owner/name path of that repository.
  merge_method:
    default: "squash"
    description: How the gate merges, squash or merge.
  retriage_merged:
    default: ""
    description: >-
      "true" records intake's re-triage request for an issue still open after its pull
      request merged, and the run ends `merged_retriage`, which starts intake through
      the `intake-after-merge` binding. Anything else re-triages nothing.
  waited:
    default: ""
    description: >-
      The wait a completed check met, as a wake binding passes it (`{ wait: true }`).
      Empty on any other start.
  decisions:
    default: ""
    description: >-
      The settled answers to the ask a run of this workflow left on the item, as an
      asks-settled binding passes them (`{ answers: true }`). Empty on any other start.
  asked:
    default: ""
    description: >-
      The result of the run that left that ask (`{ result: "" }`), which holds the head
      it asked about and the brief a return starts from. Empty on any other start.

# How the run left the item. `merged_retriage` is a merge that left the issue open with a
# re-triage request recorded. A run that ends `waiting` may leave waits; one that ends
# `asked` leaves its ask. `merged` and `parked` end the item: the change landed, or work on
# it stopped until the build queue readies it again, and a later step on the item opens it.
# `waiting` with no wait (a red base branch) stops the item until archon-merge-pick starts it.
returns: { node: settle, outcome: outcome, asks: asks, waits: waits, ends: [merged, parked] }

# Read-only: runs in the launch checkout beside any other run, and creates no worktree.
worktree:
  enabled: false
mutates_checkout: false

nodes:
  - id: facts
    script: facts
    runtime: bun
    output_format:
      type: object
      properties:
        # What follows: nothing to judge, a wait that goes on, or the judge.
        path: { type: string, enum: [settle, wait, judge] }
        # The issue whose item the run is on.
        item: { type: object }
        pr: { type: [object, 'null'] }
        url: { type: string }
        # The pull request's gate facts, and the base branch's; null when not read.
        facts: { type: [object, 'null'] }
        base: { type: [object, 'null'] }
        # The stage's record on the work item, with an approval the answer just gave.
        record: { type: [object, 'null'] }
        validation: { type: [object, 'null'] }
        protected: { type: array, items: { type: string } }
        # The pack's merge_lane and ci settings.
        lane: { type: string }
        ci: { type: string }
        # The maintainer's answer that started the run; null on any other start.
        answer: { type: [object, 'null'] }
        # How the item ends on the settle path; null otherwise.
        settled: { type: [object, 'null'] }
      required: [path, item, pr, url, facts, base, record, validation, protected, lane, ci, answer, settled]

  - id: judge
    command: judge
    depends_on: [facts]
    when: "$facts.output.path == 'judge'"
    model: ['@merge', large]
    with:
      item: { from: "$facts.output.item" }
      pr: { from: "$facts.output.pr" }
      url: "$facts.output.url"
      facts: { from: "$facts.output.facts" }
      record: { from: "$facts.output.record" }
      validation: { from: "$facts.output.validation" }
      protected: { from: "$facts.output.protected" }
      base: { from: "$facts.output.base" }
      lane: "$facts.output.lane"
      ci: "$facts.output.ci"
    output_format:
      type: object
      properties:
        # Each action admits only what it can act on: a return carries the brief the
        # build queue's next round starts from, and an ask carries the question.
        decision:
          anyOf:
            - type: object
              additionalProperties: false
              properties:
                action: { type: string, enum: [merge, wait] }
                class: &class { type: string, enum: [clear, unclear] }
                # The head the decision is about: the full commit id.
                head: &head { type: string, pattern: '^[0-9a-f]{40,64}$' }
                reran: &reran { type: boolean }
                reason: &reason { type: string, pattern: '\S' }
                brief: { type: string }
                ask: { type: 'null' }
              required: &decision [action, class, head, reran, reason, brief, ask]
            - type: object
              additionalProperties: false
              properties:
                action: { type: string, enum: [return] }
                class: *class
                head: *head
                reran: *reran
                reason: *reason
                brief: { type: string, pattern: '\S' }
                ask: { type: 'null' }
              required: *decision
            - type: object
              additionalProperties: false
              properties:
                action: { type: string, enum: [ask] }
                class: *class
                head: *head
                reran: *reran
                reason: *reason
                # The brief the build round starts from when the answer is `return`.
                brief: { type: string, pattern: '\S' }
                # The question as the person reads it. The options are the stage's own
                # three (merge, return, park), which the settle node adds.
                ask:
                  type: object
                  additionalProperties: false
                  properties:
                    question: { type: string, pattern: '\S' }
                    context: { type: string, pattern: '\S' }
                    recommendation:
                      type: object
                      additionalProperties: false
                      properties:
                        # merge, return or park; anything else is recorded as park.
                        option: { type: string, pattern: '\S' }
                        why: { type: string, pattern: '\S' }
                      required: [option, why]
                  required: [question, context, recommendation]
              required: *decision
        # The base branch as the judge found it; when red, the diagnosis.
        base: { type: string }
      required: [decision, base]

  # The one place a pull request merges, and the one write of the run's decision.
  - id: settle
    script: settle
    runtime: bun
    depends_on: [facts, judge]
    trigger_rule: none_failed_min_one_success
    with:
      start: { from: "$facts.output" }
      judged: { from: "$judge.output", if_skipped: null }
    output_format:
      type: object
      properties:
        outcome: { type: string, enum: [merged, merged_retriage, returned, parked, waiting, asked] }
        summary: { type: string }
        # The issue, which a binding on the outcome hands the stage it starts.
        number: { type: integer }
        # The head the decision is about, which an approval is pinned to; empty when none was read.
        head: { type: string }
        # The brief the item's next build round starts from: on a return, and on an ask
        # for the return its answer may choose.
        brief: { type: string }
      required: [outcome, summary, number, head, brief]
