name: archon-merge-queue
description: >-
  Queue at most five same-repository PRs with supervised gates by default.
  Committed project policy can authorize small bounded work after independent
  triage, diff assessment, composition review, and positive checks.
model: medium
interactive: true
worktree:
  enabled: true
inputs:
  prs:
    description: JSON array of qualified PR refs, all in one repository and base.
returns: report
outcome_field: merged
nodes:
  - id: intake
    script: merge-queue
    runtime: uv
    with:
      action: intake
      prs: "$INPUTS.prs"

  - id: assess
    command: assess-merge-queue
    context: fresh
    mutates_checkout: false
    depends_on: [intake]
    with:
      intake: "$intake.output"
    output_format:
      type: object
      properties:
        order:
          type: array
          items: { type: integer }
        judgments:
          type: array
          items:
            type: object
            properties:
              number: { type: integer }
              size: { type: string, enum: [small_bounded, risky, large] }
              reason: { type: string }
            required: [number, size, reason]
      required: [order, judgments]

  - id: assessment-record
    script: merge-queue
    runtime: uv
    depends_on: [assess]
    with:
      action: assess
      assessment: "$assess.output"

  - id: triages
    depends_on: [assessment-record]
    loop_group:
      max_iterations: 5
      until_bash: test "$triage-record.output.done" = "true"
      fresh_context: true
      nodes:
        - id: triage-prepare
          script: merge-queue
          runtime: uv
          with:
            action: triage-prepare

        - id: triage
          include: archon-triage
          depends_on: [triage-prepare]
          when: "$triage-prepare.output.run == true"
          with:
            target: "$triage-prepare.output.target"
            publish: "false"

        - id: triage-record
          script: merge-queue
          runtime: uv
          depends_on: [triage-prepare, triage]
          trigger_rule: all_done
          with:
            action: triage-record
            prepared: "$triage-prepare.output"
            triage:
              from: "$triage.output"
              if_skipped: null

  - id: order-snapshot
    script: merge-queue
    runtime: uv
    depends_on: [triages]
    trigger_rule: all_done
    with:
      action: order-snapshot

  - id: approve-order
    depends_on: [order-snapshot]
    when: "$order-snapshot.output.human_required == true"
    approval:
      message: >-
        Approve this exact pinned intake and proposed order, or hold the queue.
        Reordering requires a new run and assessment. Text is retained as notes.
        $order-snapshot.output
      decisions:
        - id: approve
          label: Approve exact order
        - id: hold
          label: Hold queue

  - id: order-receipt
    script: merge-queue
    runtime: uv
    depends_on: [order-snapshot, approve-order]
    trigger_rule: all_done
    with:
      action: order
      receipt:
        from: "$approve-order.output"
        if_skipped: null
      snapshot: "$order-snapshot.output.snapshot"

  - id: candidates
    depends_on: [order-receipt]
    when: "$order-receipt.output.proceed == true"
    loop_group:
      max_iterations: 5
      until_bash: test "$record.output.done" = "true"
      fresh_context: true
      nodes:
        - id: prepare
          script: merge-queue
          runtime: uv
          with:
            action: prepare

        - id: review
          include: archon-review
          depends_on: [prepare]
          when: "$prepare.output.run == true"
          with:
            local_range: "$prepare.output.local_range"
            work_order: "$prepare.output.work_order"
            errors: "$prepare.output.review_errors"
            docs: "$prepare.output.review_docs"

        - id: validate
          include: archon-validate
          depends_on: [review]
          when: "$prepare.output.run == true"

        - id: record
          script: merge-queue
          runtime: uv
          depends_on: [prepare, review, validate]
          trigger_rule: all_done
          with:
            action: record
            prepared: "$prepare.output"
            review:
              from: "$review.output"
              if_skipped: null
            validation:
              from: "$validate.output"
              if_skipped: null

  - id: candidate-snapshot
    script: merge-queue
    runtime: uv
    depends_on: [candidates]
    trigger_rule: all_done
    with:
      action: snapshot

  - id: approve-candidates
    depends_on: [candidate-snapshot]
    when: "$candidate-snapshot.output.human_required == true"
    approval:
      message: >-
        Approve only this ordered, tested candidate SHA chain and its evidence.
        Any changed head, base, candidate, or evidence invalidates approval.
        Held or failed evidence requires correction and a fresh run; approval
        cannot waive a failed merge guard.
        $candidate-snapshot.output
      decisions:
        - id: approve
          label: Merge exact tested chain
        - id: hold
          label: Hold queue

  - id: candidate-receipt
    script: merge-queue
    runtime: uv
    depends_on: [candidate-snapshot, approve-candidates]
    when: "$candidate-snapshot.output.ready == true || $candidate-snapshot.output.human_required == true"
    trigger_rule: all_done
    with:
      action: candidate
      receipt:
        from: "$approve-candidates.output"
        if_skipped: null
      snapshot: "$candidate-snapshot.output.snapshot"

  - id: merges
    depends_on: [candidate-receipt]
    loop_group:
      max_iterations: 5
      until_bash: test "$merge.output.done" = "true"
      nodes:
        - id: merge
          script: merge-queue
          runtime: uv
          with:
            action: merge
    when: "$candidate-receipt.output.proceed == true"

  - id: report
    script: merge-queue
    runtime: uv
    depends_on: [intake, order-receipt, candidates, candidate-snapshot, candidate-receipt, merges]
    trigger_rule: all_done
    with:
      action: report
    output_format:
      type: object
      properties:
        merged: { type: boolean }
        queue: { type: string }
        phase: { type: string }
        entries: { type: array, items: { type: object } }
        order_decision: { type: [object, "null"] }
        candidate_decision: { type: [object, "null"] }
      required: [merged, queue, phase, entries]
