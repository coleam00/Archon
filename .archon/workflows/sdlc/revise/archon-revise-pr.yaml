name: archon-revise-pr
description: |
  Repair an explicit existing same-repository GitHub PR from its original work
  order and public findings. A cold invocation checks out the PR in an isolated
  worktree, reuses implementation, and publishes to the same head without force.
  The caller owns attempts and independent acceptance. Never merge or replace a PR.

requires: [github]
worktree:
  enabled: true

inputs:
  target_pr:
    required: true
    description: Positive PR number in the checkout's GitHub origin repository.
  work_order:
    required: true
    description: Original accepted work order, inline or a readable artifact path.
  findings:
    required: true
    description: Public findings to repair, inline or a readable report path.
  publication_policy:
    default: ""
    description: Optional absolute operator-owned publication policy outside the checkout.

returns: outcome

nodes:
  - id: checkout
    include: archon-pr
    with:
      operation: checkout
      target_pr: "$INPUTS.target_pr"
      work_order: "$INPUTS.work_order"
      findings: "$INPUTS.findings"
      publication_policy: "$INPUTS.publication_policy"

  - id: repair
    include: archon-implement
    depends_on: [checkout]
    with:
      work: >-
        Repair the public findings below within the original accepted work order.
        The checkout is the existing PR #$checkout.output.number on
        $checkout.output.head, targeting $checkout.output.base in
        $checkout.output.repository. Commit the repair but do not push, create a
        replacement PR, change draft state, approve acceptance, or merge.

        Original work order:
        $INPUTS.work_order

        Public findings:
        $INPUTS.findings

  - id: gate
    script: gate
    runtime: bun
    depends_on: [repair]
    with:
      done: "$repair.output.done"
      green: "$repair.output.green"

  - id: publish
    include: archon-pr
    depends_on: [gate]
    with:
      expected_pr: "$checkout.output"
      publication_policy: "$INPUTS.publication_policy"

  - id: outcome
    script: __archon_pack__bundled:sdlc:deliver::outcome
    runtime: bun
    depends_on: [publish]
    with:
      mode: revise
      pr: "$publish.output"
    output_format:
      type: object
      properties:
        outcome: { type: string, enum: [delivered, no_action, blocked] }
        summary: { type: string }
        pr:
          type: [object, "null"]
          properties:
            number: { type: integer }
            url: { type: string }
            head: { type: string }
            base: { type: string }
            head_sha: { type: string }
            base_sha: { type: string }
            repository: { type: string }
            is_draft: { type: boolean }
          required: [number, url, head, base, head_sha, base_sha, repository, is_draft]
        reports:
          type: array
          items: { type: string }
      required: [outcome, summary, pr, reports]
