name: archon-metrics-test-value-judge
description: |
  Judge, for each test one pull request adds or changes, whether it protects
  behavior: whether a plausible regression of what the change promises would make
  it fail. It returns the verdicts and records no metric, so calibrating it never
  changes the metric. `archon-metrics-test-value` and
  `archon-metrics-test-value-calibrate` launch it once per pull request.

  Use when: one of those workflows judges a pull request.
  NOT for: reviewing a change (review); it judges tests that already merged.

# It reads the forge only, so judges of many pull requests share one checkout.
mutates_checkout: false

inputs:
  pr:
    required: true
    description: The pull request's URL.

returns: judge

nodes:
  - id: read
    script: read
    runtime: bun

  - id: judge
    depends_on: [read]
    model: large
    allowed_tools: []
    prompt: |
      You are judging the tests one pull request adds or changes. For each, decide
      whether it protects behavior: whether a plausible future edit that breaks what
      the change promises would make this test fail.

      The criteria below are this project's test-review lens. Use its standard for
      what protects behavior and what is not worth testing. Ignore its instructions
      about files to write, worktrees, findings and output; you only judge.

      $read.output

      Rules:
      - Judge every test case the pull request adds, and every existing test case
        whose body it changes. Leave out tests it only moves or deletes, and helpers
        that are not test cases.
      - `file` is the test file's path exactly as the pull request lists it.
      - `name` is the test's full name as its source writes it: the titles of its
        enclosing `describe` (or suite) blocks and its own title, joined by " > ".
        Keep a parameterized title's placeholders as written, such as `%s` or
        `${value}`.
      - A test protects behavior when it asserts an outcome or invariant someone
        relies on, and a plausible regression of it would fail the test.
      - A test that only checks diagnostic or log content does not protect behavior,
        unless capturing that evidence is the pull request's purpose.
      - A test that keeps a secret or credential out of logs or output protects
        behavior.
      - A test that only checks clearer error wording does not protect behavior, as
        long as the bad input is still rejected without it.
      - A test that repeats what another test in the pull request already proves,
        or that checks wiring, framework behavior, the type system or one more
        permutation of a proven invariant, does not protect behavior.
      - `reason` is one sentence: the regression it would catch, or why it catches
        none.
    output_format:
      type: object
      additionalProperties: false
      properties:
        tests:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              file: { type: string }
              name: { type: string }
              protects: { type: boolean }
              reason: { type: string }
            required: [file, name, protects, reason]
      required: [tests]
