name: archon-worktree-cleanup
description: |
  Remove merged worktrees, and their local branches, across every project
  registered on this install. Removal accepts Git base ancestry, patch equivalence,
  or one merged pull request head covering every existing local tip (worktree HEAD and branch ref). Cleanup can
  discover that pull request by local commits even if its published branch name
  differs. The local branch goes
  even when the worktree adopted an existing branch rather than creating one.
  Remote branches always stay, with a warning. It runs the host CLI's
  `archon isolation cleanup --merged`, so a worktree with uncommitted changes,
  a run that can still claim it, or commits the merge does not cover stays.
  Set include_closed to true to also accept a closed but unmerged PR whose head
  covers every existing local tip.

  Use when: a schedule binding the operator installed starts it (see the SDLC
  pack README, "Worktree cleanup"), or an operator runs it by hand. The pack
  installs no binding.
  NOT for: uncovered worktrees (a completed run releases its own clean checkout;
  the age sweep and `archon complete` handle the rest).

inputs:
  include_closed:
    default: "false"
    description: >-
      Also accept closed but unmerged PRs whose head covers every existing local
      tip. Must be true or false; any other value refuses the run.

# Cleanup runs against the registered projects, not a checkout of its own.
worktree:
  enabled: false

nodes:
  - id: merged
    script: merged
    runtime: bun
