name: archon-triage
description: Ground one item against current code and route the work without implementing it. Standalone Ready and blocked decisions pause for an answer; NO_ACTION completes. ready_handoff suppresses only Ready acknowledgement. Composing queues use archon-triage-block.
model: medium
inputs:
  target:
    default: ""
    description: "What to triage — an issue, document, plan, report, or free-form request. When empty, the run's trigger message is the target. One item per run."
  publish:
    default: "false"
    description: Write the derived labels to the tracker item — true or false. Off by default; the run then records the labels it would apply.
  ready_handoff:
    default: "false"
    description: True only when the caller owns the Ready handoff. Questions still pause.
returns: result
outcome_field: ready
nodes:
  - id: cycle
    loop_group:
      max_iterations: 1
      fresh_context: true
      until_bash: |
        done=$settle.output.done
        test "$done" = "true"
      nodes:
        - id: prepare
          script: prepare
          runtime: bun
          with:
            previous: $LOOP_PREV.settle.output
            answer: $LOOP_PREV.ask.output
            work: $INPUTS.target
          output_format:
            type: object
            properties:
              effect:
                type: string
                enum:
                  - retry
                  - replan
                  - ci
                  - finish
              work:
                &text
                type: string
              previous:
                type:
                  - object
                  - "null"
              replan:
                type: boolean
              pr:
                anyOf:
                  - type: "null"
                  - &qualified_pr
                    type: object
                    additionalProperties: false
                    properties:
                      repo:
                        type: object
                        properties:
                          host:
                            &nonempty_text
                            type: string
                            pattern: \S
                          path:
                            *nonempty_text
                        required:
                          - host
                          - path
                        additionalProperties: false
                      number:
                        type: integer
                        minimum: 1
                    required:
                      - repo
                      - number
              policy_defaults:
                *text
            required:
              - effect
              - work
              - previous
              - replan
              - pr
              - policy_defaults
        - id: attempt
          include: archon-triage-block
          depends_on:
            - prepare
          when: "$prepare.output.effect == 'retry'"
          with:
            target: $prepare.output.work
            publish: $INPUTS.publish
        - id: decide
          command: decide
          model: medium
          context: fresh
          mutates_checkout: false
          depends_on:
            - attempt
            - prepare
          trigger_rule: none_failed_min_one_success
          when: "$prepare.output.effect != 'finish'"
          with:
            result:
              from: $attempt.output
              if_skipped: null
            previous:
              from: $prepare.output.previous
            effect: $prepare.output.effect
            policy_defaults: $prepare.output.policy_defaults
            ready_handoff: $INPUTS.ready_handoff
          output_format:
            type: object
            additionalProperties: false
            properties:
              done:
                type: boolean
              attention:
                anyOf:
                  - type: "null"
                  - &attention
                    type: object
                    additionalProperties: false
                    properties:
                      what:
                        *nonempty_text
                      why:
                        *nonempty_text
                      recommendation:
                        type: object
                        additionalProperties: false
                        properties:
                          choice:
                            *nonempty_text
                          why:
                            *nonempty_text
                          evidence:
                            *nonempty_text
                          confidence:
                            type: string
                            enum:
                              - low
                              - medium
                              - high
                          would_change:
                            *nonempty_text
                        required:
                          - choice
                          - why
                          - evidence
                          - confidence
                          - would_change
                      choices:
                        type: array
                        minItems: 1
                        items:
                          type: object
                          additionalProperties: false
                          properties:
                            id:
                              type: string
                              pattern: "^[a-z][a-z0-9-]*$"
                            label:
                              *nonempty_text
                            does:
                              *nonempty_text
                            effect:
                              type: string
                              enum:
                                - retry
                                - finish
                            ruling:
                              *text
                          required:
                            - id
                            - label
                            - does
                            - effect
                            - ruling
                      if_unanswered:
                        *nonempty_text
                      links:
                        type: array
                        items:
                          *nonempty_text
                        minItems: 1
                    required:
                      - what
                      - why
                      - recommendation
                      - choices
                      - if_unanswered
                      - links
              pr:
                anyOf:
                  - type: "null"
                  - *qualified_pr
            required:
              - done
              - attention
              - pr
        - id: settle
          script: settle
          runtime: bun
          depends_on:
            - prepare
            - attempt
            - decide
          trigger_rule: none_failed_min_one_success
          with:
            previous:
              from: $prepare.output.previous
            effect: $prepare.output.effect
            result:
              from: $attempt.output
              if_skipped: null
            decision:
              from: $decide.output
              if_skipped: null
          output_format:
            type: object
            properties:
              result:
                &result
                type: object
                properties:
                  contract:
                    type: string
                    enum:
                      - READY
                      - NEEDS_CONTRACT_WORK
                      - BLOCKED
                      - NO_ACTION
                  route:
                    type: string
                    enum:
                      - investigate
                      - plan
                      - deliver
                      - continue
                      - no_action
                  pull_request:
                    type:
                      - integer
                      - "null"
                  ready:
                    type: boolean
                  type:
                    type: object
                    additionalProperties: false
                    properties:
                      value:
                        type: string
                        enum:
                          - bug
                          - feature
                          - refactor
                          - maintenance
                          - docs
                          - question
                      reason:
                        type: string
                        pattern: \S
                    required:
                      - value
                      - reason
                  size:
                    type: object
                    additionalProperties: false
                    properties:
                      value:
                        type: string
                        enum:
                          - s
                          - m
                          - l
                      reason:
                        type: string
                        pattern: \S
                    required:
                      - value
                      - reason
                  complexity:
                    type: object
                    additionalProperties: false
                    properties:
                      value:
                        type: string
                        enum:
                          - low
                          - medium
                          - high
                      reason:
                        type: string
                        pattern: \S
                    required:
                      - value
                      - reason
                  importance:
                    type: object
                    additionalProperties: false
                    properties:
                      value:
                        type: string
                        enum:
                          - low
                          - medium
                          - high
                      reason:
                        type: string
                        pattern: \S
                    required:
                      - value
                      - reason
                  urgency:
                    type: object
                    additionalProperties: false
                    properties:
                      value:
                        type: string
                        enum:
                          - none
                          - soon
                          - now
                      reason:
                        type: string
                        pattern: \S
                    required:
                      - value
                      - reason
                  labels:
                    type: array
                    items:
                      type: string
                  published:
                    type: boolean
                  proposed_edits:
                    type: object
                    properties:
                      title:
                        type: string
                      body:
                        type: string
                    required:
                      - title
                      - body
                  blocked_reason:
                    type: string
                  blocked_by:
                    type: array
                    items:
                      type: string
                  closure:
                    anyOf:
                      - type: "null"
                      - type: object
                        additionalProperties: false
                        properties:
                          kind:
                            type: string
                            enum:
                              - duplicate
                          url:
                            type: string
                            pattern: \S
                          original:
                            type: object
                            additionalProperties: false
                            properties:
                              repo:
                                type: object
                                properties:
                                  host:
                                    type: string
                                    pattern: \S
                                  path:
                                    type: string
                                    pattern: \S
                                required:
                                  - host
                                  - path
                                additionalProperties: false
                              number:
                                type: integer
                                minimum: 1
                            required:
                              - repo
                              - number
                        required:
                          - kind
                          - url
                          - original
                      - type: object
                        additionalProperties: false
                        properties:
                          kind:
                            type: string
                            enum:
                              - delivered
                          url:
                            type: string
                            pattern: \S
                        required:
                          - kind
                          - url
                  summary:
                    type: string
                  report:
                    type: object
                    properties:
                      type:
                        type: string
                        enum:
                          - archon_artifact
                      run_id:
                        type: string
                      path:
                        type: string
                        enum:
                          - triage.md
                    required:
                      - type
                      - run_id
                      - path
                required:
                  - contract
                  - route
                  - pull_request
                  - ready
                  - type
                  - size
                  - complexity
                  - importance
                  - urgency
                  - labels
                  - published
                  - proposed_edits
                  - blocked_reason
                  - blocked_by
                  - closure
                  - summary
                  - report
              done:
                type: boolean
              message:
                *text
              attention:
                anyOf:
                  - type: "null"
                  - *attention
              class: { type: string }
              options:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      *text
                    label:
                      *text
                  required:
                    - id
                    - label
              replan:
                type: boolean
              pr:
                anyOf:
                  - type: "null"
                  - *qualified_pr
            required:
              - result
              - done
              - message
              - class
              - attention
              - options
              - replan
              - pr
        - id: ask
          depends_on:
            - settle
          when: "$settle.output.message != ''"
          wait:
            attention: $settle.output.message
            form: select
            options: $settle.output.options
            labels:
              sdlc: triage
              decision: $settle.output.class
  - id: result
    depends_on:
      - cycle
    runtime: bun
    script: console.log(JSON.stringify(JSON.parse(process.env.INPUTS_ENVELOPE).result))
    with:
      envelope:
        from: $cycle.output
    output_format:
      *result
