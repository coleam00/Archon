name: archon-triage
description: |
  Ground one work item against the current repository before deciding what kind
  of work it needs, judge whether it is a contract a run can start from, then route
  it to investigate, plan, deliver, continue an open PR, or no action
  (archon-triage-block). Advisory: it leaves the checkout unchanged, and writes
  labels only when asked to publish. When the item is blocked or needs contract
  work, the run pauses as one attention item carrying the question. The answer
  triages again with the person's note, or ends the run with the verdict as it
  stands.

  Use when: an issue, plan, report, or request may be stale or may prescribe an
  unverified solution — "triage this issue", "what does this need next", "is
  this ready to build".
  NOT for: performing the investigation, writing the plan, or delivering work.

inputs:
  target:
    default: ""
    description: >-
      What to triage — an issue, document, plan, report, or free-form request.
      When empty, the run's trigger message is the target. One item per run.
  publish:
    default: "false"
    description: >-
      Write the derived labels to the tracker item — true or false. Off by
      default; the run then records the labels it would apply.

returns: result
outcome_field: ready

# Read-only: runs in the launch checkout beside any other run, and creates no worktree.
worktree:
  enabled: false
mutates_checkout: false

nodes:
  # One pass is the triage and its attention block (see archon-attention). Each
  # answer to the item permits one more pass.
  - id: cycle
    loop_group:
      max_iterations: 1
      fresh_context: true
      until_bash: 'done=$attend.output.done; test "$done" = true'
      nodes:
        - id: go
          bash: "true"
          when: "$LOOP_PREV.attend__ask.output.decision == '' || $LOOP_PREV.attend__ask.output.decision == 'rerun'"

        - id: stage
          include: archon-triage-block
          depends_on: [go]
          with:
            publish: "$INPUTS.publish"
            target: |-
              $INPUTS.target
              $LOOP_PREV.attend__settle.output.brief
              $LOOP_PREV.attend__ask.output.text

        - id: attend
          include: archon-attention
          depends_on: [stage]
          trigger_rule: all_done
          with:
            stage: archon-triage
            outcome: "$stage.output"

  - id: result
    depends_on: [cycle]
    runtime: bun
    script: console.log(JSON.stringify(JSON.parse(process.env.INPUTS_CYCLE).outcome))
    with:
      cycle: "$cycle.output"
    output_format:
      type: object
      properties:
        ready: { type: boolean }
      required: [ready]
