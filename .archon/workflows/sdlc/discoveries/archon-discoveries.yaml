name: archon-discoveries
description: |
  Decide what the runs that built a landed change noticed outside it: verify each
  record against the landing branch, and file it as a new issue (with a marker, so it
  is filed once), add its evidence to the issue that already covers it, drop it, leave
  it for later, or ask. Files at most three issues a pass, and labels none: a
  maintainer decides what is triaged. Changes nothing in the checkout.

  Starts when a change lands, or by hand on an item whose change landed:
  `archon workflow run archon-discoveries --item issue-<n> --input issue=<n>`.

model: ['@discoveries', large]
mutates_checkout: false

inputs:
  issue:
    description: The number of the issue whose change landed.
  repo_host:
    default: ""
    description: The host of the repository. Empty means the checkout's `origin` remote.
  repo_path:
    default: ""
    description: The repository on its host. Empty means the checkout's `origin` remote.
  answers:
    default: "None."
    description: Every answer an operator gave on this item, oldest first.
  review:
    result_of: archon-review
    description: What the latest review of the item ended with, with its accepted discoveries.

returns: { node: decide, outcome: outcome, asks: asks, final: [decided], summary: summary }

nodes:
  - id: decide
    command: discoveries
    output_format:
      type: object
      additionalProperties: false
      properties:
        outcome: { type: string, enum: [decided, ask] }
        decisions:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              outcome: { type: string, enum: [file, track, drop, wait, ask] }
              key: { type: string }
              title: { type: string }
              refs: { type: array, items: { type: string } }
              issue: { type: string }
              reason: { type: string }
            required: [outcome, key, title, refs, issue, reason]
        summary: { type: string }
      required: [outcome, decisions, summary]
