# Exec-code fixture: search-existing reports no forge search happened for any
# item (the local-proposals-only path), so classify can only ever produce
# 'new' or 'stale', never 'duplicate' or 'update-existing'. resolve-input's
# own forge probe still runs for real against this checkout's actual git
# remote and gh auth state, which fixtures cannot fully control; this fixture
# proves the LOGICAL no-forge path through search-existing/classify/render
# regardless of what that real probe finds in the environment it happens to
# run in (documented as a limitation in the PR report).
revalidate:
  entries:
    - item_index: 0
      still_valid: true
      evidence_refs: [{ path: "AGENTS.md", line: 1 }]
      note: "stub: still applies"
search-existing:
  entries:
    - item_index: 0
      forge_checked: false
      matches: []
classify:
  entries:
    - item_index: 0
      classification: new
      target_item: null
      rationale: "stub: no forge was reachable, so this is proposed locally with publication unavailable"
fixture:
  expect: completed
  reached: [resolve-input, revalidate, check-evidence, search-existing, classify, render]
  inputs:
    discovery_artifact: ".archon/workflows/sdlc/discoveries/fixtures/data/single.json"
exec-code: true
