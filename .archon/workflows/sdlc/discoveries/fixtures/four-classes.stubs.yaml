      still_valid: true
      evidence_refs: [{ path: "AGENTS.md", line: 1 }]
      note: "stub: still applies"
    - item_index: 2
      still_valid: true
      evidence_refs: [{ path: "AGENTS.md", line: 1 }]
      note: "stub: still applies"
    - item_index: 3
      still_valid: true
      evidence_refs: [{ path: "AGENTS.md", line: 1 }]
      note: "stub: still applies"
search-existing:
  entries:
