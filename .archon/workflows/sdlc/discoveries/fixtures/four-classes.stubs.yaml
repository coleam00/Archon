      forge_checked: true
      matches:
        - number: 101
          url: "https://github.com/example/repo/issues/101"
          title: "Existing tracked item, same defect"
          similarity_note: "stub: same underlying problem"
    - item_index: 2
      forge_checked: true
      matches:
        - number: 202
          url: "https://github.com/example/repo/issues/202"
          title: "Existing tracked item, related defect"
