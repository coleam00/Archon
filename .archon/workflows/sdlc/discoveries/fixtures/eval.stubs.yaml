# Dry-run fixture: eval mode. The outcome returns every decision as its evaluation
# and asks nothing, even for an ask decision, so the run never pauses.
facts:
  path: decide
  base: { branch: dev, sha: "stub-sha" }
  policy_defaults: "/stub/policy"
decide:
  decisions:
    - outcome: ask
      key: stub-open-question
      refs: ["run-a:review#0"]
      title: "stub: a scope question"
      question: "stub: is this in scope?"
      recommendation: "stub: drop it"
  summary: "stub: 1 record, asked."
outcome:
  mode: eval
  summary: "stub: 1 record, asked."
  written: []
  dropped: []
  asked: []
  question: ""
  evaluation:
    decisions:
      - outcome: ask
        key: stub-open-question
        refs: ["run-a:review#0"]
        title: "stub: a scope question"
        question: "stub: is this in scope?"
        recommendation: "stub: drop it"
    problems: []
fixture:
  inputs: { repo_host: github.com, repo_path: example/repo, mode: eval }
  expect: completed
  reached: [facts, decide, outcome]
exec-code: true
