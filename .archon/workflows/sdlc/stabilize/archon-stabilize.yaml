name: archon-stabilize
description: |
  Eliminate one flaky or unsound test: ground the complaint against the
  repository and its CI evidence (healthy baseline first, then the failure
  profile), prove the coupling that makes it flake, then take the real fix —
  never a widened timeout — through the full reviewed delivery tail. One
  governed run; the assessment is the work order.

  Use when: a test that fails intermittently, tests nothing real, or leans on
  timing should become a reviewed, ready-to-merge PR — "stabilize the
  migrate-state-dir windows flake", "this test keeps failing on CI, fix it
  properly".
  NOT for: sweeping every bad test at once (one target per run — the
  per-concern fan-out sweep is a future shape), or making CI green by raising
  timeouts, adding retries, or widening tolerances (that disarms the alarm;
  this workflow exists to fix the cause).

requires: [github]

inputs:
  target:
    default: ""
    description: >-
      The test to stabilize — a test name, file, suite, or a CI run/job
      reference showing the failure. When empty, the run's trigger message is
      the target; when that names no specific test, the assessment hunts for
      the strongest-evidenced flake in recent default-branch CI history.
  # The tests lens defaults ON here — the whole diff IS test code, so the
  # test-coverage reviewer earns its slot by default. Operator can still
  # disable it per run; the other lenses stay opt-in as everywhere else.
  tests:
    default: true
    description: Test-coverage lens — forced on by default (the diff is test code); auto or false override.
  errors:
    default: "auto"
    description: Silent-failure lens — auto, true, or false.
  comments:
    default: "auto"
    description: Comment-accuracy lens — auto, true, or false.
  types:
    default: "auto"
    description: Type-design lens — auto, true, or false.
  docs:
    default: "auto"
    description: Docs-impact lens — auto, true, or false.

returns: outcome

nodes:
  # Diagnosis is investigation-grade work (baseline forensics, root-causing a
  # race), not a version lookup — it gets the large tier where upkeep's
  # assessment runs on medium.
  - id: assess
    command: assess
    # Advisory: the engine fails this node with the touched paths named if it
    # modifies the working tree (#2771); replaced the record-state snapshot —
    # which also dissolved the record/judge/verify triad whose rule-of-three
    # extraction the constitution's watch-list was tracking.
    mutates_checkout: false
    model: large
    output_type: stability-assessment
    output_format:
      type: object
      properties:
        action:
          type: string
          enum: [fix, no_action]
        summary:
          type: string
      required: [action, summary]

  - id: assert-intact
    bash: |
      # Tree-intactness is engine-enforced via mutates_checkout: false above;
      # what remains is the evidence contract.
      if [ ! -s "$ARTIFACTS_DIR/stabilize-assessment.md" ]; then
        echo "assert-intact: the run completed but wrote no stabilize-assessment.md — a verdict without evidence is not an assessment." >&2
        exit 1
      fi
      echo '{"intact":"true"}'
    depends_on: [assess]

  # Spend gate: a no_action assessment skips everything paid or public below.
  # An expected negative is a completed run with the assessment as its result.
  - id: gate-fix
    bash: echo '{"gate":"fix"}'
    depends_on: [assert-intact]
    when: "$assess.output.action == 'fix'"

  # The work order carries the one constraint that defines this class: the
  # alarm never gets disarmed. A fix that cannot be delivered as prescribed
  # stops honestly rather than substituting a timeout bump.
  - id: deliver
    include: archon-deliver
    with:
      tests: "$INPUTS.tests"
      errors: "$INPUTS.errors"
      comments: "$INPUTS.comments"
      types: "$INPUTS.types"
      docs: "$INPUTS.docs"
      work: >-
        Fix the flaky or unsound test specified in
        $ARTIFACTS_DIR/stabilize-assessment.md. Read that file in full first —
        it is the verified work order, and you know nothing about this flake
        beyond it and the repository itself. Follow its fix order exactly.
        Binding constraint: raising a timeout, adding a retry, widening a
        tolerance, or skipping the test is NOT an acceptable fix — the
        assessment prescribes the decoupling; if reality contradicts it (the
        coupling cannot be removed as prescribed), stop honestly with green
        false and the contradiction in your summary rather than substituting
        an alarm-disarming shim. One authorized exception: if your own
        instrumented evidence PROVES the prescribed layer cannot produce the
        required outcome, implement the fix at the layer your proof identifies
        — state the escalation, its blast radius, and the proof in your report
        so the reviewer judges the trade-off in the pull request. Alarm-
        disarming shims stay forbidden at every layer. Meet the assessment's proof bar before
        declaring green: demonstrate the flake is dead (repeated runs under
        the triggering condition, the named coupling demonstrably gone) and,
        where the assessment demands it, that the test still fails on the
        fault it exists to catch. Keep the diff scoped to the target test and
        the coupling the assessment names — unrelated suspect tests you notice
        go in your report, not the diff. Carry the assessment's mechanism, its
        blast radius, and the alternative it rejected into your report — the
        reviewer must be able to judge that trade-off from the pull request.
        Original request: $INPUTS.target
    depends_on: [gate-fix]

  # One return for every legitimate terminal result: a no_action assessment
  # completes with its report path; a delivered fix is accepted only when the
  # deliver branch actually ran (if_skipped binding, #2637) and GitHub
  # confirms a ready PR. A passed gate with no delivered output means delivery
  # died mid-flight — outcome must never attribute that to the assessment.
  - id: outcome
    script: outcome
    runtime: uv
    depends_on: [assess, assert-intact, gate-fix, deliver]
    trigger_rule: none_failed_min_one_success
    with:
      action: "$assess.output.action"
      summary: "$assess.output.summary"
      delivered: { from: "$deliver.output", if_skipped: null }
      gate_passed: { from: "$gate-fix.output", if_skipped: null }
