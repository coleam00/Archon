name: archon-review
description: |
  Review a change through parallel specialist lenses and end in one evidence-based
  verdict. A quick route agent picks the lenses the change earns (seams, code, tests,
  errors, docs, ux), with seams on unless the change clearly touches no type, contract,
  state or boundary. Every round holds the change to the issue's accepted contract: each
  acceptance item, invariant and steering constraint is met with cited evidence or
  raised as a blocking finding. A round that follows an earlier review of the item
  verifies the earlier findings and reviews only the delta since the commit that round
  reviewed. Beside the lenses, a simplify pass names any smaller shape that keeps the
  outcome. When the verdict is not ready, three independent verifiers judge each
  blocking finding, and one most of them reject is demoted. The report is posted to the
  pull request as one comment, edited in place each round, only while the pull
  request's head is the reviewed commit. Read-only: it judges, it never edits.

  Starts on every build, on the commit the build pushed. By hand, on any pull request,
  from a checkout of its head branch:
  `archon workflow run archon-review --item pr-<n> --input pr=<n> --branch <head-branch>`.
  In delivery it ends `approve` (the host stage starts), `return` (the builder
  continues), `replan` or `ask`; by hand it ends `ready` or `not_ready` and starts nothing.

model: ['@reviewer', medium]
mutates_checkout: false

inputs:
  issue:
    default: ""
    description: The number of the issue whose change this is. Empty for a review by hand.
  repo_host:
    default: ""
    description: The host of the repository. Empty means the checkout's `origin` remote.
  repo_path:
    default: ""
    description: The repository on its host. Empty means the checkout's `origin` remote.
  pr:
    default: ""
    description: >-
      For a review by hand, the pull request to review, as a number or URL. Empty in
      delivery, where the builder's result names it, or for the current branch's open
      pull request, otherwise the working diff.
  answers:
    default: "None."
    description: Every answer an operator gave on this item, oldest first.
  build:
    result_of: archon-build
    description: What the last build of the item ended with. Read from the item.
  earlier:
    result_of: archon-review
    description: What the previous review of the item ended with, so this round continues it.

returns:
  node: verdict
  outcome: outcome
  asks: asks
  final: [ready, not_ready]
  summary: findings_summary
  # One option set for every ask; the asks-settled bindings in .pack/pack.yaml route on these ids.
  options:
    - { id: send-back, does: 'The same builder continues the change with your answer and this review report, in its own session, and the review sees it again.', cost: 'One build run and one more review round.' }
    - { id: take-as-is, does: 'The change goes on to the host stage as it is.', cost: 'What the review returned stays unfixed.' }
    - { id: replan, does: 'The item goes back to planning with your answer.', cost: 'The work so far may be discarded.' }
    - { id: stop, does: 'Nothing more runs. An operator lands or closes the change by hand.', cost: 'The item ends here unless someone takes it on.' }

nodes:
  - id: scope
    command: review-scope
    context: fresh
    output_format:
      type: object
      additionalProperties: false
      properties:
        head: { type: string }
        continuation: { type: boolean }
        prior_report: { type: string }
        head_matches: { type: boolean }
        pr:
          anyOf:
            - type: 'null'
            - type: object
              additionalProperties: false
              properties:
                repo:
                  type: object
                  additionalProperties: false
                  properties:
                    host: { type: string }
                    path: { type: string }
                  required: [host, path]
                number: { type: integer, minimum: 1 }
              required: [repo, number]
        report:
          type: object
          additionalProperties: false
          properties:
            type: { const: archon_artifact }
            run_id: { type: string }
            path: { type: string }
          required: [type, run_id, path]
      required: [head, continuation, prior_report, head_matches, pr, report]

  - id: route
    command: route-review
    model: ['@review-route', small]
    context: fresh
    depends_on: [scope]
    output_format:
      type: object
      additionalProperties: false
      properties:
        seams: { type: boolean }
        code: { type: boolean }
        tests: { type: boolean }
        errors: { type: boolean }
        docs: { type: boolean }
        ux: { type: boolean }
        reason: { type: string }
      required: [seams, code, tests, errors, docs, ux, reason]

  # Lenses run side by side in one checkout. The engine fails one that changes it, so a
  # reviewer that edits cannot mislead the others. Each declares its report as an artifact
  # pointer, so the engine also fails a lens that ends without writing it.
  - id: seams
    model: ['@review-seams', '@reviewer', medium]
    command: review-seams
    context: fresh
    depends_on: [route]
    when: "$route.output.seams == true"
    output_format: &lens-report
      type: object
      additionalProperties: false
      properties:
        findings: { type: integer, minimum: 0 }
        report:
          type: object
          additionalProperties: false
          properties:
            type: { const: archon_artifact }
            run_id: { type: string }
            path: { type: string }
          required: [type, run_id, path]
      required: [findings, report]
  - id: code
    model: ['@review-code', '@reviewer', large]
    command: review-code
    context: fresh
    depends_on: [route]
    when: "$route.output.code == true"
    output_format: *lens-report
  - id: tests
    model: ['@review-tests', '@reviewer', medium]
    command: review-tests
    context: fresh
    depends_on: [route]
    when: "$route.output.tests == true"
    output_format: *lens-report
  - id: errors
    model: ['@review-errors', '@reviewer', medium]
    command: review-errors
    context: fresh
    depends_on: [route]
    when: "$route.output.errors == true"
    output_format: *lens-report
  - id: docs
    model: ['@review-docs', '@reviewer', medium]
    command: review-docs
    context: fresh
    depends_on: [route]
    when: "$route.output.docs == true"
    output_format: *lens-report
  - id: ux
    model: ['@review-ux', '@reviewer', large]
    command: review-ux
    context: fresh
    depends_on: [route]
    when: "$route.output.ux == true"
    output_format: *lens-report

  # Beside the lenses, so its smaller shapes reach the builder with the review's findings.
  # A later round judges only a large or reshaping delta (see commands/simplify.md). Its
  # report is shape.md, and the verdict carries its count, so a bench can tell what it added.
  - id: simplify
    model: ['@review-simplify', '@reviewer', medium]
    command: simplify
    context: fresh
    depends_on: [scope]
    output_format:
      type: object
      additionalProperties: false
      properties:
        findings: { type: boolean }
        count: { type: integer, minimum: 0 }
        skipped: { type: boolean }
        report: { type: string, description: 'The absolute path of shape.md.' }
      required: [findings, count, skipped, report]

  # all_done: a lens that failed must not kill the review. Synthesis reads how each lens
  # ended from $NODE_OUTCOMES_FILE and holds readiness on a selected lens that did not
  # complete, so the gap is disclosed and the next round is the retry.
  - id: synthesize
    command: review-synthesize
    context: fresh
    depends_on: [scope, route, seams, code, tests, errors, docs, ux]
    trigger_rule: all_done
    output_format:
      type: object
      additionalProperties: false
      properties:
        ready: { type: boolean }
        action: { type: string, enum: [none, correct, replan, ask] }
        findings_summary: { type: string }
        discoveries: &discoveries
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              title: { type: string }
              claim: { type: string }
              evidence: { type: array, items: { type: string } }
              relation: { type: string, enum: [unrelated, scope_conflict, note] }
              source_nodes: { type: array, items: { type: string } }
            required: [title, claim, evidence, relation, source_nodes]
        contract_left: { type: array, items: { type: string } }
        coverage_gaps: { type: array, items: { type: string } }
      required: [ready, action, findings_summary, discoveries, contract_left, coverage_gaps]

  # Three independent verifiers judge each open blocking finding when the verdict is not
  # ready. One command serves all three; `voter` names the file each writes.
  - id: verify-1
    model: ['@reviewer', large]
    command: review-verify
    context: fresh
    depends_on: [synthesize]
    when: "$synthesize.output.ready == false"
    with: { voter: "1" }
  - id: verify-2
    model: ['@reviewer', large]
    command: review-verify
    context: fresh
    depends_on: [synthesize]
    when: "$synthesize.output.ready == false"
    with: { voter: "2" }
  - id: verify-3
    model: ['@reviewer', large]
    command: review-verify
    context: fresh
    depends_on: [synthesize]
    when: "$synthesize.output.ready == false"
    with: { voter: "3" }

  # Applies the votes, decides how the round ends, and publishes the report.
  - id: verdict
    command: review-verdict
    context: fresh
    depends_on: [scope, synthesize, simplify, verify-1, verify-2, verify-3]
    trigger_rule: all_done
    output_format:
      type: object
      additionalProperties: false
      properties:
        outcome: { type: string, enum: [approve, return, replan, ask, ready, not_ready] }
        ready: { type: boolean }
        action: { type: string, enum: [none, correct, replan, ask] }
        head: { type: string }
        pull_request: { type: string }
        published: { type: boolean }
        findings_summary: { type: string }
        report: { type: string, description: 'The absolute path of review/report.md.' }
        simplify: { type: integer, minimum: 0, description: 'How many smaller shapes the simplify pass reported this round.' }
        shape: { type: string, description: 'The absolute path of shape.md, or empty when simplify did not complete.' }
        discoveries: *discoveries
        contract_left: { type: array, items: { type: string } }
      required: [outcome, ready, action, head, pull_request, published, findings_summary, report, simplify, shape, discoveries, contract_left]
