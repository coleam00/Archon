name: archon-review
description: |
  Review a change through parallel specialist lenses and produce one evidence-based
  verdict. On the first round, a quick route agent picks the lenses the change
  earns — seams, code, tests, errors, docs — with seams on unless the change
  clearly touches no type, contract, state or boundary. Reviews a PR when given
  one, otherwise the working diff. Every round also holds the change to the
  accepted contract: each stated acceptance item, invariant, and steering
  constraint is met with cited evidence or raised as a blocking finding.
  Advisory and read-only: it judges, it never edits. Given the previous round's
  report, the same lenses review only the correction delta since the reviewed
  commit, judging whether each prior finding was resolved or validly declined
  (`light` runs the general code reviewer alone, for a CI fix), and one
  continuation reviewer carries the prior findings forward.

  When reviewing a PR, the final synthesized report is posted to it as one
  canonical comment, edited in place on re-review. Before any lens runs, the PR
  head must match the checkout commit; otherwise the run stops with retry commands.

  Use when: changes need judging — "review this PR", "review my changes",
  "is this ready to merge".
  NOT for: fixing findings (implement), running the project's checks (validate),
  or writing code.

model: medium

inputs:
  scope:
    default: ""
    description: >-
      What to review — a PR number/URL, a branch, or empty for the working diff
      against the merge-base.
  prior_report:
    default: ""
    description: >-
      Path to the previous review round's report. When set, this round verifies
      prior findings first and reviews only the delta since the commit that round
      reviewed, which its publish recorded beside the report.
  work_order:
    default: ""
    description: >-
      The accepted outcome and scope boundaries for this change. Delivery passes
      the same work order implementation received. Standalone review may leave
      this empty and use the PR's problem, outcome, and explicit scope instead.
  light:
    default: "false"
    description: >-
      "true" when this continuation follows a correction for CI rather than for
      review: the general code lens alone reviews the delta.
  # Error review can be forced on or off; `auto` leaves it to the route agent.
  errors:
    default: "auto"
    description: Silent-failure lens — auto, true, or false.

returns: publish
outcome_field: ready

nodes:
  # Fixes what this round reviews before any agent reads the target: whether it
  # continues a previous round, the commit under review (the checkout's HEAD as
  # the engine observed it), and, on a continuation, the previous round's
  # reviewed commit, which the head must descend from. A caller's pull-request
  # record names the PR, never the commit: its head revision goes stale with
  # every push after the PR opens. head-check refuses before lenses; publish
  # checks again before the public write. The node also turns the input into the
  # routable fact the lenses gate on: an include's inputs are substituted as text
  # at load time and cannot be compared in a `when:`.
  - id: mode
    script: review-round
    runtime: bun
    with:
      prior_report: "$INPUTS.prior_report"
      light: "$INPUTS.light"
    output_format:
      type: object
      properties:
        continuation: { type: boolean }
        head: { type: string, minLength: 1 }
        # The previous round's reviewed commit; empty on a first round.
        cursor: { type: string }
        risks: { type: string, minLength: 1 }
        # This node's engine identity, so synthesis counts only this round's lenses.
        execution: { type: object }
        # A continuation's lenses; all false on a first round, where route decides.
        seams: { type: boolean }
        code: { type: boolean }
        tests: { type: boolean }
        errors: { type: boolean }
        docs: { type: boolean }
      required: [continuation, head, cursor, risks, execution, seams, code, tests, errors, docs]

  - id: scope
    command: review-scope
    context: fresh
    mutates_checkout: false
    depends_on: [mode]
    output_format:
      type: object
      properties:
        # The qualified pull request this round reviewed, or `null` for a working
        # diff. publish below writes to this record and to nothing else, so the
        # comment can never land on an ambient branch→PR mapping. The bounds match
        # parseQualifiedPr in .shared/forge.ts, which publish runs on this value:
        # non-blank host and path, a positive number.
        pr:
          type: [object, 'null']
          properties:
            repo:
              type: object
              properties:
                host: { type: string, pattern: '\S' }
                path: { type: string, pattern: '\S' }
              required: [host, path]
            number: { type: integer, minimum: 1 }
          required: [repo, number]
        # The engine refuses this node when scope.md is missing or empty, so no
        # verdict is ever judged without its scope.
        report:
          type: object
          properties:
            type: { type: string, enum: [archon_artifact] }
            run_id: { type: string }
            path: { type: string, enum: [review/scope.md] }
          required: [type, run_id, path]
      required: [pr, report]

  - id: head-check
    script: check-review-head
    runtime: bun
    depends_on: [scope]
    with:
      scope: "$INPUTS.scope"
      pr: "$scope.output.pr"
      head: "$mode.output.head"

  # The lens decision is quick and separate from scope: a small model reads the diff
  # summary and the work order and answers, with seams on by default. Only a first
  # round decides; a continuation reruns what mode read back.
  - id: route
    command: route-review
    model: small
    context: fresh
    mutates_checkout: false
    depends_on: [head-check]
    when: "$mode.output.continuation == false"
    output_format:
      type: object
      properties:
        seams: { type: boolean }
        code: { type: boolean }
        tests: { type: boolean }
        errors: { type: boolean }
        docs: { type: boolean }
        reason: { type: string, pattern: '\S' }
      required: [seams, code, tests, errors, docs, reason]

  # ── Lenses ────────────────────────────────────────────────────────
  # Every reviewer is read-only by the engine's check, not only by its prompt:
  # lenses run in parallel in one checkout, so a reviewer that edits it can
  # mislead the others. `&&` binds tighter than `||` and short-circuits, so a
  # round that skipped the route node never reads it.
  - id: seams
    output_type: review-lens
    command: review-seams
    context: fresh
    mutates_checkout: false
    depends_on: [head-check, route]
    # A later round skips route; head-check alone must have succeeded.
    trigger_rule: none_failed_min_one_success
    when: "$mode.output.continuation == false && $route.output.seams == true || $mode.output.seams == true"

  - id: code
    output_type: review-lens
    model: large
    command: review-code
    context: fresh
    mutates_checkout: false
    depends_on: [head-check, route]
    trigger_rule: none_failed_min_one_success
    when: "$mode.output.continuation == false && $route.output.code == true || $mode.output.code == true"

  - id: tests
    output_type: review-lens
    command: review-tests
    context: fresh
    mutates_checkout: false
    depends_on: [head-check, route]
    trigger_rule: none_failed_min_one_success
    when: "$mode.output.continuation == false && $route.output.tests == true || $mode.output.tests == true"

  - id: errors
    output_type: review-lens
    command: review-errors
    context: fresh
    mutates_checkout: false
    depends_on: [head-check, route]
    trigger_rule: none_failed_min_one_success
    when: "$mode.output.continuation == false && $route.output.errors == true || $mode.output.errors == true"

  - id: docs
    output_type: review-lens
    command: review-docs
    context: fresh
    mutates_checkout: false
    depends_on: [head-check, route]
    trigger_rule: none_failed_min_one_success
    when: "$mode.output.continuation == false && $route.output.docs == true || $mode.output.docs == true"

  # all_done lets this barrier settle after unselected lenses, or a lens whose
  # retries were exhausted. The deciding
  # agent can then tolerate specialist failures without also tolerating a failed
  # head check: synthesize separately requires head-check to have succeeded.
  - id: review-complete
    bash: "true"
    depends_on: [head-check, route, seams, code, tests, errors, docs]
    trigger_rule: all_done

  # A failed specialist (a provider stream dying mid-review, say) must not kill
  # the review: synthesize detects the missing completion for a selected lens and
  # forces ready:false naming the gap, so degradation is disclosed, never silent,
  # and the next round is the retry. `ready` is a real boolean — the load-bearing field a composing
  # loop terminates on. Every round receives this round's lens files; a
  # continuation also receives the complete prior report and correction delta.
  #
  # The deciding agent and the lenses start fresh and carry earlier rounds through
  # the prior report, not a resumed session: a loop body cannot resume a session
  # from its own earlier iteration, and session resume is not portable across the
  # bundle's supported providers (Claude Code, Codex, and Pi).
  #
  # Adversarial per-finding verification happens inside this node's prompt. A
  # separate verify stage between the lenses and this node is now expressible and
  # would not change either side's contract — the findings files are the declared
  # boundary — but nothing has measured it as better than the in-prompt pass, so
  # it stays here until something does.
  - id: synthesize
    command: review-synthesize
    context: fresh
    mutates_checkout: false
    output_type: review-report
    depends_on: [head-check, review-complete]
    output_format: &review_verdict
      type: object
      properties:
        ready:
          type: boolean
        action:
          type: string
          enum: [none, correct, replan, needs_human]
        findings_summary:
          type: string
        # The report the verdict rests on, as a certified artifact pointer: the
        # engine refuses the verdict at this node when the file is missing or
        # empty, so a caller that continues over it never has to check.
        report:
          type: object
          properties:
            type: { type: string, enum: [archon_artifact] }
            run_id: { type: string }
            path: { type: string, enum: [review/report.md] }
          required: [type, run_id, path]
        # Work this review proved but the change does not do. The run's outcome
        # relays each record; the human-readable copy is discoveries.md.
        discoveries:
          type: array
          items:
            type: object
            properties:
              title: { type: string, pattern: '\S' }
              claim: { type: string, pattern: '\S' }
              evidence: { type: array, items: { type: string }, minItems: 1 }
              relation: { type: string, enum: [unrelated, scope_conflict, note] }
              source_nodes: { type: array, items: { type: string }, minItems: 1 }
            required: [title, claim, evidence, relation, source_nodes]
        # The required outcome and acceptance items the contract coverage does not
        # mark met, one line each. Empty exactly when it marks all of them met: only
        # then may the pull request close its issue.
        contract_left:
          type: array
          items: { type: string, pattern: '\S' }
      required: [ready, action, findings_summary, report, discoveries, contract_left]

  # The reviewer judges and writes the report; this node owns the one public
  # write, so every round edits the same marked comment instead of appending
  # another, through whichever forge source the run selected. The verdict passes
  # through unchanged: publication is not what makes a review true.
  - id: publish
    script: publish-review
    runtime: bun
    depends_on: [synthesize]
    with:
      # Delivery's verified record, when it passed one, is the write target;
      # the scope agent's declaration names it only for a standalone review.
      scope: "$INPUTS.scope"
      pr: "$scope.output.pr"
      report: "$ARTIFACTS_DIR/review/report.md"
      head: "$mode.output.head"
      ready: "$synthesize.output.ready"
      action: "$synthesize.output.action"
      summary: "$synthesize.output.findings_summary"
      report_pointer: "$synthesize.output.report"
      discoveries: { from: "$synthesize.output.discoveries" }
      contract_left: { from: "$synthesize.output.contract_left" }
      route: { from: "$route.output", if_skipped: null }
      mode: { from: "$mode.output" }
    output_type: review-report
    output_format: *review_verdict

  # Reviewers' scratch worktrees are removed by the workflow once every lens and
  # the deciding agent have settled, whether they succeeded or failed.
  - id: prune-scratch
    script: prune-scratch
    runtime: bun
    depends_on: [synthesize]
    trigger_rule: all_done
    with:
      lens: ""

