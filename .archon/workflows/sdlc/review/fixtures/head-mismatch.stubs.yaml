# A mismatched PR head stops before route, every lens, synthesis and publish.
# Those nodes have no stubs, so reaching any of them fails the fixture.
policy: { defaults: "fixture-policy-defaults" }
scope:
  head_matches: false
  pr: { repo: { host: github.com, path: example/repo }, number: 1 }
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/scope.md" }
result:
  ready: false
  action: ask
  findings_summary: "Checkout HEAD differs from PR head. Rerun: archon workflow run archon-review --input scope=https://github.com/example/repo/pull/1 --branch feature"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/scope.md" }
  discoveries: []
  contract_left: ["PR head mismatch prevented contract review."]
prune-scratch: "prune-scratch: removed 0 scratch worktree(s)"
fixture:
  expect: completed
  reached: [scope, result]
