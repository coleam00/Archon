# Dry-run fixture: a continuation round runs no specialist at all. One reviewer
# verifies the prior report and the correction delta itself, so the whole fan-out
# stays gated off — including the docs lens the scope node would otherwise select
# here (`docs: true`).
#
# That is the structural half of the loop guard: when a correction delta adds
# user-facing surface, the continuation reviewer re-evaluates a gated-off lens
# against the delta in its own judgment, and there is no route by which an
# already-passed lens can rerun. No lens carries a stub, so one that runs anyway
# fails this fixture instead of passing quietly. The judgment itself — which
# surface earns a re-evaluation, and whether the finding resolves as a follow-up —
# is model reasoning that no fixture can assert.
mode: '{"continuation":true}'
scope:
  docs: true
review-complete: "settled"
synthesize:
  ready: true
  action: none
  findings_summary: "stub: prior findings verified against the delta; nothing open"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
fixture:
  expect: completed
  reached: [synthesize]
