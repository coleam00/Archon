# Dry-run fixture: a later round. The mode node reruns the selection the first round
# recorded (seams and code) on the correction delta, without asking the route agent;
# the synthesizer carries the prior findings forward. The route node and the lenses
# the selection left out carry no stub, so one that runs anyway fails this fixture.
mode: '{"continuation":true,"head":"fixturehead","cursor":"fixtureprior","risks":"fixture-owned-policy","execution":{"path":"mode","invocation":{"loopPath":[]}},"seams":true,"code":true,"tests":false,"errors":false,"docs":false,"part":null}'
head-check: "target matches"
scope:
  selector: ""
  # A standalone review of the working diff: no pull request to publish to.
  pr: null
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/scope.md" }
seams: "0 findings; prior finding S1 resolved by the delta"
code: "0 findings; prior finding C1 validly declined"
review-complete: "settled"
synthesize:
  ready: true
  action: none
  findings_summary: "stub: prior findings resolved or validly declined; nothing open"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
  discoveries: []
  contract_left: []
publish:
  ready: true
  action: none
  findings_summary: "stub: prior findings resolved or validly declined; nothing open"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
  discoveries: []
  contract_left: []
prune-scratch: "prune-scratch: removed 0 scratch worktree(s)"
fixture:
  expect: completed
  reached: [seams, code, synthesize]
