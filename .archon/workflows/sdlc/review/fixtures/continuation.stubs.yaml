# Dry-run fixture: a later round skips a lens that found nothing. The previous round
# ran seams, code and docs; docs found nothing and seams left S1 open. The round
# reruns code alone, and the route agent adds seams for its open finding. Docs,
# tests and errors carry no stub, so one that runs anyway fails this fixture.
policy: { defaults: "fixture-policy-defaults" }
mode: '{"continuation":true,"light":false,"head":"fixturehead","cursor":"fixtureprior","risks":"fixture-owned-policy","execution":{"path":"mode","invocation":{"loopPath":[]}},"seams":false,"code":true,"tests":false,"errors":false,"docs":false,"part":null}'
route: { seams: true, code: false, tests: false, errors: false, docs: false, reason: "stub: S1, a seams finding, is still open in findings.json" }
scope:
  # A standalone review of the working diff: no pull request to publish to.
  pr: null
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/scope.md" }
seams: "0 findings; prior finding S1 resolved by the delta"
code: "0 findings; prior finding C1 validly declined"
review-complete: "settled"
synthesize:
  ready: true
  action: none
  findings_summary: "stub: prior findings resolved or validly declined; nothing open"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
  discoveries: []
  contract_left: []
publish:
  ready: true
  action: none
  findings_summary: "stub: prior findings resolved or validly declined; nothing open"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
  discoveries: []
  contract_left: []
prune-scratch: "prune-scratch: removed 0 scratch worktree(s)"
fixture:
  expect: completed
  reached: [route, seams, code, synthesize]
  resolved-text-contains:
    route: "findings.json"
