# Dry-run fixture: a continuation round runs no route agent and no specialist. One
# reviewer verifies the prior report and the correction delta itself. Neither the
# route node nor any lens carries a stub, so one that runs anyway fails this fixture.
mode: '{"continuation":true,"head":"fixturehead","cursor":"fixtureprior","risks":"fixture-owned-policy","execution":{"path":"mode","invocation":{"loopPath":[]}}}'
scope:
  pr_behind: false
  # A standalone review of the working diff: no pull request to publish to.
  pr: null
review-complete: "settled"
synthesize:
  ready: true
  action: none
  findings_summary: "stub: prior findings verified against the delta; nothing open"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
  discoveries: []
publish:
  ready: true
  action: none
  findings_summary: "stub: prior findings verified against the delta; nothing open"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
  discoveries: []
prune-scratch: "prune-scratch: removed 0 scratch worktree(s)"
fixture:
  expect: completed
  reached: [synthesize]
