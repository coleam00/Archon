# Dry-run fixture: an acceptance item whose proof needs a live third-party resource.
# Synthesis defers it to an operator check instead of stopping the run: the review
# ends ready with the item left open, and the pull request names the check.
policy: { defaults: "fixture-policy-defaults" }
mode: '{"continuation":false,"light":false,"head":"fixturehead","cursor":"","risks":"fixture-owned-policy","execution":{"path":"mode","invocation":{"loopPath":[]}},"seams":false,"code":false,"tests":false,"errors":false,"docs":false,"part":null}'
route: { seams: false, code: true, tests: false, errors: false, docs: false, reason: "stub: a small adapter change" }
head-check:
  target: { pr: null, base: null, head: fixturehead, merge_base: null }
scope:
  target: { pr: null, base: null, head: fixturehead, merge_base: null }
  selector: ""
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/scope.md" }
code: "0 findings"
review-complete: "settled"
synthesize:
  ready: true
  action: none
  findings_summary: "stub: clean; one acceptance item deferred to an operator check"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
  discoveries: []
  contract_left: ["acceptance: a message reaches a live Slack channel. Deferred to an operator check: post one message from a configured workspace and see it arrive"]
publish:
  ready: true
  action: none
  findings_summary: "stub: clean; one acceptance item deferred to an operator check"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
  discoveries: []
  contract_left: ["acceptance: a message reaches a live Slack channel. Deferred to an operator check: post one message from a configured workspace and see it arrive"]
prune-scratch: "prune-scratch: removed 0 scratch worktree(s)"
fixture:
  expect: completed
  reached: [code, synthesize]
  resolved-text-contains:
    synthesize: "deferred to an operator check"
