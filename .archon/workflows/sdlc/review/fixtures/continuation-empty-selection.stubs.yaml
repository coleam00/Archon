# Dry-run fixture: a later round whose previous round recorded no lenses. The route
# agent judges the correction delta and picks code and tests, so the round has lens
# reports to certify instead of inheriting an empty selection. The lenses neither
# selected carry no stub, so one that runs anyway fails this fixture.
mode: '{"continuation":true,"light":false,"head":"fixturehead","cursor":"fixtureprior","risks":"fixture-owned-policy","execution":{"path":"mode","invocation":{"loopPath":[]}},"seams":false,"code":false,"tests":false,"errors":false,"docs":false,"part":null}'
route: { seams: false, code: true, tests: true, errors: false, docs: false, reason: "stub: the delta changes behavior and its tests" }
head-check:
  base: null
  # A standalone review of the working diff: no pull request to publish to.
  pr: null
  head: fixturehead
  merge_base: null
scope:
  target:
    base: null
    pr: null
    head: fixturehead
    merge_base: null
  selector: ""
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/scope.md" }
code: "0 findings; prior finding C1 resolved by the delta"
tests: "0 findings"
review-complete: "settled"
synthesize:
  ready: true
  action: none
  findings_summary: "stub: prior findings resolved; nothing open"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
  discoveries: []
  contract_left: []
publish:
  ready: true
  action: none
  findings_summary: "stub: prior findings resolved; nothing open"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
  discoveries: []
  contract_left: []
