name: archon-merge-question
description: Apply one independent merge queue answer while sibling questions wait.
requires: [github]
worktree:
  enabled: false
mutates_checkout: false
inputs:
  question: { required: true }
  limit: { default: '10' }
  merge_method: { default: squash }
  retriage_as: { default: '' }
  auto_merge_queue: { default: 'true' }
returns: ruling
nodes:
  - id: question
    script: question
    runtime: bun
    output_format:
      type: object
      properties:
        attention: {type: string}
        options:
          type: array
          items:
            type: object
            properties: {id: {type: string}, label: {type: string}}
            required: [id, label]
        asked:
          oneOf:
            - type: object
              properties:
                by: {type: string, const: pr}
                item:
                  type: object
                  properties:
                    repo:
                      type: object
                      properties: {host: {type: string}, path: {type: string}}
                      required: [host, path]
                    number: {type: integer}
                  required: [repo, number]
                pr:
                  type: object
                  properties:
                    repo:
                      type: object
                      properties: {host: {type: string}, path: {type: string}}
                      required: [host, path]
                    number: {type: integer}
                  required: [repo, number]
                head: {type: string}
                brief: {type: string}
                attention:
                  type: object
                  properties:
                    what: {type: string}
                    why: {type: string}
                    recommendation:
                      type: object
                      properties:
                        choice: {type: string}
                        why: {type: string}
                        evidence: {type: string}
                        confidence: {type: string, enum: [low, medium, high]}
                        would_change: {type: string}
                      required: [choice, why, evidence, confidence, would_change]
                    choices:
                      type: array
                      items:
                        type: object
                        properties:
                          id: {type: string}
                          label: {type: string}
                          does: {type: string}
                          effect: {type: string, enum: [merge, return, park]}
                          ruling: {type: string}
                        required: [id, label, does, effect, ruling]
                    if_unanswered: {type: string}
                    links: {type: array, items: {type: string}}
                  required: [what, why, recommendation, choices, if_unanswered, links]
              required: [by, item, pr, head, brief, attention]
            - type: object
              properties:
                by: {type: string, const: base}
                attention:
                  type: object
                  properties:
                    what: {type: string}
                    why: {type: string}
                    recommendation:
                      type: object
                      properties:
                        choice: {type: string}
                        why: {type: string}
                        evidence: {type: string}
                        confidence: {type: string, enum: [low, medium, high]}
                        would_change: {type: string}
                      required: [choice, why, evidence, confidence, would_change]
                    choices:
                      type: array
                      items:
                        type: object
                        properties:
                          id: {type: string}
                          label: {type: string}
                          does: {type: string}
                          effect: {type: string, enum: [hold]}
                          ruling: {type: string}
                        required: [id, label, does, effect, ruling]
                    if_unanswered: {type: string}
                    links: {type: array, items: {type: string}}
                  required: [what, why, recommendation, choices, if_unanswered, links]
              required: [by, attention]
        owner_run_id: {type: string}
      required: [attention, options, asked, owner_run_id]
  - id: ask
    depends_on: [question]
    wait:
      attention: "$question.output.attention"
      form: select
      options: "$question.output.options"
      labels:
        merge: "$question.output.asked.by"
  - id: ruling
    script: ruling
    runtime: bun
    depends_on: [question, ask]
    with:
      asked: { from: "$question.output.asked" }
      owner_run_id: "$question.output.owner_run_id"
      choice: "$ask.output.decision"
      text: "$ask.output.text"
    output_format:
      type: object
      properties:
        decision: { type: string, enum: [merge, return, park, hold] }
        section: { type: string }
        summary: { type: string }
      required: [decision, section, summary]
