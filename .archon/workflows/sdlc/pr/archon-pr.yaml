name: archon-pr
description: |
  Open a pull request for the committed work on the current branch — draft by
  default when composed, template-aware, with the body built from the run's
  artifacts — or push to the one it already has. Pushes and verifies by reading
  the pull request back. When its caller allows it, it also publishes content the
  run prepared for the description as a marked section of it, and reads that back.
  It runs no validation and merges no base: CI judges the pushed head. Never sweeps unrelated changes, never rebases and never
  force-pushes.

  Use when: committed work on a branch needs a PR — "open a PR", "create a
  draft PR for this branch".
  NOT for: implementing (implement), reviewing (review), or merging (always human).

model: medium

inputs:
  draft:
    default: "true"
    description: '"true" opens the PR as a draft; anything else opens it ready for review.'
  pull_request:
    default: ""
    description: The number of an open pull request to continue, as the caller resolved it; empty or `null` when it names none.
  branch:
    default: ""
    description: >-
      The branch a new pull request opens from, as the caller resolved it. When an
      open pull request already has that head, the push updates it instead of
      opening another. Empty opens it from the checkout's branch.
  publish_description:
    default: "false"
    description: >-
      "true" lets the run publish content it prepared for the pull request's
      description, as a marked section of it, on any pull request it opens or
      continues; anything else leaves a continued pull request's description as its
      author left it.

returns: publish

nodes:
  # Refuses the run before the agent spends when the selected forge source cannot
  # act: no plugin for the host, no usable credential, or an unauthenticated gh.
  - id: forge
    script: forge-check
    runtime: bun
    output_format:
      type: object
      properties:
        source: { type: string, enum: [gh, forge] }
      required: [source]

  # The agent judges: which repository the work is proposed to, the base, whether
  # the run continues an existing pull request, and what the title and body say.
  # It performs no push and no forge write.
  - id: prepare
    command: pr
    depends_on: [forge]
    with:
      source: "$forge.output.source"
    output_type: pull-request-intent
    output_format:
      type: object
      properties:
        repo: &repo
          type: object
          properties:
            host: { type: string, pattern: '\S' }
            path: { type: string, pattern: '\S' }
          required: [host, path]
        head_repo: *repo
        head: { type: string, pattern: '\S' }
        base: { type: string, pattern: '\S' }
        existing: { type: [integer, 'null'], minimum: 1 }
        title: { type: string, pattern: '\S' }
        # The opening description; null when the run continues a pull request.
        body:
          type: [object, 'null']
          properties:
            type: { type: string, enum: [archon_artifact] }
            run_id: { type: string }
            path: { type: string, enum: [pr-body.md] }
          required: [type, run_id, path]
        # null unless the caller allows a section and the run prepared content for it.
        description:
          type: [object, 'null']
          properties:
            type: { type: string, enum: [archon_artifact] }
            run_id: { type: string }
            path: { type: string, enum: [pr-description.md] }
          required: [type, run_id, path]
        summary: { type: string }
      required: [repo, head_repo, head, base, existing, title, body, description, summary]

  # The durable ownership record for every later public action in delivery and
  # inbound forge event. It pushes the branch, then opens the pull request, or
  # reuses the one this work already has; consumers use this qualified identity,
  # never gh's ambient branch lookup.
  - id: publish
    script: publish-pr
    runtime: bun
    # pushHead owns retries; rerunning this node would restart its two-push budget.
    timeout: 180000
    depends_on: [prepare]
    with:
      repo: { from: "$prepare.output.repo" }
      head_repo: { from: "$prepare.output.head_repo" }
      head: "$prepare.output.head"
      base: "$prepare.output.base"
      existing: { from: "$prepare.output.existing" }
      title: "$prepare.output.title"
      body: { from: "$prepare.output.body" }
      description: { from: "$prepare.output.description" }
      publish_description: "$INPUTS.publish_description"
      draft: "$INPUTS.draft"
      pull_request: "$INPUTS.pull_request"
      branch: "$INPUTS.branch"
    output_type: pull-request
    output_format:
      type: object
      properties:
        schemaVersion: { type: integer, enum: [1] }
        repo:
          type: object
          properties:
            host: { type: string }
            path: { type: string }
          required: [host, path]
        number: { type: integer }
        url: { type: string }
        head: { type: string }
        base: { type: string }
        is_draft: { type: boolean }
        state: { type: string, enum: [open, closed, merged] }
        head_repo:
          type: [object, 'null']
          properties:
            host: { type: string }
            path: { type: string }
          required: [host, path]
        head_revision: { type: [string, 'null'] }
        base_revision: { type: [string, 'null'] }
        maintainer_can_modify: { type: [boolean, 'null'] }
      required:
        [
          schemaVersion,
          repo,
          number,
          url,
          head,
          base,
          is_draft,
          state,
          head_repo,
          head_revision,
          base_revision,
          maintainer_can_modify,
        ]
