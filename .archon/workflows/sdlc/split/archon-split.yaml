name: archon-split
description: |
  Decide how one large issue triage judged `split` is built: whole, or as the fewest
  pieces that each prove something on their own, by its kind (a PRD, an epic or a bundle
  of tasks). It files the piece that comes next as its own issue (once, by a marker),
  records it as part of this item, puts it in triage, and leaves the plan for the later
  pieces as one comment on the item. Changes nothing in the checkout.

  Starts when triage routes an issue `split`, or by hand:
  `archon workflow run archon-split --item issue-<n> --input issue=<n>`.
  Built whole, it starts the plan or the build stage.

model: ['@split', large]
mutates_checkout: false

inputs:
  issue:
    description: The number of the issue to split.
  repo_host:
    default: ""
    description: The host of the issue's repository. Empty means the checkout's `origin` remote.
  repo_path:
    default: ""
    description: The issue's repository on its host. Empty means the checkout's `origin` remote.
  answers:
    default: "None."
    description: Every answer an operator gave on this item, oldest first.
  triage:
    result_of: archon-triage
    description: What triage concluded about the issue, with its reason for splitting.
  earlier:
    result_of: archon-split
    description: What the last split of this item ended with, so no piece is filed twice.

returns: { node: split, outcome: outcome, asks: asks }

nodes:
  - id: split
    command: split
    output_format:
      type: object
      additionalProperties: false
      properties:
        outcome: { type: string, enum: [split, plan, build, ask] }
        kind: { type: string, enum: [prd, epic, bundle, whole] }
        issues:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              key: { type: string }
              title: { type: string }
              number: { type: integer, minimum: 1 }
            required: [key, title, number]
        existing:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              number: { type: integer, minimum: 1 }
              why: { type: string }
            required: [number, why]
        summary: { type: string }
      required: [outcome, kind, issues, existing, summary]
