name: archon-simplify
description: |
  Judge whether a change delivers its outcome through more structure than it needs,
  and name the smaller shape. Read-only: it judges, it never edits. Delivery runs
  it once, after the last review round and before CI; the implementer adopts or
  declines each finding.

  Use when: a change needs its structure judged — "is this overbuilt", "simplify
  review".
  NOT for: correctness (review), fixing findings (implement), or writing code.

model: medium

inputs:
  work_order:
    default: ""
    description: The accepted outcome and scope boundaries.

returns: simplify

nodes:
  - id: simplify
    output_type: structure-review
    command: simplify
    context: fresh
    mutates_checkout: false
    output_format:
      type: object
      properties:
        # True when the report holds any finding: delivery hands every one to the
        # owner to judge.
        findings: { type: boolean }
      required: [findings]
