name: archon-build-queue
description: |
  One build round for one issue: takes an item intake triaged toward a reviewed, ready
  pull request and stops only for decisions that belong to a person. The run is on the
  issue's item, and the engine admits one build run per item, so two runs never build
  one issue. One agent routes it (and proves a bug's symptom first) and launches
  archon-build from a brief, or marks a pull request already reviewed Ready, with no red
  check the change caused, ready without another round; one agent answers how that round
  ended; and after several rounds that each found new defects, one agent decides whether
  to ask the scope question instead of running another. A clear case acts on its own.
  Anything unclear pauses as one attention item whose answer is a declared option; the
  ruling is written into the issue body as a dated "Current scope" section. Every
  decision is recorded on the item's work item.

  Use when: a trigger binding the operator installed starts it (see
  https://archon.diy/guides/sdlc-operations/#build-queue), or a person starts one issue
  by number: `--input number=<n> --item issue-<n>`.
  NOT for: choosing what to build next or saying it in words (archon-build-pick),
  triaging an item (archon-intake), delivering one item by hand (archon-ship), or
  merging (archon-merge-queue).

requires: [github]

inputs:
  repo_host:
    default: ""
    description: >-
      The forge host of the repository whose issue the run builds. Empty, with
      repo_path empty too, resolves the repository from the checkout's git remotes.
  repo_path:
    default: ""
    description: The owner/name path of that repository.
  number:
    description: >-
      The issue to build. The run must be on its item, `issue-<number>`. It is refused
      with the reason when the issue has no work item or does not wait for a round.
  round_limit:
    default: "3"
    description: >-
      After this many rounds since the item's scope last changed, the answer to a round
      that ends wanting another also judges whether the rounds converge.

# How the run left the item: `ready`, `continue` or `parked`, after a person's answer too.
returns: { node: ruling, outcome: decision }

nodes:
  # Reads the item and writes the issue's body to build/issue.md, so every agent reads
  # the same text.
  - id: facts
    script: facts
    runtime: bun
    output_format:
      type: object
      properties:
        path: { type: string, enum: [closed, route] }
        item:
          type: object
          properties:
            repo:
              type: object
              properties:
                host: { type: string }
                path: { type: string }
              required: [host, path]
            number: { type: integer }
          required: [repo, number]
        url: { type: string }
        # When this run read the item: what its decision records as the item's `at`.
        read_at: { type: string }
        # The item's work item as this run read it, its history reports as plain run id
        # and path references.
        record: { type: object }
        # What the next launch starts from: the answer to the last stop, or empty.
        brief: { type: string }
        # The rounds before this run's, from the work item.
        rounds: { type: array, items: { type: object } }
        # Whether this run's round reaches round_limit rounds since the scope changed.
        at_cap: { type: boolean }
        # The item's pull request as the forge reports it now: the latest round's that
        # recorded one, or the one triage routed it to continue; else null.
        pull_request: { type: [object, 'null'] }
        # The number of that pull request when a round may continue it: it is open and
        # its head is in the item's repository. Null otherwise. Route decides whether
        # the round does.
        continues: { type: [integer, 'null'] }
        # The branch the round opens its pull request from when route continues none: a
        # new build/<issue>-<slug>-<run>. Empty on a closed issue.
        branch: { type: string }
        # The related work intake's triage found, for a round that plans.
        related: { type: array, items: { type: object } }
      required: [path, item, url, read_at, record, brief, rounds, at_cap, pull_request, continues, branch, related]

  # Routes the item and writes the brief the round starts from. The prompt names the
  # UI check policy's browser tool for a bug that needs a browser. It is not a `skills:` entry:
  # that would refuse the whole run under a provider that cannot load named skills,
  # and the provider is the user's choice.
  - id: route
    command: route
    depends_on: [facts]
    when: "$facts.output.path == 'route'"
    model: ['@build-route', large]
    mutates_checkout: false
    with:
      url: "$facts.output.url"
      record: { from: "$facts.output.record" }
      brief: "$facts.output.brief"
      pull_request: { from: "$facts.output.pull_request" }
      continues: "$facts.output.continues"
      lane: "$INPUTS.build_lane"
      ci: "$INPUTS.ci"
    output_format:
      type: object
      properties:
        decision: { type: string, enum: [launch, ask, ready] }
        # The route this round takes through archon-build. Declared on every decision,
        # read only on launch.
        route: { type: string, enum: [investigate, plan, deliver, continue] }
        # On launch, the number of the pull request the round continues: the candidate
        # facts reports, or null when the issue's dated scope or a recorded answer
        # supersedes it and the round starts fresh from the new branch. Null otherwise.
        continues: { type: [integer, 'null'] }
        # On ready, the full head SHA the pull request is already reviewed Ready at,
        # with no red check the change caused; apply takes it out of draft only while
        # its head is still this commit. Null otherwise.
        ready_head: { type: [string, 'null'] }
        # The brief the round starts from on launch; on ask, the brief a continue
        # choice launches.
        brief: { type: string, pattern: '\S' }
        reason: { type: string, pattern: '\S' }
        # On ask, the wait's own fields as the person reads them; null otherwise. Each
        # option's value is what the queue does when it is chosen.
        ask: &ask
          type: [object, 'null']
          additionalProperties: false
          properties:
            question: { type: string, pattern: '\S' }
            options:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                properties:
                  id: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
                  label: { type: string, pattern: '\S' }
                  does: { type: string, pattern: '\S' }
                  value:
                    type: object
                    additionalProperties: false
                    properties:
                      effect: { type: string, enum: [continue, ready, park] }
                      ruling: { type: string }
                    required: [effect, ruling]
                required: [id, label, does, value]
            recommendation:
              type: object
              additionalProperties: false
              properties:
                option: { type: string }
                why: { type: string, pattern: '\S' }
                confidence: { type: string, enum: [low, medium, high] }
              required: [option, why, confidence]
          required: [question, options, recommendation]
      required: [decision, route, continues, ready_head, brief, reason, ask]

  # A round that continues a pull request (route's declaration) starts from that pull
  # request's head, not from the branch the run's checkout was cut from, so its publish
  # fast-forwards. A fresh round stays on the base, and refuses when it is not on it.
  - id: checkout
    script: checkout
    runtime: bun
    depends_on: [facts, route]
    when: "$route.output.decision == 'launch'"
    with:
      item: { from: "$facts.output.item" }
      pull_request: { from: "$facts.output.pull_request" }
      candidate: "$facts.output.continues"
      continues: "$route.output.continues"
      route: "$route.output.route"
      rounds: { from: "$facts.output.rounds" }
    output_format:
      type: object
      properties:
        head: { type: [string, 'null'] }
        # The commit the continued pull request's review comment names at the round's
        # start; null on a fresh round or when it has no trusted review. Checkout refuses
        # a pull request with more than one.
        reviewed: { type: [string, 'null'] }
        # The pull request the round continues, or null when it starts fresh.
        pull_request: { type: [integer, 'null'], minimum: 1 }
        # The report an earlier round published at `reviewed`, which the round's first
        # review continues from; empty when that review reads the whole change.
        prior_report: { type: string }
      required: [head, reviewed, pull_request, prior_report]

  # The round. Intake triaged the item and route declared this round's route, so the
  # run triages nothing: archon-build is archon-ship without its triage.
  - id: ship
    include: archon-build
    depends_on: [facts, route, checkout]
    when: "$route.output.decision == 'launch'"
    with:
      route: "$route.output.route"
      work: >-
        $route.output.brief

        The issue, its title and body, is in $ARTIFACTS_DIR/build/issue.md. Read it
        in full: the body, with its dated "Current scope" sections, is the contract,
        and the brief above adds only what the body does not say. Intake triaged the
        item; no triage report is in this run's artifacts.
      related: "$facts.output.related"
      pull_request: "$checkout.output.pull_request"
      prior_report: "$checkout.output.prior_report"
      branch: "$facts.output.branch"

  - id: answer
    command: answer
    depends_on: [facts, checkout, ship]
    trigger_rule: none_failed_min_one_success
    when: "$facts.output.path == 'route' && $route.output.decision == 'launch'"
    model: ['@build-answer', large]
    mutates_checkout: false
    with:
      url: "$facts.output.url"
      record: { from: "$facts.output.record" }
      rounds: { from: "$facts.output.rounds" }
      ending: { from: "$ship.output", if_skipped: null }
      reviewed: "$checkout.output.reviewed"
      at_cap: "$facts.output.at_cap"
      ci: "$INPUTS.ci"
    output_format:
      type: object
      properties:
        decision: { type: string, enum: [done, continue, ask] }
        # What the next round starts from on continue; on ask, what a continue
        # choice launches. Empty on done.
        brief: { type: string }
        # The pull request whose head the checkout's unpushed commits go to; null
        # pushes nothing.
        push:
          type: [object, 'null']
          properties:
            repo:
              type: object
              properties:
                host: { type: string }
                path: { type: string }
              required: [host, path]
            number: { type: integer, minimum: 1 }
          required: [repo, number]
        reason: { type: string, pattern: '\S' }
        # On ask, what the question is about, as the agent judged it: `scope` for the
        # contract's shape or the rounds' trend, `stop` for anything else. Ignored on
        # done and continue. Not nullable: Codex's constrained decoding could not emit
        # `null` from an enum and padded whitespace until max_output_tokens.
        ask_class: { type: string, enum: [stop, scope] }
        ask: *ask
      required: [decision, brief, push, reason, ask_class, ask]

  # Checks the decision, performs the writes it declared and reads each one back:
  # the push, then the work item.
  - id: apply
    script: apply
    runtime: bun
    depends_on: [facts, route, answer]
    trigger_rule: none_failed_min_one_success
    with:
      path: "$facts.output.path"
      item: { from: "$facts.output.item" }
      read_at: "$facts.output.read_at"
      pull_request: { from: "$facts.output.pull_request" }
      route: { from: "$route.output", if_skipped: null }
      ending: { from: "$ship.output", if_skipped: null }
      answer: { from: "$answer.output", if_skipped: null }
      # Every verdict and CI report this run's delivery rounds produced; null when a
      # record cannot be read, so the round is still recorded, without them.
      reviews: { outputs: review-report, if_unreadable: null }
      ci: { outputs: ci-report, if_unreadable: null }
    output_format:
      type: object
      properties:
        decision: { type: string, enum: [parked, ready, continue, asked] }
        summary: { type: string }
        # The ask's question, options and recommendation, as the deciding agent wrote
        # them: empty, none and null when nothing is asked.
        question: { type: string }
        options:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
              does: { type: string }
              value: { type: object }
            required: [id, label, does, value]
        recommendation: { type: [object, 'null'] }
        class: { type: string, enum: ['', route, stop, scope] }
        # The ask's subject labels: the issue number, and its pull request's or empty.
        item: { type: string }
        pr: { type: string }
        # What the ruling node needs: the ask, the brief a continue option launches and
        # which decision asked; null when nothing is asked.
        asked: { type: [object, 'null'] }
      required: [decision, summary, question, options, recommendation, class, item, pr, asked]

  # A paused run gives its resource slot back, so another issue can build while this
  # one waits. It still holds its item: no second run builds the issue meanwhile.
  - id: ask
    depends_on: [apply]
    when: "$apply.output.question != ''"
    wait:
      attention: "$apply.output.question"
      form: select
      options: "$apply.output.options"
      other: true
      recommendation: "$apply.output.recommendation"
      labels:
        stage: build
        kind: "$apply.output.class"
        item: "$apply.output.item"
        pr: "$apply.output.pr"

  # Runs in every run, so the run's outcome is one node's: with nothing asked it hands
  # on apply's decision, and after an ask it acts on the answer.
  - id: ruling
    script: ruling
    runtime: bun
    depends_on: [facts, apply, ask]
    trigger_rule: none_failed_min_one_success
    with:
      item: { from: "$facts.output.item" }
      read_at: "$facts.output.read_at"
      applied: "$apply.output.decision"
      asked: { from: "$apply.output.asked" }
      decision: { from: "$ask.output.decision", if_skipped: "" }
      text: { from: "$ask.output.text", if_skipped: "" }
    output_format:
      type: object
      properties:
        decision: { type: string, enum: [continue, ready, parked] }
        section: { type: string }
        summary: { type: string }
      required: [decision, section, summary]
