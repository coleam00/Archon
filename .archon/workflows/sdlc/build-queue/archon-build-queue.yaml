name: archon-build-queue
description: |
  The build queue: takes intake's triaged work items to a reviewed, ready pull
  request and stops only for decisions that belong to a person. Each run claims the
  best waiting item with intake's claim, or the one the number input names. One
  agent routes it (and proves a bug's symptom first) and launches archon-build from a
  brief, or marks a pull request already reviewed Ready, with no red check the change
  caused, ready without another round; one agent answers how that round ended; and after several rounds that each
  found new defects, one agent decides whether to ask the scope question instead of
  running another. A clear case acts on its own. Anything unclear pauses as one
  attention item whose answer is a declared choice; the ruling is written into the
  issue body as a dated "Current scope" section. Every decision is recorded on the
  item's work item.

  A person can also say what to build in the run's message instead of naming a number:
  one agent resolves the message to an issue to claim, a choice between issues, a work
  order for several issues, which the run writes and the scheduled queue builds, or new
  work it files and hands to intake. Neither is built in the run that wrote it.

  Use when: a trigger binding the operator installed starts it (see
  https://archon.diy/guides/sdlc-operations/#build-queue), or a person names the
  item, by number or in words.
  NOT for: triaging an item (archon-intake), delivering one item by hand
  (archon-ship), or merging (archon-merge-queue).

requires: [github]

inputs:
  repo_host:
    default: ""
    description: >-
      The forge host of the repository whose work items the queue builds. Empty, with
      repo_path empty too, resolves the repository from the checkout's git remotes.
  repo_path:
    default: ""
    description: The owner/name path of that repository.
  number:
    default: ""
    description: >-
      The issue to build. Empty claims the item the run's message names, or with no
      message the waiting item that sorts first. A number claims that item, and refuses
      the run with the reason when it cannot: it has no work item, another run holds it,
      or it does not wait for the build queue.
  orders_only:
    default: "false"
    description: >-
      "true" claims only items that are members of an open work order (a
      `work-order/<id>` state document; see
      https://archon.diy/guides/sdlc-operations/#work-orders), and
      nothing when no order is open. It first marks done each open order whose members
      have all merged. A named item is claimed either way. Anything else picks from
      every waiting item.
  revisit_blocked:
    default: ""
    description: >-
      "true" makes a run that names no item also revisit the blocked items: one agent
      judges which no longer look blocked, and each of those gets this run's re-triage
      request and one intake pickup. Anything else revisits nothing.
  round_limit:
    default: "3"
    description: >-
      After this many rounds since the item's scope last changed, the answer to a round
      that ends wanting another also judges whether the rounds converge.
  build_queue_binding:
    default: ""
    description: >-
      The absolute path of the operator's timer-binding config for this repository's
      build queue. A decision that wants the item's next round now fires it with
      `archon trigger fire`, so the round is admitted under that binding's resource,
      capacity and overlap policy, at most once per decision. Empty starts no
      follow-up; the next queue run picks the item up.

returns: apply

nodes:
  - id: start
    script: start
    runtime: bun
    output_format:
      type: object
      properties:
        repo:
          type: object
          properties:
            host: { type: string }
            path: { type: string }
          required: [host, path]
        # Whether the run's message names the work: number is empty and it has one.
        message: { type: boolean }
      required: [repo, message]

  - id: interpret
    command: interpret
    depends_on: [start]
    when: "$start.output.message == true"
    model: large
    mutates_checkout: false
    with:
      repo: "$start.output.repo.host/$start.output.repo.path"
    output_format:
      type: object
      properties:
        decision: { type: string, enum: [build, choose, order, intake, none] }
        number: { type: [integer, 'null'], minimum: 1 }
        options:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              id: { type: string, pattern: '^issue-[0-9]+$' }
              label: { type: string, pattern: '\S' }
              does: { type: string, pattern: '\S' }
              value:
                type: object
                additionalProperties: false
                properties:
                  number: { type: integer, minimum: 1 }
                required: [number]
            required: [id, label, does, value]
        order:
          type: [object, 'null']
          additionalProperties: false
          properties:
            id: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
            members: { type: array, minItems: 2, items: { type: integer, minimum: 1 } }
            unresolved:
              type: array
              items:
                type: object
                additionalProperties: false
                properties:
                  named: { type: string, pattern: '\S' }
                  why: { type: string, pattern: '\S' }
                required: [named, why]
          required: [id, members, unresolved]
        issue:
          type: [object, 'null']
          additionalProperties: false
          properties:
            title: { type: string, pattern: '\S' }
            body: { type: string, pattern: '\S' }
          required: [title, body]
        reason: { type: string, pattern: '\S' }
      required: [decision, number, options, order, issue, reason]

  - id: pick
    depends_on: [interpret]
    when: "$interpret.output.decision == 'choose'"
    wait:
      attention: "$interpret.output.reason"
      form: select
      options: "$interpret.output.options"
      labels:
        build: message

  # Claims the item and writes the issue's body to build/issue.md, so every agent
  # reads the same text. With a message it claims the item interpret or the pick
  # resolved, refuses with interpret's reason when it resolved none, and claims
  # nothing when the message is a work order or new work for intake.
  - id: facts
    script: facts
    runtime: bun
    depends_on: [start, interpret, pick]
    trigger_rule: none_failed_min_one_success
    with:
      repo: { from: "$start.output.repo" }
      interpreted: { from: "$interpret.output", if_skipped: null }
      picked: { from: "$pick.output.value", if_skipped: null }
    output_format:
      type: object
      properties:
        path: { type: string, enum: [idle, closed, route, order, handoff] }
        item:
          type: [object, 'null']
          properties:
            repo:
              type: object
              properties:
                host: { type: string }
                path: { type: string }
              required: [host, path]
            number: { type: integer }
          required: [repo, number]
        url: { type: string }
        # The item's work item, as the queue read it at pickup, its history reports
        # as plain run id and path references: null for an item no pickup recorded.
        record: { type: [object, 'null'] }
        # What the next launch starts from: the answer to the last stop, or empty.
        brief: { type: string }
        # The rounds before this run's, from the work item.
        rounds: { type: array, items: { type: object } }
        # Whether this run's round reaches round_limit rounds since the scope changed.
        at_cap: { type: boolean }
        # The item's pull request as the forge reports it now: the latest round's that
        # recorded one, or the one triage routed it to continue; else null.
        pull_request: { type: [object, 'null'] }
        # The number of that pull request when a round may continue it: it is open and
        # its head is in the item's repository. Null otherwise. Route decides whether
        # the round does.
        continues: { type: [integer, 'null'] }
        # The branch the round opens its pull request from when route continues none: a
        # new build/<issue>-<slug>-<run>. Empty with no item.
        branch: { type: string }
        # The related work intake's triage found, for a round that plans.
        related: { type: array, items: { type: object } }
      required: [path, item, url, record, brief, rounds, at_cap, pull_request, continues, branch, related]

  # Routes the item and writes the brief the round starts from. The prompt names the
  # playwright-cli skill for a bug that needs a browser. It is not a `skills:` entry:
  # that would refuse the whole run under a provider that cannot load named skills,
  # and the provider is the user's choice.
  - id: route
    command: route
    depends_on: [facts]
    when: "$facts.output.path == 'route'"
    model: large
    mutates_checkout: false
    with:
      url: "$facts.output.url"
      record: { from: "$facts.output.record" }
      brief: "$facts.output.brief"
      pull_request: { from: "$facts.output.pull_request" }
      continues: "$facts.output.continues"
    output_format:
      type: object
      properties:
        decision: { type: string, enum: [launch, ask, ready] }
        # The route this round takes through archon-build. Declared on every decision,
        # read only on launch.
        route: { type: string, enum: [investigate, plan, deliver, continue] }
        # On launch, the number of the pull request the round continues: the candidate
        # facts reports, or null when the issue's dated scope or a recorded answer
        # supersedes it and the round starts fresh from the new branch. Null otherwise.
        continues: { type: [integer, 'null'] }
        # On ready, the full head SHA the pull request is already reviewed Ready at,
        # with no red check the change caused; apply takes it out of draft only while
        # its head is still this commit. Null otherwise.
        ready_head: { type: [string, 'null'] }
        # The brief the round starts from on launch; on ask, the brief a continue
        # choice launches.
        brief: { type: string, pattern: '\S' }
        reason: { type: string, pattern: '\S' }
        attention: &attention
          type: [object, 'null']
          additionalProperties: false
          properties:
            what: { type: string, pattern: '\S' }
            why: { type: string, pattern: '\S' }
            recommendation:
              type: object
              additionalProperties: false
              properties:
                choice: { type: string }
                why: { type: string, pattern: '\S' }
                evidence: { type: string, pattern: '\S' }
                confidence: { type: string, enum: [low, medium, high] }
                would_change: { type: string, pattern: '\S' }
              required: [choice, why, evidence, confidence, would_change]
            choices:
              type: array
              minItems: 1
              items:
                type: object
                additionalProperties: false
                properties:
                  id: { type: string, pattern: '^[a-z0-9]+(-[a-z0-9]+)*$' }
                  label: { type: string, pattern: '\S' }
                  does: { type: string, pattern: '\S' }
                  effect: { type: string, enum: [continue, ready, park] }
                  ruling: { type: string }
                required: [id, label, does, effect, ruling]
            if_unanswered: { type: string, pattern: '\S' }
            links: { type: array, items: { type: string } }
          required: [what, why, recommendation, choices, if_unanswered, links]
      required: [decision, route, continues, ready_head, brief, reason, attention]

  # A round that continues a pull request (route's declaration) starts from that pull
  # request's head, not from the branch the run's checkout was cut from, so its publish
  # fast-forwards. A fresh round stays on the base, and refuses when it is not on it.
  - id: checkout
    script: checkout
    runtime: bun
    depends_on: [facts, route]
    when: "$route.output.decision == 'launch'"
    with:
      item: { from: "$facts.output.item" }
      pull_request: { from: "$facts.output.pull_request" }
      candidate: "$facts.output.continues"
      continues: "$route.output.continues"
    output_format:
      type: object
      properties:
        head: { type: [string, 'null'] }
        # The commit the continued pull request's review comment names at the round's
        # start; null on a fresh round or when it has no trusted review. Checkout refuses
        # a pull request with more than one.
        reviewed: { type: [string, 'null'] }
        # The pull request the round continues, or null when it starts fresh.
        pull_request: { type: [integer, 'null'], minimum: 1 }
      required: [head, reviewed, pull_request]

  # The round. Intake triaged the item and route declared this round's route, so the
  # run triages nothing: archon-build is archon-ship without its triage.
  - id: ship
    include: archon-build
    depends_on: [facts, route, checkout]
    when: "$route.output.decision == 'launch'"
    with:
      route: "$route.output.route"
      work: >-
        $route.output.brief

        The issue, its title and body, is in $ARTIFACTS_DIR/build/issue.md. Read it
        in full: the body, with its dated "Current scope" sections, is the contract,
        and the brief above adds only what the body does not say. Intake triaged the
        item; no triage report is in this run's artifacts.
      related: "$facts.output.related"
      pull_request: "$checkout.output.pull_request"
      branch: "$facts.output.branch"
      ci: "$INPUTS.ci"

  - id: answer
    command: answer
    depends_on: [facts, checkout, ship]
    trigger_rule: none_failed_min_one_success
    when: "$facts.output.path == 'route' && $route.output.decision == 'launch'"
    model: large
    mutates_checkout: false
    with:
      url: "$facts.output.url"
      record: { from: "$facts.output.record" }
      rounds: { from: "$facts.output.rounds" }
      ending: { from: "$ship.output", if_skipped: null }
      reviewed: "$checkout.output.reviewed"
      at_cap: "$facts.output.at_cap"
    output_format:
      type: object
      properties:
        decision: { type: string, enum: [done, continue, ask] }
        # What the next round starts from on continue; on ask, what a continue
        # choice launches. Empty on done.
        brief: { type: string }
        # The pull request whose head the checkout's unpushed commits go to; null
        # pushes nothing.
        push:
          type: [object, 'null']
          properties:
            repo:
              type: object
              properties:
                host: { type: string }
                path: { type: string }
              required: [host, path]
            number: { type: integer, minimum: 1 }
          required: [repo, number]
        reason: { type: string, pattern: '\S' }
        # On ask, what the question is about, as the agent judged it: `scope` for the
        # contract's shape or the rounds' trend, `stop` for anything else. Ignored on
        # done and continue. Not nullable: Codex's constrained decoding could not emit
        # `null` from an enum and padded whitespace until max_output_tokens.
        ask_class: { type: string, enum: [stop, scope] }
        attention: *attention
      required: [decision, brief, push, reason, ask_class, attention]

  # Files the new work the message described and starts intake on it.
  - id: handoff
    script: handoff
    runtime: bun
    depends_on: [start, interpret, facts]
    when: "$facts.output.path == 'handoff'"
    with:
      repo: { from: "$start.output.repo" }
      issue: { from: "$interpret.output.issue" }
    output_format:
      type: object
      properties:
        summary: { type: string }
      required: [summary]

  # Writes the work order the message named and starts intake on each member it has
  # not seen. The scheduled build queue builds the members; this run claims none.
  - id: order
    script: order
    runtime: bun
    depends_on: [start, interpret, facts]
    when: "$facts.output.path == 'order'"
    with:
      repo: { from: "$start.output.repo" }
      order: { from: "$interpret.output.order" }
    output_format:
      type: object
      properties:
        summary: { type: string }
      required: [summary]

  # Checks the decision, performs the writes it declared and reads each one back:
  # the push, then the work item.
  - id: apply
    script: apply
    runtime: bun
    depends_on: [facts, route, answer, order, handoff]
    trigger_rule: none_failed_min_one_success
    with:
      path: "$facts.output.path"
      order: { from: "$order.output.summary", if_skipped: "" }
      handoff: { from: "$handoff.output.summary", if_skipped: "" }
      item: { from: "$facts.output.item" }
      pull_request: { from: "$facts.output.pull_request" }
      route: { from: "$route.output", if_skipped: null }
      ending: { from: "$ship.output", if_skipped: null }
      answer: { from: "$answer.output", if_skipped: null }
      # Every verdict and CI report this run's delivery rounds produced; null when a
      # record cannot be read, so the round is still recorded, without them.
      reviews: { outputs: review-report, if_unreadable: null }
      ci: { outputs: ci-report, if_unreadable: null }
    output_format:
      type: object
      properties:
        decision: { type: string, enum: [idle, order, handoff, parked, ready, continue, asked, launch] }
        summary: { type: string }
        # The attention message; empty when nothing is asked.
        attention: { type: string }
        # Each choice as a wait option; its value is the choice the answer returns.
        options:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              label: { type: string }
              does: { type: string }
              value: { type: object }
            required: [id, label, does, value]
        # The wait's recommendation; null when nothing is asked.
        recommendation: { type: [object, 'null'] }
        class: { type: string, enum: ['', route, stop, scope] }
        # What the answer node needs: the attention item, the brief a continue choice
        # launches and which decision asked; null when nothing is asked.
        asked: { type: [object, 'null'] }
      required: [decision, summary, attention, options, recommendation, class, asked]

  # A paused run gives its resource slot back, so the next scheduled run can work
  # another item while this one waits.
  - id: ask
    depends_on: [apply]
    when: "$apply.output.attention != ''"
    wait:
      attention: "$apply.output.attention"
      form: select
      options: "$apply.output.options"
      recommendation: "$apply.output.recommendation"
      labels:
        build: "$apply.output.class"

  - id: ruling
    script: ruling
    runtime: bun
    depends_on: [facts, apply, ask]
    with:
      item: { from: "$facts.output.item" }
      asked: { from: "$apply.output.asked" }
      choice: { from: "$ask.output.value" }
      text: "$ask.output.text"
    output_format:
      type: object
      properties:
        decision: { type: string, enum: [continue, ready, park] }
        section: { type: string }
        summary: { type: string }
      required: [decision, section, summary]

  # Revisit pickup is independent of item pickup: an unresolved PR create must
  # not suppress revisits of other items.
  - id: blocked
    script: blocked
    runtime: bun
    output_format:
      type: object
      properties:
        blocked:
          type: array
          items:
            type: object
            properties:
              number: { type: integer, minimum: 1 }
              summary: { type: string }
            required: [number, summary]
        blocked_count: { type: integer }
      required: [blocked, blocked_count]

  - id: revisit
    command: revisit
    depends_on: [start, blocked]
    when: "$blocked.output.blocked_count > 0"
    model: medium
    mutates_checkout: false
    with:
      blocked: { from: "$blocked.output.blocked" }
      repo: "$start.output.repo.host/$start.output.repo.path"
    output_format:
      type: object
      properties:
        retriage:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              number: { type: integer, minimum: 1 }
              reason: { type: string, pattern: '\S' }
            required: [number, reason]
      required: [retriage]

  - id: retriage
    script: retriage
    runtime: bun
    depends_on: [start, blocked, revisit]
    with:
      repo: { from: "$start.output.repo" }
      blocked: { from: "$blocked.output.blocked" }
      retriage: { from: "$revisit.output.retriage" }
    output_format:
      type: object
      properties:
        retriaged: { type: array, items: { type: integer } }
        summary: { type: string }
      required: [retriaged, summary]
