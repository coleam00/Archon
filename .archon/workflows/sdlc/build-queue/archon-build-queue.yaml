name: archon-build-queue
description: |
  Claim the next waiting build item, select its PR branch before provisioning a
  checkout, and dispatch archon-build-round with literal CLI --branch. The round
  owns delivery and attention decisions; this read-only pickup also revisits blocked items.

requires: [github]

inputs:
  repo_host:
    description: The forge host of the repository whose work items the queue builds.
  repo_path:
    description: The owner/name path of that repository.
  order:
    default: '["urgency desc","importance desc","size asc","created asc"]'
    description: >-
      Pickup order, intake's format: a JSON array of "<key> <asc|desc>" with keys
      urgency, importance, size, complexity and created.
  number:
    default: ""
    description: >-
      The issue to build. Empty claims the waiting item that sorts first. A number
      claims that item, and refuses the run with the reason when it cannot: it has no
      work item, another run holds it, or it does not wait for the build queue.
  retriage_as:
    default: ""
    description: >-
      The maintainer login a blocked item's re-triage is requested as. Set, a run that
      names no item also revisits the blocked items: one agent judges which no longer
      look blocked, and those get archon-triage and an intake run with that label
      event. Empty revisits nothing.
  round_limit:
    default: "3"
    description: >-
      After this many rounds since the item's scope last changed, the answer to a round
      that ends wanting another also judges whether the rounds converge.

worktree:
  enabled: false

returns: dispatch

nodes:
  - id: facts
    script: facts
    runtime: bun
    output_format:
      type: object
      properties:
        path: { type: string, enum: [idle, closed, route] }
        item:
          type: [object, 'null']
          properties:
            repo:
              type: object
              properties:
                host: { type: string }
                path: { type: string }
              required: [host, path]
            number: { type: integer }
          required: [repo, number]
        branch: { type: string }
        # The blocked items due a revisit; empty unless retriage_as is set and no item
        # is named.
        blocked: { type: array, items: { type: object } }
        blocked_count: { type: integer }
      required: [path, item, branch, blocked, blocked_count]

  - id: settle
    script: settle
    runtime: bun
    depends_on: [facts]
    when: "$facts.output.path != 'route'"
    with:
      path: "$facts.output.path"
      item: { from: "$facts.output.item" }
    output_format:
      type: object
      properties:
        summary: { type: string }
      required: [summary]

  - id: dispatch
    script: dispatch
    runtime: bun
    depends_on: [facts, settle]
    trigger_rule: none_failed_min_one_success
    with:
      path: "$facts.output.path"
      item: { from: "$facts.output.item" }
      branch: "$facts.output.branch"
      settled: { from: "$settle.output", if_skipped: null }
    output_format:
      type: object
      properties:
        run_id: { type: [string, 'null'] }
        summary: { type: string }
      required: [run_id, summary]

  # Intake's blocked verdict can go stale while work lands in parallel. The revisit
  # runs beside the item's path and changes nothing on it.
  - id: revisit
    command: revisit
    depends_on: [facts]
    when: "$facts.output.blocked_count > 0"
    model: medium
    mutates_checkout: false
    with:
      blocked: { from: "$facts.output.blocked" }
    output_format:
      type: object
      properties:
        retriage:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              number: { type: integer, minimum: 1 }
              reason: { type: string, pattern: '\S' }
            required: [number, reason]
      required: [retriage]

  - id: retriage
    script: retriage
    runtime: bun
    depends_on: [facts, revisit]
    with:
      blocked: { from: "$facts.output.blocked" }
      retriage: { from: "$revisit.output.retriage" }
    output_format:
      type: object
      properties:
        retriaged: { type: array, items: { type: integer } }
        summary: { type: string }
      required: [retriaged, summary]
