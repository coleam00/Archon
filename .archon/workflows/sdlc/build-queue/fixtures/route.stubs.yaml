# Dry-run fixture, the routing decision: a triaged item is launched. The route
# agent's brief is archon-ship's target, the included ship runs its real scripts on
# a stubbed triage that finds no contract, and the answer agent reads that ending.
# The queue's own scripts reach the state store, so they are stubbed here and proved
# by .archon/scripts/__tests__/build-queue.test.ts.
facts:
  path: route
  item: { repo: { host: "github.com", path: "example/repo" }, number: 7 }
  url: "https://github.com/example/repo/issues/7"
  record: null
  brief: ""
  rounds: []
  at_cap: false
  policy_defaults: "/stub/policy"
  pull_request: null
  continues: null
  branch: "build/7-stub-fixture"
blocked:
  blocked: []
  blocked_count: 0
route:
  decision: launch
  continues: null
  ready_head: null
  brief: "stub-brief: deliver https://github.com/example/repo/issues/7; the issue body is the contract"
  reason: "stub: the body is a contract"
  attention: null
checkout: { head: null, pull_request: null }
ship__forge: { source: forge }
ship__triage__triage:
  decision: { contract: NEEDS_CONTRACT_WORK, proposed_edits: { title: "stub: title", body: "stub: body" } }
  type: { value: feature, reason: "stub: asks for new behavior" }
  size: { value: s, reason: "stub: size" }
  complexity: { value: low, reason: "stub: complexity" }
  importance: { value: medium, reason: "stub: importance" }
  urgency: { value: none, reason: "stub: urgency" }
  item: { repo: { host: "", path: "" }, number: 0 }
  area_labels: []
  related: []
  summary: "stub: no acceptance stated"
  report: { type: archon_artifact, run_id: "fixture-run", path: "triage.md" }
answer:
  decision: done
  brief: ""
  push: null
  reason: "stub: answered"
  attention: null
apply:
  decision: ready
  summary: "stub: Issue 7: ready."
  attention: ""
  options: []
  class: ""
  asked: null
fixture:
  inputs: { repo_host: github.com, repo_path: example/repo }
  expect: completed
  reached: [facts, route, ship__triage__verdict, ship__report, answer, apply]
  resolved-text-contains:
    ship__triage__triage: "stub-brief: deliver https://github.com/example/repo/issues/7"
    answer: '"reason":"needs_contract"'
exec-code: true
