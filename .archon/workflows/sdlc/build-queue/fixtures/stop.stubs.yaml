# Dry-run fixture, the stop-answer decision: a round ends on a question the
# contract does not answer, so the answer agent asks. The run pauses as one
# attention item whose answer is a declared choice, and the ruling node records it.
# The round includes archon-ship-block, which never pauses, so the triage question
# raises no item of its own: the queue's is the only one.
# The queue's own scripts reach the state store and the forge, so they are stubbed
# here and proved by .archon/scripts/__tests__/build-queue.test.ts.
facts:
  path: route
  item: { repo: { host: "github.com", path: "example/repo" }, number: 7 }
  url: "https://github.com/example/repo/issues/7"
  record: null
  brief: ""
  rounds: []
  at_cap: false
  policy_defaults: "/stub/policy"
  pull_request: null
  continues: null
  branch: "build/7-stub-fixture"
blocked:
  blocked: []
  blocked_count: 0
route:
  decision: launch
  continues: null
  ready_head: null
  brief: "stub: continue PR 8"
  reason: "stub: the body is a contract"
  attention: null
checkout: { head: null, reviewed: null, pull_request: null }
ship__forge: { source: forge }
ship__triage__triage:
  decision: { contract: NEEDS_CONTRACT_WORK, proposed_edits: { title: "stub: title", body: "stub: body" } }
  type: { value: feature, reason: "stub: asks for new behavior" }
  size: { value: s, reason: "stub: size" }
  complexity: { value: low, reason: "stub: complexity" }
  importance: { value: medium, reason: "stub: importance" }
  urgency: { value: none, reason: "stub: urgency" }
  item: { repo: { host: "", path: "" }, number: 0 }
  area_labels: []
  related: []
  summary: "stub: no acceptance stated"
  report: { type: archon_artifact, run_id: "fixture-run", path: "triage.md" }
answer:
  decision: ask
  brief: "stub: continue PR 8 under the ruling"
  push: null
  reason: "stub: the plan asks to relax a stated constraint"
  ask_class: stop
  attention:
    what: "stub: the item and the decision"
    why: "stub: what either answer changes"
    recommendation:
      choice: narrow
      why: "stub: why"
      evidence: "stub: evidence"
      confidence: medium
      would_change: "stub: what would change it"
    choices:
      - { id: narrow, label: "stub: narrow it", does: "stub: continues on the narrower scope", effect: continue, ruling: "stub: acceptance drops A4" }
      - { id: park, label: "stub: park it", does: "stub: stops working it", effect: park, ruling: "" }
