apply:
  decision: asked
  summary: "stub: Issue 7: asked."
  attention: "stub: the attention message"
  options: [{ id: narrow, label: "stub: narrow it" }, { id: park, label: "stub: park it" }]
  class: stop
  asked: { attention: {}, brief: "stub: continue PR 8", by: stop }
ask: { decision: narrow, text: "stub: drop A4" }
ruling:
  decision: continue
  section: "stub: Current scope (maintainer ruling)"
  summary: "stub: the maintainer chose narrow"
fixture:
  inputs: { repo_host: github.com, repo_path: example/repo }
  expect: completed
  reached: [facts, route, ship__report, answer, apply, ask, ruling]
exec-code: true
