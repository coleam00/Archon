name: archon-upkeep
description: |
  Keep one dependency current: ground the update request against the repository
  as it exists (locked version, blast radius, breaking changes that touch real
  usage), then either stop with the reason or take the bump through the full
  reviewed delivery tail. One governed run; the assessment is the work order.

  Use when: a dependency or security advisory should become a reviewed,
  ready-to-merge PR — "update sharp", "address the undici advisory",
  "bump X to latest".
  NOT for: sweeping every outdated dependency at once (one target per run),
  or deciding fork-vs-replace questions (that is a human decision the
  assessment will surface, not make).

requires: [github]

inputs:
  target:
    default: ""
    description: >-
      The update to assess — a dependency name, version, or advisory. When
      empty, the run's trigger message is the target.
  errors:
    default: "auto"
    description: Silent-failure lens — auto, true, or false.

# `delivered:false` is a valid completion: an assessment that finds the locked
# version already current is a successful run that shipped nothing, and lifecycle
# status and work outcome are separate facts. Both were reported as
# `outcome: null` before the terminal script could certify its own result.
returns: outcome
outcome_field: delivered

nodes:
  # The assessment stage is advisory and inline (not a composed package): the
  # record/judge/verify triad appears here for the second time after triage —
  # rule of three says extract on the third package that needs it, not now.
  - id: assess
    command: assess
    # Advisory: the engine fails this node with the touched paths named if it
    # modifies the working tree; replaced the record-state snapshot.
    mutates_checkout: false
    model: medium
    output_type: dependency-assessment
    output_format:
      type: object
      properties:
        action:
          type: string
          enum: [update, no_action]
        summary:
          type: string
        report:
          # The evidence contract, enforced by the engine at this node. A pointer
          # that names a file this run did not write is refused here, so a verdict
          # can no longer arrive without the report behind it. Four copies of a
          # `test -s` node used to check this one hop later.
          type: object
          properties:
            type: { type: string, enum: [archon_artifact] }
            run_id: { type: string }
            path: { type: string, enum: [upkeep-assessment.md] }
          required: [type, run_id, path]
      required: [action, summary, report]

  # Spend gate and work order in one node. A no_action assessment skips everything
  # paid or public below, and an expected negative is a completed run with the
  # assessment as its result. The condition used to live on a marker node that
  # computed nothing, kept so a skip stayed distinguishable from a stop — a
  # distinction the engine's skip causes carry on their own.
  #
  # The order authorizes exactly the lockfile change implement's default forbids:
  # implement.md's "never update a lockfile" exists to stop incidental churn, and
  # the target dependency IS the work here — so the order re-scopes that rule
  # explicitly (non-goals are transferable by the work item) while keeping it in
  # force for every other dependency.
  - id: deliver
    include: archon-deliver
    with:
      errors: "$INPUTS.errors"
      work: >-
        Apply the dependency update specified in
        $ARTIFACTS_DIR/upkeep-assessment.md. Read that file in full first — it
        is the verified work order, and you know nothing about this update
        beyond it and the repository itself. Follow its update order: use the
        project's own package manager, change the manifest only as the
        assessment directs, and update the lockfile for the TARGET dependency
        only — this work item explicitly authorizes that lockfile change; the
        no-lockfile-updates default still applies to every other dependency, so
        keep churn minimal and never downgrade anything unrelated. Fix what the
        bump breaks, validate with the project's own checks, and if reality
        contradicts the assessment (version unavailable, an unlisted peer
        conflict), stop honestly with green false and the contradiction in your
        summary rather than improvising a different version. Carry the
        assessment's chosen mechanism, its blast radius, and the alternative it
        rejected into your report — the reviewer must be able to judge that
        trade-off from the pull request. Original request:
        $INPUTS.target
    depends_on: [assess]
    when: "$assess.output.action == 'update'"

  # One return for every legitimate terminal result: a no_action assessment
  # completes with its report path; a delivered update is reported from the
  # flip's certified URL the deliver branch returned (if_skipped binding, so a
  # skipped flip arrives as null).
  #
  # The spend gate's output used to be bound here to tell "delivery started and
  # died mid-flight" apart from an assessment that stopped. A failed delivery now
  # cascades an `upstream_failed` skip that blocks this join outright, so that case
  # never reaches this node and the run's terminal record names the node that
  # actually failed.
  - id: outcome
    script: outcome
    runtime: bun
    depends_on: [assess, deliver]
    trigger_rule: none_failed_min_one_success
    with:
      action: "$assess.output.action"
      summary: "$assess.output.summary"
      delivered: { from: "$deliver.output.pr_url", if_skipped: null }
    output_format:
      type: object
      properties:
        delivered: { type: boolean }
        summary: { type: string }
      required: [delivered, summary]
