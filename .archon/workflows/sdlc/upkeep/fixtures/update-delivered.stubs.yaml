# The assessment confirms a concrete update is owed, so delivery runs one round to a
# ready PR, and the real outcome node reports delivery's own ending.
assess:
  action: update
  summary: "stub: locked 1.2.3, target 1.2.9 admitted by the constraint, two usage sites, no breaking changes apply"
  report: { type: archon_artifact, run_id: "fixture-run", path: "upkeep-assessment.md" }
implement__implement:
  done: true
  green: true
  red_cause: ""
  summary: "stub: implemented, focused checks green"
implement__assert-changed: "3 files changed"
validate__mode: { comparison: false }
validate__discover: { checks: [{ name: "project gate", argv: ["stub-gate"] }], notes: "stub: the project's aggregate gate" }
validate__run: { status: green, summary: "stub: full gate green" }
validate__result: { green: true, red_cause: "", summary: "stub: full gate green", evidence: null }
pr__pr: { intent: "/fixture/pr-intent.json" }
pr__publish: { schemaVersion: 1, repo: { host: "github.com", path: "example/repo" }, number: 7, url: "https://github.com/example/repo/pull/7", head: "fixture-branch", base: "dev", is_draft: true, state: "open", head_repo: { host: "github.com", path: "example/repo" }, head_revision: "fixturehead", base_revision: "fixturebase", maintainer_can_modify: null }
review__mode: '{"continuation":false,"head":"fixturehead","cursor":"","risks":"fixture-owned-policy","execution":{"path":"review__mode","invocation":{"loopPath":[]}}}'
review__scope:
  seams: true
  code: true
  tests: false
  errors: false
  docs: false
  risk: "stub: changes a typed contract"
  pr: { repo: { host: "github.com", path: "example/repo" }, number: 7 }
review__seams: "0 findings"
review__code: "0 findings"
review__review-complete: "settled"
review__synthesize:
  ready: true
  action: none
  findings_summary: "stub: clean"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
review__publish:
  ready: true
  action: none
  findings_summary: "stub: clean"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
simplify__simplify: { findings: false }
ci:
  state: green
  summary: "stub: all checks green; marked ready"
fixture:
  expect: completed
  reached: [deliver__outcome, outcome]
exec-code: true
