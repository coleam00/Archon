name: archon-deliver-block
description: |
  The delivery tail, autonomous on its green path. Capped rounds of implement
  (focused checks only; CI is the full validation), draft PR, and a review at the
  depth its risk earns. Once a review passes, simplify judges the structure once,
  the implementer adopts or declines its findings, a light review checks what
  that changed, and one CI agent marks the PR ready on green. Open review findings, a CI red the change caused, or a conflict
  with the base send the work back to implement for another round, which merges
  the base on a conflict; every other ending is not ready, with
  its reason. A red PR never stays ready. The PR description is updated once the
  rounds end, and the report relays discoveries to the operator on every ending,
  a failure included. Composing callers own any attention decision.

  Use when: decided work should become a reviewed, ready-to-merge PR —
  "deliver this plan", "take this to a PR", "build and ship this".
  NOT for: deciding what to build, or merging (always human).

inputs:
  pull_request:
    default: ""
    description: >-
      The number of an open pull request this delivery continues instead of opening
      one, as a caller resolved it. Empty or `null` when the caller names none; the
      run can still continue one it was launched onto.
  work:
    default: ""
    description: >-
      What to deliver — a plan path, findings, a description, or the repair of
      an existing pull request when this run was launched on its branch
      (`--adopt`, or from the pull request). Empty means the run's trigger
      message is the work.
  part:
    default: ""
    description: >-
      The part of an approved multi-part plan this delivery is, forwarded
      unchanged to every review in the rounds. archon-review's `part` input
      owns its shape. Empty delivers the whole contract.
  # Error review can be forced on or off; `auto` leaves it to review's route agent.
  errors:
    default: "auto"
    description: Silent-failure lens — auto, true, or false.

# A composed caller reads the report: ready with the pull request's URL, or not
# ready with the reason the rounds ended. Not ready is a valid completion, like
# `delivered: false` in the callers. A delivery that broke still completes the
# report, not ready with reason `failed`, and the run still fails, naming the node
# that failed.
returns: report
outcome_field: ready

nodes:
  # Refuses the run before any agent spends when the selected forge source cannot
  # act: no plugin for the host, no usable credential, or an unauthenticated gh.
  - id: forge
    script: forge-check
    runtime: bun
    output_format:
      type: object
      properties:
        source: { type: string, enum: [gh, forge] }
      required: [source]

  # One round: implement → draft PR → review → (simplify → reshape → rereview → CI). Open
  # review findings, or a red CI the change caused, start another round. Each
  # round's implementer is a fresh agent that reads the previous round's review
  # report and ci.md, and each later round's review reads only its delta. The pr step runs every round, so every round's commits are
  # pushed before the review reads the pull request's remote head.
  - id: rounds
    depends_on: [forge]
    loop_group:
      until_bash: |
        done=$round.output.done
        test "$done" = "true"
      # round caps itself one below this, so the cap ends typed instead of failing.
      max_iterations: 5
      fresh_context: true
      nodes:
        - id: implement
          include: archon-implement
          with:
            work: >-
              Deliver the accepted work order below. On the first round, build it.

              Result of this run's previous delivery round (empty on the first
              round): $LOOP_PREV.round.output.summary

              On a later round, correct what that round left, within the work
              order. Judge every open finding recorded in
              $ARTIFACTS_DIR/review/report.md: read it and the work order in full
              before editing. Fix every blocking finding, or decline it only with
              the evidence that it is not a finding: it is wrong, already
              satisfied, or its smaller shape changes behavior. Fix a note, or
              decline it with a one-line reason. The following review judges
              every decline. A finding unrelated to this change is a follow-up,
              not work for this round: say so and record it as a discovery. When a
              causal finding records a finite affected-member inventory, the
              finding is not fixed until every affected member is handled and the
              smallest relevant proof passes. Do not cross an explicit boundary to
              make a finding disappear; the following review must return replan if
              the requested outcome requires that expansion. When
              $ARTIFACTS_DIR/ci.md records CI red that this change caused on the
              pull request's current head, fix that too, at its cause, never by
              weakening a test. Removing or replacing a test this pull request
              added, when ci.md says it fails on its own cost, fixes the cause.
              When it records a conflict with the base, merge the
              base branch into this branch with a normal merge commit, never a
              rebase, and resolve every conflict it names. Record every disposition — fixed, declined with its
              reason or evidence, or unrelated — in implementation.md.

              Accepted work order:
              $INPUTS.work

        # Red the change did not cause still goes to review; CI judges it again.
        - id: pr
          include: archon-pr
          depends_on: [implement]
          when: "$implement.output.green == true || $implement.output.red_cause == 'inherited' || $implement.output.red_cause == 'environment'"
          with:
            draft: "true"
            pull_request: "$INPUTS.pull_request"

        - id: review
          include: archon-review-block
          depends_on: [pr]
          with:
            # The PR node's structured read-back names the pull request, so review
            # never rediscovers an ambient branch→PR mapping. It does not name the
            # commit: every round reviews the checkout's HEAD, which archon-review
            # checks against this PR's remote head before publishing.
            scope: "$pr.output"
            # A later round reviews only the delta since the previous round's
            # published report: the code lens, plus every lens route selects for an
            # open prior finding or the delta's area, after review findings; the code
            # lens alone after a CI fix.
            prior_report: "$LOOP_PREV.round.output.prior_report"
            light: "$LOOP_PREV.round.output.light_review"
            work_order: "$INPUTS.work"
            part: "$INPUTS.part"
            errors: "$INPUTS.errors"

        # After a review passes, before CI. Once per run: a later round finds the
        # earlier shape.md and declares no findings (see simplify.md).
        - id: simplify
          include: archon-simplify
          depends_on: [review]
          when: "$review.output.ready == true"
          with:
            work_order: "$INPUTS.work"

        - id: reshape
          include: archon-implement
          depends_on: [simplify]
          when: "$simplify.output.findings == true"
          with:
            work: >-
              Judge the smaller shapes recorded in $ARTIFACTS_DIR/shape.md against
              the accepted work order below. Adopt every finding whose smaller
              shape keeps the required outcome and the behavior the project
              supported before this change, and that the project's values back;
              decline one only with that evidence. Record each disposition in
              implementation.md. Keep the requested outcome and its tests intact.
              Then commit and push to the pull request's head branch,
              $pr.output.head, whatever the green state: CI judges the pushed head
              next. Name the branch explicitly (`git push <remote>
              HEAD:refs/heads/<branch>`), never let git pick an upstream, and never
              force-push.

              Accepted work order:
              $INPUTS.work

        # Reshape commits after review passed, so its delta is reviewed before CI, by
        # the light review a CI fix gets: the code lens alone, on the delta.
        - id: rereview
          include: archon-review-block
          depends_on: [reshape]
          with:
            scope: "$pr.output"
            prior_report: "$ARTIFACTS_DIR/review/report.md"
            light: "true"
            work_order: "$INPUTS.work"
            part: "$INPUTS.part"
            errors: "$INPUTS.errors"

        # CI is the project's full validation: implementers run only focused checks.
        # Fresh: CI reads the PR, not simplify's or reshape's conversation.
        - id: ci
          command: ci
          model: medium
          context: fresh
          mutates_checkout: false
          depends_on: [review, simplify, rereview]
          trigger_rule: none_failed_min_one_success
          with:
            pr: "$pr.output"
            source: "$forge.output.source"
          # `&&` short-circuits, so a skipped node's output is never read.
          when: "$review.output.ready == true && $simplify.output.findings == false || $review.output.ready == true && $simplify.output.findings == true && $rereview.output.ready == true"
          output_format:
            type: object
            properties:
              state: { type: string, enum: [green, pr_caused, other] }
              # Whether the agent re-ran failed jobs it judged other, and how that ended.
              rerun: { type: string, enum: [none, green, red] }
              summary: { type: string, pattern: '\S' }
            required: [state, rerun, summary]

        # `until_bash` and the loop's output cannot read a skipped node, so this joins
        # the round's verdicts into the value the loop decides on.
        - id: round
          script: round
          runtime: bun
          depends_on: [implement, pr, review, rereview, ci]
          trigger_rule: all_done
          with:
            previous: "$LOOP_PREV.round.output.round"
            prior_report: "$LOOP_PREV.round.output.prior_report"
            previous_pr_url: "$LOOP_PREV.round.output.pr_url"
            previous_contract_left: "$LOOP_PREV.round.output.contract_left"
            green: "$implement.output.green"
            red_cause: "$implement.output.red_cause"
            implement_summary: "$implement.output.summary"
            pr_url: { from: "$pr.output.url", if_skipped: null }
            review_ready: { from: "$review.output.ready", if_skipped: null }
            review_action: { from: "$review.output.action", if_skipped: null }
            review_summary: { from: "$review.output.findings_summary", if_skipped: null }
            review_contract_left: { from: "$review.output.contract_left", if_skipped: null }
            rereview_ready: { from: "$rereview.output.ready", if_skipped: null }
            rereview_action: { from: "$rereview.output.action", if_skipped: null }
            rereview_summary: { from: "$rereview.output.findings_summary", if_skipped: null }
            rereview_contract_left: { from: "$rereview.output.contract_left", if_skipped: null }
            ci: { from: "$ci.output.state", if_skipped: null }
            ci_rerun: { from: "$ci.output.rerun", if_skipped: null }
            ci_summary: { from: "$ci.output.summary", if_skipped: null }
          output_format:
            type: object
            properties:
              round: { type: integer }
              done: { type: boolean }
              ready: { type: boolean }
              reason:
                type: string
                enum: [delivered, implement_blocked, review_open, replan, needs_human, ci_pr_caused, ci_other, round_cap]
              pr_url: { type: string }
              prior_report: { type: string }
              # A correction for CI gets a light review: the code lens alone.
              light_review: { type: boolean }
              ci_rerun: { type: string, enum: [none, green, red] }
              # The latest review's `contract_left`; null until a review judged coverage.
              contract_left: { type: [array, 'null'], items: { type: string } }
              summary: { type: string }
            required: [round, done, ready, reason, pr_url, prior_report, light_review, ci_rerun, contract_left, summary]

  # Corrections and the base merge can falsify claims the description made when the
  # draft opened, and an implementer can pass red the description must disclose. One
  # agent reads the live description and the final diff, and edits only what is no
  # longer true. It also links the issue by the latest review's coverage: closing
  # only when nothing is left. It runs once the rounds have ended, never per round.
  - id: update-pr-body
    command: update-pr-body
    model: medium
    depends_on: [rounds]
    when: "$rounds.output.pr_url != ''"
    with:
      pr: "$rounds.output.pr_url"
      contract_left: "$rounds.output.contract_left"
      source: "$forge.output.source"
    output_format:
      type: object
      properties:
        changed: { type: boolean }
        summary: { type: string, pattern: '\S' }
      required: [changed, summary]

  # Composes the success-path report (scripts/outcome.ts): ready with the pull
  # request's URL, or not ready with why. `report` relays it.
  - id: outcome
    script: outcome
    runtime: bun
    depends_on: [rounds, update-pr-body]
    trigger_rule: none_failed_min_one_success
    with:
      rounds: { from: "$rounds.output" }

  # The workflow's terminal report on every ending. A node failure skips `outcome`
  # (never fails it), so `all_done` still runs this node and the binding reads null.
  # `always_run` because it reads discoveries its dependency edge does not carry.
  - id: report
    script: report
    runtime: bun
    always_run: true
    depends_on: [outcome]
    trigger_rule: all_done
    with:
      outcome: { from: "$outcome.output", if_skipped: null }
    output_format:
      type: object
      properties:
        ready: { type: boolean }
        reason:
          type: string
          enum: [delivered, implement_blocked, review_open, replan, needs_human, ci_pr_caused, ci_other, round_cap, failed]
        # The pull request, ready or not; '' when no round opened one, or when a node
        # failure kept the report from learning it.
        pr_url: { type: string }
        # The last round's CI re-run: none, or how the one re-run of failed jobs ended.
        ci_rerun: { type: string, enum: [none, green, red] }
        summary: { type: string }
      required: [ready, reason, pr_url, ci_rerun, summary]
