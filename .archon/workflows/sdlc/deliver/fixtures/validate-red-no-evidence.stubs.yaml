# Dry-run fixture: the project gate applies the same evidence rule as the gate
# before it (--exec-code, so the real gate script decides). A full gate that comes
# back red, calls the red environmental, and says nothing about which check failed
# stops the run — the caveat it would record tells a reader nothing to act on.
impl__record-start: '{"start":"recorded"}'
impl__implement:
  done: true
  green: true
  summary: "stub: implemented and green on the checks it ran"
impl__assert-changed: "3 files changed"
pr__pr: { number: 9, url: "https://github.com/example/repo/pull/9", head: "fixture-branch", base: "dev", is_draft: true }
classify:
  errors: false
  docs: false
  reasons:
    errors: "stub: no failure paths"
    docs: "stub: no doc-facing changes"
resolve-scope: '{"errors":"false"}'
review__mode: '{"continuation":false}'
review__scope: "PR diff in scope; head sha stubbed"
review__code: "0 findings"
review__seams: "0 findings"
review__simplify: "0 findings"
review__tests: "0 findings"
review__synthesize:
  ready: true
  action: none
  findings_summary: "stub: clean on initial review"
validate__validate:
  green: false
  red_cause: environment
  summary: ""
fixture:
  expect: failed
  fail-node: gate-validated
  reached: [pr__pr, review__synthesize]
exec-code: true
