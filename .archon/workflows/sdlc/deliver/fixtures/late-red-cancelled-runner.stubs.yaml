# Dry-run fixture: CI never ran the change. Two jobs are cancelled because no
# hosted runner was acquired, everything downstream is skipped, and only the
# summary job reports failure. The re-run agent re-runs them once, CI cancels them
# again, and the classifier says environment. That is no code red: no fix runs,
# the pull request goes back to draft, and the run pauses for the operator to
# re-run the checks and resume.
impl__implement:
  done: true
  green: true
  red_cause: ""
  summary: "stub: implemented and green"
impl__assert-changed: "3 files changed"
# The gates are deliberately unstubbed: the real gate scripts decide.
pr__prepare: { repo: { host: "github.com", path: "example/repo" }, head_repo: { host: "github.com", path: "example/repo" }, head: "fixture-branch", base: "dev", existing: null, title: "stub: title", body: { type: archon_artifact, run_id: "fixture-run", path: "pr-body.md" }, conflicts: [], summary: "stub: the base had not moved" }
pr__synced: { recorded: true }
pr__publish: { schemaVersion: 1, repo: { host: "github.com", path: "example/repo" }, number: 10, url: "https://github.com/example/repo/pull/10", head: "fixture-branch", base: "dev", is_draft: true, state: "open", head_repo: { host: "github.com", path: "example/repo" }, head_revision: "fixturehead", base_revision: "fixturebase", maintainer_can_modify: null }
discover-ci: { expected_checks: [], logs_reachable: true, evidence: "stub: no checks gate a merge here" }
review-policy: { risks: "fixture-owned-policy" }
classify:
  tier: full
  errors: false
  docs: false
  reasons:
    tier: "stub: touches persisted state"
    errors: "stub: no failure paths"
    docs: "stub: no doc-facing changes"
resolve-scope: '{"errors":"false"}'
review__mode: '{"continuation":false,"head":"fixturehead","cursor":"","risks":"fixture-owned-policy"}'
review__coverage: { full: true, errors: false, docs: false, lenses: [seams, code, tests, simplify] }
review__scope:
  # PR diff in scope; head sha stubbed
  docs: false
  pr: { repo: { host: "github.com", path: "example/repo" }, number: 10 }
review__code: "0 findings"
review__simplify__simplify: { findings: false }
review__simplify__prune-scratch: "prune-scratch: removed 0 scratch worktree(s)"
review__seams: "0 findings"
shape__simplify: { findings: false }
shape__prune-scratch: "prune-scratch: removed 0 scratch worktree(s)"
review__tests: "0 findings"
review__lens-status: { required: [seams, code, tests, simplify], completed: [seams, code, tests, simplify], missing: [] }
review__prune-scratch: "prune-scratch: removed 0 scratch worktree(s)"
review__synthesize:
  ready: true
  action: none
  findings_summary: "stub: clean on initial review; CI still running"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
  discoveries: []
review__publish:
  ready: true
  action: none
  findings_summary: "stub: clean on initial review; CI still running"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
  discoveries: []
validate__discover: { checks: [{ name: "project gate", argv: ["stub-gate"], group: "gate" }], notes: "stub: the project's aggregate gate" }
validate__run: { status: green, summary: "stub: full gate green" }
ci-probe: '{"state":"red","detail":"non-green checks: changes (cancelled), workflow-fixtures (cancelled), Test Suite (failure)","cancelled":["changes","workflow-fixtures"]}'
ci-verdict: '{"state":"red","detail":"non-green checks: changes (cancelled), workflow-fixtures (cancelled), Test Suite (failure)","cancelled":["changes","workflow-fixtures"]}'
ci-rerun: { requested: true, reason: "stub: two checks were cancelled before a runner was acquired; re-ran the failed and cancelled jobs" }
# CI cancels them again: the re-run reproduced no failure.
rerun-probe: '{"state":"red","detail":"non-green checks: changes (cancelled), workflow-fixtures (cancelled), Test Suite (failure)","cancelled":["changes","workflow-fixtures"]}'
ci-reverdict: '{"state":"red","detail":"non-green checks: changes (cancelled), workflow-fixtures (cancelled), Test Suite (failure)","cancelled":["changes","workflow-fixtures"]}'
ci-changed: '{"files":["packages/core/src/feature.ts"]}'
# The worst claim a classifier could pair with it: a re-run that "fails". The real
# ci-cause still keeps it environment, because a cancelled check never ran and no
# failure points at a file.
ci-classify:
  failing_checks: ["changes", "workflow-fixtures", "Test Suite"]
  failing_paths: []
  base: passes
  rerun: fails
  claim: environment
  evidence: "stub: changes and workflow-fixtures were cancelled when no hosted runner was acquired, every downstream job was skipped, and Test Suite failed only because of them; the re-run was cancelled the same way"
fix-ci-probe: '{"state":"red","detail":"non-green checks: changes (cancelled), workflow-fixtures (cancelled), Test Suite (failure)","cancelled":["changes","workflow-fixtures"]}'
attention-ci-probe: '{"state":"red","detail":"non-green checks: changes (cancelled), workflow-fixtures (cancelled), Test Suite (failure)","cancelled":["changes","workflow-fixtures"]}'
file-discoveries: '{"records":[]}'
match-discoveries: { matches: [] }
fork: '{"fork":true}'
flip-ready: { pr_url: "https://github.com/example/repo/pull/10" }
mark-draft: "mark-draft: the pull request is a draft while CI stays red"
publish-pr-body: {}
fixture:
  expect: paused
  reached: [ci-rerun, rerun-probe, ci-classify, ci-cause, gate-ci-fix, ci-attention-route, mark-draft, attention-ci-probe]
  resolved-text-contains:
    attention-ci-pause: "after Archon classified the failure as environment"
exec-code: true
