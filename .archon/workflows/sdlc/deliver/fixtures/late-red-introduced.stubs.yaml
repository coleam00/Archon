# Dry-run fixture: ready, red, fixed, green. The pull request is marked ready once
# the work is done, then a branch-introduced check concludes red at the single CI
# wait. The run routes the red into the one CI fix pass, and the re-wait carries
# it to confirm-ready on a green head (--exec-code, so the real gates and route
# scripts decide).
#
# ci-probe reports the late red as a STATE, ci-verdict classifies it, ci-fix
# corrects and pushes, the re-wait
# concludes green, and the ready claim is confirmed. flip-ready stays stubbed as every
# fixture must: exec-code runs bash for real and this worktree's origin is a
# real repository — an unstubbed flip would be a live public action.
impl__implement:
  done: true
  green: true
  red_cause: ""
  summary: "stub: implemented and green"
impl__assert-changed: "3 files changed"
# gate-green, gate-validated, and gate-ci-fix are deliberately unstubbed: the
# real gates must accept this run at every gate it reaches.
pr__prepare: { repo: { host: "github.com", path: "example/repo" }, head_repo: { host: "github.com", path: "example/repo" }, head: "fixture-branch", base: "dev", existing: null, title: "stub: title", body: { type: archon_artifact, run_id: "fixture-run", path: "pr-body.md" }, conflicts: [], summary: "stub: the base had not moved" }
pr__synced: { recorded: true }
pr__publish: { schemaVersion: 1, repo: { host: "github.com", path: "example/repo" }, number: 9, url: "https://github.com/example/repo/pull/9", head: "fixture-branch", base: "dev", is_draft: true, state: "open", head_repo: { host: "github.com", path: "example/repo" }, head_revision: "fixturehead", base_revision: "fixturebase", maintainer_can_modify: null }
discover-ci: { expected_checks: [], logs_reachable: true, evidence: "stub: no checks gate a merge here" }
review-policy: { risks: "fixture-owned-policy" }
classify:
  tier: full
  errors: false
  docs: false
  reasons:
    tier: "stub: touches persisted state"
    errors: "stub: no failure paths"
    docs: "stub: no doc-facing changes"
resolve-scope: '{"errors":"false"}'
review__mode: '{"continuation":false,"head":"fixturehead","cursor":"","risks":"fixture-owned-policy"}'
review__coverage: { full: true, errors: false, docs: false, lenses: [seams, code, tests, simplify] }
review__scope:
  # PR diff in scope; head sha stubbed
  docs: false
  pr: { repo: { host: "github.com", path: "example/repo" }, number: 9 }
review__code: "0 findings"
review__simplify__simplify: { findings: false }
review__simplify__prune-scratch: "prune-scratch: removed 0 scratch worktree(s)"
review__seams: "0 findings"
shape__simplify: { findings: false }
shape__prune-scratch: "prune-scratch: removed 0 scratch worktree(s)"
review__tests: "0 findings"
review__lens-status: { required: [seams, code, tests, simplify], completed: [seams, code, tests, simplify], missing: [] }
review__prune-scratch: "prune-scratch: removed 0 scratch worktree(s)"
review__synthesize:
  ready: true
  action: none
  findings_summary: "stub: clean on initial review; CI still running"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
  discoveries: []
review__publish:
  ready: true
  action: none
  findings_summary: "stub: clean on initial review; CI still running"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
  discoveries: []
validate__discover: { checks: [{ name: "project gate", argv: ["stub-gate"], group: "gate" }], notes: "stub: the project's aggregate gate" }
validate__run: { status: green, summary: "stub: full gate green" }
ci-probe: '{"state":"red","detail":"test (windows-latest) (fail)"}'
ci-verdict: '{"state":"red","detail":"test (windows-latest) (fail)"}'
ci-rerun: { requested: false, reason: "stub: no re-run warranted" }
ci-reverdict: '{"state":"red","detail":"test (windows-latest) (fail)"}'
ci-changed: '{"files":["packages/core/src/feature.ts","packages/core/src/feature.test.ts"]}'
ci-classify:
  failing_checks: ["test (windows-latest)"]
  failing_paths: ["packages/core/src/feature.test.ts"]
  base: passes
  rerun: not_rerun
  claim: introduced
  evidence: "stub: the new test fails on Windows; the base passes"
ci-fix__implement:
  done: true
  green: true
  red_cause: ""
  summary: "stub: the branch's new test asserted an unsorted order; fixed at the cause and pushed"
ci-fix__assert-changed: "1 file changed"
ci-delta-scope: '{"moved":false}'
fix-ci-probe: '{"state":"concluded","detail":"all 9 required check(s) green"}'
fix-verdict: '{"state":"concluded","detail":"all 9 required check(s) green"}'
