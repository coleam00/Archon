# Dry-run fixture: a correction whose red came from the machine, not the code,
# keeps its round instead of throwing it away (--exec-code, so both real gate
# scripts decide). Parallel runs held the same database, one spec failed for
# it, and the delivery was correct.
#
# The initial gate takes the ordinary green route; the correction gate takes the
# passed-red route. Contention is transient, so the later project gate is green
# and the run flips the PR — the whole outcome the boolean gate used to destroy.
impl__record-start: '{"start":"recorded"}'
impl__implement:
  done: true
  green: true
  summary: "stub: implemented and green"
impl__assert-changed: "3 files changed"
pr__pr: { number: 7, url: "https://github.com/example/repo/pull/7", head: "fixture-branch", base: "dev", is_draft: true }
classify:
  errors: false
  docs: false
  reasons:
    errors: "stub: no failure paths"
    docs: "stub: no doc-facing changes"
resolve-scope: '{"errors":"false"}'
review__mode: '{"continuation":false}'
review__scope: "PR diff in scope; head sha stubbed"
review__code: "1 Important finding"
review__seams: "0 findings"
review__simplify: "0 findings"
review__tests: "0 findings"
review__synthesize:
  ready: false
  action: correct
  findings_summary: "stub: one Important finding open"
ci-note: "CI state for this pull request (head abc123def456): No concluded failures."
fix__record-start: '{"start":"recorded"}'
fix__implement:
  done: true
  green: false
  red_cause: environment
  summary: "stub: the finding is fixed; one spec failed on a sqlite lock a sibling run held"
fix__assert-changed: "1 file changed"
# gate-green and gate-correction-green are deliberately unstubbed: the real script
# takes the green route at the first and the passed-red route at the second.
recheck__mode: '{"continuation":true}'
recheck__scope: "light mode; delta since cursor"
recheck__synthesize:
  ready: true
  action: none
  findings_summary: "stub: the correction closed the finding"
sync-pr-body: "body resynced, and the environment red disclosed"
validate__validate:
  green: true
  summary: "stub: the contention cleared; full gate green"
gate-validated: '{"gate":"green"}'
ci-probe: '{"state":"concluded","detail":"all checks green"}'
ci-verdict: '{"state":"concluded","detail":"all checks green"}'
flip-ready: "https://github.com/example/repo/pull/7"
outcome: "https://github.com/example/repo/pull/7"
fixture:
  expect: completed
  reached: [gate-correction-green, flip-ready]
exec-code: true
