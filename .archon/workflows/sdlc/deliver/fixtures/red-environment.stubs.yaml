outcome: { ready: true, pr_url: "https://github.com/example/repo/pull/7", summary: "https://github.com/example/repo/pull/7" }
file-discoveries: '{"records":[]}'
match-discoveries: { matches: [] }
fork: '{"fork":true}'
fixture:
  expect: completed
  reached: [gate-correction-green, flip-ready, outcome]
exec-code: true
