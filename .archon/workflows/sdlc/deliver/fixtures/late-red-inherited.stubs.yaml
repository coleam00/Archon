publish-pr-body: {}
fixture:
  expect: paused
  reached: [ci-verdict, ci-cause, ci-fix__implement, gate-ci-fix, push-ci-fix, fix-verdict, fix-classify, gate-fix-result, ci-attention-route, mark-draft, attention-ci-probe]
  resolved-text-contains:
    attention-ci-pause: "pull request #10 after Archon classified the failure as inherited: e2e-smoke (fail) Re-run the failing check, then resume this run."
exec-code: true
