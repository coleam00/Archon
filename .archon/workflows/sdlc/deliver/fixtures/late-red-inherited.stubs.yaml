# Dry-run fixture: CI concludes red after the
# review converged, but the red is inherited — the branch did not cause it: the
# failing file is one the PR does not change, and the same check fails on the
# base commit. The real ci-cause accepts the claim, no correction pass runs, the
# gate passes with the evidence recorded, and the run pauses with the
# rerun-and-resume action visible. The fixture pins the route: classification
# instead of a probe death, then one fresh check read and an action-required
# wait rather than flip-ready.
impl__implement:
  done: true
  green: true
  red_cause: ""
  summary: "stub: implemented and green"
impl__assert-changed: "3 files changed"
# gate-green, gate-validated, and gate-ci-fix are deliberately unstubbed: the
# real gates must accept the inherited classification.
pr__pr: { intent: "/fixture/pr-intent.json" }
pr__publish: { schemaVersion: 1, repo: { host: "github.com", path: "example/repo" }, number: 10, url: "https://github.com/example/repo/pull/10", head: "fixture-branch", base: "dev", is_draft: true, state: "open", head_repo: { host: "github.com", path: "example/repo" }, head_revision: "fixturehead", base_revision: "fixturebase", maintainer_can_modify: null }
review-policy: { risks: "fixture-owned-policy" }
classify:
  tier: full
  errors: false
  docs: false
  reasons:
    tier: "stub: touches persisted state"
    errors: "stub: no failure paths"
    docs: "stub: no doc-facing changes"
resolve-scope: '{"errors":"false"}'
review__mode: '{"continuation":false,"head":"fixturehead","cursor":"","risks":"fixture-owned-policy","execution":{"path":"review__mode","invocation":{"loopPath":[]}}}'
review__coverage: { full: true }
review__scope:
  # PR diff in scope; head sha stubbed
  docs: false
  pr: { repo: { host: "github.com", path: "example/repo" }, number: 10 }
review__code: "0 findings"
review__simplify__simplify: { findings: false }
review__seams: "0 findings"
shape__simplify: { findings: false }
review__tests: "0 findings"
review__synthesize:
  ready: true
  action: none
  findings_summary: "stub: clean on initial review; CI still running"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
review__publish:
  ready: true
  action: none
  findings_summary: "stub: clean on initial review; CI still running"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
validate__discover: { checks: [{ name: "project gate", argv: ["stub-gate"] }], notes: "stub: the project's aggregate gate" }
validate__run: { status: green, summary: "stub: full gate green" }
ci-probe: '{"state":"red","detail":"e2e-smoke (fail)"}'
ci-verdict: '{"state":"red","detail":"e2e-smoke (fail)"}'
ci-changed: '{"files":["packages/core/src/feature.ts","packages/core/src/feature.test.ts"]}'
ci-classify:
  failing_checks: ["e2e-smoke"]
  failing_paths: ["e2e/smoke.spec.ts"]
  base: fails
  rerun: not_rerun
  claim: inherited
  evidence: "stub: e2e-smoke fails the same way on the base commit"
fix-ci-probe: '{"state":"red","detail":"e2e-smoke (fail)"}'
attention-ci-probe: '{"state":"red","detail":"e2e-smoke (fail)"}'
file-discoveries: '{"issues":[]}'
fork: '{"fork":true}'
fixture:
  expect: paused
  reached: [review__synthesize, gate-validated, ci-verdict, ci-cause, gate-ci-fix, fix-ci-probe, ci-attention-route, attention-ci-probe]
  resolved-text-contains:
    attention-ci-pause: "pull request #10 after Archon classified the failure as inherited: e2e-smoke (fail) Re-run the failing check, then resume this run."
exec-code: true
