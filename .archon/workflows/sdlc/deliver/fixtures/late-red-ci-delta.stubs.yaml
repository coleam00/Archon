# Dry-run fixture: a late branch-introduced red is fixed, and the structure pass
# over the CI fix's own commits finds a smaller shape. One implementation pass
# judges it and pushes before the re-wait, whose probe then reads the final head
# (--exec-code, so the real gates decide). The fix's structure is never reviewed
# by a review round; this pass is its only structural check.
impl__implement:
  done: true
  green: true
  red_cause: ""
  summary: "stub: implemented and green"
impl__assert-changed: "3 files changed"
# gate-green, gate-validated, and gate-ci-fix are deliberately unstubbed: the
# real gates must accept this run at every gate it reaches.
pr__pr: { intent: "/fixture/pr-intent.json" }
pr__publish: { schemaVersion: 1, repo: { host: "github.com", path: "example/repo" }, number: 9, url: "https://github.com/example/repo/pull/9", head: "fixture-branch", base: "dev", is_draft: true, state: "open", head_repo: { host: "github.com", path: "example/repo" }, head_revision: "fixturehead", base_revision: "fixturebase", maintainer_can_modify: null }
classify:
  tier: full
  errors: false
  docs: false
  reasons:
    tier: "stub: touches persisted state"
    errors: "stub: no failure paths"
    docs: "stub: no doc-facing changes"
resolve-scope: '{"errors":"false","simplify":"false"}'
review__mode: '{"continuation":false}'
review__scope:
  # PR diff in scope; head sha stubbed
  docs: false
  pr: { repo: { host: "github.com", path: "example/repo" }, number: 9 }
review__code: "0 findings"
review__seams: "0 findings"
shape__simplify: { findings: false }
review__tests: "0 findings"
review__synthesize:
  ready: true
  action: none
  findings_summary: "stub: clean on initial review; CI still running"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
review__publish:
  ready: true
  action: none
  findings_summary: "stub: clean on initial review; CI still running"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
validate__discover: { checks: [{ name: "project gate", argv: ["stub-gate"] }], quarantine: [], notes: "stub: the project's aggregate gate" }
validate__run: { status: green, summary: "stub: full gate green" }
ci-probe: '{"state":"red","detail":"test (windows-latest) (fail)"}'
ci-verdict: '{"state":"red","detail":"test (windows-latest) (fail)"}'
ci-fix__implement:
  done: true
  green: true
  red_cause: ""
  summary: "stub: the branch's new test asserted an unsorted order; fixed at the cause and pushed"
ci-fix__assert-changed: "1 file changed"
ci-delta-scope: '{"moved":true,"base":"fixturehead"}'
ci-delta__simplify: { findings: true }
ci-reshape__implement:
  done: true
  green: true
  red_cause: ""
  summary: "stub: adopted the smaller shape for the CI fix"
ci-reshape__assert-changed: "1 file changed"
fix-ci-probe: '{"state":"concluded","detail":"all 9 required check(s) green"}'
flip-ready: { pr_url: "https://github.com/example/repo/pull/9" }
outcome: { pr_url: "https://github.com/example/repo/pull/9", summary: "https://github.com/example/repo/pull/9" }
delta-scope: '{"moved":false,"base":"fixturehead"}'
polish-scope: '{"polish":false}'
file-discoveries: '{"issues":[]}'
fork: '{"fork":true}'
fixture:
  expect: completed
  reached: [gate-ci-fix, ci-delta__simplify, ci-reshape__implement, gate-ci-reshape, fix-ci-probe, flip-ready]
exec-code: true
