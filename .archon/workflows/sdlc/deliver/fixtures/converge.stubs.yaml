# Dry-run fixture: the initial review finds blockers, one correction runs green,
# its continuation review is ready, and the run flips the PR. `until_bash` is not
# executed by dry-run, so the simulator honestly assumes completion after this
# structurally exercised iteration; real multi-iteration convergence is dogfood.
#
# This is also the classifier-selects-errors path: `classify` says the diff has
# failure paths, the operator declared nothing, and resolve-scope is left unstubbed
# so the real script adopts that judgment. `reached` proves the lens actually ran.
impl__record-start: '{"start":"recorded"}'
impl__implement:
  done: true
  green: true
  summary: "stub: implemented and green"
impl__assert-changed: "3 files changed"
gate-green: '{"gate":"green"}'
pr__pr: { number: 1, url: "https://github.com/example/repo/pull/1", head: "fixture-branch", base: "dev", is_draft: true }
review__mode: '{"continuation":false}'
review__scope: "PR diff in scope; head sha stubbed"
review__code: "2 findings (Important)"
review__seams: "0 findings"
review__simplify: "0 findings"
review__tests: "0 findings"
review__errors: "0 findings"
review__synthesize:
  ready: false
  action: correct
  findings_summary: "stub: 3 Important findings open"
ci-note: "CI state for this pull request (head abc123def456): No concluded failures. 2 check(s) still running — never wait on them."
fix__record-start: '{"start":"recorded"}'
fix__implement:
  done: true
  green: true
  summary: "stub: findings fixed, pushed"
fix__assert-changed: "2 files changed"
gate-correction-green: '{"gate":"green"}'
recheck__mode: '{"continuation":true}'
recheck__scope: "light mode; delta since cursor"
# No recheck specialist stubs: continuation mode must skip the fan-out and let
# the deciding agent review the prior report and correction delta itself.
recheck__synthesize:
  ready: true
  action: none
  findings_summary: "stub: no open Critical/Important"
# gate-ready is deliberately unstubbed: under --exec-code the real script runs,
# proving the $corrections.output whole-ref binding on a completed loop_group.
sync-pr-body: "body resynced: corrected the claims the correction round falsified"
validate__validate:
  green: true
  summary: "stub: full gate green"
gate-validated: '{"gate":"green"}'
ci-probe: '{"state":"concluded","detail":"all 2 check(s) green"}'
ci-verdict: '{"state":"concluded","detail":"all 2 check(s) green"}'
flip-ready: "https://github.com/example/repo/pull/1"
outcome: "https://github.com/example/repo/pull/1"
classify:
  errors: true
  docs: false
  reasons:
    errors: "stub: the diff adds a retry and a fallback"
    docs: "stub: no doc-facing changes"
fixture:
  expect: completed
  reached: [review__errors, ci-note]
exec-code: true
