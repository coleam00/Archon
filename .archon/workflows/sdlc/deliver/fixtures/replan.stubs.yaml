  action: replan
  findings_summary: "stub: requested outcome requires crossing an explicit boundary"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
review__publish:
  ready: false
  action: replan
  findings_summary: "stub: requested outcome requires crossing an explicit boundary"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
