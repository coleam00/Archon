# A proved scope conflict must not enter correction or reach validation. The
# real verdict validator accepts the combination; the real ready gate fails
# truthfully and leaves the draft PR plus canonical report intact, and the
# discoveries that come with the replan are still filed.
impl__implement:
  done: true
  green: true
  red_cause: ""
  summary: "stub: implemented inside the accepted contract"
impl__assert-changed: "2 files changed"
gate-green: '{"gate":"green","red_cause":"","stage":"The implementation","summary":"","head":null}'
pr__prepare: { repo: { host: "github.com", path: "example/repo" }, head_repo: { host: "github.com", path: "example/repo" }, head: "fixture-branch", base: "dev", existing: null, title: "stub: title", body: { type: archon_artifact, run_id: "fixture-run", path: "pr-body.md" }, conflicts: [], summary: "stub: the base had not moved" }
pr__synced: { recorded: true }
pr__publish: { schemaVersion: 1, repo: { host: "github.com", path: "example/repo" }, number: 3, url: "https://github.com/example/repo/pull/3", head: "fixture-branch", base: "dev", is_draft: true, state: "open", head_repo: { host: "github.com", path: "example/repo" }, head_revision: "fixturehead", base_revision: "fixturebase", maintainer_can_modify: null }
discover-ci: { expected_checks: [], logs_reachable: true, evidence: "stub: no checks gate a merge here" }
review-policy: { risks: "fixture-owned-policy" }
classify:
  tier: full
  errors: false
  docs: false
  reasons:
    tier: "stub: touches persisted state"
    errors: "stub: no failure paths"
    docs: "stub: no docs changes"
resolve-scope: '{"errors":"false"}'
review__mode: '{"continuation":false,"head":"fixturehead","cursor":"","risks":"fixture-owned-policy"}'
review__coverage: { full: true, errors: false, docs: false, lenses: [seams, code, tests, simplify] }
review__scope:
  # accepted contract and scope conflict recorded
  docs: false
  pr: { repo: { host: "github.com", path: "example/repo" }, number: 3 }
review__code: "1 blocking scope conflict"
review__simplify__simplify: { findings: false }
review__simplify__prune-scratch: "prune-scratch: removed 0 scratch worktree(s)"
review__seams: "0 findings"
shape__simplify: { findings: false }
shape__prune-scratch: "prune-scratch: removed 0 scratch worktree(s)"
review__tests: "0 findings"
review__lens-status: { required: [seams, code, tests, simplify], completed: [seams, code, tests, simplify], missing: [] }
review__prune-scratch: "prune-scratch: removed 0 scratch worktree(s)"
review__synthesize:
  ready: false
  action: replan
  findings_summary: "stub: requested outcome requires crossing an explicit boundary"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
  discoveries: []
review__publish:
  ready: false
  action: replan
  findings_summary: "stub: requested outcome requires crossing an explicit boundary"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
  discoveries: []
file-discoveries: '{"records":[{"title":"stub: the scope conflict","issue":"https://github.com/example/repo/issues/9"}]}'
match-discoveries: { matches: [] }
publish-pr-body: {}
fixture:
  expect: failed
  fail-node: gate-ready
  reached: [file-discoveries]
exec-code: true
