# A correction can uncover that the remaining blocker needs a materially wider
# work order. The loop stops on replan and gate-ready refuses the ready path;
# the discoveries are still filed.
impl__implement:
  done: true
  green: true
  red_cause: ""
  summary: "stub: initial implementation green"
impl__assert-changed: "2 files changed"
gate-green: '{"gate":"green","red_cause":"","stage":"The implementation","summary":"","head":null}'
pr__prepare: { repo: { host: "github.com", path: "example/repo" }, head_repo: { host: "github.com", path: "example/repo" }, head: "fixture-branch", base: "dev", existing: null, title: "stub: title", body: { type: archon_artifact, run_id: "fixture-run", path: "pr-body.md" }, conflicts: [], summary: "stub: the base had not moved" }
pr__synced: { recorded: true }
pr__publish: { schemaVersion: 1, repo: { host: "github.com", path: "example/repo" }, number: 6, url: "https://github.com/example/repo/pull/6", head: "fixture-branch", base: "dev", is_draft: true, state: "open", head_repo: { host: "github.com", path: "example/repo" }, head_revision: "fixturehead", base_revision: "fixturebase", maintainer_can_modify: null }
review-policy: { risks: "fixture-owned-policy" }
classify:
  tier: full
  errors: false
  docs: false
  reasons:
    tier: "stub: touches persisted state"
    errors: "stub"
    docs: "stub"
resolve-scope: '{"errors":"false"}'
review__mode: '{"continuation":false,"head":"fixturehead","cursor":"","risks":"fixture-owned-policy"}'
review__coverage: { full: true, errors: false, docs: false, lenses: [seams, code, tests, simplify] }
review__scope:
  # accepted contract recorded
  docs: false
  pr: { repo: { host: "github.com", path: "example/repo" }, number: 6 }
review__code: "1 blocking in-scope finding"
review__simplify__simplify: { findings: false }
review__simplify__prune-scratch: "prune-scratch: removed 0 scratch worktree(s)"
review__seams: "0 findings"
shape__simplify: { findings: false }
shape__prune-scratch: "prune-scratch: removed 0 scratch worktree(s)"
review__tests: "0 findings"
review__lens-status: { required: [seams, code, tests, simplify], completed: [seams, code, tests, simplify], missing: [] }
review__prune-scratch: "prune-scratch: removed 0 scratch worktree(s)"
review__synthesize:
  ready: false
  action: correct
  findings_summary: "stub: one in-scope correction"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
  discoveries: []
review__publish:
  ready: false
  action: correct
  findings_summary: "stub: one in-scope correction"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
  discoveries: []
fix__implement:
  done: true
  green: true
  red_cause: ""
  summary: "stub: correction exposed a scope conflict"
fix__assert-changed: "1 file changed"
gate-correction-green: '{"gate":"green","red_cause":"","stage":"The correction","summary":"","head":null}'
recheck__mode: '{"continuation":true,"head":"fixturehead","cursor":"fixtureprior","risks":"fixture-owned-policy"}'
recheck__coverage: { full: false, errors: false, docs: false, lenses: [] }
recheck__scope:
  # light review with original accepted contract
  docs: false
  pr: { repo: { host: "github.com", path: "example/repo" }, number: 6 }
recheck__lens-status: { required: [], completed: [], missing: [] }
recheck__prune-scratch: "prune-scratch: removed 0 scratch worktree(s)"
recheck__synthesize:
  ready: false
  action: replan
  findings_summary: "stub: remaining correction requires replanning"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
  discoveries: []
recheck__publish:
  ready: false
  action: replan
  findings_summary: "stub: remaining correction requires replanning"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
  discoveries: []
file-discoveries: '{"records":[{"title":"stub: the scope conflict","issue":"https://github.com/example/repo/issues/9"}]}'
match-discoveries: { matches: [] }
publish-pr-body: {}
fixture:
  expect: failed
  fail-node: gate-ready
  reached: [file-discoveries]
exec-code: true
