# Dry-run fixture: the validate-RED path — initial review is clean but the project
# gate fails, so the run fails at gate-validated (a dependency of flip-ready, which never runs).
# Run with --exec-code: gate-validated must EXECUTE to be seen red.
#
# The verdict below declares no `red_cause`, which makes this the guard for the
# absence case: the gate refuses red nobody explained exactly as it refuses red the
# change introduced. Declared-optional must never read as permission. The comparison
# producer is the one that can return red with an empty cause, so it stands in here.
#
# It also carries the operator-override direction of the errors lens: `classify`
# says the diff has failure paths, the operator declared `errors: false`, and the
# real resolve-scope script must let the declaration win. review__errors has no
# stub, so a lens that runs anyway fails and breaks the single-failure assertion.
impl__implement:
  done: true
  green: true
  red_cause: ""
  summary: "stub: implemented and green"
impl__assert-changed: "3 files changed"
gate-green: '{"gate":"green","red_cause":"","stage":"The implementation","summary":"","head":null}'
pr__prepare: { repo: { host: "github.com", path: "example/repo" }, head_repo: { host: "github.com", path: "example/repo" }, head: "fixture-branch", base: "dev", existing: null, title: "stub: title", body: { type: archon_artifact, run_id: "fixture-run", path: "pr-body.md" }, conflicts: [], summary: "stub: the base had not moved" }
pr__synced: { recorded: true }
pr__publish: { schemaVersion: 1, repo: { host: "github.com", path: "example/repo" }, number: 2, url: "https://github.com/example/repo/pull/2", head: "fixture-branch", base: "dev", is_draft: true, state: "open", head_repo: { host: "github.com", path: "example/repo" }, head_revision: "fixturehead", base_revision: "fixturebase", maintainer_can_modify: null }
review__mode: '{"continuation":false,"head":"fixturehead","cursor":"","risks":"fixture-owned-policy"}'
review__coverage: { full: true, errors: false, docs: false, lenses: [seams, code, tests, simplify] }
review__scope:
  # PR diff in scope; head sha stubbed
  docs: false
  pr: { repo: { host: "github.com", path: "example/repo" }, number: 2 }
review__code: "0 findings"
review__simplify__simplify: { findings: false }
review__simplify__prune-scratch: "prune-scratch: removed 0 scratch worktree(s)"
review__seams: "0 findings"
shape__simplify: { findings: false }
shape__prune-scratch: "prune-scratch: removed 0 scratch worktree(s)"
review__tests: "0 findings"
review__lens-status: { required: [seams, code, tests, simplify], completed: [seams, code, tests, simplify], missing: [] }
review__prune-scratch: "prune-scratch: removed 0 scratch worktree(s)"
review__synthesize:
  ready: true
  action: none
  findings_summary: "stub: clean on initial review"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
  discoveries: []
review__publish:
  ready: true
  action: none
  findings_summary: "stub: clean on initial review"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
  discoveries: []
# gate-ready is deliberately unstubbed: under --exec-code the real script runs,
# proving the review_ready binding and the corrections if_skipped default.
validate__mode: '{"comparison":true}'
validate__compare:
  green: false
  red_cause: ""
  summary: "stub: tests failed — 3 red"
  evidence: null
ci: { state: green, summary: "stub: every check that gates a merge passed", evidence: "stub: gh pr checks on the head commit" }
flip-ready: { pr_url: "https://github.com/example/repo/pull/2" }
review-policy: { risks: "fixture-owned-policy" }
classify:
  tier: full
  errors: true
  docs: false
  reasons:
    tier: "stub: touches persisted state"
    errors: "stub: the diff adds a retry and a fallback"
    docs: "stub: no doc-facing changes"
file-discoveries: '{"records":[]}'
match-discoveries: { matches: [] }
fork: '{"fork":true}'
publish-pr-body: {}
fixture:
  expect: failed
  fail-node: gate-validated
  reached: [review__code, review__seams, review__tests]
  inputs:
    errors: "false"
exec-code: true
