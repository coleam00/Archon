# Dry-run fixture: a failed CI pass must never leave a red pull request ready. CI
# concludes red after the pull request was marked ready, and the correction round
# ends with red it cannot explain — the real gate refuses, and confirm-ready still
# runs after the failed pass, puts the pull request back in draft and refuses
# (stubbed as that refusal: a string fails its schema). If the wiring ever skipped
# confirm-ready after a failed pass, its refusal would vanish from the failed set
# and this fixture would break (--exec-code, so the real gate decides).
#
# The other non-convergence shape, a recheck that still
# demands correction exhausting the loop's single round, cannot be pinned
# here: the dry-run simulator proceeds past an exhausted bound, so that path
# is asserted by the engine in real runs, like the corrections loop's own
# bound.
impl__implement:
  done: true
  green: true
  red_cause: ""
  summary: "stub: implemented and green"
impl__assert-changed: "3 files changed"
pr__prepare: { repo: { host: "github.com", path: "example/repo" }, head_repo: { host: "github.com", path: "example/repo" }, head: "fixture-branch", base: "dev", existing: null, title: "stub: title", body: { type: archon_artifact, run_id: "fixture-run", path: "pr-body.md" }, conflicts: [], summary: "stub: the base had not moved" }
pr__synced: { recorded: true }
pr__publish: { schemaVersion: 1, repo: { host: "github.com", path: "example/repo" }, number: 11, url: "https://github.com/example/repo/pull/11", head: "fixture-branch", base: "dev", is_draft: true, state: "open", head_repo: { host: "github.com", path: "example/repo" }, head_revision: "fixturehead", base_revision: "fixturebase", maintainer_can_modify: null }
discover-ci: { expected_checks: [], logs_reachable: true, evidence: "stub: no checks gate a merge here" }
review-policy: { risks: "fixture-owned-policy" }
classify:
