# Dry-run fixture: a correction round with nothing left to change survives its own
# guard, and the loop converges through it (--exec-code, so the real assert-changed
# and the real gates decide).
#
# The open finding is already satisfied on the branch and the only check still red was
# red at the reviewed starting commit, so the correction has no edit to make and says
# so: done, not green, `inherited`, with the check named. `fix__assert-changed` runs
# for real against a clean scratch worktree -- no content changed since the correction
# invocation started -- which is exactly the state that used to kill the round and
# discard every correction before it. The round now passes its guard, the continuation
# review certifies the branch ready, and the inherited break rides to the CI wait like
# any other, where the pull request's own checks decide.
impl__implement:
  done: true
  green: true
  red_cause: ""
  summary: "stub: implemented and green"
impl__assert-changed: "3 files changed"
# gate-green, gate-correction-green, gate-ready and gate-validated are deliberately
# unstubbed: the real scripts must accept this run at every gate it reaches.
pr__pr: { intent: "/fixture/pr-intent.json" }
pr__publish: { schemaVersion: 1, repo: { host: "github.com", path: "example/repo" }, number: 7, url: "https://github.com/example/repo/pull/7", head: "fixture-branch", base: "dev", is_draft: true, state: "open", head_repo: { host: "github.com", path: "example/repo" }, head_revision: "fixturehead", base_revision: "fixturebase", maintainer_can_modify: null }
classify:
  tier: full
  errors: false
  docs: false
  reasons:
    tier: "stub: touches persisted state"
    errors: "stub: no failure paths"
    docs: "stub: no doc-facing changes"
resolve-scope: '{"errors":"false","simplify":"false"}'
review__mode: '{"continuation":false}'
review__scope:
  # PR diff in scope; head sha stubbed
  docs: false
  pr: { repo: { host: "github.com", path: "example/repo" }, number: 7 }
review__code: "1 finding (Important)"
review__seams: "0 findings"
shape__simplify: { findings: false }
review__tests: "0 findings"
review__synthesize:
  ready: false
  action: correct
  findings_summary: "stub: 1 Important finding open"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
review__publish:
  ready: false
  action: correct
  findings_summary: "stub: 1 Important finding open"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
ci-note: "CI state for this pull request (head abc123def456): Concluded non-green checks:\n- test (windows-latest) (fail)"
fix__implement:
  done: true
  green: false
  red_cause: inherited
  summary: "stub: the finding is already satisfied on the branch and needed no edit; lint is red only for a violation present at the reviewed starting commit, in a file this diff never touches"
recheck__mode: '{"continuation":true}'
recheck__scope:
  # light mode; delta since cursor
  docs: false
  pr: { repo: { host: "github.com", path: "example/repo" }, number: 7 }
recheck__synthesize:
  ready: true
  action: none
  findings_summary: "stub: no open Critical/Important"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
recheck__publish:
  ready: true
  action: none
  findings_summary: "stub: no open Critical/Important"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
read-pr-body: { body: "/fixture/pr-body-current.md", url: "https://github.com/example/repo/pull/7" }
validate__discover: { checks: [{ name: "project gate", argv: ["stub-gate"] }], quarantine: [], notes: "stub: the project's aggregate gate" }
validate__run: { status: red, summary: "stub: a check in the project gate failed" }
validate__classify:
  red_cause: inherited
  summary: "stub: the same inherited lint break, still red on the base"
ci-probe: '{"state":"pending","detail":"stub: 1 check still running"}'
polish-scope: '{"polish":false}'
file-discoveries: '{"issues":[]}'
fork: '{"fork":true}'
fixture:
  expect: paused
  reached: [fix__assert-changed, gate-correction-green, recheck__synthesize, gate-ready, gate-validated, ci-probe]
exec-code: true
