# Dry-run fixture: the CI fix lands, and CI is red again on a different check,
# which the classifier attributes to the base. That red is classified again rather
# than refused unexplained: the post-fix gate passes it with its evidence, and the
# run pauses for the operator with the pull request converted back to draft.
impl__implement:
  done: true
  green: true
  red_cause: ""
  summary: "stub: implemented and green"
impl__assert-changed: "3 files changed"
# The gates are deliberately unstubbed: the real gate scripts decide.
pr__prepare: { repo: { host: "github.com", path: "example/repo" }, head_repo: { host: "github.com", path: "example/repo" }, head: "fixture-branch", base: "dev", existing: null, title: "stub: title", body: { type: archon_artifact, run_id: "fixture-run", path: "pr-body.md" }, conflicts: [], summary: "stub: the base had not moved" }
pr__synced: { recorded: true }
pr__publish: { schemaVersion: 1, repo: { host: "github.com", path: "example/repo" }, number: 10, url: "https://github.com/example/repo/pull/10", head: "fixture-branch", base: "dev", is_draft: true, state: "open", head_repo: { host: "github.com", path: "example/repo" }, head_revision: "fixturehead", base_revision: "fixturebase", maintainer_can_modify: null }
discover-ci: { expected_checks: [], logs_reachable: true, evidence: "stub: no checks gate a merge here" }
review-policy: { risks: "fixture-owned-policy" }
classify:
  tier: full
  errors: false
  docs: false
  reasons:
    tier: "stub: touches persisted state"
    errors: "stub: no failure paths"
    docs: "stub: no doc-facing changes"
resolve-scope: '{"errors":"false"}'
review__mode: '{"continuation":false,"head":"fixturehead","cursor":"","risks":"fixture-owned-policy"}'
review__coverage: { full: true, errors: false, docs: false, lenses: [seams, code, tests, simplify] }
review__scope:
  # PR diff in scope; head sha stubbed
  docs: false
  pr: { repo: { host: "github.com", path: "example/repo" }, number: 10 }
review__code: "0 findings"
review__simplify__simplify: { findings: false }
review__simplify__prune-scratch: "prune-scratch: removed 0 scratch worktree(s)"
review__seams: "0 findings"
shape__simplify: { findings: false }
shape__prune-scratch: "prune-scratch: removed 0 scratch worktree(s)"
review__tests: "0 findings"
review__lens-status: { required: [seams, code, tests, simplify], completed: [seams, code, tests, simplify], missing: [] }
review__prune-scratch: "prune-scratch: removed 0 scratch worktree(s)"
review__synthesize:
  ready: true
  action: none
  findings_summary: "stub: clean on initial review; CI still running"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
  discoveries: []
review__publish:
  ready: true
  action: none
  findings_summary: "stub: clean on initial review; CI still running"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
  discoveries: []
validate__discover: { checks: [{ name: "project gate", argv: ["stub-gate"], group: "gate" }], notes: "stub: the project's aggregate gate" }
validate__run: { status: green, summary: "stub: full gate green" }
ci-probe: '{"state":"red","detail":"test (windows-latest) (failure)"}'
ci-verdict: '{"state":"red","detail":"test (windows-latest) (failure)"}'
ci-rerun: { requested: false, reason: "stub: no re-run warranted" }
ci-reverdict: '{"state":"red","detail":"test (windows-latest) (failure)","cancelled":[]}'
ci-changed: '{"files":["packages/core/src/feature.ts","packages/core/src/feature.test.ts"]}'
ci-classify:
  failing_checks: ["test (windows-latest)"]
  failing_paths: ["packages/core/src/feature.test.ts"]
  base: passes
  rerun: not_rerun
  claim: introduced
  evidence: "stub: the branch's new test fails on Windows"
ci-fix__implement:
  done: true
  green: true
  red_cause: ""
  summary: "stub: fixed the new test's ordering assumption"
ci-fix__assert-changed: "1 file changed"
push-ci-fix: "push-head: fixture-branch is at fixturehead"
ci-delta-scope: '{"moved":false}'
fix-ci-probe: '{"state":"red","detail":"e2e-smoke (failure)"}'
fix-verdict: '{"state":"red","detail":"e2e-smoke (failure)"}'
fix-classify:
  failing_checks: ["e2e-smoke"]
  failing_paths: ["e2e/smoke.spec.ts"]
  base: fails
  rerun: not_rerun
  claim: inherited
  evidence: "stub: e2e-smoke fails the same way on the base commit"
attention-ci-probe: '{"state":"red","detail":"e2e-smoke (failure)"}'
file-discoveries: '{"records":[]}'
match-discoveries: { matches: [] }
fork: '{"fork":true}'
flip-ready: { pr_url: "https://github.com/example/repo/pull/10" }
mark-draft: "mark-draft: the pull request is a draft while CI stays red"
publish-pr-body: {}
fixture:
  expect: paused
  reached: [ci-fix__implement, fix-verdict, fix-classify, gate-fix-result, ci-attention-route, mark-draft, attention-ci-probe]
  resolved-text-contains:
    attention-ci-pause: "after Archon classified the failure as inherited"
exec-code: true
