# Dry-run fixture: red the change cannot have caused passes BOTH green gates, and
# the run rides to the durable CI wait (--exec-code, so both real gate scripts
# decide).
#
# An inherited base break survives the whole tail: implement meets it, and so does
# the project gate after review, because nobody fixed the base meanwhile. Neither
# gate refuses it — the pull request's own CI is what decides, and it is red there
# too, so `ci-probe` reports pending and the run suspends at `ci-pause` rather than
# dying locally. That pause is the intended terminus: resume once the base is fixed.
impl__record-start: '{"start":"recorded"}'
impl__implement:
  done: true
  green: false
  red_cause: inherited
  summary: "stub: validate red on a spec this diff never touches; same spec red at the run's starting commit"
impl__assert-changed: "3 files changed"
# gate-green and gate-validated are deliberately unstubbed: both real scripts must
# pass this red and record it.
pr__pr: { number: 6, url: "https://github.com/example/repo/pull/6", head: "fixture-branch", base: "dev", is_draft: true }
classify:
  errors: false
  docs: false
  reasons:
    errors: "stub: no failure paths"
    docs: "stub: no doc-facing changes"
resolve-scope: '{"errors":"false"}'
review__mode: '{"continuation":false}'
review__scope: "PR diff in scope; head sha stubbed"
review__code: "0 findings"
review__seams: "0 findings"
review__simplify: "0 findings"
review__tests: "0 findings"
review__synthesize:
  ready: true
  action: none
  findings_summary: "stub: the change itself is clean"
validate__validate:
  green: false
  red_cause: inherited
  summary: "stub: the same inherited break, still red on the base"
ci-probe: '{"state":"pending","detail":"stub: 1 check still running"}'
fixture:
  expect: paused
  reached: [pr__pr, review__synthesize, gate-validated, ci-probe]
exec-code: true
