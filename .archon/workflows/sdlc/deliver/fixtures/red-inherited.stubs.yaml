# Dry-run fixture: red the change cannot have caused passes BOTH green gates, and
# the run rides to the CI check (--exec-code, so both real gate scripts decide).
#
# An inherited base break survives the whole tail: implement meets it, and so does
# the project gate after review, because nobody fixed the base meanwhile. Neither
# gate refuses it — the pull request's own CI is what decides, and it is red there
# too, so the run completes not ready with the root cause. flip-ready carries no
# stub: reaching it would execute the real script and fail this fixture.
impl__implement:
  done: true
  green: false
  red_cause: inherited
  summary: "stub: validate red on a spec this diff never touches; same spec red at the run's starting commit"
impl__assert-changed: "3 files changed"
# gate-green and gate-validated are deliberately unstubbed: both real scripts must
# pass this red and record it.
pr__prepare: { repo: { host: "github.com", path: "example/repo" }, head_repo: { host: "github.com", path: "example/repo" }, head: "fixture-branch", base: "dev", existing: null, title: "stub: title", body: { type: archon_artifact, run_id: "fixture-run", path: "pr-body.md" }, conflicts: [], summary: "stub: the base had not moved" }
pr__synced: { recorded: true }
pr__publish: { schemaVersion: 1, repo: { host: "github.com", path: "example/repo" }, number: 6, url: "https://github.com/example/repo/pull/6", head: "fixture-branch", base: "dev", is_draft: true, state: "open", head_repo: { host: "github.com", path: "example/repo" }, head_revision: "fixturehead", base_revision: "fixturebase", maintainer_can_modify: null }
review-policy: { risks: "fixture-owned-policy" }
classify:
  tier: full
  errors: false
  docs: false
  reasons:
    tier: "stub: touches persisted state"
    errors: "stub: no failure paths"
    docs: "stub: no doc-facing changes"
resolve-scope: '{"errors":"false"}'
review__mode: '{"continuation":false,"head":"fixturehead","cursor":"","risks":"fixture-owned-policy"}'
review__coverage: { full: true, errors: false, docs: false, lenses: [seams, code, tests, simplify] }
review__scope:
  # PR diff in scope; head sha stubbed
  docs: false
  pr: { repo: { host: "github.com", path: "example/repo" }, number: 6 }
review__code: "0 findings"
review__simplify__simplify: { findings: false }
review__simplify__prune-scratch: "prune-scratch: removed 0 scratch worktree(s)"
review__seams: "0 findings"
shape__simplify: { findings: false }
shape__prune-scratch: "prune-scratch: removed 0 scratch worktree(s)"
review__tests: "0 findings"
review__lens-status: { required: [seams, code, tests, simplify], completed: [seams, code, tests, simplify], missing: [] }
review__prune-scratch: "prune-scratch: removed 0 scratch worktree(s)"
review__synthesize:
  ready: true
  action: none
  findings_summary: "stub: the change itself is clean"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
  discoveries: []
review__publish:
  ready: true
  action: none
  findings_summary: "stub: the change itself is clean"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
  discoveries: []
validate__discover: { checks: [{ name: "project gate", argv: ["stub-gate"], group: "gate" }], notes: "stub: the project's aggregate gate" }
validate__run: { status: red, summary: "stub: a check in the project gate failed" }
validate__classify:
  red_cause: inherited
  summary: "stub: the same inherited break, still red on the base"
file-discoveries: '{"records":[]}'
match-discoveries: { matches: [] }
fork: '{"fork":true}'
ci: { state: red, summary: "stub: test (ubuntu) fails in src/db.test.ts; the base fails the same way, so the break is inherited", evidence: "stub: the failing job log and the base branch run" }
publish-pr-body: {}
fixture:
  expect: completed
  reached: [pr__prepare, review__synthesize, gate-validated, ci, outcome]
exec-code: true
