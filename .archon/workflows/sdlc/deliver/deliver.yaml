name: deliver
description: |
  The delivery tail, end to end and autonomous: implement the work, gate on
  green, open a draft PR, review it, correct and close the findings, validate,
  wait for checks to clear, then flip the PR ready for review. No in-run
  approval gate — the human gate is PR review and merge on GitHub, outside
  the run.

  Use when: decided work should become a reviewed, ready-to-merge PR —
  "deliver this plan", "take this to a PR", "build and ship this".
  NOT for: deciding what to build, or merging (always human).

# v1 SHAPE NOTE: the intended review ⟲ fix LOOP is not expressible today —
# `include:` is rejected inside a loop_group body (#2623). Until then, this is a
# fixed, bounded unroll:
# full review → fix → light re-review → fix → code-scoped closure. The closure
# never starts another fix pass: a remaining blocker leaves the draft PR and
# report truthful, so the run is finite and never silently ships.

requires: [github]

inputs:
  work:
    default: ""
    description: >-
      What to deliver — a plan path, findings, or a description. Empty means
      the run's trigger message is the work.
  prior_report:
    default: ""
    description: >-
      Cross-run review continuity: the previous delivery run's review report
      path. Round 1 then verifies prior findings (rejections included) instead
      of relitigating them from scratch. Empty on a first delivery.

returns: pr

nodes:
  - id: impl
    include: implement
    with:
      work: "$INPUTS.work"

  # R3's gate: run success never certifies green — this does, deterministically,
  # before anything public happens. Strict field access: a missing field fails
  # the node rather than passing the gate.
  - id: gate-green
    bash: |
      if [ "$impl.output.green" = "true" ]; then
        echo '{"gate":"green"}'
      else
        echo "implement finished but not green — its summary says why. Refusing to open a PR on red work." >&2
        exit 1
      fi
    depends_on: [impl]

  - id: pr
    include: pr
    with:
      draft: "true"
    depends_on: [gate-green]

  # Round 1: reviews the PR — full on a first delivery, light continuation when
  # the caller passes the previous run's report (adjudications carry across
  # runs instead of being relitigated).
  - id: rev1
    include: review
    with:
      scope: ""
      prior_report: "$INPUTS.prior_report"
    depends_on: [pr]

  # Marker join: gate-ready must OR two branches where one may be skipped, and a
  # bash ref to a skipped node's output fails strictly — so each round records
  # readiness as a marker file instead (deterministic code reading a validated
  # field across mutually exclusive branches).
  - id: flag1
    bash: |
      if [ "$rev1.output.ready" = "true" ]; then
        mkdir -p "$ARTIFACTS_DIR/review" &&
          touch "$ARTIFACTS_DIR/review/.ready" &&
          echo '{"ready":"true"}'
      else
        echo '{"ready":"false"}'
      fi
    depends_on: [rev1]

  # Fix: implement in findings mode — commits and pushes to the PR branch.
  - id: fix
    include: implement
    with:
      work: >-
        Fix the review findings recorded in $ARTIFACTS_DIR/review/report.md —
        every open Critical and Important finding. When done and green, push
        the new commits to the PR branch (git push).
    depends_on: [flag1]
    when: "$rev1.output.ready == 'false'"

  # Round 2 runs ONLY when round 1 found blockers and fix applied work — a
  # ready round 1 ends the review; there is nothing new to re-review. The
  # marker join stays because a skipped rev2 cannot be referenced directly (a
  # bash ref to a skipped node's output fails strictly). When rev2 RUNS it OWNS
  # the marker — sets it on ready, clears it otherwise — so on the path where
  # the re-review exists, it is the final authority (no round-1 bypass, R3).
  - id: rev2
    include: review
    with:
      scope: ""
      prior_report: "$ARTIFACTS_DIR/review/report.md"
    depends_on: [fix]

  - id: flag2
    bash: |
      if [ "$rev2.output.ready" = "true" ]; then
        mkdir -p "$ARTIFACTS_DIR/review" &&
          touch "$ARTIFACTS_DIR/review/.ready" &&
          echo '{"ready":"true"}'
      else
        rm -f "$ARTIFACTS_DIR/review/.ready"
        echo '{"ready":"false"}'
      fi
    depends_on: [rev2]

  # Second and final fix round. Its correction receives one code-scoped closure
  # check below, but closure can never trigger another fix pass.
  - id: fix2
    include: implement
    with:
      work: >-
        Fix the still-open findings from the second review round recorded in
        $ARTIFACTS_DIR/review/report.md — every open Critical and Important
        finding. When done and green, push the new commits to the PR branch
        (git push). The closure reviewer owns the final report and canonical PR
        comment; do not edit either one yourself.
    depends_on: [flag2]
    when: "$rev2.output.ready == 'false'"

  # Final closure is deliberately one code-correctness reviewer, not another
  # discovery fan-out. It verifies round-2 blockers and their correction delta,
  # admits only concrete Critical/Important regressions, and cannot cause a
  # third fix cycle.
  - id: rev3
    command: review-close
    model: medium
    context: fresh
    depends_on: [fix2]
    when: "$fix2.output.green == 'true'"
    output_type: review-report
    output_format:
      type: object
      properties:
        ready:
          type: boolean
        findings_summary:
          type: string
      required: [ready, findings_summary]

  - id: flag3
    bash: |
      if [ "$rev3.output.ready" = "true" ]; then
        mkdir -p "$ARTIFACTS_DIR/review" &&
          touch "$ARTIFACTS_DIR/review/.ready" &&
          echo '{"ready":"true"}'
      else
        rm -f "$ARTIFACTS_DIR/review/.ready"
        echo '{"ready":"false"}'
      fi
    depends_on: [rev3]

  # Ready = a review-owned marker from round 1, round 2, or final closure.
  # all_done is the branch join: unused flags are skipped by design. On failure,
  # report the stage that actually stopped instead of assuming review ran.
  - id: gate-ready
    bash: |
      if [ -f "$ARTIFACTS_DIR/review/.ready" ]; then
        echo '{"ready":"true"}'
        exit 0
      fi

      # Read-only stage diagnosis. The gate never mutates GitHub on a failure;
      # the draft state and canonical review comment already carry the truth.
      ORIGIN_REPO=$(git remote get-url origin | sed -E 's#^.*[:/]([^/]+/[^/]+)$#\1#; s#\.git$##')
      if ! gh pr view --repo "$ORIGIN_REPO" --json number --jq .number >/dev/null 2>&1; then
        echo "delivery stopped before a draft PR was available — see the earliest failed node." >&2
      elif [ ! -f "$ARTIFACTS_DIR/review/report.md" ]; then
        echo "a draft PR exists, but review did not complete — see the earliest failed review node." >&2
      else
        echo "review completed with blocking findings — see $ARTIFACTS_DIR/review/report.md and the canonical PR comment." >&2
      fi
      exit 1
    depends_on: [flag1, flag2, flag3]
    trigger_rule: all_done

  # Final local gate, ALWAYS run: the project's own checks via the validate
  # package. Uniform on every path — and when CI is maintainer-gated (fork
  # PRs), this is the only validation before the flip.
  - id: validate
    include: validate
    depends_on: [gate-ready]

  - id: gate-validated
    bash: |
      if [ "$validate.output.green" = "true" ]; then
        echo '{"validated":"true"}'
      else
        echo "local validation failed after review — see the validation report in the run artifacts." >&2
        exit 1
      fi
    depends_on: [validate]

  # Explicit 60-minute bound: without `timeout:` the engine kills a script node
  # at its 120 s default (R5) — far under a normal 5-10 minute CI run.
  - id: await-checks
    script: await-checks
    runtime: uv
    timeout: 3600000
    depends_on: [gate-validated]

  - id: flip-ready
    bash: |
      # --repo pins to the origin remote (#2226): gh's default resolution in a
      # fork clone targets the upstream parent instead.
      ORIGIN_REPO=$(git remote get-url origin | sed -E 's#^.*[:/]([^/]+/[^/]+)$#\1#; s#\.git$##')
      gh pr ready --repo "$ORIGIN_REPO"
      draft=$(gh pr view --repo "$ORIGIN_REPO" --json isDraft --jq .isDraft)
      if [ "$draft" = "false" ]; then
        gh pr view --repo "$ORIGIN_REPO" --json url --jq .url
      else
        echo "flip-ready: PR still reports draft after the ready flip" >&2
        exit 1
      fi
    depends_on: [await-checks]
