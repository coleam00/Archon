name: archon-deliver
description: |
  The delivery tail, autonomous on its green path: implement the work, gate on
  green, simplify it before anything is public, open a draft PR, review it at the
  depth its risk earns, correct the findings the owner judges worth fixing, file
  unrelated discoveries as issues, wait for checks to clear, then flip the PR
  ready for review. Late CI red that
  the branch did not introduce pauses for an explicit rerun and resume. There
  is no in-run approval gate — the human gate is PR review and merge on GitHub,
  outside the run.

  Use when: decided work should become a reviewed, ready-to-merge PR —
  "deliver this plan", "take this to a PR", "build and ship this".
  NOT for: deciding what to build, or merging (always human).

# Review establishes the first verdict. When blockers remain, a bounded static
# body repeats fix → light review, so every correction is independently checked
# and a clean review stops immediately. Exhausting the bound fails truthfully
# with the PR still draft and the canonical report carrying the open findings.

requires: [github]

inputs:
  work:
    default: ""
    description: >-
      What to deliver — a plan path, findings, a description, or the repair of
      an existing pull request when this run was launched on its branch
      (`--adopt`, or from the pull request). Empty means the run's trigger
      message is the work.
  prior_report:
    default: ""
    description: >-
      Cross-run review continuity: the previous delivery run's review report
      path. Round 1 then verifies prior findings (rejections included) instead
      of relitigating them from scratch. Empty on a first delivery.
  # Error review can be forced on or off. Seams always runs; code and tests run on
  # the full tier and one focused reviewer on the focused tier; docs runs only when
  # the classifier finds shipped documentation in the diff.
  errors:
    default: "auto"
    description: Silent-failure lens — auto, true, or false.

# The returns node is what a composed dependency on this workflow resolves to,
# and what a caller's binding of this workflow's output reads. Both must mean
# "the delivery finished": the flip is the delivery's proof, where the pr
# node's record exists from the moment of creation even when everything after
# it dies. Returning the flip makes a failed flip block a composing caller's
# terminal node, an earlier death hand it a null, and a success hand it the
# read-back-verified URL — never a stale record presented as a delivery.
# The deliberate cost: when the flip itself FAILS, the composing tail's
# terminal node is blocked, so its caveat and discovery surfacing is skipped
# along with the false delivery claim — the operator gets the flip's own
# error, which names the recovery. Truthful failure beats a lying report. The
# engine's terminal record does not close that gap: it is assembled when the run
# reaches a terminal status and read back from outside, so no node of this run
# can compose from it, and it carries no discoveries or red causes of its own.
# What it does supply the operator is the node that actually failed.
returns: flip-ready

nodes:
  - id: impl
    include: archon-implement
    with:
      work: "$INPUTS.work"

  # R3's gate: run success never certifies green — this does, deterministically,
  # before anything public happens. Strict field access: a missing field fails
  # the node rather than passing the gate. It fails on red the change introduced
  # and passes red the change cannot have caused, recording that caveat for every
  # downstream reader — see scripts/gate-green.ts for why that trade is safe.
  - id: gate-green
    script: gate-green
    runtime: bun
    # Every gate that passes red leaves the cause as its own typed artifact;
    # readers find them by type under nodes/, never through one shared file.
    output_type: green-gate
    output_format: &green_gate
      type: object
      properties:
        gate: { type: string, enum: [green] }
        red_cause: { type: string }
        stage: { type: string }
        summary: { type: string }
      required: [gate, red_cause, stage, summary]
    depends_on: [impl]
    with:
      green: "$impl.output.green"
      red_cause: "$impl.output.red_cause"
      summary: "$impl.output.summary"
      stage: "The implementation"

  # Structure is judged before the pull request opens: a smaller shape is cheapest
  # while nothing is published and no reviewer has spent effort on code it would
  # delete. The same charter runs as a review lens elsewhere; delivery turns that
  # lens off below because this pass already covered it.
  - id: shape
    include: archon-simplify
    with:
      stage: pre-pr
      work_order: "$INPUTS.work"
    depends_on: [gate-green]

  - id: reshape
    include: archon-implement
    depends_on: [shape]
    when: "$shape.output.findings == true"
    with:
      work: >-
        Before this work is published, adopt the smaller shape recorded in
        $ARTIFACTS_DIR/shape.md. Read it and the accepted work order below in full.
        Judge every finding, Suggestions included: make each change that is
        valid by this project's values, and decline one that is wrong or a matter
        of taste the project's engineering conventions do not back, recording the
        reason in implementation.md. Keep the requested outcome and its tests intact.

        Accepted work order:
        $INPUTS.work

  - id: gate-reshape
    script: gate-green
    runtime: bun
    output_type: green-gate
    output_format: *green_gate
    depends_on: [reshape]
    with:
      green: "$reshape.output.green"
      red_cause: "$reshape.output.red_cause"
      summary: "$reshape.output.summary"
      stage: "The structure correction"

  - id: pr
    include: archon-pr
    with:
      draft: "true"
    depends_on: [shape, gate-reshape]
    trigger_rule: none_failed_min_one_success

  # Initial review: full on a first delivery, light continuation when
  # the caller passes the previous run's report (adjudications carry across
  # runs instead of being relitigated).
  # Review scope is decided from the actual PR, not declared blind at launch:
  # the diff is information that does not exist until the PR does. classify
  # picks the review tier from the change's risk (seams runs on every tier) and
  # judges whether errors and docs warrant their conditional lenses; resolve-scope
  # then merges the operator's declared error override over that judgment. Its
  # output feeds the errors gate, while the classifier feeds the docs gate. Round
  # 1 decides once,
  # and correction reviews preserve those concerns while one continuation
  # reviewer judges the prior report and correction delta.
  - id: classify
    command: classify-review-scope
    # This workflow declares no top-level model, so every AI node here names its
    # own tier. Choosing between two booleans off a diff is small-tier work.
    model: small
    depends_on: [pr]
    mutates_checkout: false
    output_type: review-scope
    output_format:
      type: object
      properties:
        tier: { type: string, enum: [focused, full] }
        errors: { type: boolean }
        docs: { type: boolean }
        reasons:
          type: object
          properties:
            tier: { type: string }
            errors: { type: string }
            docs: { type: string }
          required: [tier, errors, docs]
      required: [tier, errors, docs, reasons]

  # Deterministic merge at the boundary: a declared 'true'/'false' beats the
  # classifier; 'auto' adopts its judgment. Output values are the strings the
  # lens gates compare against.
  - id: resolve-scope
    script: resolve-review-scope
    runtime: bun
    with:
      c_errors: "$classify.output.errors"
    depends_on: [classify]
    output_format:
      type: object
      properties:
        errors: { type: string, enum: ['true', 'false'] }
        simplify: { type: string, enum: ['false'] }
      required: [errors, simplify]

  - id: review
    include: archon-review
    with:
      # The PR node's structured read-back is the target authority. Review must
      # not rediscover an ambient branch→PR mapping.
      scope: "$pr.output"
      prior_report: "$INPUTS.prior_report"
      work_order: "$INPUTS.work"
      tier: "$classify.output.tier"
      # shape already ran the simplify pass on this change.
      simplify: "$resolve-scope.output.simplify"
      errors: "$resolve-scope.output.errors"
      docs: "$classify.output.docs"
    depends_on: [resolve-scope]

  # Validate the authored verdict before it controls a costly branch. `ready`
  # remains the review outcome; `action` says what delivery may do about it.
  # A ready initial review skips this block. Otherwise each iteration corrects
  # the current canonical findings, proves the correction is green, then runs a
  # fresh continuation review over the report and delta, so a blocking fix is
  # never unreviewed. The bound is a runaway backstop, not a pacing device:
  # until_bash ends the loop the moment a recheck certifies ready. Since
  # continuation rechecks and class completion landed (2026-08-27), no converging
  # delivery needed more than three corrections, and the one run that reached
  # five never converged: it found another symptom of one class each round. A
  # per-lane bound would need runtime-parameterized composition, which the
  # language deliberately does not have — the flat bound buys the same outcome.
  #
  # CI feeds the fix, without waiting: checks run on the pushed commits while
  # review happens, so concluded results usually exist by the time a round
  # starts. Each round reads that state once, at its boundary — after the
  # previous recheck landed — and hands it to the fix as evidence. A failure a
  # check can prove is cheapest to fix here, in the round that caused it, not
  # an hour later at the terminal wait. The loop itself never waits on CI, and
  # await-checks below remains the authority on the flip.
  # The review's verdict is certified at its producer: `action` is an enum the
  # engine enforces on synthesize, so it routes here unvalidated. A verdict that
  # contradicts itself (`ready: true` with `correct`) cannot mislead this graph,
  # which reads only `action`.
  - id: corrections
    depends_on: [review]
    when: "$review.output.action == 'correct'"
    loop_group:
      # `none` converged and `replan` must stop correction. gate-ready below
      # accepts only `none`; a replan outcome leaves the PR draft and fails with
      # the canonical report intact instead of spending another correction.
      until_bash: test $recheck.output.action != "correct"
      max_iterations: 3
      fresh_context: true
      nodes:
        # Evidence provisioning, never a gate: this node cannot fail the round
        # and never waits. A read that fails, times out, or finds no checks
        # reports that fact and the round proceeds on the review findings
        # alone. One read, one captured document — deriving failures and counts
        # from separate reads could present a half-failed read as clean CI. The
        # engine owns the bounded read. A timeout skips this optional producer;
        # ci-evidence below turns that absence into the declared fallback passed
        # to the fix. The read goes through the pack's one check reader
        # (.shared/checks.ts), the same one check-ci and flip-ready use.
        - id: ci-note
          timeout: 45000
          on_timeout: skip
          script: ci-note
          runtime: bun
          with:
            pr:
              from: "$pr.output"

        - id: ci-evidence
          script: console.log(process.env.INPUTS_NOTE ?? '')
          runtime: bun
          depends_on: [ci-note]
          trigger_rule: all_done
          with:
            note:
              from: "$ci-note.output"
              if_skipped: >-
                No CI evidence is available for this round (the check read timed out).
                Proceed on the review findings alone.

        - id: fix
          include: archon-implement
          depends_on: [ci-evidence]
          with:
            work: >-
              Judge every open finding recorded in $ARTIFACTS_DIR/review/report.md,
              Suggestions included, within the accepted work order below. Read
              both in full before editing. Fix every valid Critical and Important
              finding, and every Suggestion that is valid by this project's values
              — a simplification, removed machinery, a corrected claim, a test
              that now proves its claim. Decline a wrong finding, or a taste call
              the project's engineering conventions and direction do not back,
              with the reason; the following review judges it. A finding
              unrelated to this change is a follow-up, not work for this round:
              say so and the review files it. Record every disposition — fixed,
              declined with its reason, or unrelated — in implementation.md. When a causal finding
              records a finite affected-member inventory, the finding is not
              fixed until every affected member is handled and the smallest
              relevant proof passes. Do not cross an explicit boundary to make
              a finding disappear; the following review must return replan if
              the requested outcome requires that expansion.

              Concluded CI evidence observed before this round — evidence, not
              a verdict, and the same red-cause discipline applies to it:

              $ci-evidence.output

              A concluded CI failure that this branch's changes introduced is
              part of this round's work, exactly like a review finding. Red on
              a check this branch cannot have caused is classified with
              evidence, not chased. Never wait on running checks — but results
              can conclude while you work, so before declaring done, re-read
              the concluded check state for this pull request with one
              non-blocking read, and treat anything newly red the same way.

              Accepted work order:
              $INPUTS.work

              When the correction is green, push its commits to the branch this
              run is on. Push it explicitly by name; do not let git select an
              upstream. Do not change the PR's draft state or edit the canonical
              review comment; the following review owns that public verdict.
              Record the exact push target and a read-back of the remote ref in
              implementation.md; never record credentials.

        # The same gate, same script: a correction can hit inherited or environment
        # red exactly as the first implementation can, and a
        # correction refused for a red it did not cause wastes the whole round.
        - id: gate-correction-green
          script: gate-green
          runtime: bun
          # Every gate that passes red leaves the cause as its own typed artifact;
          # readers find them by type under nodes/, never through one shared file.
          output_type: green-gate
          output_format: *green_gate
          depends_on: [fix]
          with:
            green: "$fix.output.green"
            red_cause: "$fix.output.red_cause"
            summary: "$fix.output.summary"
            stage: "The correction"

        - id: recheck
          include: archon-review
          with:
            scope: "$pr.output"
            prior_report: "$ARTIFACTS_DIR/review/report.md"
            work_order: "$INPUTS.work"
            # Continuation mode owns coverage and skips every specialist,
            # regardless of these conditional-lens bindings.
            tier: "$classify.output.tier"
            simplify: "$resolve-scope.output.simplify"
            errors: "$resolve-scope.output.errors"
            docs: "$classify.output.docs"
          depends_on: [gate-correction-green]

  # none_failed_min_one_success joins the mutually exclusive paths as bound
  # values: the
  # initial review's verdict directly, and the correction loop's final verdict
  # with if_skipped defaults. The loop can stop on `none` (ready) or `replan`
  # (truthful terminal refusal); the script below owns that final distinction.
  # A failed loop (bound exhausted) or failed review prevents this node from
  # running, so lifecycle success alone never certifies readiness. if_skipped
  # covers only skipped/pending producers, never failed ones.
  - id: gate-ready
    script: gate-ready
    runtime: bun
    depends_on: [review, corrections]
    trigger_rule: none_failed_min_one_success
    with:
      review_action: "$review.output.action"
      correction_action: { from: "$corrections.output.action", if_skipped: null }

  # Suggestions never block, so a ready verdict can leave valid ones open. One
  # implementation pass judges them — fix what the project's values back, decline
  # the rest with a reason — and needs no review round of its own: nothing in it
  # blocks, and CI on its pushed head is its proof.
  - id: polish-scope
    script: polish-scope
    runtime: bun
    depends_on: [gate-ready]
    output_format:
      type: object
      properties:
        polish: { type: boolean }
      required: [polish]

  - id: polish
    include: archon-implement
    depends_on: [polish-scope]
    when: "$polish-scope.output.polish == true"
    with:
      work: >-
        The review of this pull request is ready, and it left Suggestions open in
        $ARTIFACTS_DIR/review/report.md. Read it and the accepted work order below
        in full. Judge each open Suggestion by this project's values: fix one that
        simplifies, removes machinery, corrects a claim or makes a test prove its
        claim; decline one that is wrong or a taste call the project's engineering
        conventions and direction do not back. Record every disposition with its
        reason in implementation.md. When you changed anything, push it to the
        branch this run is on, explicitly by name, and record the push target and a
        read-back of the remote ref. Do not change the PR's draft state or edit the
        canonical review comment.

        Accepted work order, for scope only — do not reopen it:
        $INPUTS.work

  - id: gate-polish
    script: gate-green
    runtime: bun
    output_type: green-gate
    output_format: *green_gate
    depends_on: [polish]
    with:
      green: "$polish.output.green"
      red_cause: "$polish.output.red_cause"
      summary: "$polish.output.summary"
      stage: "The polish pass"

  # Unrelated work the review proved becomes tracker issues, one per record, each
  # linking back to this run and the pull request. Off the flip's path: a failed
  # filing is reported, and never holds a delivered change back.
  - id: file-discoveries
    script: file-discoveries
    runtime: bun
    depends_on: [gate-ready]
    with:
      pr: "$pr.output"
    output_format:
      type: object
      properties:
        issues: { type: array, items: { type: string } }
      required: [issues]

  # The final local gate runs only where it is the sole check before the flip: a
  # fork's CI waits for a maintainer's approval. Otherwise the implementation
  # already ran the project's gate on this head and CI runs it again.
  - id: fork
    script: is-fork
    runtime: bun
    depends_on: [gate-ready, gate-polish]
    trigger_rule: none_failed_min_one_success
    with:
      pr: "$pr.output"
    output_format:
      type: object
      properties:
        fork: { type: boolean }
      required: [fork]

  # Correction and polish passes change the diff after `pr` wrote the
  # description, so concrete claims in the body can be falsified by the very
  # fixes the review demanded. One resync, once readiness is certified — never per
  # iteration (that would be repeated public writes describing diffs the next
  # iteration falsifies). Skipped when neither ran: the diff never changed after
  # the body was written.
  # The live description, read through the selected source: a human may have
  # edited the body since this run wrote it, and a resync that silently reverted
  # that edit would be a write nobody asked for.
  - id: read-pr-body
    script: read-pr-body
    runtime: bun
    with:
      pr: "$pr.output"
    # After the project gate, not beside it: the gates record the red they let
    # through as typed artifacts, and the body must disclose every one of them,
    # so this reads once all of them exist instead of racing the last writer.
    depends_on: [fork, gate-validated]
    trigger_rule: none_failed_min_one_success
    when: "$review.output.action != 'none' || $polish-scope.output.polish == true"
    output_format:
      type: object
      properties:
        body: { type: string }
        url: { type: string }
      required: [body, url]

  - id: sync-pr-body
    command: sync-pr-body
    model: medium
    with:
      pr: "$pr.output"
      current_body: "$read-pr-body.output.body"
    depends_on: [read-pr-body]
    output_format:
      type: object
      properties:
        intent: { type: string }
      required: [intent]

  # The resync node judges which claims the final diff falsified; this node owns
  # the edit and its read-back, through whichever source the run selected.
  - id: publish-pr-body
    script: publish-pr-body
    runtime: bun
    with:
      pr: "$pr.output"
      intent: "$sync-pr-body.output.intent"
    depends_on: [sync-pr-body]
    output_format: { type: object }

  # Final local gate, fork pull requests only: the project's own checks via the
  # validate package, the one validation before the flip when CI is
  # maintainer-gated.
  - id: validate
    include: archon-validate
    depends_on: [fork]
    when: "$fork.output.fork == true"

  # The third gate on the same script, for the same reason: a local gate that
  # refuses every red refuses red the change did not cause, and the base break
  # this branch inherited is exactly the red that survives to here. Introduced red
  # still stops the run. Inherited or environment red proceeds to await-checks,
  # where the pull request's own CI decides — an inherited break is red there
  # too, is classified once more by the convergence pass below, and pauses for
  # explicit operator action before any ready flip can run. A validation that
  # did not finish (`incomplete`) also stops the run, reported as unfinished
  # rather than red, so resuming is the action.
  - id: gate-validated
    script: gate-green
    runtime: bun
    # Every gate that passes red leaves the cause as its own typed artifact;
    # readers find them by type under nodes/, never through one shared file.
    output_type: green-gate
    output_format: *green_gate
    depends_on: [validate]
    with:
      green: "$validate.output.green"
      red_cause: "$validate.output.red_cause"
      summary: "$validate.output.summary"
      stage: "The project gate"

  # CI wait, durably. The probe classifies check state once; a pending state
  # routes into the engine's `wait:` node, which suspends the run and
  # releases the worker slot. A concluded GitHub check signals the wait and
  # the continuation scheduler resumes it; the five-minute deadline preserves
  # progress when no webhook arrives. Red is a reported state here, never a
  # body failure: the probe declares it, the loop exits as concluded, and the
  # convergence pass below owns what red means. A concluded probe skips the
  # pause and `until_bash` ends the loop with zero wasted wait. 13 iterations
  # bound the watch at ~60 minutes of CI time, the same ceiling the poller had
  # — exhausting it fails the run rather than flipping a PR whose CI never
  # ended.
  - id: await-checks
    loop_group:
      max_iterations: 13
      # Completion reads the probe's own certified field. It once shelled out to
      # `gh` instead, because a resumed wait looked like it could not see the
      # iteration's outputs — investigated and disproven: the incident was a
      # quoting error in this predicate, where a second layer of quotes around an
      # already shell-quoted substitution corrupted the comparison. Write the
      # reference bare, as below. Red counts as done here; ci-verdict is the node
      # that classifies a concluded red — never flip-ready first — and
      # flip-ready's preflight refuses any non-green state regardless.
      until_bash: test $ci-probe.output.state != "pending"
      nodes:
        - id: ci-probe
          script: check-ci
          runtime: bun
          with:
            pr:
              from: "$pr.output"
          # The probe's only in-process wait is the single 60 s registration
          # grace; headroom over the 120 s script default keeps that honest.
          timeout: 180000
          output_format: &ci_state
            type: object
            properties:
              state: { type: string, enum: [pending, concluded, red] }
              detail: { type: string }
            required: [state, detail]
        - id: ci-pause
          wait:
            event: checks.complete
            deadline_ms: 300000
          when: $ci-probe.output.state == 'pending'
          depends_on: [ci-probe]
    depends_on: [fork, gate-validated]
    trigger_rule: none_failed_min_one_success

  # Late-red convergence. Review convergence and CI conclusion race: a
  # branch-introduced failure can conclude after the last recheck, the wait
  # exits on any non-pending state, and flip-ready's only moves are flip or
  # terminal failure. The pass below is the bounded route between them:
  # classify, correct, re-await. It sits after the wait because
  # loop completion is computed externally (see await-checks) and a DAG has
  # no back-edges.
  - id: ci-verdict
    script: check-ci
    runtime: bun
    with:
      pr:
        from: "$pr.output"
    timeout: 180000
    depends_on: [await-checks]
    output_format: *ci_state

  # One correction pass, entered only on concluded red. No review follows it: the
  # re-await below reads CI on the pushed fix, which is the proof a CI fix needs,
  # and the red-cause discipline in its brief is what keeps it honest. Every
  # post-CI-fix review in the pack's history confirmed the fix (21 of 21).
  - id: ci-fix
    include: archon-implement
    depends_on: [ci-verdict]
    when: "$ci-verdict.output.state == 'red'"
    with:
      work: >-
        CI concluded non-green after the review converged. The failing
        checks:

        $ci-verdict.output.detail

        The same red-cause discipline as every round applies. A concluded
        CI failure this branch's changes introduced is this pass's work:
        fix it at the cause and push the correction to the branch this
        run is on, explicitly by name. Red on a check this branch cannot
        have caused is classified with evidence — red_cause inherited or
        environment, with the summary naming the proof — never chased and
        never "fixed" by weakening a test. Do not change the PR's draft
        state or edit the canonical review comment.

        Accepted work order, for scope only — do not reopen it:
        $INPUTS.work

  # The same gate, same script, fourth consumer: introduced-and-unfixed or
  # unexplained red refuses loudly; inherited or environment red passes with its
  # caveat recorded and routes to the explicit action wait below.
  - id: gate-ci-fix
    script: gate-green
    runtime: bun
    # Every gate that passes red leaves the cause as its own typed artifact;
    # readers find them by type under nodes/, never through one shared file.
    output_type: green-gate
    output_format: *green_gate
    depends_on: [ci-fix]
    with:
      green: "$ci-fix.output.green"
      red_cause: "$ci-fix.output.red_cause"
      summary: "$ci-fix.output.summary"
      stage: "The CI correction"

  # The re-wait after a pushed correction: same probe, webhook wake-up,
  # five-minute deadline fallback, and ceiling as await-checks. On an inherited
  # or environment classification nothing was pushed, the state is still
  # concluded red, and this exits in one probe before the explicit action route
  # below.
  - id: await-fix-checks
    loop_group:
      max_iterations: 13
      until_bash: test $fix-ci-probe.output.state != "pending"
      nodes:
        - id: fix-ci-probe
          script: check-ci
          runtime: bun
          with:
            pr:
              from: "$pr.output"
          timeout: 180000
          output_format: *ci_state
        - id: fix-ci-pause
          wait:
            event: checks.complete
            deadline_ms: 300000
          when: $fix-ci-probe.output.state == 'pending'
          depends_on: [fix-ci-probe]
    depends_on: [gate-ci-fix]

  # Late red that the branch did not introduce needs a person, not another
  # autonomous correction. Preserve the draft PR and the recorded refusal,
  # then probe once per explicit resume until the operator has rerun the check.
  - id: ci-attention-route
    script: ci-attention-route
    runtime: bun
    depends_on: [ci-verdict, gate-ci-fix, await-fix-checks]
    trigger_rule: none_failed_min_one_success
    with:
      red_cause: { from: "$gate-ci-fix.output.red_cause", if_skipped: "" }
    output_format:
      type: object
      properties:
        attention: { type: boolean }
        red_cause: { type: string }
      required: [attention, red_cause]

  - id: ci-attention
    depends_on: [ci-attention-route]
    when: "$ci-attention-route.output.attention == true"
    loop_group:
      max_iterations: 13
      until_bash: test $attention-ci-probe.output.state = "concluded"
      nodes:
        - id: attention-ci-probe
          script: check-ci
          runtime: bun
          with:
            pr:
              from: "$pr.output"
          timeout: 180000
          output_format: *ci_state
        - id: attention-ci-pause
          wait:
            attention: >-
              CI remains non-green for pull request
              #$pr.output.number after Archon classified the failure as
              $ci-attention-route.output.red_cause:
              $attention-ci-probe.output.detail
              Re-run the failing check, then resume this run.
          when: "$attention-ci-probe.output.state != 'concluded'"
          depends_on: [attention-ci-probe]

  - id: flip-ready
    script: flip-ready
    runtime: bun
    output_format:
      type: object
      properties:
        pr_url: { type: string, minLength: 1 }
      required: [pr_url]
    with:
      pr:
        from: "$pr.output"
    # Failure-cascade skips block this join, so a failed ancestor no longer has to
    # be named directly: the skip carries `upstream_failed` from the node that
    # actually failed, across every hop. ci-verdict is the successful dependency
    # the rule requires — a strict transitive reduction without it can leave a
    # clean-review delivery with no success at all. publish-pr-body orders the
    # flip after the resync even when the CI waits return immediately.
    depends_on: [ci-verdict, ci-attention-route, ci-attention, publish-pr-body]
    trigger_rule: none_failed_min_one_success

  # This tail's terminal report, like every other SDLC tail's (scripts/outcome.ts).
  # flip-ready owns the one irreversible public action and stops there; composing
  # the text its reader receives is separate work, and a named script keeps it out
  # of a bash body.
  #
  # No `outcome_field:` here, unlike the other tails. It would need a two-valued
  # boolean on this workflow's `returns:` node, and delivery has none: flip-ready
  # refuses rather than reporting a false verdict, so the field could only ever be
  # a constant. The run's lifecycle status already carries that fact.
  - id: outcome
    script: outcome
    runtime: bun
    with:
      pr_url: "$flip-ready.output.pr_url"
    depends_on: [flip-ready]
    output_format:
      type: object
      properties:
        pr_url: { type: string }
        summary: { type: string }
      required: [pr_url, summary]
