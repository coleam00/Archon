name: archon-deliver
description: |
  The delivery tail: implement the work, validate it once, publish a draft PR,
  review it, and correct until the review is ready; simplify once, then one CI
  agent waits for CI and judges it. Green: the agent marks the PR ready. Red the
  PR caused: another round. Red for any other reason: the run stops not ready,
  with the cause. Rounds are capped; the cap ends the run not ready, with the
  reason. Never merges and never syncs the base: a ready PR goes to the merge
  queue, which owns staleness.

  Use when: decided work should become a reviewed, ready-to-merge PR —
  "deliver this plan", "take this to a PR", "build and ship this".
  NOT for: deciding what to build, or merging (always human).

requires: [github]
model: medium

inputs:
  work:
    default: ""
    description: >-
      What to deliver — a plan path, findings, a description, or the repair of
      an existing pull request when this run was launched on its branch
      (`--adopt`, or from the pull request). Empty means the run's trigger
      message is the work.
  review_scopes:
    default: ""
    description: >-
      Review lenses to add to the risk-picked ones (seams, code, tests, errors,
      docs, or all), or an explicit restriction such as "only tests".

returns: outcome
outcome_field: ready

nodes:
  # One round: implement → validate → publish → review → (simplify → CI). A review
  # that needs fixes, a red the change caused, or a red CI the PR caused starts
  # another round. Each round's implementer is a fresh agent that reads the previous
  # round's review report and ci.md from artifacts; once a loop body can continue a
  # named session, `implement` resumes the previous round's session instead.
  - id: rounds
    loop_group:
      until_bash: |
        done=$round.output.done
        test "$done" = "true"
      # round caps itself one below this, so the cap ends typed instead of failing.
      max_iterations: 4
      fresh_context: true
      nodes:
        - id: implement
          include: archon-implement
          with:
            work: >-
              Accepted work order:
              $INPUTS.work

              Result of this run's previous delivery round (empty on the first
              round): $LOOP_PREV.round.output.summary

              On the first round, implement the work order. On a later round,
              correct what that round left: read $ARTIFACTS_DIR/review/report.md
              and judge every open finding (fix every blocking finding, or
              decline it only with the evidence that it is not a finding; fix a
              note or decline it with a one-line reason), read
              $ARTIFACTS_DIR/ci.md when the round ended on a CI failure this
              pull request caused, and reproduce and fix the failing check that
              result names when it ended on a red validation. Record every
              disposition in implementation.md. Do not cross an explicit
              boundary to make a finding disappear.

        # The full project gate, once per round, before anything is published.
        - id: validate
          include: archon-validate
          depends_on: [implement]
          when: "$implement.output.green == true"

        - id: pr
          include: archon-pr
          depends_on: [validate]
          when: "$validate.output.green == true || $validate.output.red_cause == 'inherited' || $validate.output.red_cause == 'environment'"
          with:
            draft: "true"

        - id: review
          include: archon-review
          depends_on: [pr]
          with:
            scope: "$pr.output"
            prior_report: "$LOOP_PREV.round.output.prior_report"
            work_order: "$INPUTS.work"
            scopes: "$INPUTS.review_scopes"

        # Once, after the review passes and before CI judges the PR.
        - id: simplify
          include: archon-simplify
          depends_on: [review]
          when: "$review.output.ready == true"
          with:
            work_order: "$INPUTS.work"

        - id: reshape
          include: archon-implement
          depends_on: [simplify]
          when: "$simplify.output.findings == true"
          with:
            work: >-
              Judge the smaller shapes recorded in $ARTIFACTS_DIR/shape.md. Read it
              and the accepted work order below in full. Adopt every finding whose
              smaller shape preserves behavior and that the project's values back;
              decline one only with that evidence. Record each disposition in
              implementation.md. Keep the requested outcome and its tests intact.
              When the work is green, push its commits to the branch this run is
              on by name (`git push origin HEAD:refs/heads/<branch>`), never
              letting git select an upstream, and never force-push.

              Accepted work order:
              $INPUTS.work

        - id: ci
          command: ci
          depends_on: [simplify, reshape]
          trigger_rule: none_failed_min_one_success
          when: "$review.output.ready == true"
          output_format:
            type: object
            properties:
              state: { type: string, enum: [green, pr_caused, other] }
              summary: { type: string }
            required: [state, summary]

        - id: round
          script: round
          runtime: bun
          depends_on: [implement, validate, pr, review, ci]
          trigger_rule: all_done
          with:
            previous: "$LOOP_PREV.round.output.round"
            prior_report: "$LOOP_PREV.round.output.prior_report"
            previous_pr_url: "$LOOP_PREV.round.output.pr_url"
            green: "$implement.output.green"
            implement_summary: "$implement.output.summary"
            validated: { from: "$validate.output.green", if_skipped: null }
            red_cause: { from: "$validate.output.red_cause", if_skipped: null }
            validate_summary: { from: "$validate.output.summary", if_skipped: null }
            pr_url: { from: "$pr.output.url", if_skipped: null }
            review_ready: { from: "$review.output.ready", if_skipped: null }
            review_action: { from: "$review.output.action", if_skipped: null }
            review_summary: { from: "$review.output.findings_summary", if_skipped: null }
            ci: { from: "$ci.output.state", if_skipped: null }
            ci_summary: { from: "$ci.output.summary", if_skipped: null }
          output_format:
            type: object
            properties:
              round: { type: integer }
              done: { type: boolean }
              ready: { type: boolean }
              reason:
                type: string
                enum:
                  [delivered, implement_blocked, validate_red, review_open, replan, ci_pr_caused, ci_other, round_cap]
              pr_url: { type: string }
              prior_report: { type: string }
              summary: { type: string }
            required: [round, done, ready, reason, pr_url, prior_report, summary]

  # The returned result: ready only when the CI agent saw green and marked the PR
  # ready; every other ending names its reason.
  - id: outcome
    script: outcome
    runtime: bun
    depends_on: [rounds]
    with:
      rounds: "$rounds.output"
    output_format:
      type: object
      properties:
        ready: { type: boolean }
        reason:
          type: string
          enum:
            [delivered, implement_blocked, validate_red, review_open, replan, ci_pr_caused, ci_other, round_cap]
        pr_url: { type: string }
        summary: { type: string }
      required: [ready, reason, pr_url, summary]
