name: archon-deliver
description: |
  The delivery tail, autonomous on its green path: implement the work, gate on
  green, simplify it before anything is public, bring the branch up to date and
  open a draft PR, review it at the depth its risk earns, correct the findings
  the owner judges worth fixing, file discoveries as issues, mark the PR ready,
  then wait on CI once. Red is re-run, classified, and fixed or answered with a
  repaired base at most once; red that stays unresolved puts the PR back in draft
  and pauses for the operator. A red PR never stays ready. There is no in-run
  approval gate — the human gate is PR review and merge on GitHub, outside the
  run.

  Use when: decided work should become a reviewed, ready-to-merge PR —
  "deliver this plan", "take this to a PR", "build and ship this".
  NOT for: deciding what to build, or merging (always human).

# Review establishes the first verdict. When blockers remain, a bounded static
# body repeats fix → light review, so every blocking correction is independently
# checked and a clean review stops immediately. Exhausting the bound fails
# truthfully with the PR still draft and the canonical report carrying the open
# findings. Every commit that ships is read by a review round that judges structure
# as well as correctness: the first round's simplify lens (or the focused reviewer)
# reads the implementation and the structure correction, each recheck reads its
# correction, and a CI fix gets a continuation review of its own before the ready
# claim is confirmed.

requires: [github]

inputs:
  pull_request:
    default: ""
    description: >-
      The number of an open pull request this delivery continues instead of opening
      one, as a caller resolved it. Empty or `null` when the caller names none; the
      run can still continue one it was launched onto.
  work:
    default: ""
    description: >-
      What to deliver — a plan path, findings, a description, or the repair of
      an existing pull request when this run was launched on its branch
      (`--adopt`, or from the pull request). Empty means the run's trigger
      message is the work.
  prior_report:
    default: ""
    description: >-
      Cross-run review continuity: the previous delivery run's review report
      path. Round 1 then verifies prior findings (rejections included) instead
      of relitigating them from scratch. Empty on a first delivery.
  # Error review can be forced on or off. Seams always runs; code and tests run on
  # the full tier and one focused reviewer on the focused tier; docs runs only when
  # the classifier finds shipped documentation in the diff.
  errors:
    default: "auto"
    description: Silent-failure lens — auto, true, or false.

# The returns node is what a composed dependency on this workflow resolves to,
# and what a caller's binding of this workflow's output reads. Both must mean
# "the delivery finished": the certified ready state is the delivery's proof,
# where the pr node's record exists from the moment of creation even when
# everything after it dies. Returning confirm-ready makes a failed confirmation
# block a composing caller's terminal node, an earlier death hand it a null, and
# a success hand it the read-back-verified URL — never a stale record presented
# as a delivery. The deliberate cost: when the confirmation itself FAILS, the
# composing tail's terminal node is blocked, so its caveat and discovery
# surfacing is skipped along with the false delivery claim — the operator gets
# the confirmation's own error, which names the recovery. Truthful failure beats a lying report. The
# engine's terminal record does not close that gap: it is assembled when the run
# reaches a terminal status and read back from outside, so no node of this run
# can compose from it, and it carries no discoveries or red causes of its own.
# What it does supply the operator is the node that actually failed.
returns: confirm-ready

nodes:
  - id: impl
    include: archon-implement
    with:
      work: "$INPUTS.work"

  # R3's gate: run success never certifies green — this does, deterministically,
  # before anything public happens. Strict field access: a missing field fails
  # the node rather than passing the gate. It fails on red the change introduced
  # and passes red the change cannot have caused, recording that caveat for every
  # downstream reader — see scripts/gate-green.ts for why that trade is safe.
  - id: gate-green
    script: gate-green
    runtime: bun
    # Every gate that passes red leaves the cause as its own typed artifact;
    # readers find them by type under nodes/, never through one shared file.
    output_type: green-gate
    output_format: &green_gate
      type: object
      properties:
        gate: { type: string, enum: [green] }
        red_cause: { type: string }
        stage: { type: string }
        summary: { type: string }
        # The commit a clean green certified, so a later step can cite it instead
        # of gating the same tree again; null for passed red or a dirty tree.
        head: { type: [string, 'null'] }
      required: [gate, red_cause, stage, summary, head]
    depends_on: [impl]
    with:
      green: "$impl.output.green"
      red_cause: "$impl.output.red_cause"
      summary: "$impl.output.summary"
      stage: "The implementation"

  # Structure is judged before the pull request opens: a smaller shape is cheapest
  # while nothing is published and no reviewer has spent effort on code it would
  # delete. The full-tier review runs the same charter again as a lens, so the code
  # gets a second, independent structure look after the PR opens; on the focused
  # tier the focused reviewer's machinery check is that second look.
  - id: shape
    include: archon-simplify
    with:
      stage: pre-pr
      work_order: "$INPUTS.work"
    depends_on: [gate-green]

  - id: reshape
    include: archon-implement
    depends_on: [shape]
    when: "$shape.output.findings == true"
    with:
      work: >-
        Before this work is published, judge the smaller shapes recorded in
        $ARTIFACTS_DIR/shape.md. Read it and the accepted work order below in full.
        Adopt every finding the project's values back. Decline one only with the
        evidence that it is wrong or that its smaller shape changes behavior; the
        review that follows judges every decline and reopens one whose evidence does
        not hold. Write $ARTIFACTS_DIR/shape-dispositions.md with one entry per
        finding in shape.md: adopted, or declined with its evidence. Keep the
        requested outcome and its tests intact.

        Accepted work order:
        $INPUTS.work

  - id: gate-reshape
    script: gate-green
    runtime: bun
    output_type: green-gate
    output_format: *green_gate
    depends_on: [reshape]
    with:
      green: "$reshape.output.green"
      red_cause: "$reshape.output.red_cause"
      summary: "$reshape.output.summary"
      stage: "The structure correction"

  - id: pr
    include: archon-pr
    with:
      draft: "true"
      pull_request: "$INPUTS.pull_request"
    depends_on: [shape, gate-reshape]
    trigger_rule: none_failed_min_one_success

  # Initial review: full on a first delivery, light continuation when
  # the caller passes the previous run's report (adjudications carry across
  # runs instead of being relitigated).
  # Review scope is decided from the actual PR, not declared blind at launch:
  # the diff is information that does not exist until the PR does. classify
  # picks the review tier from the change's risk (seams runs on every tier) and
  # judges whether errors and docs warrant their conditional lenses; resolve-scope
  # then merges the operator's declared error override over that judgment. Its
  # output feeds the errors gate, while the classifier feeds the docs gate. Round
  # 1 completes full coverage when focused review detects an engaged risk,
  # and correction reviews preserve those concerns while one continuation
  # reviewer judges the prior report and correction delta.
  - id: review-policy
    script: review-policy
    runtime: bun
    depends_on: [pr]
    output_format:
      type: object
      properties:
        risks: { type: string, minLength: 1 }
      required: [risks]

  # What CI this project has, which checks gate a merge of this pull request, and
  # whether their logs are readable from here: project facts an agent discovers
  # once per delivery, beside the review. The CI waits and the ready confirmation
  # act on this record deterministically; no script names a CI system or a check.
  - id: discover-ci
    command: discover-ci
    model: small
    depends_on: [pr]
    mutates_checkout: false
    with:
      pr: "$pr.output"
    output_type: ci-facts
    output_format:
      type: object
      properties:
        expected_checks: { type: array, items: { type: string, pattern: '\S' } }
        logs_reachable: { type: boolean }
        evidence: { type: string, pattern: '\S' }
      required: [expected_checks, logs_reachable, evidence]

  - id: classify
    command: classify-review-scope
    # This workflow declares no top-level model, so every AI node here names its
    # own tier. Choosing between two booleans off a diff is small-tier work.
    model: small
    depends_on: [review-policy]
    mutates_checkout: false
    output_type: review-scope
    output_format:
      type: object
      properties:
        tier: { type: string, enum: [focused, full] }
        errors: { type: boolean }
        docs: { type: boolean }
        reasons:
          type: object
          properties:
            tier: { type: string }
            errors: { type: string }
            docs: { type: string }
          required: [tier, errors, docs]
      required: [tier, errors, docs, reasons]

  # Deterministic merge at the boundary: a declared 'true'/'false' beats the
  # classifier; 'auto' adopts its judgment. The output value is the string the
  # lens gate compares against.
  - id: resolve-scope
    script: resolve-review-scope
    runtime: bun
    with:
      c_errors: "$classify.output.errors"
    depends_on: [classify]
    output_format:
      type: object
      properties:
        errors: { type: string, enum: ['true', 'false'] }
      required: [errors]

  - id: review
    include: archon-review
    with:
      # The PR node's structured read-back names the pull request, so review
      # never rediscovers an ambient branch→PR mapping. It does not name the
      # commit: every round reviews the checkout's HEAD, which archon-review
      # checks against this PR's remote head before publishing.
      scope: "$pr.output"
      prior_report: "$INPUTS.prior_report"
      work_order: "$INPUTS.work"
      tier: "$classify.output.tier"
      errors: "$resolve-scope.output.errors"
      docs: "$classify.output.docs"
    depends_on: [resolve-scope]

  # Validate the authored verdict before it controls a costly branch. `ready`
  # remains the review outcome; `action` says what delivery may do about it.
  # A ready initial review skips this block. Otherwise each iteration corrects
  # the current canonical findings, proves the correction is green, then runs a
  # fresh continuation review over the report and delta, so a blocking fix is
  # never unreviewed. The bound is a runaway backstop, not a pacing device:
  # until_bash ends the loop the moment a recheck certifies ready, so a healthy
  # delivery still exits in one or two rounds. Five rounds leaves room for a
  # feature-sized change whose rechecks keep finding real blockers. A per-lane
  # bound would need runtime-parameterized composition, which the language
  # deliberately does not have — the flat bound buys the same outcome.
  #
  # Corrections are driven by the review and local validation alone. CI is
  # waited on once, after the pull request is marked ready (await-checks below).
  # The review's verdict is certified at its producer: `action` is an enum the
  # engine enforces on synthesize, so it routes here unvalidated. A verdict that
  # contradicts itself (`ready: true` with `correct`) cannot mislead this graph,
  # which reads only `action`.
  - id: corrections
    depends_on: [review]
    when: "$review.output.action == 'correct'"
    loop_group:
      # `none` converged and `replan` must stop correction. gate-ready below
      # accepts only `none`; a replan outcome leaves the PR draft and fails with
      # the canonical report intact instead of spending another correction.
      until_bash: |
        value=$recheck.output.action
        test "$value" != "correct"
      max_iterations: 5
      fresh_context: true
      nodes:
        - id: fix
          include: archon-implement
          with:
            work: >-
              Judge every open finding recorded in $ARTIFACTS_DIR/review/report.md,
              within the accepted work order below. Read both in full before
              editing. Fix every blocking finding, or decline it only with the
              evidence that it is not a finding: it is wrong, already satisfied,
              or its smaller shape changes behavior. Fix a note, or decline it
              with a one-line reason. The following review judges every decline.
              A finding unrelated to this change is a follow-up, not work for
              this round: say so and the review files it. Record every
              disposition — fixed, declined with its reason or evidence, or
              unrelated — in implementation.md. When a causal finding
              records a finite affected-member inventory, the finding is not
              fixed until every affected member is handled and the smallest
              relevant proof passes. Do not cross an explicit boundary to make
              a finding disappear; the following review must return replan if
              the requested outcome requires that expansion.

              Accepted work order:
              $INPUTS.work

              Commit the correction; the workflow pushes it. Do not change the
              PR's draft state or edit the canonical review comment; the
              following review owns that public verdict.

        # The same gate, same script: a correction can hit inherited or environment
        # red exactly as the first implementation can, and a
        # correction refused for a red it did not cause wastes the whole round.
        - id: gate-correction-green
          script: gate-green
          runtime: bun
          # Every gate that passes red leaves the cause as its own typed artifact;
          # readers find them by type under nodes/, never through one shared file.
          output_type: green-gate
          output_format: *green_gate
          depends_on: [fix]
          with:
            green: "$fix.output.green"
            red_cause: "$fix.output.red_cause"
            summary: "$fix.output.summary"
            stage: "The correction"

        # Agents commit; this pushes, by name, and reads the remote back, so a
        # review round never starts on a head the pull request does not have.
        - id: push-fix
          script: push-head
          runtime: bun
          depends_on: [gate-correction-green]
          with:
            pr: "$pr.output"

        - id: recheck
          include: archon-review
          with:
            scope: "$pr.output"
            prior_report: "$ARTIFACTS_DIR/review/report.md"
            work_order: "$INPUTS.work"
            # Continuation mode owns coverage and skips every specialist,
            # regardless of these conditional-lens bindings.
            tier: "$classify.output.tier"
            errors: "$resolve-scope.output.errors"
            docs: "$classify.output.docs"
          depends_on: [push-fix]

  # none_failed_min_one_success joins the mutually exclusive paths as bound
  # values: the
  # initial review's verdict directly, and the correction loop's final verdict
  # with if_skipped defaults. The loop can stop on `none` (ready) or `replan`
  # (truthful terminal refusal); the script below owns that final distinction.
  # A failed loop (bound exhausted) or failed review prevents this node from
  # running, so lifecycle success alone never certifies readiness. if_skipped
  # covers only skipped/pending producers, never failed ones.
  - id: gate-ready
    script: gate-ready
    runtime: bun
    depends_on: [review, corrections]
    trigger_rule: none_failed_min_one_success
    with:
      review_action: "$review.output.action"
      correction_action: { from: "$corrections.output.action", if_skipped: null }

  # Work the review proved but this change does not do becomes tracker issues,
  # one per record, each linking back to this run and the pull request. It joins
  # the final verdict the same way gate-ready does, not gate-ready itself, so a
  # replan files its discoveries too: that is when a scope conflict matters most.
  # A review that failed, or a correction loop that exhausted its bound, has no
  # converged discovery set and blocks this node. Off the ready path: a failed
  # filing never holds a delivered change back or changes a replan's refusal,
  # but it does end the run failed, so the unfiled records reach the operator.
  #
  # Before filing, a small agent makes a best-effort search of the open issues for
  # ones that already describe the same defect. Its matches are a judgment the
  # filing script validates; a miss files a duplicate. The matcher failing outright
  # fails the filing like any node on this off-ready path: the delivery stands, and
  # the records stay in the review report for the operator.
  - id: match-discoveries
    command: match-discoveries
    model: small
    mutates_checkout: false
    depends_on: [review, corrections]
    trigger_rule: none_failed_min_one_success
    with:
      pr: "$pr.output"
      initial: { from: "$review.output.discoveries" }
      final: { from: "$corrections.output.discoveries", if_skipped: null }
    output_format:
      type: object
      properties:
        matches:
          type: array
          items:
            type: object
            properties:
              index: { type: integer, minimum: 0 }
              issue: { type: integer, minimum: 1 }
            required: [index, issue]
      required: [matches]

  - id: file-discoveries
    script: file-discoveries
    runtime: bun
    depends_on: [match-discoveries]
    with:
      pr: "$pr.output"
      initial: { from: "$review.output.discoveries" }
      final: { from: "$corrections.output.discoveries", if_skipped: null }
      matches: { from: "$match-discoveries.output.matches" }
    output_type: discovery-filing
    output_format:
      type: object
      properties:
        records:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              issue: { type: string }
            required: [title, issue]
      required: [records]

  # The final local gate runs only where it is the sole check before the ready mark: a
  # fork's CI waits for a maintainer's approval. Otherwise the implementation
  # already ran the project's gate on this head and CI runs it again.
  - id: fork
    script: is-fork
    runtime: bun
    depends_on: [gate-ready]
    with:
      pr: "$pr.output"
    output_format:
      type: object
      properties:
        fork: { type: boolean }
      required: [fork]

  # Correction passes change the diff after `pr` wrote the
  # description, so concrete claims in the body can be falsified by the very
  # fixes the review demanded. One resync, once readiness is certified — never per
  # iteration (that would be repeated public writes describing diffs the next
  # iteration falsifies). Skipped when none ran: the diff never changed after
  # the body was written.
  # The live description, read through the selected source: a human may have
  # edited the body since this run wrote it, and a resync that silently reverted
  # that edit would be a write nobody asked for.
  - id: read-pr-body
    script: read-pr-body
    runtime: bun
    with:
      pr: "$pr.output"
    # After the project gate, not beside it: the gates record the red they let
    # through as typed artifacts, and the body must disclose every one of them,
    # so this reads once all of them exist instead of racing the last writer.
    depends_on: [fork, gate-validated]
    trigger_rule: none_failed_min_one_success
    when: "$review.output.action != 'none'"
    output_format:
      type: object
      properties:
        body: { type: string }
        url: { type: string }
      required: [body, url]

  - id: sync-pr-body
    command: sync-pr-body
    model: medium
    with:
      pr: "$pr.output"
      current_body: "$read-pr-body.output.body"
    depends_on: [read-pr-body]
    output_format:
      type: object
      properties:
        # The complete replacement body, or null when the body is still accurate.
        body:
          anyOf:
            - type: "null"
            - type: object
              properties:
                type: { type: string, enum: [archon_artifact] }
                run_id: { type: string }
                path: { type: string, enum: [pr-body-final.md] }
              required: [type, run_id, path]
        summary: { type: string }
      required: [body, summary]

  # The resync node judges which claims the final diff falsified; this node owns
  # the edit and its read-back, through whichever source the run selected. It runs
  # without a resync too: the project gate can pass red after the pull request
  # opened, and the red-cause block must disclose it either way.
  - id: publish-pr-body
    script: publish-pr-body
    runtime: bun
    with:
      pr: "$pr.output"
      body: { from: "$sync-pr-body.output.body", if_skipped: null }
    depends_on: [fork, gate-validated, sync-pr-body]
    trigger_rule: none_failed_min_one_success
    output_format: { type: object }

  # Final local gate, fork pull requests only: the project's own checks via the
  # validate package, the one validation before the ready mark when CI is
  # maintainer-gated.
  - id: validate
    include: archon-validate
    depends_on: [fork]
    when: "$fork.output.fork == true"

  # The third gate on the same script, for the same reason: a local gate that
  # refuses every red refuses red the change did not cause, and the base break
  # this branch inherited is exactly the red that survives to here. Introduced red
  # still stops the run. Inherited or environment red proceeds to await-checks,
  # where the pull request's own CI decides — an inherited break is red there
  # too, is classified once more by the convergence pass below, and pauses for
  # explicit operator action, with the pull request back in draft. A validation that
  # did not finish (`incomplete`) also stops the run, reported as unfinished
  # rather than red, so resuming is the action.
  - id: gate-validated
    script: gate-green
    runtime: bun
    # Every gate that passes red leaves the cause as its own typed artifact;
    # readers find them by type under nodes/, never through one shared file.
    output_type: green-gate
    output_format: *green_gate
    depends_on: [validate]
    with:
      green: "$validate.output.green"
      red_cause: "$validate.output.red_cause"
      summary: "$validate.output.summary"
      stage: "The project gate"

  # The work is done: review converged and the local gate is green for the tree.
  # The pull request is marked ready now, before CI is waited on, because a project
  # whose CI skips drafts only starts it here. confirm-ready at the end converts it
  # back to draft unless CI is green on the final head: a red pull request never
  # stays ready.
  - id: flip-ready
    script: flip-ready
    runtime: bun
    output_format:
      type: object
      properties:
        pr_url: { type: string, minLength: 1 }
      required: [pr_url]
    with:
      pr:
        from: "$pr.output"
    # publish-pr-body runs after every gate and the resync, and is skipped when a
    # gate failed. discover-ci is named so the flip never runs without the CI facts
    # confirm-ready binds: after the flip, nothing may fail before the draft
    # conversion can.
    depends_on: [publish-pr-body, discover-ci]

  # CI wait, durably. The probe classifies check state once; a pending state
  # routes into the engine's `wait:` node, which suspends the run and
  # releases the worker slot. A concluded check signals the wait and the
  # continuation scheduler resumes it; the five-minute deadline preserves
  # progress when no webhook arrives. Red is a reported state here, never a
  # body failure: the probe declares it, the loop exits as concluded, and the
  # convergence pass below owns what red means. A concluded probe skips the
  # pause and `until_bash` ends the loop with zero wasted wait. The probe waits
  # for every check discover-ci expects, so silence is pending, never a pass.
  # 13 iterations bound the watch at ~60 minutes of CI time — exhausting it
  # fails the run, and confirm-ready puts the PR back in draft.
  - id: await-checks
    loop_group:
      max_iterations: 13
      # Red counts as done here; ci-verdict classifies a concluded red, and
      # confirm-ready refuses any non-green state regardless.
      until_bash: |
        value=$ci-probe.output.state
        test "$value" != "pending"
      nodes:
        - id: ci-probe
          script: check-ci
          runtime: bun
          with:
            pr:
              from: "$pr.output"
            expected:
              from: "$discover-ci.output.expected_checks"
          timeout: 120000
          output_format: &ci_state
            type: object
            properties:
              state: { type: string, enum: [pending, concluded, red] }
              detail: { type: string }
            required: [state, detail]
        - id: ci-pause
          wait:
            event: checks.complete
            deadline_ms: 300000
          when: $ci-probe.output.state == 'pending'
          depends_on: [ci-probe]
    depends_on: [flip-ready, discover-ci]

  # Late-red convergence. Review convergence and CI conclusion race: a
  # branch-introduced failure can conclude after the last recheck, the wait
  # exits on any non-pending state, and confirm-ready's only moves are keeping
  # the PR ready on green or putting it back in draft. The pass below is the bounded route between them:
  # re-run once when warranted, classify, correct, re-await, and classify again.
  # It sits after the wait because loop completion is computed externally (see
  # await-checks) and a DAG has no back-edges.
  - id: ci-verdict
    script: check-ci
    runtime: bun
    with:
      pr:
        from: "$pr.output"
      expected:
        from: "$discover-ci.output.expected_checks"
    timeout: 120000
    depends_on: [await-checks]
    output_format: *ci_state

  # Whether a red deserves one re-run before anyone attributes it, and how this
  # project's CI re-runs a job, is judgment. A re-run comes before classification,
  # so its result is evidence the classifier reads like any other.
  - id: ci-rerun
    command: rerun-ci
    model: small
    mutates_checkout: false
    depends_on: [ci-verdict]
    when: "$ci-verdict.output.state == 'red'"
    with:
      detail: "$ci-verdict.output.detail"
      ci: "$discover-ci.output"
    output_format:
      type: object
      properties:
        requested: { type: boolean }
        reason: { type: string, pattern: '\S' }
      required: [requested, reason]

  - id: await-rerun
    depends_on: [ci-rerun]
    when: "$ci-rerun.output.requested == true"
    loop_group:
      max_iterations: 13
      until_bash: |
        value=$rerun-probe.output.state
        test "$value" != "pending"
      nodes:
        - id: rerun-probe
          script: check-ci
          runtime: bun
          with:
            pr:
              from: "$pr.output"
            expected:
              from: "$discover-ci.output.expected_checks"
          timeout: 120000
          output_format: *ci_state
        - id: rerun-pause
          wait:
            event: checks.complete
            deadline_ms: 300000
          when: $rerun-probe.output.state == 'pending'
          depends_on: [rerun-probe]

  # The state the classifier judges: the re-run's conclusion, or the first
  # verdict's again when nothing was re-run.
  - id: ci-reverdict
    script: check-ci
    runtime: bun
    with:
      pr:
        from: "$pr.output"
      expected:
        from: "$discover-ci.output.expected_checks"
    timeout: 120000
    depends_on: [ci-verdict, ci-rerun, await-rerun]
    trigger_rule: none_failed_min_one_success
    when: "$ci-verdict.output.state == 'red'"
    output_format: *ci_state

  # What caused a concluded red is decided before anyone fixes or waits on it.
  # An agent reads the logs and reports where each failure lives, the base
  # commit's result, and the re-run's; ci-cause holds its claim to that evidence
  # against the changed files git reports. A failure in a file the PR changes is
  # never inherited, so it always reaches the correction pass.
  - id: ci-changed
    script: changed-files
    runtime: bun
    depends_on: [ci-reverdict]
    when: "$ci-reverdict.output.state == 'red'"
    with:
      pr:
        from: "$pr.output"
    output_format:
      type: object
      properties:
        files: { type: array, items: { type: string } }
      required: [files]

  - id: ci-classify
    command: classify-ci-red
    model: small
    mutates_checkout: false
    depends_on: [ci-reverdict]
    when: "$ci-reverdict.output.state == 'red'"
    with:
      detail: "$ci-reverdict.output.detail"
      ci: "$discover-ci.output"
    output_format: &ci_claim
      type: object
      properties:
        failing_checks: { type: array, items: { type: string } }
        failing_paths: { type: array, items: { type: string } }
        base: { type: string, enum: [fails, passes, unknown] }
        rerun: { type: string, enum: [fails, passes, not_rerun] }
        claim: { type: string, enum: [introduced, inherited, environment, unavailable] }
        evidence: { type: string, minLength: 1 }
      required: [failing_checks, failing_paths, base, rerun, claim, evidence]

  - id: ci-cause
    script: ci-cause
    runtime: bun
    depends_on: [ci-changed, ci-classify]
    output_type: ci-cause
    with:
      changed: "$ci-changed.output"
      failing_checks: "$ci-classify.output.failing_checks"
      failing_paths: "$ci-classify.output.failing_paths"
      base: "$ci-classify.output.base"
      rerun: "$ci-classify.output.rerun"
      claim: "$ci-classify.output.claim"
      evidence: "$ci-classify.output.evidence"
    output_format:
      type: object
      properties:
        cause: { type: string, enum: [introduced, inherited, environment, unavailable] }
        evidence: { type: string, minLength: 1 }
      required: [cause, evidence]

  # The one CI correction pass: introduced red is fixed at its cause, and
  # inherited red is answered by merging the repaired base. Its commits are
  # pushed and CI is waited on once more before the ready claim is confirmed; a fix (not a base
  # merge) also gets a continuation review (ci-recheck below).
  - id: ci-fix
    include: archon-implement
    depends_on: [ci-cause]
    when: "$ci-cause.output.cause == 'introduced' || $ci-cause.output.cause == 'inherited'"
    with:
      work: >-
        CI concluded non-green on this pull request's final head, classified
        as $ci-cause.output.cause:

        $ci-cause.output.evidence

        The failing checks:

        $ci-reverdict.output.detail

        When the cause is introduced, fix it at the cause. If the failure is
        outside this pull request's changed code and does not reproduce,
        declare green: false with that evidence; never change unrelated code to
        turn a check green, and never weaken a test. When the cause is
        inherited, merge the latest base into this branch with a normal merge
        commit; if the base still fails the same way, declare green: false with
        red_cause inherited and that evidence, and change nothing else. Commit
        the result; the workflow pushes it. Do not change the PR's draft state
        or edit the canonical review comment.

        Accepted work order, for scope only — do not reopen it:
        $INPUTS.work

  # The same gate, same script, with ci-cause's decision as the cause: an
  # introduced red the correction left red refuses loudly; red the change is not
  # shown to cause skipped the correction, passes with its evidence recorded,
  # and routes to the explicit action wait below.
  - id: gate-ci-fix
    script: gate-green
    runtime: bun
    # Every gate that passes red leaves the cause as its own typed artifact;
    # readers find them by type under nodes/, never through one shared file.
    output_type: green-gate
    output_format: *green_gate
    depends_on: [ci-cause, ci-fix]
    trigger_rule: none_failed_min_one_success
    with:
      green: { from: "$ci-fix.output.green", if_skipped: "false" }
      red_cause: "$ci-cause.output.cause"
      summary: "$ci-cause.output.evidence"
      stage: "The CI correction"

  - id: push-ci-fix
    script: push-head
    runtime: bun
    depends_on: [gate-ci-fix]
    when: "$ci-cause.output.cause == 'introduced' || $ci-cause.output.cause == 'inherited'"
    with:
      pr: "$pr.output"

  # A CI fix is written after the review converged, so its commits get a review
  # round of their own: a continuation over the canonical report that judges the
  # fix's correctness and structure. Skipped when no fix ran, when the pass only
  # merged the base, or when it changed nothing. A blocking finding puts the PR
  # back in draft (confirm-ready) and stops the run with the report public; there
  # is no second correction loop after CI.
  - id: ci-delta-scope
    script: delta-scope
    runtime: bun
    depends_on: [push-ci-fix]
    when: "$ci-cause.output.cause == 'introduced'"
    output_type: ci-fix-delta
    with:
      since: "$ci-fix.execution.checkoutStart"
    output_format:
      type: object
      properties:
        moved: { type: boolean }
      required: [moved]

  - id: ci-recheck
    include: archon-review
    depends_on: [ci-delta-scope]
    when: "$ci-delta-scope.output.moved == true"
    with:
      scope: "$pr.output"
      prior_report: "$ARTIFACTS_DIR/review/report.md"
      work_order: "$INPUTS.work"
      tier: "$classify.output.tier"
      errors: "$resolve-scope.output.errors"
      docs: "$classify.output.docs"

  # The readiness gate's script on the CI fix's review: only `none` passes. Its
  # typed record exists only when that review converged, which is how confirm-ready
  # knows without binding a node that may have failed.
  - id: gate-ci-recheck
    script: gate-ready
    runtime: bun
    depends_on: [ci-recheck]
    output_type: ci-fix-review
    output_format: { type: object }
    with:
      review_action: "$ci-recheck.output.action"
      correction_action: ""

  # The re-wait after a pushed correction: same probe, webhook wake-up,
  # five-minute deadline fallback, and ceiling as await-checks. When no fix ran,
  # nothing was pushed and this exits in one probe before the action route below.
  - id: await-fix-checks
    loop_group:
      max_iterations: 13
      until_bash: |
        value=$fix-ci-probe.output.state
        test "$value" != "pending"
      nodes:
        - id: fix-ci-probe
          script: check-ci
          runtime: bun
          with:
            pr:
              from: "$pr.output"
            expected:
              from: "$discover-ci.output.expected_checks"
          timeout: 120000
          output_format: *ci_state
        - id: fix-ci-pause
          wait:
            event: checks.complete
            deadline_ms: 300000
          when: $fix-ci-probe.output.state == 'pending'
          depends_on: [fix-ci-probe]
    depends_on: [gate-ci-fix, ci-delta-scope, gate-ci-recheck]
    trigger_rule: none_failed_min_one_success

  # A red after the CI fix is classified again before anything acts on it. There
  # is no second fix: introduced red refuses at the gate, and red the fix is not
  # shown to have caused passes there to the operator's pause below.
  - id: fix-verdict
    script: check-ci
    runtime: bun
    with:
      pr:
        from: "$pr.output"
      expected:
        from: "$discover-ci.output.expected_checks"
    timeout: 120000
    depends_on: [await-fix-checks]
    when: "$ci-cause.output.cause == 'introduced' || $ci-cause.output.cause == 'inherited'"
    output_format: *ci_state

  - id: fix-classify
    command: classify-ci-red
    model: small
    mutates_checkout: false
    depends_on: [fix-verdict]
    when: "$fix-verdict.output.state == 'red'"
    with:
      detail: "$fix-verdict.output.detail"
      ci: "$discover-ci.output"
    output_format: *ci_claim

  - id: gate-fix-result
    script: gate-green
    runtime: bun
    output_type: green-gate
    output_format: *green_gate
    depends_on: [fix-classify]
    with:
      green: "false"
      red_cause: "$fix-classify.output.claim"
      summary: "$fix-classify.output.evidence"
      stage: "The CI correction's result"

  # Late red that the branch did not introduce needs a person, not another
  # autonomous correction. Preserve the draft PR and the recorded refusal,
  # then probe once per explicit resume until the operator has rerun the check.
  # The post-fix cause, when one was classified, is the current one.
  - id: ci-attention-route
    script: ci-attention-route
    runtime: bun
    depends_on: [ci-verdict, gate-ci-fix, await-fix-checks, gate-fix-result]
    trigger_rule: none_failed_min_one_success
    with:
      red_cause: { from: "$gate-ci-fix.output.red_cause", if_skipped: "" }
      post_fix_cause: { from: "$gate-fix-result.output.red_cause", if_skipped: "" }
    output_format:
      type: object
      properties:
        attention: { type: boolean }
        red_cause: { type: string }
      required: [attention, red_cause]

  # Red the run could not resolve: the pull request goes back to draft before the
  # run pauses for the operator.
  - id: mark-draft
    script: mark-draft
    runtime: bun
    depends_on: [ci-attention-route]
    when: "$ci-attention-route.output.attention == true"
    with:
      pr: "$pr.output"

  - id: ci-attention
    depends_on: [mark-draft]
    when: "$ci-attention-route.output.attention == true"
    loop_group:
      max_iterations: 13
      until_bash: |
        value=$attention-ci-probe.output.state
        test "$value" = "concluded"
      nodes:
        - id: attention-ci-probe
          script: check-ci
          runtime: bun
          with:
            pr:
              from: "$pr.output"
            expected:
              from: "$discover-ci.output.expected_checks"
          timeout: 120000
          output_format: *ci_state
        - id: attention-ci-pause
          wait:
            attention: >-
              CI remains non-green for pull request
              #$pr.output.number after Archon classified the failure as
              $ci-attention-route.output.red_cause:
              $attention-ci-probe.output.detail
              Re-run the failing check, then resume this run.
          when: "$attention-ci-probe.output.state != 'concluded'"
          depends_on: [attention-ci-probe]

  # A barrier that settles once the CI path has, however it ended: a failed step
  # there must still reach the confirmation below.
  - id: ci-settled
    bash: "true"
    depends_on: [ci-verdict, ci-attention-route, ci-attention, gate-ci-fix, gate-fix-result, gate-ci-recheck]
    trigger_rule: all_done

  # The ready claim is certified on the final head: CI green, every expected check
  # present, and the CI fix's review converged — or the pull request goes back to
  # draft and this refuses. It runs however the CI path ended (ci-settled), so a
  # failed step there still leaves no red pull request ready, and it is skipped
  # when the early flip never happened, so nothing here can mark ready a pull
  # request the delivery never finished.
  - id: confirm-ready
    script: confirm-ready
    runtime: bun
    output_format:
      type: object
      properties:
        pr_url: { type: string, minLength: 1 }
      required: [pr_url]
    with:
      pr: "$pr.output"
      expected:
        from: "$discover-ci.output.expected_checks"
    depends_on: [flip-ready, ci-settled]

  # This tail's terminal report, like every other SDLC tail's (scripts/outcome.ts).
  # confirm-ready owns the final ready claim and stops there; composing
  # the text its reader receives is separate work, and a named script keeps it out
  # of a bash body.
  #
  # No `outcome_field:` here, unlike the other tails. It would need a two-valued
  # boolean on this workflow's `returns:` node, and delivery has none: confirm-ready
  # refuses rather than reporting a false verdict, so the field could only ever be
  # a constant. The run's lifecycle status already carries that fact.
  - id: outcome
    script: outcome
    runtime: bun
    with:
      pr_url: "$confirm-ready.output.pr_url"
    depends_on: [confirm-ready]
    output_format:
      type: object
      properties:
        pr_url: { type: string }
        summary: { type: string }
      required: [pr_url, summary]
