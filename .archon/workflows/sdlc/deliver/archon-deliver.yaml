name: archon-deliver
description: |
  The delivery tail, autonomous on its green path: implement the work, simplify
  it before anything is public, bring the branch up to date and open a draft PR,
  validate the project once, review it at the depth its risk earns, correct the
  findings the owner judges worth fixing (each round validated once before its
  review), file discoveries as issues, update the PR description, then check CI:
  green marks the PR ready, and red ends the run not ready with the root cause. A
  red PR is never marked ready. There is no in-run approval gate — the human gate is PR
  review and merge on GitHub, outside the run.

  Use when: decided work should become a reviewed, ready-to-merge PR —
  "deliver this plan", "take this to a PR", "build and ship this".
  NOT for: deciding what to build, or merging (always human).

# Review establishes the first verdict. When blockers remain, a bounded static
# body repeats fix → light review, so every blocking correction is independently
# checked and a clean review stops immediately. Exhausting the bound fails
# truthfully with the PR still draft and the canonical report carrying the open
# findings. Every commit that ships is read by a review round that judges structure
# as well as correctness: the first round's simplify lens (or the focused reviewer)
# reads the implementation and the structure correction, and each recheck reads its
# correction.

requires: [github]

inputs:
  pull_request:
    default: ""
    description: >-
      The number of an open pull request this delivery continues instead of opening
      one, as a caller resolved it. Empty or `null` when the caller names none; the
      run can still continue one it was launched onto.
  work:
    default: ""
    description: >-
      What to deliver — a plan path, findings, a description, or the repair of
      an existing pull request when this run was launched on its branch
      (`--adopt`, or from the pull request). Empty means the run's trigger
      message is the work.
  prior_report:
    default: ""
    description: >-
      Cross-run review continuity: the previous delivery run's review report
      path. Round 1 then verifies prior findings (rejections included) instead
      of relitigating them from scratch. Empty on a first delivery.
  # Error review can be forced on or off; `auto` leaves it to the routing agent.
  errors:
    default: "auto"
    description: Silent-failure lens — auto, true, or false.

# A composed caller reads the outcome: ready with the pull request's URL, or not
# ready with why (red CI, CI with no result, or a review that asks for a replan).
# Not ready is a valid completion, like `delivered: false` in the callers; a
# delivery that broke fails instead, naming the node that failed.
returns: outcome
outcome_field: ready

nodes:
  # The implementer checks its own changes; the project's full validation runs once,
  # just before review (validate below).
  - id: impl
    include: archon-implement
    with:
      work: "$INPUTS.work"

  # Run success never certifies the implementer's verdict: its loop completes on a
  # declared blocker too. This turns a blocker or red the change introduced into a
  # failed run before anything is published (see ../.shared/gate.ts); red the
  # change cannot have caused passes, with the cause recorded for the reports.
  - id: gate-green
    script: gate-green
    runtime: bun
    # Every gate that passes red leaves the cause as its own typed artifact;
    # readers find them by type under nodes/, never through one shared file.
    output_type: green-gate
    output_format: &green_gate
      type: object
      properties:
        gate: { type: string, enum: [green] }
        red_cause: { type: string }
        stage: { type: string }
        summary: { type: string }
      required: [gate, red_cause, stage, summary]
    depends_on: [impl]
    with:
      green: "$impl.output.green"
      red_cause: "$impl.output.red_cause"
      summary: "$impl.output.summary"
      stage: "The implementation"

  # Structure is judged before the pull request opens: a smaller shape is cheapest
  # while nothing is published and no reviewer has spent effort on code it would
  # delete. The full-tier review runs the same charter again as a lens, so the code
  # gets a second, independent structure look after the PR opens; on the focused
  # tier the focused reviewer's machinery check is that second look.
  - id: shape
    include: archon-simplify
    with:
      stage: pre-pr
      work_order: "$INPUTS.work"
    depends_on: [gate-green]

  # A decline here is judged by the review; red it leaves is caught by the
  # validation before that review.
  - id: reshape
    include: archon-implement
    depends_on: [shape]
    when: "$shape.output.findings == true"
    with:
      work: >-
        Before this work is published, judge the smaller shapes recorded in
        $ARTIFACTS_DIR/shape.md. Read it and the accepted work order below in full.
        Adopt every finding the project's values back. Decline one only with the
        evidence that it is wrong or that its smaller shape changes behavior; the
        review that follows judges every decline and reopens one whose evidence does
        not hold. Write $ARTIFACTS_DIR/shape-dispositions.md with one entry per
        finding in shape.md: adopted, or declined with its evidence. Keep the
        requested outcome and its tests intact.

        Accepted work order:
        $INPUTS.work

  - id: pr
    include: archon-pr
    with:
      draft: "true"
      pull_request: "$INPUTS.pull_request"
    depends_on: [shape, reshape]
    trigger_rule: none_failed_min_one_success

  # The project's full validation, once, on the merged tree the review will read.
  - id: validate
    include: archon-validate
    depends_on: [pr]

  # Turns the validation's verdict into a stop: red this change introduced, or a
  # validation that did not finish, fails the run before review spends anything.
  - id: gate-validated
    script: gate-green
    runtime: bun
    output_type: green-gate
    output_format: *green_gate
    depends_on: [validate]
    with:
      green: "$validate.output.green"
      red_cause: "$validate.output.red_cause"
      summary: "$validate.output.summary"
      stage: "The project validation"

  # Which review lenses this change earns is a quick judgment from the diff and the
  # work order. It runs nothing.
  - id: route
    command: route-review
    model: small
    depends_on: [gate-validated]
    mutates_checkout: false
    with:
      work: "$INPUTS.work"
      errors: "$INPUTS.errors"
    output_type: review-scope
    output_format:
      type: object
      properties:
        tier: { type: string, enum: [focused, full] }
        seams: { type: boolean }
        errors: { type: boolean }
        docs: { type: boolean }
        reason: { type: string, pattern: '\S' }
      required: [tier, seams, errors, docs, reason]

  - id: review
    include: archon-review
    with:
      # The PR node's structured read-back names the pull request, so review
      # never rediscovers an ambient branch→PR mapping. It does not name the
      # commit: every round reviews the checkout's HEAD, which archon-review
      # checks against this PR's remote head before publishing.
      scope: "$pr.output"
      prior_report: "$INPUTS.prior_report"
      work_order: "$INPUTS.work"
      tier: "$route.output.tier"
      seams: "$route.output.seams"
      errors: "$route.output.errors"
      docs: "$route.output.docs"
    depends_on: [route]

  # A ready initial review skips this block. Otherwise each round corrects the
  # current canonical findings, validates the project once, then runs a fresh
  # continuation review over the report and delta, so a blocking fix is never
  # unreviewed. until_bash ends the loop the moment a recheck stops asking for a
  # correction; five rounds is a runaway backstop, and exhausting it fails the run
  # with the PR still draft and the canonical report carrying the open findings.
  # The review's `action` is an enum the engine enforces on synthesize, so it routes
  # here unvalidated.
  - id: corrections
    depends_on: [review]
    when: "$review.output.action == 'correct'"
    loop_group:
      until_bash: |
        value=$recheck.output.action
        test "$value" != "correct"
      max_iterations: 5
      fresh_context: true
      nodes:
        - id: fix
          include: archon-implement
          with:
            work: >-
              Judge every open finding recorded in $ARTIFACTS_DIR/review/report.md,
              within the accepted work order below. Read both in full before
              editing. Fix every blocking finding, or decline it only with the
              evidence that it is not a finding: it is wrong, already satisfied,
              or its smaller shape changes behavior. Fix a note, or decline it
              with a one-line reason. The following review judges every decline.
              A finding unrelated to this change is a follow-up, not work for
              this round: say so and the review files it. Record every
              disposition — fixed, declined with its reason or evidence, or
              unrelated — in implementation.md. When a causal finding
              records a finite affected-member inventory, the finding is not
              fixed until every affected member is handled and the smallest
              relevant proof passes. Do not cross an explicit boundary to make
              a finding disappear; the following review must return replan if
              the requested outcome requires that expansion.

              Accepted work order:
              $INPUTS.work

              Commit the correction and push it to the pull request's head
              branch, $pr.output.head, naming the branch explicitly: never let
              git pick an upstream, and never force-push. Do not change the
              PR's draft state or edit the canonical review comment; the
              following review owns that public verdict.

        - id: revalidate
          include: archon-validate
          depends_on: [fix]

        - id: gate-revalidated
          script: gate-green
          runtime: bun
          output_type: green-gate
          output_format: *green_gate
          depends_on: [revalidate]
          with:
            green: "$revalidate.output.green"
            red_cause: "$revalidate.output.red_cause"
            summary: "$revalidate.output.summary"
            stage: "The project validation after a correction"

        - id: recheck
          include: archon-review
          with:
            scope: "$pr.output"
            prior_report: "$ARTIFACTS_DIR/review/report.md"
            work_order: "$INPUTS.work"
            # Continuation mode owns coverage and skips every specialist,
            # regardless of these conditional-lens bindings.
            tier: "$route.output.tier"
            seams: "$route.output.seams"
            errors: "$route.output.errors"
            docs: "$route.output.docs"
          depends_on: [gate-revalidated]

  # Work the review proved but this change does not do becomes tracker issues,
  # one per record, each linking back to this run and the pull request. It joins
  # the final verdict, so a replan files its discoveries too: that is when a scope
  # conflict matters most. A review that failed, or a correction loop that
  # exhausted its bound, has no converged discovery set and blocks this node. Off
  # the ready path: a failed filing never holds a delivered change back, but it does
  # end the run failed, so the unfiled records reach the operator.
  #
  # Before filing, a small agent makes a best-effort search of the open issues for
  # ones that already describe the same defect. Its matches are a judgment the
  # filing script validates; a miss files a duplicate.
  - id: match-discoveries
    command: match-discoveries
    model: small
    mutates_checkout: false
    depends_on: [review, corrections]
    trigger_rule: none_failed_min_one_success
    with:
      pr: "$pr.output"
      initial: { from: "$review.output.discoveries" }
      final: { from: "$corrections.output.discoveries", if_skipped: null }
    output_format:
      type: object
      properties:
        matches:
          type: array
          items:
            type: object
            properties:
              index: { type: integer, minimum: 0 }
              issue: { type: integer, minimum: 1 }
            required: [index, issue]
      required: [matches]

  - id: file-discoveries
    script: file-discoveries
    runtime: bun
    depends_on: [match-discoveries]
    with:
      pr: "$pr.output"
      initial: { from: "$review.output.discoveries" }
      final: { from: "$corrections.output.discoveries", if_skipped: null }
      matches: { from: "$match-discoveries.output.matches" }
    output_type: discovery-filing
    output_format:
      type: object
      properties:
        records:
          type: array
          items:
            type: object
            properties:
              title: { type: string }
              issue: { type: string }
            required: [title, issue]
      required: [records]

  # Corrections and the base merge can falsify claims the description made when the
  # draft opened, and a validation can pass red the description must disclose. One
  # agent reads the live description and the final diff, and edits only what is no
  # longer true. It runs once the review has converged or stopped, never per round.
  - id: update-pr-body
    command: update-pr-body
    model: medium
    depends_on: [review, corrections]
    trigger_rule: none_failed_min_one_success
    with:
      pr: "$pr.output"
    output_format:
      type: object
      properties:
        changed: { type: boolean }
        summary: { type: string, pattern: '\S' }
      required: [changed, summary]

  # Whether CI is green on the delivered head is this agent's judgment, waiting
  # included: it reads whatever CI the project has and waits for running checks
  # itself. It never writes. It runs only when the review converged; flip-ready
  # marks the pull request ready only on a green answer, so a red pull request is
  # never made ready.
  - id: ci
    command: check-ci
    model: medium
    mutates_checkout: false
    depends_on: [update-pr-body]
    # `&&` short-circuits, so the loop's verdict is read only when the loop ran.
    when: "$review.output.action == 'none' || $review.output.action == 'correct' && $corrections.output.action == 'none'"
    with:
      pr: "$pr.output"
    output_format:
      type: object
      properties:
        state: { type: string, enum: [green, red, blocked] }
        summary: { type: string, pattern: '\S' }
        evidence: { type: string, pattern: '\S' }
      required: [state, summary, evidence]

  - id: flip-ready
    script: flip-ready
    runtime: bun
    depends_on: [ci]
    when: "$ci.output.state == 'green'"
    with:
      pr: "$pr.output"
    output_format:
      type: object
      properties:
        pr_url: { type: string, minLength: 1 }
      required: [pr_url]

  # This tail's terminal report, like every other SDLC tail's (scripts/outcome.ts):
  # ready with the pull request's URL, or not ready with why. A failed flip blocks
  # this join, so the run reports the node that failed.
  - id: outcome
    script: outcome
    runtime: bun
    depends_on: [update-pr-body, ci, flip-ready]
    trigger_rule: none_failed_min_one_success
    with:
      pr: "$pr.output"
      review_action: "$review.output.action"
      correction_action: { from: "$corrections.output.action", if_skipped: null }
      state: { from: "$ci.output.state", if_skipped: null }
      ci_summary: { from: "$ci.output.summary", if_skipped: null }
      pr_url: { from: "$flip-ready.output.pr_url", if_skipped: null }
    output_format:
      type: object
      properties:
        ready: { type: boolean }
        pr_url: { type: string, minLength: 1 }
        summary: { type: string }
      required: [ready, pr_url, summary]
