name: archon-triage-block
description: |
  Ground one work item against the current repository before deciding what kind
  of work it needs. Reconciles tracker history, current code, moved branches,
  stale assumptions, and explicit direction; judges whether the item is a
  contract a run can start from; then routes to investigate, plan, deliver,
  continue an open PR that already carries the outcome, split a large item
  into issues when building it whole would not work, or no action.
  Advisory: it leaves the checkout unchanged, and writes labels only when asked
  to publish.

  The graph of archon-triage, for a workflow that composes triage in its own run.
  It declares no run settings, so a composer's worktree choice stands.

model: ['@triage', medium]

inputs:
  target:
    default: ""
    description: >-
      What to triage — an issue, document, plan, report, or free-form request.
      When empty, the run's trigger message is the target. One item per run.
  publish:
    default: "false"
    description: >-
      Write the derived labels to the tracker item — true or false. Off by
      default; the run then records the labels it would apply.

# A composing caller resolves to the triage agent's typed output. A field only one
# branch of the decision carries, such as `decision.route`, reads as empty on the others.
returns: triage

nodes:
  - id: triage
    command: triage
    # Triage is advisory on both counts, and the engine holds both. It fails this
    # node with the touched paths named if the checkout is modified, and it
    # refuses the artifact pointer below if the report it names does not exist —
    # so a route with no evidence behind it never leaves here.
    mutates_checkout: false
    output_type: work-triage
    output_format:
      type: object
      properties:
        # The verdict and what it carries, as one value: each branch admits only
        # the fields its contract verdict owns, so an illegal combination (a route
        # on a contract that is not READY, edits on a BLOCKED item) is rejected
        # here, where the provider can re-ask.
        decision:
          anyOf:
            - type: object
              additionalProperties: false
              properties:
                contract: { type: string, enum: [READY] }
                route: { type: string, enum: [investigate, plan, deliver, split] }
              required: [contract, route]
            - type: object
              additionalProperties: false
              properties:
                contract: { type: string, enum: [READY] }
                route: { type: string, enum: [continue] }
                # The number of the open pull request in the item's repository
                # that carries this outcome; the run continues it instead of
                # opening another.
                pull_request: { type: integer, minimum: 1 }
              required: [contract, route, pull_request]
            - type: object
              additionalProperties: false
              properties:
                contract: { type: string, enum: [NEEDS_CONTRACT_WORK] }
                # What the author must answer before any route can start; the
                # author's text is never rewritten.
                questions:
                  type: array
                  minItems: 1
                  maxItems: 5
                  items: { type: string, pattern: '\S' }
              required: [contract, questions]
            - type: object
              additionalProperties: false
              properties:
                contract: { type: string, enum: [BLOCKED] }
                blocked_reason: { type: string, pattern: '\S' }
                # URLs are verified references, never guesses.
                blocked_by: { type: array, items: { type: string } }
              required: [contract, blocked_reason, blocked_by]
            - type: object
              additionalProperties: false
              properties:
                contract: { type: string, enum: [NO_ACTION] }
                # What made the item closable: the open issue it duplicates, or the
                # merged change that delivered it. The URL is one the agent opened,
                # never a guess; a duplicate also names the original as an item, so
                # the close can link back to it.
                closure:
                  anyOf:
                    - type: object
                      additionalProperties: false
                      properties:
                        kind: { type: string, enum: [duplicate] }
                        url: { type: string, pattern: '\S' }
                        original: &item_ref
                          type: object
                          additionalProperties: false
                          properties:
                            repo:
                              type: object
                              properties:
                                host: { type: string, pattern: '\S' }
                                path: { type: string, pattern: '\S' }
                              required: [host, path]
                              additionalProperties: false
                            number: { type: integer, minimum: 1 }
                          required: [repo, number]
                      required: [kind, url, original]
                    - type: object
                      additionalProperties: false
                      properties:
                        kind: { type: string, enum: [delivered] }
                        url: { type: string, pattern: '\S' }
                      required: [kind, url]
              required: [contract, closure]
            # Triage could not do its work: a forge read it needed answered with an
            # error other than `not_found`. This is not a verdict about the item; the
            # labels node refuses it, so the run fails and the item stays untriaged.
            - type: object
              additionalProperties: false
              properties:
                contract: { type: string, enum: [NOT_TRIAGED] }
                failed:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    additionalProperties: false
                    properties:
                      op: { type: string, pattern: '\S' }
                      kind: { type: string, pattern: '\S' }
                    required: [op, kind]
              required: [contract, failed]
        # Five judged fields, each a value and a one-line reason. Only type and
        # size become labels; a composing caller reads all five.
        type:
          type: object
          additionalProperties: false
          properties:
            value: { type: string, enum: [bug, feature, refactor, maintenance, docs, question] }
            reason: { type: string, pattern: '\S' }
          required: [value, reason]
        size:
          type: object
          additionalProperties: false
          properties:
            value: { type: string, enum: [s, m, l] }
            reason: { type: string, pattern: '\S' }
          required: [value, reason]
        complexity:
          type: object
          additionalProperties: false
          properties:
            value: { type: string, enum: [low, medium, high] }
            reason: { type: string, pattern: '\S' }
          required: [value, reason]
        importance:
          type: object
          additionalProperties: false
          properties:
            value: { type: string, enum: [low, medium, high] }
            reason: { type: string, pattern: '\S' }
          required: [value, reason]
        urgency:
          type: object
          additionalProperties: false
          properties:
            value: { type: string, enum: [none, soon, now] }
            reason: { type: string, pattern: '\S' }
          required: [value, reason]
        # The tracker item the labels address: a qualified repository and a
        # positive number, or the empty repository with number 0 when the target
        # was not a tracker issue. Any other pairing is re-asked at this node.
        item:
          anyOf:
            - *item_ref
            - type: object
              additionalProperties: false
              properties:
                repo:
                  type: object
                  properties:
                    host: { type: string, enum: [''] }
                    path: { type: string, enum: [''] }
                  required: [host, path]
                  additionalProperties: false
                number: { type: integer, enum: [0] }
              required: [repo, number]
        area_labels:
          type: array
          items: { type: string, pattern: '\S' }
        # Work the next node should know about: overlapping open issues, closed
        # earlier attempts, recent merged changes on the same surface. Each URL is one
        # the agent opened; duplicates and blockers live in the decision instead.
        related:
          type: array
          items:
            type: object
            additionalProperties: false
            properties:
              url: { type: string, pattern: '\S' }
              relation: { type: string, pattern: '\S' }
            required: [url, relation]
        summary: { type: string, pattern: '\S' }
        report:
          # The evidence contract, enforced by the engine at this node: a pointer at a
          # file this run's artifacts do not hold, or an empty one, is refused before
          # the node completes, so a verdict cannot arrive without its report.
          type: object
          properties:
            type: { type: string, enum: [archon_artifact] }
            run_id: { type: string }
            path: { type: string, enum: [triage.md] }
          required: [type, run_id, path]
      required: [decision, type, size, complexity, importance, urgency, item, area_labels, related, summary, report]

  # A NOT_TRIAGED decision is refused here, before anything is recorded. Otherwise the
  # pack's labels derive from the decision here rather than being chosen by the
  # model: one state label and one type label, plus a size label while the item can
  # still be worked. They are written only under publish, after the item's identity
  # is verified on the tracker, and read back before the node reports them.
  - id: labels
    script: labels
    runtime: bun
    depends_on: [triage]
    with:
      triage: { from: "$triage.output" }
      publish: "$INPUTS.publish"
    output_format:
      type: object
      properties:
        labels: { type: array, items: { type: string } }
        published: { type: boolean }
      required: [labels, published]
