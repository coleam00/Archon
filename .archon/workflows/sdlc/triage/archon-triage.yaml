name: archon-triage
description: |
  Ground one work item against the current repository before deciding what kind
  of work it needs. Reconciles tracker history, current code, moved branches,
  stale assumptions, and explicit direction; judges whether the item is a
  contract a run can start from; then routes to investigate, plan, deliver, or
  no action. Advisory: it leaves the checkout unchanged, and writes labels only
  when asked to publish.

  Use when: an issue, plan, report, or request may be stale or may prescribe an
  unverified solution — "triage this issue", "what does this need next", "is
  this ready to build".
  NOT for: performing the investigation, writing the plan, or delivering work.

model: medium

inputs:
  target:
    default: ""
    description: >-
      What to triage — an issue, document, plan, report, or free-form request.
      When empty, the run's trigger message is the target. One item per run.
  publish:
    default: "false"
    description: >-
      Write the derived labels to the tracker item — true or false. Off by
      default; the run then records the labels it would apply.

# The verdict node is what a composing caller resolves to: the same fields the
# prompt declared, after the boundary has verified the tuple is legal.
returns: verdict
outcome_field: ready

nodes:
  - id: triage
    command: triage
    # Triage is advisory on both counts, and the engine holds both. It fails this
    # node with the touched paths named if the checkout is modified, and it
    # refuses the artifact pointer below if the report it names does not exist —
    # so a route with no evidence behind it never leaves here.
    mutates_checkout: false
    output_type: work-triage
    output_format:
      type: object
      properties:
        contract:
          type: string
          enum: [READY, NEEDS_CONTRACT_WORK, BLOCKED, NO_ACTION]
        route:
          type: string
          enum: [investigate, plan, deliver, no_action]
        design_first:
          type: boolean
        complexity:
          type: string
          enum: [small, risky, large]
        # The tracker item the labels address. An empty repository means the
        # target was not a tracker issue.
        item:
          type: object
          properties:
            repository:
              type: string
            number:
              type: integer
          required: [repository, number]
        area_labels:
          type: array
          items:
            type: string
        # Only NEEDS_CONTRACT_WORK fills these; a later gated step applies them.
        proposed_edits:
          type: object
          properties:
            title:
              type: string
            body:
              type: string
          required: [title, body]
        # Only BLOCKED fills these. URLs are verified references, never guesses.
        blocked_reason:
          type: string
        blocked_by:
          type: array
          items:
            type: string
        summary:
          type: string
        report:
          # The evidence contract, enforced by the engine at this node: a pointer at a
          # file this run's artifacts do not hold, or an empty one, is refused before
          # the node completes, so a verdict cannot arrive without its report.
          type: object
          properties:
            type: { type: string, enum: [archon_artifact] }
            run_id: { type: string }
            path: { type: string, enum: [triage.md] }
          required: [type, run_id, path]
      required:
        - contract
        - route
        - design_first
        - complexity
        - item
        - area_labels
        - proposed_edits
        - blocked_reason
        - blocked_by
        - summary
        - report

  # The prompt judges; this boundary verifies what a schema cannot: the relations
  # between fields. Only a READY contract carries an engineering route, design-first
  # is a READY item routed to plan, only NEEDS_CONTRACT_WORK proposes edits, only
  # BLOCKED names blockers, and the pack's labels are derived here rather than
  # chosen by the model: one state label, plus a size label while the item can
  # still be worked. Each field's own type and vocabulary were certified on the
  # node above. Labels are written only under publish, after the item's identity
  # is verified on the tracker, and read back before the node reports them.
  - id: verdict
    script: verdict
    runtime: bun
    depends_on: [triage]
    with:
      contract: "$triage.output.contract"
      route: "$triage.output.route"
      design_first: "$triage.output.design_first"
      complexity: "$triage.output.complexity"
      item: { from: "$triage.output.item" }
      area_labels: { from: "$triage.output.area_labels" }
      proposed_edits: { from: "$triage.output.proposed_edits" }
      blocked_reason: "$triage.output.blocked_reason"
      blocked_by: { from: "$triage.output.blocked_by" }
      summary: "$triage.output.summary"
      report: { from: "$triage.output.report" }
      publish: "$INPUTS.publish"
    output_format:
      type: object
      properties:
        contract:
          type: string
          enum: [READY, NEEDS_CONTRACT_WORK, BLOCKED, NO_ACTION]
        route:
          type: string
          enum: [investigate, plan, deliver, no_action]
        ready:
          type: boolean
        design_first:
          type: boolean
        complexity:
          type: string
          enum: [small, risky, large]
        labels:
          type: array
          items:
            type: string
        published:
          type: boolean
        proposed_edits:
          type: object
          properties:
            title:
              type: string
            body:
              type: string
          required: [title, body]
        blocked_reason:
          type: string
        blocked_by:
          type: array
          items:
            type: string
        summary:
          type: string
        # The same pointer, so a composing caller resolves to a verdict that still
        # carries its evidence; the engine checks it again here.
        report:
          type: object
          properties:
            type: { type: string, enum: [archon_artifact] }
            run_id: { type: string }
            path: { type: string, enum: [triage.md] }
          required: [type, run_id, path]
      required:
        - contract
        - route
        - ready
        - design_first
        - complexity
        - labels
        - published
        - proposed_edits
        - blocked_reason
        - blocked_by
        - summary
        - report
