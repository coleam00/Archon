name: archon-triage
description: |
  Ground one work item against the current repository before deciding what kind
  of work it needs. Reconciles tracker history, current code, moved branches,
  stale assumptions, and explicit direction; then routes to investigate, plan,
  deliver, or no action, and judges whether the item is a usable contract
  (READY, NEEDS_CONTRACT_WORK, BLOCKED, NO_ACTION) beside the route. Proposes
  labels and, for NEEDS_CONTRACT_WORK, the edits that would make it ready.
  Advisory: it leaves the checkout unchanged and never writes to the tracker
  unless `publish` is explicitly set.

  Use when: an issue, plan, report, or request may be stale or may prescribe an
  unverified solution - "triage this issue", "what does this need next", "is
  this ready to build".
  NOT for: performing the investigation, writing the plan, delivering work, or
  applying the proposed edits.

model: medium

inputs:
  target:
    default: ""
    description: >-
      What to triage - an issue, document, plan, report, or free-form request.
      When empty, the run's trigger message is the target.
  publish:
    default: "false"
    description: >-
      "true" writes only the proposed pack state label to the resolved GitHub issue
      (creating any of the five pack labels that do not already exist) and
      reads them back through the forge owner. Other labels remain proposals.
      "false" stays advisory; other values are rejected.

returns: validate-contract

nodes:
  - id: triage
    command: triage
    # The engine enforces checkout intactness.
    mutates_checkout: false
    output_type: work-triage
    output_format: &triage-output
      type: object
      properties: &triage-properties
        route:
          type: string
          enum: [investigate, plan, deliver, no_action]
        summary:
          type: string
        contract:
          type: string
          enum: [READY, NEEDS_CONTRACT_WORK, BLOCKED, NO_ACTION]
        design_first:
          type: boolean
        complexity:
          type: string
          enum: [small_bounded, risky, large]
        proposed_edits:
          type: object
          properties:
            title: { type: string }
            body: { type: string }
          required: [title, body]
        labels:
          type: array
          items: { type: string }
        blocked_by:
          type: array
          items: { type: string }
        blocked_reason:
          type: string
        issue_repo:
          type: string
        issue_number:
          type: integer
        issue_url:
          type: string
      required:
        - route
        - summary
        - contract
        - design_first
        - complexity
        - proposed_edits
        - labels
        - blocked_reason
        - blocked_by
        - issue_repo
        - issue_number
        - issue_url

  # Only validated tuples reach consumers. Publication, when enabled, must
  # also verify before this node returns.
  - id: validate-contract
    script: validate-contract
    runtime: uv
    depends_on: [triage]
    output_format:
      <<: *triage-output
      properties:
        <<: *triage-properties
        publication:
          type: object
          properties:
            published: { type: boolean }
            applied_labels: { type: array, items: { type: string } }
            skipped_labels: { type: array, items: { type: string } }
          required: [published, applied_labels, skipped_labels]
      required: [route, summary, contract, design_first, complexity, proposed_edits, labels, blocked_reason, blocked_by, issue_repo, issue_number, issue_url, publication]
    with:
      triage: "$triage.output"
      publish: "$INPUTS.publish"
