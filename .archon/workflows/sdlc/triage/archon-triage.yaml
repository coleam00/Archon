name: archon-triage
description: |
  Ground one work item against the current repository before deciding what kind
  of work it needs. Reconciles tracker history, current code, moved branches,
  stale assumptions, and explicit direction; then routes to investigate, plan,
  deliver, or no action. Advisory: it leaves the checkout unchanged.

  Use when: an issue, plan, report, or request may be stale or may prescribe an
  unverified solution — "triage this issue", "what does this need next", "is
  this ready to build".
  NOT for: performing the investigation, writing the plan, or delivering work.

model: medium

inputs:
  target:
    default: ""
    description: >-
      What to triage — an issue, document, plan, report, or free-form request.
      When empty, the run's trigger message is the target.

returns: triage

nodes:
  - id: triage
    command: triage
    # Triage is advisory on both counts, and the engine holds both. It fails this
    # node with the touched paths named if the checkout is modified, and it
    # refuses the artifact pointer below if the report it names does not exist —
    # so a route with no evidence behind it never leaves here.
    mutates_checkout: false
    output_type: work-triage
    output_format:
      type: object
      properties:
        route:
          type: string
          enum: [investigate, plan, deliver, no_action]
        summary:
          type: string
        report:
          # The evidence contract, enforced by the engine at this node: a pointer at a
          # file this run's artifacts do not hold is refused before the node completes,
          # so a verdict cannot arrive without its report. The bar is an existing, non-empty
          # file, the bar the node this replaced enforced by hand.
          type: object
          properties:
            type: { type: string, enum: [archon_artifact] }
            run_id: { type: string }
            path: { type: string, enum: [triage.md] }
          required: [type, run_id, path]
      required: [route, summary, report]
