# Dry-run fixture: a clear item answered with a cited ruling. The scripts are stubbed;
# .archon/scripts/__tests__/attention-manager.test.ts runs them.
facts:
  path: decide
  item:
    kind: attention
    runId: "stub-asking-run"
    workflow: archon-build-queue
    node: ask
    occurrence: "stub-occurrence"
    labels: { build: stop }
    pausedAt: "2026-10-16T14:15:21.000Z"
    message: "stub: the decision, its recommendation and the choices"
    form: select
    options: [{ id: stub-keep }, { id: stub-change }]
    context: { artifactsDir: "/stub/artifacts/runs/stub-asking-run" }
  policy_defaults: "/stub/policy"
decide:
  decision: answer
  choice: stub-keep
  ruling: "stub: keep the hard cap, as the dated scope section rules."
  sources: ["stub: the issue's Current scope section"]
  confidence: high
  reason: "stub: the dated scope section settles it"
apply:
  decision: answered
  summary: "stub: answered with stub-keep"
  record: "attention-manager/decisions/stub-asking-run/stub-occurrence"
  evaluation: null
fixture:
  inputs: { autonomy: answer }
  expect: completed
  reached: [facts, decide, apply]
exec-code: true
