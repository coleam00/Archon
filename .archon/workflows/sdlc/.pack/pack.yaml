# The SDLC pack's settings. A project sets them in `.archon/packs/sdlc.yaml`, under
# `settings:`; the README's setup guide says what each one does.
inputs:
  ci:
    type: enum
    values: [forge, none]
    default: forge
    description: >-
      What the merge gate trusts at a pull request's head besides a Ready review verdict.
      forge: green checks on the forge. none: the full validation delivery ran and
      recorded at that same head, for a project with no CI.
  build_lane:
    type: enum
    values: [auto, manual]
    default: auto
    description: >-
      auto: the build queue launches a clear item's round by itself. manual: no round
      launches until a maintainer answered the queue's question about the item, so every
      launch comes to the attention queue with a recommendation.
  merge_lane:
    type: enum
    values: [auto, manual]
    default: auto
    description: >-
      auto: the merge queue merges a clear pull request by itself. manual: nothing merges
      until a maintainer approved the pull request at its head, so every merge comes to
      the attention queue with a recommendation.
  protected_paths:
    type: list
    default: ""
    description: >-
      Comma-separated globs, such as `.archon/workflows/**,infra/**`. A pull request
      that changes a matching path never merges on the auto lane: it merges only once a
      maintainer approved it at its head.

# The trigger bindings the pack recommends. Nothing here starts a run: an operator writes
# them for one repository with `archon pack bindings sdlc` and registers each file.
# The README's setup guide says how. https://archon.diy/guides/sdlc-operations/ says,
# queue by queue, why each capacity and overlap is what it is.
bindings:
  intake-issues:
    workflow: archon-intake
    resource: intake
    capacity: 2
    overlap: queue
    event:
      kind: issue.lifecycle
      actions: [opened, edited, reopened]
    inputs:
      repo_host: { event: repository.host }
      repo_path: { event: repository.path }
      number: { event: subject.number }
      kind: { event: subject.kind }
      action: { event: event.action }
      build_queue_binding: { binding: build-queue }
  intake-labels:
    workflow: archon-intake
    resource: intake
    capacity: 2
    overlap: queue
    event:
      kind: label.changed
      actions: [added]
      # The one request label, TRIAGE_REQUEST in .shared/labels.ts. The predicate only
      # saves runs: intake ignores any other label.
      predicates:
        - field: label.name
          in: [archon-triage]
    inputs:
      repo_host: { event: repository.host }
      repo_path: { event: repository.path }
      number: { event: subject.number }
      kind: { event: subject.kind }
      action: { event: event.action }
      label: { event: label.name }
      label_actor: { event: label.actor.login }
      build_queue_binding: { binding: build-queue }
  build-queue:
    workflow: archon-build-queue
    resource: build
    capacity: 2
    overlap: skip
    isolation: { kind: worktree }
    schedule: { interval_seconds: 1800 }
    inputs:
      repo_host: { repo: host }
      repo_path: { repo: path }
      build_queue_binding: { binding: build-queue }
  split-queue:
    workflow: archon-split
    resource: split
    overlap: skip
    schedule: { interval_seconds: 1800 }
    inputs:
      repo_host: { repo: host }
      repo_path: { repo: path }
  # A short interval stands in for an event the forge does not deliver: a pull request
  # whose checks were pending merges soon after they finish. A sweep where nothing
  # changed runs no agent.
  merge-queue:
    workflow: archon-merge-queue
    resource: merge
    overlap: skip
    schedule: { interval_seconds: 300 }
    inputs:
      repo_host: { repo: host }
      repo_path: { repo: path }
      merge_queue_binding: { binding: merge-queue }
      build_queue_binding: { binding: build-queue }
      discoveries_binding: { binding: discoveries }
  discoveries:
    workflow: archon-discoveries
    resource: discoveries
    overlap: skip
    schedule: { interval_seconds: 14400 }
    inputs:
      repo_host: { repo: host }
      repo_path: { repo: path }
  metrics-prs:
    workflow: archon-metrics-prs
    resource: metrics-prs
    overlap: skip
    schedule: { interval_seconds: 86400 }
  metrics-test-value:
    workflow: archon-metrics-test-value
    resource: metrics-test-value
    overlap: skip
    schedule: { interval_seconds: 86400 }
    inputs:
      since: 1d
  worktree-cleanup:
    workflow: archon-worktree-cleanup
    # The sweep covers every project registered on the host, so one resource guards it.
    resource: worktree-cleanup
    resource_scope: host
    overlap: skip
    schedule: { interval_seconds: 21600 }
    inputs:
      include_closed: 'false'
