# The SDLC pack's settings. A project sets them in `.archon/packs/sdlc.yaml`, under
# `settings:`. Everything else a project holds an opinion on is policy text: the pack's
# defaults in `.shared/policy/`, which a project's `.archon/sdlc/policy/<topic>.md` adds to.
inputs:
  ci:
    type: enum
    values: [forge, none]
    default: forge
    description: >-
      Where a change's full validation comes from. forge: the checks the forge runs on
      the pull request. none: the project has no CI, so the host stage runs the full
      validation itself and the land stage merges only the commit it validated.
  land_policy:
    type: string
    file: true
    default: ""
    description: >-
      The project's land policy, a path from the project root, read after the pack's
      default `.shared/policy/merge.md`. It says which pull requests merge on their own
      and which are asked. Empty: the default alone applies. It is a setting, not a policy
      file found by name, because a policy that goes missing silently lets merges through
      that the project would have asked about; `archon validate workflows` reports a path
      that does not exist.

# The forge operations the pack's agents call. The engine checks
# them when a run of any pack workflow starts, before a worktree, a slot or a node: the
# project's forge plugin must advertise every one and have a credential the forge
# accepts. `repository` names the inputs a run names its repository in.
forge:
  repository: { host: repo_host, path: repo_path }
  operations:
    - pr.view
    - pr.create
    - pr.edit-body
    - pr.ready
    - pr.draft
    - pr.close
    - pr.merge
    - pr.merge-state
    - pr.threads
    - pr.thread.reply
    - pr.thread.resolve
    - checks.state
    - checks.logs
    - checks.rerun
    - repo.labels.list
    - workitem.view
    - workitem.comments
    - workitem.search
    - workitem.create
    - workitem.close
    - workitem.comment.upsert
    - workitem.label.add

# How the stages chain. A declaration starts nothing: `archon pack bindings sdlc` writes
# one trigger file per binding, outcome and option for one repository, and
# `archon trigger add` registers each. The README says how.
#
# Every stage works on the issue's item, `issue-<number>`. It ends with an outcome, and a
# run-ended binding starts the next stage on the same item. A stage that needs a decision
# ends with asks on the item; when they are answered, an asks-settled binding starts the
# stage the answer chose, or the same stage again with the answers as decisions made.
# `answers: { item: answers }` hands every stage every answer given on the item so far.
#
# From build on, each stage works in the checkout the stage before it left
# (`checkout: ended-run` or `asking-run`), so the change stays on one branch and the
# builder continues it there.
bindings:
  # Intake. A maintainer adding the label `archon-triage` to an issue is the only start:
  # an issue nobody labelled reaches no agent. The source plugin sees the label by
  # webhook, or reads it with `observe` on an install with no webhooks.
  triage-on-label:
    workflow: archon-triage
    resource: sdlc-triage
    capacity: 3
    overlap: queue
    event:
      kind: label.changed
      actions: [added]
      predicates:
        - { field: label.name, equals: archon-triage }
        - { field: subject.kind, equals: issue }
    item: { field: subject.number, prefix: issue- }
    inputs:
      issue: { event: subject.number }
      repo_host: { repo: host }
      repo_path: { repo: path }
  triage-after-answers:
    workflow: archon-triage
    resource: sdlc-triage
    capacity: 3
    overlap: queue
    asks_settled: { workflow: archon-triage, settled: answered }
    inputs: &asked
      issue: { input: issue }
      repo_host: { repo: host }
      repo_path: { repo: path }
      answers: { item: answers }

  # After triage: investigate a cause nobody knows, split what cannot be built as one
  # change, and send what is known (to plan) or ready (to build) through the link stage.
  investigate-after-triage:
    workflow: archon-investigate
    resource: sdlc-investigate
    capacity: 3
    overlap: queue
    run_ended: { workflow: archon-triage, outcome: investigate }
    inputs: &ended
      issue: { input: issue }
      repo_host: { repo: host }
      repo_path: { repo: path }
      answers: { item: answers }
  investigate-after-answers:
    workflow: archon-investigate
    resource: sdlc-investigate
    capacity: 3
    overlap: queue
    asks_settled: { workflow: archon-investigate, settled: answered }
    inputs: *asked
  split-after-triage:
    workflow: archon-split
    resource: sdlc-split
    capacity: 2
    overlap: queue
    run_ended: { workflow: archon-triage, outcome: split }
    inputs: *ended
  split-after-answers:
    workflow: archon-split
    resource: sdlc-split
    capacity: 2
    overlap: queue
    asks_settled: { workflow: archon-split, settled: answered }
    inputs: *asked
  # Link: can it be built now? Triage's `plan` and `build` go through it. It records the
  # item's links itself, and an item that waits holds a `depends_on` link to what it
  # waits on: when that item lands or ends without landing, link starts again on every
  # item that depends on it.
  link-after-triage:
    workflow: archon-link
    resource: sdlc-link
    capacity: 3
    overlap: queue
    run_ended: { workflow: archon-triage, outcome: [plan, build] }
    inputs: *ended
  link-after-answers:
    workflow: archon-link
    resource: sdlc-link
    capacity: 3
    overlap: queue
    asks_settled: { workflow: archon-link, settled: answered }
    inputs: *asked
  link-after-blocker-landed:
    workflow: archon-link
    resource: sdlc-link
    capacity: 3
    overlap: queue
    run_ended: { workflow: archon-land, outcome: merged, linked: { kind: depends_on, holder: from } }
    inputs: &blocker
      ended: { item: key }
      repo_host: { repo: host }
      repo_path: { repo: path }
  link-after-blocker-closed:
    workflow: archon-link
    resource: sdlc-link
    capacity: 3
    overlap: queue
    run_ended: { workflow: archon-triage, outcome: [close, split], linked: { kind: depends_on, holder: from } }
    inputs: *blocker
  link-after-blocker-refuted:
    workflow: archon-link
    resource: sdlc-link
    capacity: 3
    overlap: queue
    run_ended: { workflow: archon-investigate, outcome: refuted, linked: { kind: depends_on, holder: from } }
    inputs: *blocker
  plan-after-link:
    workflow: archon-plan
    resource: sdlc-plan
    capacity: 3
    overlap: queue
    run_ended: { workflow: archon-link, outcome: plan }
    inputs: &linked
      issue: { result: /issue }
      repo_host: { repo: host }
      repo_path: { repo: path }
      answers: { item: answers }
  plan-after-split:
    workflow: archon-plan
    resource: sdlc-plan
    capacity: 3
    overlap: queue
    run_ended: { workflow: archon-split, outcome: plan }
    inputs: *ended
  plan-after-answers:
    workflow: archon-plan
    resource: sdlc-plan
    capacity: 3
    overlap: queue
    asks_settled: { workflow: archon-plan, settled: answered }
    inputs: *asked
  # Delivery found that the plan cannot deliver the outcome: plan it again.
  plan-after-build:
    workflow: archon-plan
    resource: sdlc-plan
    capacity: 3
    overlap: queue
    run_ended: { workflow: archon-build, outcome: replan }
    inputs: *ended
  plan-after-review:
    workflow: archon-plan
    resource: sdlc-plan
    capacity: 3
    overlap: queue
    run_ended: { workflow: archon-review, outcome: replan }
    inputs: *ended
  plan-after-review-answers:
    workflow: archon-plan
    resource: sdlc-plan
    capacity: 3
    overlap: queue
    asks_settled: { workflow: archon-review, settled: answered, option: replan }
    inputs: *asked
  plan-after-host-answers:
    workflow: archon-plan
    resource: sdlc-plan
    capacity: 3
    overlap: queue
    asks_settled: { workflow: archon-host, settled: answered, option: replan }
    inputs: *asked

  # Build. The first build of an item starts from what planned it: a plan, an
  # investigation that rooted the cause, or triage's handoff for small specified work
  # that the link stage placed.
  build-after-link:
    workflow: archon-build
    resource: sdlc-build
    capacity: 5
    overlap: queue
    run_ended: { workflow: archon-link, outcome: build }
    inputs: *linked
  build-after-split:
    workflow: archon-build
    resource: sdlc-build
    capacity: 5
    overlap: queue
    run_ended: { workflow: archon-split, outcome: build }
    inputs: *ended
  build-after-investigate:
    workflow: archon-build
    resource: sdlc-build
    capacity: 5
    overlap: queue
    run_ended: { workflow: archon-investigate, outcome: rooted }
    inputs: *ended
  build-after-plan:
    workflow: archon-build
    resource: sdlc-build
    capacity: 5
    overlap: queue
    run_ended: { workflow: archon-plan, outcome: planned }
    inputs: *ended
  build-after-answers:
    workflow: archon-build
    resource: sdlc-build
    capacity: 5
    overlap: queue
    asks_settled: { workflow: archon-build, settled: answered, checkout: asking-run }
    inputs: *asked

  # A change sent back continues in the builder's own session, on its own branch. Each
  # way back is limited to three starts per item until the item is planned again; the
  # stage that would send it back past the limit asks instead, and a `send-back` answer
  # gives the builder one more round. The option ids are the ones review, host and land
  # declare under `returns.options`.
  build-after-review:
    workflow: archon-build
    resource: sdlc-build
    capacity: 5
    overlap: queue
    limit: { starts: 3, reset_on: archon-plan }
    run_ended: { workflow: archon-review, outcome: return, checkout: ended-run }
    inputs: &returned
      issue: { input: issue }
      repo_host: { repo: host }
      repo_path: { repo: path }
      answers: { item: answers }
      returned: { result: "" }
  build-after-review-answers:
    workflow: archon-build
    resource: sdlc-build
    capacity: 5
    overlap: queue
    asks_settled: { workflow: archon-review, settled: answered, option: send-back, checkout: asking-run }
    inputs: *returned
  build-after-host:
    workflow: archon-build
    resource: sdlc-build
    capacity: 5
    overlap: queue
    limit: { starts: 3, reset_on: archon-plan }
    run_ended: { workflow: archon-host, outcome: return, checkout: ended-run }
    inputs: *returned
  build-after-host-answers:
    workflow: archon-build
    resource: sdlc-build
    capacity: 5
    overlap: queue
    asks_settled: { workflow: archon-host, settled: answered, option: send-back, checkout: asking-run }
    inputs: *returned
  build-after-land:
    workflow: archon-build
    resource: sdlc-build
    capacity: 5
    overlap: queue
    limit: { starts: 3, reset_on: archon-plan }
    run_ended: { workflow: archon-land, outcome: return, checkout: ended-run }
    inputs: *returned
  build-after-land-answers:
    workflow: archon-build
    resource: sdlc-build
    capacity: 5
    overlap: queue
    asks_settled: { workflow: archon-land, settled: answered, option: send-back, checkout: asking-run }
    inputs: *returned

  # Review every build, on the commit it ended on.
  review-after-build:
    workflow: archon-review
    resource: sdlc-review
    capacity: 5
    overlap: queue
    run_ended: { workflow: archon-build, outcome: built, checkout: ended-run }
    inputs: *ended

  # Host: the pull request's own checks, review threads and description.
  host-after-review:
    workflow: archon-host
    resource: sdlc-host
    capacity: 5
    overlap: queue
    run_ended: { workflow: archon-review, outcome: approve, checkout: ended-run }
    inputs: *ended
  host-after-review-answers:
    workflow: archon-host
    resource: sdlc-host
    capacity: 5
    overlap: queue
    asks_settled: { workflow: archon-review, settled: answered, option: take-as-is, checkout: asking-run }
    inputs: *asked

  # Land, one change at a time: the second is judged against a branch that has the first.
  land-after-host:
    workflow: archon-land
    resource: sdlc-land
    capacity: 1
    overlap: queue
    run_ended: { workflow: archon-host, outcome: ready, checkout: ended-run }
    inputs: *ended
  land-after-host-answers:
    workflow: archon-land
    resource: sdlc-land
    capacity: 1
    overlap: queue
    asks_settled: { workflow: archon-host, settled: answered, option: take-as-is, checkout: asking-run }
    inputs: *asked
  land-after-answers:
    workflow: archon-land
    resource: sdlc-land
    capacity: 1
    overlap: queue
    asks_settled: { workflow: archon-land, settled: answered, option: land, checkout: asking-run }
    inputs: *asked

  # Once a change has landed, what the item's runs noticed outside it is decided.
  discoveries-after-land:
    workflow: archon-discoveries
    resource: sdlc-discoveries
    capacity: 1
    overlap: queue
    run_ended: { workflow: archon-land, outcome: merged }
    inputs: *ended
  discoveries-after-answers:
    workflow: archon-discoveries
    resource: sdlc-discoveries
    capacity: 1
    overlap: queue
    asks_settled: { workflow: archon-discoveries, settled: answered }
    inputs: *asked
