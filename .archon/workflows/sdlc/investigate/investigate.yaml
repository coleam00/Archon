name: investigate
description: |
  Establish the smallest proven causal chain for a bug, unexplained behavior, or
  open question, and write an evidence-backed report a fixer or planner can act
  on without repeating the work. Advisory: it reads, reproduces, and reports —
  the repository is left exactly as it was found.

  Use when: the cause is not yet known — "investigate this issue", "why does
  this fail", "root-cause this before we fix it".
  NOT for: deciding how to build the fix (plan), or building it (implement).

model: large

inputs:
  target:
    default: ""
    description: >-
      What to investigate — an issue reference, a symptom, a failing command, or
      a question. When empty, the run's trigger message is the target.

returns: investigate

nodes:
  - id: record-state
    bash: |
      # Snapshot the working tree so assert-intact can prove the investigation
      # left it untouched. Chained with && so a failed write fails the node
      # instead of echoing success.
      mkdir -p "$ARTIFACTS_DIR" &&
        git status --porcelain > "$ARTIFACTS_DIR/.tree-state" &&
        echo '{"state":"recorded"}'

  # Inconclusive is a valid outcome, not a failure: rooted:false with the gaps
  # named honestly beats a confident guess. Consumers gate on
  # $investigate.output.rooted before building on the chain.
  - id: investigate
    command: investigate
    depends_on: [record-state]
    output_type: investigation-report
    output_format:
      type: object
      properties:
        rooted:
          type: boolean
        summary:
          type: string
      required: [rooted, summary]

  # Deterministic on both promises: a pleasant summary is not a report, and an
  # advisory run must not mutate the checkout (advisory agents resetting user
  # work is a lived failure mode, not a hypothetical).
  - id: assert-intact
    bash: |
      if [ ! -s "$ARTIFACTS_DIR/investigation.md" ]; then
        echo "assert-intact: the run completed but wrote no investigation.md — a summary is not a report." >&2
        exit 1
      fi
      git status --porcelain > "$ARTIFACTS_DIR/.tree-state-after"
      if ! diff -q "$ARTIFACTS_DIR/.tree-state" "$ARTIFACTS_DIR/.tree-state-after" > /dev/null 2>&1; then
        echo "assert-intact: the working tree changed during an advisory run:" >&2
        diff "$ARTIFACTS_DIR/.tree-state" "$ARTIFACTS_DIR/.tree-state-after" >&2 || true
        exit 1
      fi
      echo '{"intact":"true"}'
    depends_on: [investigate]
