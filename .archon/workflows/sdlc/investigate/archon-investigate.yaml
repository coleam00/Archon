name: archon-investigate
description: |
  Establish the proven causal chain for one issue's symptom, from what is observed to the
  root cause that explains it, and decide the fix, so the build stage can act on the
  report without repeating the work. Changes nothing: the repository is left exactly as
  it was found.

  Starts when triage routes an issue `investigate`, or by hand:
  `archon workflow run archon-investigate --item issue-<n> --input issue=<n>`.
  `rooted` starts the build stage; `ask` leaves a product decision on the item.

model: ['@investigator', medium]
mutates_checkout: false

inputs:
  issue:
    description: The number of the issue to investigate.
  repo_host:
    default: ""
    description: The host of the issue's repository. Empty means the checkout's `origin` remote.
  repo_path:
    default: ""
    description: The issue's repository on its host. Empty means the checkout's `origin` remote.
  answers:
    default: "None."
    description: Every answer an operator gave on this item, oldest first.
  triage:
    result_of: archon-triage
    description: What triage concluded about the issue. Read from the item.

returns: { node: investigate, outcome: verdict, asks: asks }

nodes:
  - id: investigate
    command: investigate
    output_format:
      type: object
      additionalProperties: false
      properties:
        verdict: { type: string, enum: [rooted, refuted, inconclusive, ask] }
        summary: { type: string }
        report: { type: string, description: 'The absolute path of investigation.md.' }
      required: [verdict, summary, report]
