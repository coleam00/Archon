name: archon-investigate
description: |
  Establish the proven causal chain for a bug, unexplained behavior, or open
  question — to the root cause whose fix prevents the symptom, never the first
  plausible explanation — and write an evidence-backed report a fixer or
  planner can act on without repeating the work. Advisory: it reads,
  reproduces, and reports — the repository is left exactly as it was found.

  Use when: the cause is not yet known — "investigate this issue", "why does
  this fail", "root-cause this before we fix it".
  NOT for: deciding how to build the fix (plan), or building it (implement).

model: medium

inputs:
  target:
    default: ""
    description: >-
      What to investigate — an issue reference, a symptom, a failing command, or
      a question. When empty, the run's trigger message is the target.

# Only `rooted` owes delivery. `refuted` and `inconclusive` are valid completions
# with an authored outcome of false — lifecycle status and work outcome are separate
# facts. The boolean is derived from the verdict by the verdict node, never declared
# a second time by the agent.
returns: verdict
outcome_field: rooted

nodes:

  # Inconclusive is a valid outcome, not a failure: the gaps named honestly beat a
  # confident guess. Consumers gate on the verdict before building on the chain.
  - id: investigate
    command: investigate
    # Advisory on both counts, and the engine holds both: it fails this node with
    # the touched paths named if the checkout is modified, and it refuses the
    # artifact pointer below if the report it names does not exist.
    mutates_checkout: false
    output_type: investigation-report
    output_format:
      type: object
      properties:
        verdict:
          type: string
          enum: [rooted, refuted, inconclusive]
        summary:
          type: string
        report:
          # The evidence contract, enforced by the engine at this node: a pointer at a
          # file this run's artifacts do not hold is refused before the node completes,
          # so a verdict cannot arrive without its report. The bar is an existing, non-empty
          # file, the bar the node this replaced enforced by hand.
          type: object
          properties:
            type: { type: string, enum: [archon_artifact] }
            run_id: { type: string }
            path: { type: string, enum: [investigation.md] }
          required: [type, run_id, path]
      required: [verdict, summary, report]

  - id: verdict
    script: verdict
    runtime: bun
    depends_on: [investigate]
    with:
      verdict: "$investigate.output.verdict"
      summary: "$investigate.output.summary"
      report: { from: "$investigate.output.report" }
    output_format:
      type: object
      properties:
        verdict: { type: string, enum: [rooted, refuted, inconclusive] }
        rooted: { type: boolean }
        summary: { type: string }
        report:
          type: object
          properties:
            type: { type: string, enum: [archon_artifact] }
            run_id: { type: string }
            path: { type: string, enum: [investigation.md] }
          required: [type, run_id, path]
      required: [verdict, rooted, summary, report]
