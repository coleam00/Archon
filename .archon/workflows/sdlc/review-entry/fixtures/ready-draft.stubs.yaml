# Dry-run fixture: a standalone review ends Ready on a pull request that is still a
# draft, so nothing hands it on. The run pauses as one attention item whose choices
# take the pull request out of draft or leave it; settle accepts `ready` because the
# agent named the pull request.
stage__mode: '{"continuation":false,"light":false,"head":"fixturehead","cursor":"","risks":"fixture-owned-policy","execution":{"path":"stage__mode","invocation":{"loopPath":[]}},"seams":false,"code":false,"tests":false,"errors":false,"docs":false,"part":null}'
stage__route: { seams: false, code: true, tests: false, errors: false, docs: false, reason: "stub: a small change" }
stage__scope:
  head_matches: true
  pr: { repo: { host: github.com, path: example/repo }, number: 1 }
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/scope.md" }
stage__code: "0 findings"
stage__synthesize:
  ready: true
  action: none
  findings_summary: "stub: clean"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
  discoveries: []
  contract_left: []
stage__publish:
  ready: true
  action: none
  findings_summary: "stub: clean"
  report: { type: archon_artifact, run_id: "fixture-run", path: "review/report.md" }
  discoveries: []
  contract_left: []
stage__prune-scratch: "prune-scratch: removed 0 scratch worktree(s)"
attend__decide:
  decision: ask
  reason: "stub: Ready on a draft pull request"
  pull_request: { repo: { host: github.com, path: example/repo }, number: 1 }
  attention:
    what: "stub: the review is Ready, and pull request 1 is still a draft"
    why: "stub: a draft is not reviewed or merged"
    recommendation:
      choice: ready
      why: "stub: the review found nothing open"
      evidence: "stub: review/report.md"
      confidence: high
      would_change: "stub: a check the review could not run"
    choices:
      - { id: ready, label: "stub: mark it ready", does: "stub: takes pull request 1 out of draft" }
      - { id: finish, label: "stub: leave it a draft", does: "stub: ends the run with the draft as it is" }
    if_unanswered: "stub: the run stays paused and spends nothing"
    links: ["https://github.com/example/repo/pull/1"]
fixture:
  inputs:
    scope: "https://github.com/example/repo/pull/1"
  expect: paused
  reached: [stage__result, attend__settle]
  resolved-text-contains:
    attend__ask: "- `ready` (stub: mark it ready): stub: takes pull request 1 out of draft"
exec-code: true
