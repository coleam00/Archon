name: archon-land
description: |
  Land one ready pull request on the item's landing branch. One agent reads the pull
  request, its checks, its threads and the base branch on the host, judges it against
  the project's land policy, and either merges it pinned to the head whose checks it
  read, sends it back to its builder, or asks an operator. After a merge, the merge is
  recorded on the item as the forge reports it.

  Starts when the host stage hands a pull request off ready, when an operator takes a
  change as it is, or when an operator answers `land`. By hand, on the change's branch:
  `archon workflow run archon-land --item issue-<n> --input issue=<n> --branch <head-branch>`.
  `merged` starts the discoveries stage.

model: ['@merge', large]
mutates_checkout: false

inputs:
  issue:
    description: The number of the issue whose change this is.
  repo_host:
    default: ""
    description: The host of the repository. Empty means the checkout's `origin` remote.
  repo_path:
    default: ""
    description: The repository on its host. Empty means the checkout's `origin` remote.
  answers:
    default: "None."
    description: Every answer an operator gave on this item, oldest first.
  host:
    result_of: archon-host
    description: What the host stage ended with. Read from the item.
  review:
    result_of: archon-review
    description: What the latest review ended with. Read from the item.
  earlier:
    result_of: archon-land
    description: What the last land run on the item ended with, for the head an approval names.

returns: { node: land, outcome: outcome, asks: asks }

nodes:
  - id: land
    command: land
    output_format:
      type: object
      additionalProperties: false
      properties:
        outcome: { type: string, enum: [merged, return, ask] }
        pull_request: { type: string }
        head: { type: string }
        class: { type: string, enum: [clear, unclear] }
        reran: { type: boolean }
        reason: { type: string }
        brief: { type: string }
        base: { type: string }
        report: { type: string, description: 'The absolute path of land.md, or empty.' }
      required: [outcome, pull_request, head, class, reran, reason, brief, base, report]

  # The merge is recorded from what the forge reports, not from what the agent said.
  - id: record
    script: record
    runtime: bun
    depends_on: [land]
    when: "$land.output.outcome == 'merged'"
    with:
      change: $land.output.pull_request
    output_format:
      type: object
      properties:
        recorded: { type: string }
      required: [recorded]
