name: archon-stabilize-assess
description: |
  Independently prove or reject one candidate from archon-stabilize-batch.
  Returns a structured diagnosis that is handed to implementation unchanged.

model: medium
mutates_checkout: false

inputs:
  target:
    required: true
    description: One candidate from the wide sweep.
  smell:
    default: ""
    description: The original failure class, for scope and framing only.

returns: assess

nodes:
  - id: assess
    command: assess-target
    mutates_checkout: false
    output_format:
      type: object
      properties:
        diagnosis_id:
          type: string
        confirmed:
          type: boolean
        title:
          type: string
        file:
          type: string
        test_id:
          type: string
        kind:
          type: string
          enum:
            - delete-useless-test
            - make-test-meaningful
            - fix-product-bug
            - split-or-recompose-test
        mechanism:
          type: string
        invariant:
          type: string
        evidence:
          type: string
        owned_paths:
          type: array
          items:
            type: string
        shared_primitives:
          type: array
          items:
            type: string
        forbidden_residuals:
          type: array
          items:
            type: string
        verification:
          type: string
        rejection_reason:
          type: string
      required:
        - diagnosis_id
        - confirmed
        - title
        - file
        - test_id
        - kind
        - mechanism
        - invariant
        - evidence
        - owned_paths
        - shared_primitives
        - forbidden_residuals
        - verification
        - rejection_reason

