name: god-mode-learn
description: |
  Use when: you want god mode to improve itself. Run it on a schedule (see
  `god-mode/triggers/`), and it becomes the always-on half of god mode.

  It reads the evidence for every workflow in the project, the SDLC pack and any
  other pack included: run outcomes per workflow, recent failures, open attention
  items counted by every label key they carry, the trust ladder, and god mode's
  memory. An agent then picks the single highest-leverage improvement, backed by that
  evidence:
  - `revise`: change an existing workflow, prompt, script or policy document (for
    example an SDLC stage whose prompt keeps producing the same failure);
  - `forge`: build a handler workflow for a recurring class of problem;
  - `consolidate`: rewrite the memory into fewer and better lessons, with a revision
    guard;
  - `none`: nothing in the evidence justifies a change.

  `revise` and `forge` end as draft pull requests, opened only after a person approves
  the full diff. The memory lands in an audited state document. It never edits the
  engine, its own governance, or the trust ladder.

  Usage: archon workflow run god-mode-learn

returns: report

nodes:
  - id: observe
    script: observe
    runtime: bun
    mutates_checkout: false
    output_format:
      type: object
      properties:
        evidence: { type: string }
        lessons_revision: { type: integer }
      required: [evidence, lessons_revision]

  - id: reflect
    depends_on: [observe]
    command: reflect
    context: fresh
    mutates_checkout: false
    with:
      evidence: "$observe.output.evidence"
    output_format:
      type: object
      additionalProperties: false
      properties:
        action: { type: string, enum: [revise, forge, consolidate, none] }
        rationale: { type: string, pattern: '\S' }
        evidence: { type: string }
        need: { type: string }
        lessons: { type: array, items: { type: string }, maxItems: 25 }
      required: [action, rationale, evidence, need, lessons]

  - id: consolidate
    depends_on: [observe, reflect]
    when: "$reflect.output.action == 'consolidate'"
    script: consolidate
    runtime: bun
    mutates_checkout: false
    with:
      lessons: { from: "$reflect.output.lessons" }
      revision: "$observe.output.lessons_revision"
    output_format:
      type: object
      properties:
        kept: { type: integer }
      required: [kept]

  - id: forge
    depends_on: [reflect]
    when: "$reflect.output.action == 'forge'"
    workflow: god-mode-forge
    isolation: worktree
    with:
      need: "$reflect.output.need"

  - id: revise
    depends_on: [reflect]
    when: "$reflect.output.action == 'revise'"
    workflow: god-mode-revise
    isolation: worktree
    with:
      need: "$reflect.output.need"

  - id: report
    depends_on: [reflect, consolidate, forge, revise]
    trigger_rule: all_done
    script: report
    runtime: bun
    mutates_checkout: false
    with:
      action: "$reflect.output.action"
      rationale: "$reflect.output.rationale"
      consolidated: { from: "$consolidate.output.kept", if_skipped: null }
      forged: { from: "$forge.output", if_skipped: null }
      revised: { from: "$revise.output", if_skipped: null }
    output_format:
      type: object
      properties:
        action: { type: string }
        summary: { type: string }
      required: [action, summary]
