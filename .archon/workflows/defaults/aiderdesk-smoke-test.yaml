name: aiderdesk-smoke-test
description: Smoke test for the AiderDesk provider. Confirms cwd binding with a deterministic bash pre-step, then tests round-trip streaming with the fast hosted Poe minimax-m3 model (Poe-hosted inference routes through AiderDesk → poe.com, not Ollama).
provider: aiderdesk
model: poe/minimax-m3

inputs:
  projectLabel:
    required: false
    default: "(unspecified repo)"
    description: Human label of the repo under review

returns: confirm

nodes:
  - id: bootstrap
    # Deterministic pre-flight: prove the cwd binding the engine handed us.
    bash: |
      echo "=== CWD binding confirmation ==="
      echo "pwd  = $(pwd)"
      echo "=== Top-level files ==="
      ls -1 | head -20

  - id: confirm
    depends_on: [bootstrap]
    prompt: |
      You are running against $inputs.projectLabel.
      The bash pre-step confirmed the cwd and listed the top-level entries:

      ---
      $bootstrap.output
      ---

      Say hello and confirm the engine → provider → AiderDesk → poe.com round-trip is working
      (model poe/minimax-m3, routed via AiderDesk's poe provider — not Ollama).
      Keep your response under 50 words.
