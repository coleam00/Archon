# This repository's settings for Rasmus's factory pack (Wirasm/archon-software-factory), which
# builds the factory console proof of concept. Paths are relative to the repository root.
# Every setting the pack has (f2d3ea4, `.pack/pack.yaml`) is written down; empty means the pack's
# default applies alone (or, for admit and land, that nothing may go ahead without an ask).
settings:
  triage_policy: ""
  plan_policy: docs/factory-console/ENGINEERING.md
  build_policy: docs/factory-console/ENGINEERING.md
  review_policy: docs/factory-console/ENGINEERING.md
  test_policy: docs/factory-console/ENGINEERING.md
  product_policy: docs/factory-console/DESIGN.md
  # GitHub starts CI on every push by itself, so the host needs nothing started.
  host_policy: ""
  # Shadow in the pack: recorded, nothing acts on it.
  admit_policy: docs/factory-console/policy/admit.md
  # The land gate decides by it, and the land stage merges on "land" (docs/factory-console/policy/land.md).
  land_policy: docs/factory-console/policy/land.md
  discoveries_policy: docs/factory-console/policy/discoveries.md
  validate_command: "bun run validate --only generated-files,type-check,lint,format && bun run --cwd packages/web test && bun run --cwd packages/server test && bun run build:web"
